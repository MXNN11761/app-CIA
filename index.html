ng<\/b>; kế hoạch chuyển giao<\/td><\/tr><tr><td><b>Bổ nhiệm/miễn nhiệm<\/b><\/td><td>HĐQT phê duyệt; quản lý cấp cao góp ý; đánh giá, thù lao có ý kiến HĐQT<\/td><\/tr><tr><td><b>Cấu trúc không hỗ trợ<\/b><\/td><td>Ghi lại đặc điểm hạn chế và biện pháp bảo vệ<\/td><\/tr><tr><td><b>Tiêu chuẩn CAE (7.2)<\/b><\/td><td>CAE giúp HĐQT hiểu; HĐQT xác định, phê duyệt; CAE tự duy trì năng lực<\/td><\/tr><\/table><\/div><h3>Độc lập và khách quan<\/h3><div class=\"tbl\"><table><tr><th><\/th><th>Độc lập (independence)<\/th><th>Khách quan (objectivity)<\/th><\/tr><tr><td>Cấp độ<\/td><td>Chức năng KTNB (tổ chức)<\/td><td>Cá nhân KTV (thái độ tư duy)<\/td><\/tr><tr><td>Nguyên tắc GIAS<\/td><td>Nguyên tắc 7 (Domain III)<\/td><td>Nguyên tắc 2 (Domain II)<\/td><\/tr><tr><td>Ai chịu trách nhiệm chính<\/td><td>HĐQT thiết lập và bảo vệ; CAE xác nhận<\/td><td>Từng KTV; CAE thiết lập phương pháp xử lý<\/td><\/tr><tr><td>Ví dụ suy giảm<\/td><td>CAE báo cáo cho GĐTC – người bị kiểm toán<\/td><td>KTV kiểm toán quy trình mình phụ trách 6 tháng trước<\/td><\/tr><\/table><\/div>","terms":[["Independence","Độc lập","Không bị các điều kiện làm suy giảm khả năng của chức năng KTNB thực hiện trách nhiệm một cách không thiên vị.","CAE báo cáo trực tiếp Ủy ban kiểm toán, ngân sách do HĐQT duyệt."],["Objectivity","Khách quan","Thái độ tư duy không thiên vị của cá nhân KTV khi đưa ra xét đoán nghề nghiệp.","KTV không nhận quà của cửa hàng đang kiểm toán."],["Direct reporting relationship","Quan hệ báo cáo trực tiếp","Quan hệ giữa CAE và HĐQT giúp KTNB thực hiện mandate; trước đây gọi là functional reporting.","CAE trình kế hoạch, kết quả trực tiếp cho Ủy ban kiểm toán."],["Administrative reporting line","Tuyến báo cáo hành chính","Tuyến báo cáo thường tới người đứng đầu ban điều hành, hỗ trợ hoạt động hằng ngày và vị thế của KTNB.","Tổng giám đốc duyệt nghỉ phép, công tác phí của CAE."],["Impairment","Sự suy giảm (độc lập/khách quan)","Tình huống làm giảm hoặc có vẻ làm giảm độc lập hoặc khách quan – thực tế (in fact) hoặc bề ngoài (in appearance).","CAE kiêm phụ trách Phòng Tuân thủ mà KTNB phải kiểm toán."],["Safeguards","Biện pháp bảo vệ","Biện pháp giảm thiểu nguy cơ suy giảm độc lập, khách quan.","Thuê bên ngoài kiểm toán Phòng Tuân thủ, báo cáo thẳng HĐQT."],["Nonaudit roles","Vai trò ngoài KTNB","Trách nhiệm của CAE nằm ngoài phạm vi KTNB (quản lý rủi ro, tuân thủ, tạm quyền…). Cần thảo luận, ghi Điều lệ, có biện pháp bảo vệ.","CAE phụ trách thêm hệ thống tiếp nhận tố giác."],["Independent third party","Bên thứ ba độc lập","Bên ngoài KTNB, khách quan, đủ năng lực, cung cấp đảm bảo cho mảng CAE từng hoặc đang phụ trách.","Công ty tư vấn kiểm toán khối tài chính sau thời gian CAE tạm quyền GĐTC."],["Interference","Sự can thiệp","Tác động từ ban điều hành hoặc bên khác vào việc xác định phạm vi, thực hiện, truyền đạt kết quả của KTNB.","Giám đốc vận hành yêu cầu dời cuộc kiểm toán đột xuất."],["CAE qualifications","Tiêu chuẩn của CAE","Trình độ, kinh nghiệm, năng lực để quản lý chức năng KTNB; HĐQT xác định và phê duyệt, CAE hỗ trợ HĐQT hiểu.","Kinh nghiệm quản lý KTNB, hiểu GIAS, kỹ năng lãnh đạo, có chứng chỉ nghề nghiệp."]],"title":"Bài 3. Độc lập tổ chức và vị trí của CAE","traps":"<div class=\"trap\"><b class=\"h\">Kiêm nhiệm không bị cấm tuyệt đối<\/b>Đáp án “CAE tuyệt đối không được nhận vai trò ngoài KTNB” là sai. GIAS cho phép, kèm thảo luận, ghi Điều lệ và biện pháp bảo vệ.<\/div><div class=\"trap\"><b class=\"h\">Lâu dài khác tạm thời<\/b><b>Lâu dài<\/b>: ghi Điều lệ + đảm bảo thay thế. <b>Tạm thời<\/b>: bên thứ ba độc lập trong thời gian kiêm nhiệm <b>+ 12 tháng<\/b> + kế hoạch chuyển giao.<\/div><div class=\"trap\"><b class=\"h\">Tổng giám đốc là tuyến hành chính, không phải người quyết định CAE<\/b>Quyết định bổ nhiệm, miễn nhiệm CAE thuộc HĐQT. Tổng giám đốc góp ý.<\/div><div class=\"trap\"><b class=\"h\">“Đã xử lý xong” vẫn phải báo<\/b>Xác nhận độc lập hằng năm phải gồm cả các sự cố có thể làm suy giảm độc lập và biện pháp đã dùng.<\/div><div class=\"trap\"><b class=\"h\">Độc lập ≠ Khách quan<\/b>Câu hỏi về tuyến báo cáo, vị trí tổ chức → <b>độc lập<\/b>. Câu hỏi về quà tặng, quan hệ cá nhân, từng phụ trách → <b>khách quan<\/b>.<\/div>","week":3}}</script>
<script>
/* ============== Lưu trữ cục bộ + đồng bộ GitHub Gist (thay cho CSDL của Claude) ==============
   - Mọi dữ liệu (tiến độ, sổ lỗi, bài học nhập thêm) lưu trong localStorage của trình duyệt.
   - Bài 1–3 và lộ trình 20 tuần được nhúng sẵn trong file (SEED); bài nhập sau ghi đè/bổ sung.
   - Nếu bật đồng bộ: mỗi thay đổi tự đẩy lên 1 Gist bí mật; khi mở app/quay lại tab sẽ kiểm tra
     bản mới hơn từ thiết bị khác và hỏi trước khi áp dụng (giống The big dream). */
var APP_VERSION = "v1.0";
var STORE_KEY = "iap-state", GH_KEY = "iap-gh-sync", GIST_FILE = "iap-hoc-bai-sync.json";
var SEED = JSON.parse(document.getElementById("iap-seed").textContent);

var Store = (function(){
  var st = {docs:{}, lastModified:null}, ok = true, subs = [];
  try{ var raw = localStorage.getItem(STORE_KEY); if(raw){ var p = JSON.parse(raw); if(p && p.docs) st = p; } }
  catch(e){ ok = false; }
  try{ localStorage.setItem("__iap_t","1"); localStorage.removeItem("__iap_t"); }catch(e){ ok = false; }
  function get(path){ return Object.prototype.hasOwnProperty.call(st.docs, path) ? st.docs[path] : (SEED[path] || null); }
  function persist(silent){
    if(!silent) st.lastModified = new Date().toISOString();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(st)); }catch(e){}
    subs.forEach(function(f){ f(); });
    if(!silent) Sync.schedulePush();
  }
  function write(path, data, merge){
    var cur = get(path);
    st.docs[path] = merge && cur ? Object.assign({}, cur, data) : data;
    persist(false);
    return Promise.resolve();
  }
  function children(coll){
    var keys = {}, pre = coll + "/";
    Object.keys(SEED).concat(Object.keys(st.docs)).forEach(function(k){
      if(k.indexOf(pre) === 0 && k.slice(pre.length).indexOf("/") < 0) keys[k] = 1;
    });
    return Object.keys(keys).map(function(k){ return {id:k.slice(pre.length), v:get(k)}; }).filter(function(x){ return x.v; });
  }
  return {
    ok: ok, get: get, write: write, children: children,
    state: function(){ return st; },
    replace: function(s){ st = {docs:s.docs || {}, lastModified:s.lastModified || new Date().toISOString()}; persist(true); },
    subscribe: function(f){ subs.push(f); }
  };
})();

function LocalDB(){
  function snapDoc(path){ var v = Store.get(path); return {id:path.split("/").pop(), exists:!!v, data:function(){ return v ? JSON.parse(JSON.stringify(v)) : undefined; }, metadata:{hasPendingWrites:false}}; }
  function makeColl(path, filter){
    function snap(){
      var docs = Store.children(path).filter(function(x){ return !filter || x.v[filter[0]] === filter[1]; })
        .map(function(x){ return {id:x.id, data:function(){ return JSON.parse(JSON.stringify(x.v)); }}; });
      return {docs:docs};
    }
    return {
      where: function(f, op, v){ return makeColl(path, [f, v]); },
      onSnapshot: function(cb){ var fire = function(){ cb(snap()); }; Store.subscribe(fire); setTimeout(fire, 0); return function(){}; }
    };
  }
  return {
    collection: function(p){ return makeColl(p, null); },
    doc: function(p){
      return {
        set: function(d){ return Store.write(p, d, false); },
        update: function(d){ return Store.write(p, d, true); },
        onSnapshot: function(cb){ var fire = function(){ cb(snapDoc(p)); }; Store.subscribe(fire); setTimeout(fire, 0); return function(){}; }
      };
    }
  };
}
window.claude = {
  use: function(name){
    if(name === "db") return Promise.resolve(LocalDB());
    if(name === "user") return Promise.resolve({
      id: function(){ return Promise.resolve("me"); },
      canEdit: function(){ return Promise.resolve(true); },
      name: function(){ return Promise.resolve(pref("name") || ""); }
    });
    return Promise.resolve(null);
  }
};

/* ---------------- GitHub Gist ---------------- */
var Sync = (function(){
  var cfg = {token:"", gistId:""}, status = "idle", msg = "", lastSynced = null, pending = null, timer = null;
  try{ var r = localStorage.getItem(GH_KEY); if(r){ var p = JSON.parse(r); cfg.token = p.token || ""; cfg.gistId = p.gistId || ""; lastSynced = p.lastSynced || null; } }catch(e){}
  function saveCfg(){ try{ if(cfg.token || cfg.gistId) localStorage.setItem(GH_KEY, JSON.stringify({token:cfg.token, gistId:cfg.gistId, lastSynced:lastSynced})); else localStorage.removeItem(GH_KEY); }catch(e){} }
  function hdr(){ return {Authorization:"token " + cfg.token, Accept:"application/vnd.github+json"}; }
  function body(){ var s = Store.state(); return {app:"iap-hoc-bai", docs:s.docs, lastModified:s.lastModified}; }
  function on(){ return !!(cfg.token && cfg.gistId); }
  function set(s, m){ status = s; msg = m || ""; if(typeof onSyncChange === "function") onSyncChange(); }
  function push(){
    if(!on()) return Promise.resolve();
    set("syncing");
    var files = {}; files[GIST_FILE] = {content:JSON.stringify(body())};
    return fetch("https://api.github.com/gists/" + cfg.gistId, {method:"PATCH", headers:hdr(), body:JSON.stringify({files:files})})
      .then(function(r){ if(!r.ok) throw new Error("Đồng bộ lên thất bại (mã " + r.status + ")"); lastSynced = Store.state().lastModified; saveCfg(); set("idle"); })
      .catch(function(e){ set("error", e.message || "Lỗi đồng bộ lên GitHub"); });
  }
  function pull(token, gistId){
    return fetch("https://api.github.com/gists/" + gistId, {headers:{Authorization:"token " + token, Accept:"application/vnd.github+json"}, cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("Tải dữ liệu đồng bộ thất bại (mã " + r.status + ")"); return r.json(); })
      .then(function(d){ var f = d.files && d.files[GIST_FILE]; return f && f.content ? JSON.parse(f.content) : null; });
  }
  function newer(remote){ var l = Store.state().lastModified; return remote && remote.lastModified && (!l || new Date(remote.lastModified) > new Date(l)); }
  function check(){
    if(!on() || status === "syncing") return Promise.resolve();
    return pull(cfg.token, cfg.gistId).then(function(remote){
      if(newer(remote)){ pending = remote; set("idle"); }
    }).catch(function(e){ set("error", e.message); });
  }
  return {
    on: on, status: function(){ return status; }, message: function(){ return msg; }, lastSynced: function(){ return lastSynced; },
    gistId: function(){ return cfg.gistId; }, pending: function(){ return pending; },
    schedulePush: function(){ if(!on()) return; clearTimeout(timer); timer = setTimeout(push, 1200); },
    check: check,
    create: function(token){
      set("syncing");
      var files = {}; files[GIST_FILE] = {content:JSON.stringify(body())};
      return fetch("https://api.github.com/gists", {method:"POST", headers:{Authorization:"token " + token, Accept:"application/vnd.github+json"},
        body:JSON.stringify({description:"IAP Học Bài — dữ liệu đồng bộ (bí mật, không chia sẻ)", public:false, files:files})})
        .then(function(r){ if(!r.ok) throw new Error("Tạo Gist thất bại (mã " + r.status + ") — kiểm tra lại token và quyền gist"); return r.json(); })
        .then(function(g){ cfg.token = token; cfg.gistId = g.id; lastSynced = Store.state().lastModified; saveCfg(); set("idle"); })
        .catch(function(e){ set("error", e.message); throw e; });
    },
    link: function(token, gistId){
      set("syncing");
      return pull(token, gistId).then(function(remote){
        cfg.token = token; cfg.gistId = gistId; saveCfg();
        if(newer(remote)) pending = remote; set("idle");
      }).catch(function(e){ set("error", e.message); throw e; });
    },
    now: function(){
      if(!on()) return Promise.resolve();
      set("syncing");
      return pull(cfg.token, cfg.gistId).then(function(remote){
        if(newer(remote)){ pending = remote; set("idle"); } else return push();
      }).catch(function(e){ set("error", e.message); });
    },
    apply: function(){ if(pending){ Store.replace(pending); lastSynced = pending.lastModified; saveCfg(); pending = null; set("idle"); } },
    dismiss: function(){ pending = null; set("idle"); },
    disconnect: function(){ cfg = {token:"", gistId:""}; pending = null; lastSynced = null; saveCfg(); set("idle"); }
  };
})();

var S = {
  db:null, uid:null, canAdmin:false, name:"",
  lessons:{}, lessonsLoaded:false, plan:null, planLoaded:false,
  prog:{lessons:{}, weeks:{}}, progLoaded:false,
  mistakes:{}, tab:"home", lessonId:null, mkFilter:"open", sync:"off"
};
var PARTS = {I:"Nền tảng KTNB",II:"Đạo đức & chuyên nghiệp",III:"Quản trị, rủi ro, kiểm soát",IV:"Rủi ro gian lận"};
var WEIGHT = {I:35,II:20,III:30,IV:15};
var L = "ABCD";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(s,r){return (r||document).querySelector(s);} function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function toast(t){var el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true;},2600);}
function pref(k,v){try{if(v===undefined)return localStorage.getItem("iap-"+k);localStorage.setItem("iap-"+k,v);}catch(e){return null;}}
function partOf(code){var n=parseInt(String(code||"").replace(/\D/g,""),10);if(!n)return null;return n<=5?"I":n<=7?"II":n<=11?"III":n<=13?"IV":null;}
function d0(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function fmtD(s){var d=d0(s);return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2);}
function daysBetween(a,b){return Math.round((b-a)/86400000);}

/* ======================= derived ======================= */
function lessonList(){return Object.keys(S.lessons).map(function(k){return S.lessons[k];}).sort(function(a,b){return (a.order||0)-(b.order||0);});}
function lp(id){return S.prog.lessons[id]||{};}
function lessonStat(L1){
  var p=lp(L1.id), nc=(L1.cases||[]).length, solved=0, first=0, cs=p.cases||{};
  Object.keys(cs).forEach(function(k){if(cs[k].ok){solved++;if(cs[k].first)first++;}});
  var q=p.quiz||null, best=q?q.best:null;
  var casesDone = nc===0 || solved>=nc;
  var done = casesDone && best!=null && best>=70;
  var started = solved>0 || q;
  var pct = (nc? solved/nc*0.5 : 0) + (best!=null ? (nc?0.5:1)*Math.min(best,100)/100 : 0);
  if(!nc && best==null) pct=0;
  return {nc:nc,solved:solved,first:first,best:best,last:q?q.last:null,attempts:q?q.attempts:0,done:done,started:!!started,pct:Math.round(pct*100)};
}
function curWeek(){
  if(!S.plan) return null;
  var t=today(), st=d0(S.plan.start);
  var n=Math.floor(daysBetween(st,t)/7)+1;
  return n;
}
function weekItems(w){
  var it=[];
  if(w.code && /^C\d+$/.test(w.code)) it.push({k:"lesson",t:"Học bài "+w.code,s:w.title});
  if(w.read && w.read!=="—") it.push({k:"read",t:"Đọc tài liệu gốc",s:w.read});
  if(w.practice && w.practice!=="—") it.push({k:"practice",t:"Luyện tập",s:w.practice});
  if(w.k) it.push({k:"k",t:"Kế toán – thuế "+w.k.split(" ")[0],s:w.k});
  if(w.milestone) it.push({k:"ms",t:"Mốc quan trọng",s:w.milestone});
  return it;
}
function lessonForCode(code){var l=lessonList();for(var i=0;i<l.length;i++)if(l[i].code===code)return l[i];return null;}
function weekDone(w){
  var it=weekItems(w), st=S.prog.weeks[w.n]||{};
  if(!it.length) return false;
  return it.every(function(x){
    if(x.k==="lesson"){var L1=lessonForCode(w.code);if(L1&&lessonStat(L1).done)return true;}
    return !!st[x.k];});
}
function openMistakes(){return Object.keys(S.mistakes).map(function(k){return S.mistakes[k];}).filter(function(m){return !m.resolved;});}

/* ======================= db ======================= */
var writeChain=Promise.resolve(), progTimer=null, inflight=0;
function progRef(){return S.db.doc("data/users/"+S.uid+"/progress");}
function saveProg(){
  if(!S.db||!S.uid) return;
  clearTimeout(progTimer);
  progTimer=setTimeout(function(){
    progTimer=null; inflight++;
    var body=JSON.parse(JSON.stringify(S.prog)); body.updatedAt=Date.now();
    writeChain=writeChain.then(function(){return progRef().set(body);}).then(function(){inflight--;setSync("on");},function(e){inflight--;setSync("err");toast("Chưa lưu được tiến độ: "+(e&&e.message||"lỗi kết nối"));});
  },500);
}
function mkRef(id){return S.db.doc("data/users/"+S.uid+"/"+id);}
function q(fn){writeChain=writeChain.then(fn).catch(function(e){setSync("err");toast("Chưa lưu được: "+(e&&e.message||"lỗi"));});return writeChain;}
function setSync(s){S.sync=s;onSyncChange();}

function boot(){
  try{var th=pref("theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
  render();
  if(!window.claude||!window.claude.use){S.sync="off";S.lessonsLoaded=S.planLoaded=S.progLoaded=true;render();return;}
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0], user=r[1];
    if(!db){S.lessonsLoaded=S.planLoaded=S.progLoaded=true;render();return;}
    S.db=db;
    db.collection("lessons").onSnapshot(function(snap){
      var o={};snap.docs.forEach(function(d){var v=d.data();if(v&&v.id)o[v.id]=v;});
      S.lessons=o;S.lessonsLoaded=true;setSync("on");render();
    },function(){S.lessonsLoaded=true;setSync("err");render();});
    db.doc("plan/main").onSnapshot(function(d){S.plan=d.exists?d.data():null;S.planLoaded=true;render();},function(){S.planLoaded=true;render();});
    var p1 = user? user.id():Promise.resolve(null);
    var p2 = user? user.canEdit():Promise.resolve(false);
    var p3 = user&&user.name? user.name():Promise.resolve("");
    Promise.all([p1,p2,p3]).then(function(v){
      S.uid=v[0];S.canAdmin=!!v[1];S.name=v[2]||"";
      if(!S.uid){S.progLoaded=true;render();return;}
      progRef().onSnapshot(function(d){
        if((d.metadata&&d.metadata.hasPendingWrites)||progTimer||inflight>0) return;
        var v2=d.exists?d.data():null;
        S.prog={lessons:(v2&&v2.lessons)||{},weeks:(v2&&v2.weeks)||{}};
        S.progLoaded=true;render();
      },function(){S.progLoaded=true;render();});
      db.collection("data/users/"+S.uid).where("kind","==","mistake").onSnapshot(function(snap){
        var o={};snap.docs.forEach(function(d){o[d.id]=Object.assign({_id:d.id},d.data());});
        S.mistakes=o;render();
      },function(){});
      render();
    });
  }).catch(function(){S.lessonsLoaded=S.planLoaded=S.progLoaded=true;render();});
}

  }

  // parts
  h+='<div class="card parts"><h2>Điểm trắc nghiệm theo phần đề thi</h2>';

  return h;
}
function checklist(w){
  var st=S.prog.weeks[w.n]||{}, it=weekItems(w);
  return it.map(function(x){
    var id="wk"+w.n+"-"+x.k, L1=x.k==="lesson"?lessonForCode(w.code):null, auto=L1&&lessonStat(L1).done, checked=auto||!!st[x.k];
    return '<div class="check"><input type="checkbox" id="'+id+'" data-wk="'+w.n+'" data-k="'+x.k+'"'+(checked?" checked":"")+(auto?" disabled":"")+(S.uid?"":" disabled")+'>'+
      '<label for="'+id+'"><b>'+esc(x.t)+'</b>'+(auto?' <span class="chip ok">tự đánh dấu khi đạt bài</span>':'')+'<small>'+esc(x.s)+'</small></label>'+
      (L1?'<button class="btn sm" data-open="'+esc(L1.id)+'">Mở bài</button>':'')+'</div>';
  }).join("");
}

var pendingImport=null;
function bindImport(){
  var f=$("#impFile"),dr=$("#drop"); if(!f) return;
  f.onchange=function(){if(f.files[0])readImport(f.files[0]);};
  dr.ondragover=function(e){e.preventDefault();dr.classList.add("over");};
  dr.ondragleave=function(){dr.classList.remove("over");};
  dr.ondrop=function(e){e.preventDefault();dr.classList.remove("over");if(e.dataTransfer.files[0])readImport(e.dataTransfer.files[0]);};
  if(pendingImport) showImport();
}
function readImport(file){
  var r=new FileReader();
  r.onload=function(){
    try{pendingImport=parseLesson(String(r.result),file.name);showImport();}
    catch(e){pendingImport=null;$("#impOut").innerHTML='<div class="trap"><b>Không đọc được file này</b>'+esc(e.message)+'. Hãy dùng file .json Claude gửi kèm bài học.</div>';}
  };
  r.readAsText(file);
}
function parseLesson(text,name){
  var o=null,t=text.trim();
  if(t[0]==="{") o=JSON.parse(t);
  else{
    var m=t.match(/<script[^>]+id="iap-lesson"[^>]*>([\s\S]*?)<\/script>/);
    if(m) o=JSON.parse(m[1]);
    else{ m=t.match(/var D=(\{[\s\S]*?\});\s*\(function\(\)\{var root/); if(m) o=JSON.parse(m[1].replace(/<\\\//g,"</")); }
  }
  if(!o) throw new Error("File không chứa dữ liệu bài học theo định dạng của công cụ");
  if(!o.code) throw new Error("Thiếu mã chủ đề (ví dụ C4)");
  var n=parseInt(String(o.code).replace(/\D/g,""),10)||0;
  o.id=o.id||("L"+("0"+n).slice(-2));
  o.order=o.order||n;

function vMistakes(){

function bindMistakes(){
  $$(".seg button").forEach(function(b){b.onclick=function(){S.mkFilter=b.dataset.f;render();};});

    var id=b.dataset.mk,r=b.dataset.r,m=S.mistakes[id];if(!m)return;var nv=m.reason===r?null:r;
    S.mistakes[id]=Object.assign({},m,{reason:nv});render();q(function(){return mkRef(id).update({reason:nv});});};});

function vReview(){

function bindReview(){

    render();};});
}

function bindCards(terms){
  var grid=$("#fcGrid");
  function draw(list){grid.innerHTML=list.map(function(t){return '<button class="fc" type="button"><span class="fc-in" style="display:block"><span class="fc-f"><span class="t">'+esc(t[0])+'</span><span class="v">'+esc(t[1])+'</span><span class="h">Chạm để lật</span></span><span class="fc-b"><span style="display:block">'+esc(t[2])+'</span><span class="ex" style="display:block"><b>Ví dụ:</b> '+esc(t[3])+'</span></span></span></button>';}).join("");
    $$(".fc",grid).forEach(function(c){c.onclick=function(){c.classList.toggle("flip");};});}

function fmtT(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
function startQuiz(Ln,order){
  if(LV.timer) clearInterval(LV.timer);
  LV.order=order;LV.ans={};LV.start=null;
  var box=$("#quizBox"), QS=Ln.quiz;
  box.innerHTML='<div class="qhead"><b class="num" id="qScore">Đúng 0 / 0</b><span class="muted num"><span id="qTime">00:00</span> <span id="qPace"></span></span></div><div class="bar" style="margin-bottom:16px"><i id="qBar" style="width:0"></i></div>'+
    order.map(function(qi,k){var Q=QS[qi];return '<div class="q" data-q="'+qi+'"><div class="qt"><span class="qn">Câu '+(k+1)+'.</span>'+esc(Q.q)+'</div>'+Q.o.map(function(op,j){return '<button class="opt" data-j="'+j+'">'+L[j]+'. '+esc(op)+'</button>';}).join("")+'<div class="exp" hidden><b></b> '+esc(Q.e)+'<div class="src">Nguồn: '+esc(Q.s)+'</div></div></div>';}).join("")+
    '<div id="qRes" hidden></div>';
  $$(".q .opt",box).forEach(function(b){b.onclick=function(){
    var qd=b.closest(".q"),qi=+qd.dataset.q,j=+b.dataset.j,Q=QS[qi];
    if(LV.ans.hasOwnProperty(qi))return;
    if(!LV.start){LV.start=Date.now();LV.timer=setInterval(tickQ,1000);}
    LV.ans[qi]=j;
    $$(".opt",qd).forEach(function(x){x.disabled=true;var k=+x.dataset.j;if(k===Q.a)x.classList.add("ok");else if(k===j)x.classList.add("bad");});
    var ex=$(".exp",qd);ex.hidden=false;$("b",ex).textContent=j===Q.a?"✓ Chính xác.":"✗ Chưa đúng – đáp án "+L[Q.a]+".";
    updQ(Ln);
  };});
}
function tickQ(){if(!LV||!LV.start)return;var s=Math.floor((Date.now()-LV.start)/1000),n=Object.keys(LV.ans).length,t=$("#qTime");if(!t)return;t.textContent=fmtT(s);$("#qPace").textContent=n?"· "+Math.round(s/n)+" giây/câu":"";}
function updQ(Ln){
  var QS=Ln.quiz,n=Object.keys(LV.ans).length,c=0;for(var k in LV.ans)if(LV.ans[k]===QS[k].a)c++;
  $("#qScore").textContent="Đúng "+c+" / "+n; $("#qBar").style.width=(n/LV.order.length*100)+"%";
  if(n<LV.order.length) return;
  clearInterval(LV.timer);tickQ();
  var full=LV.order.length===QS.length, pct=Math.round(c/n*100);
  var wrong=LV.order.filter(function(i){return LV.ans[i]!==QS[i].a;});
  var msg=pct>=85?"Rất tốt. Chuyển sang đọc tài liệu gốc và bài luyện tập của tuần.":pct>=70?"Đạt mục tiêu ≥ 70%. Ôn lại các câu sai trong Sổ lỗi.":"Dưới 70%: xem lại phần liên quan rồi làm lại câu sai.";
  var r=$("#qRes");r.hidden=false;
  r.innerHTML='<div class="big num">'+pct+'%</div><p style="margin-top:8px">'+c+'/'+n+' câu đúng'+(full?'':' (làm lại câu sai, không tính vào điểm bài)')+'. '+msg+'</p><div class="row">'+(wrong.length?'<button class="btn pri" id="qWrong">Làm lại câu sai</button>':'')+'<button class="btn" id="qAll">Làm lại tất cả</button>'+(wrong.length?'<button class="btn" data-go="mistakes">Mở sổ lỗi</button>':'')+'</div>';
  bindCommon();
  if($("#qWrong")) $("#qWrong").onclick=function(){startQuiz(Ln,wrong);$("#s-quiz").scrollIntoView();};
  $("#qAll").onclick=function(){startQuiz(Ln,QS.map(function(_,i){return i;}));$("#s-quiz").scrollIntoView();};
  if(!S.uid) return;
  if(full){
    var P=S.prog.lessons[Ln.id]=S.prog.lessons[Ln.id]||{}, old=P.quiz||{};
    P.quiz={best:Math.max(old.best||0,pct),last:pct,attempts:(old.attempts||0)+1,at:Date.now()};
    saveProg(); refreshLessonChrome();
  }
  LV.order.forEach(function(qi){
    var Q=QS[qi], id="mk-"+Ln.id+"-"+qi, ex=S.mistakes[id], ok=LV.ans[qi]===Q.a;
    if(!ok){
      var body={kind:"mistake",lesson:Ln.id,code:Ln.code,qi:qi,q:Q.q,o:Q.o,a:Q.a,e:Q.e,s:Q.s,picked:Q.o[LV.ans[qi]],right:Q.o[Q.a],
        wrong:(ex?(ex.wrong||1)+1:1),at:Date.now(),resolved:false,reason:ex?ex.reason||null:null};
      q(function(){return mkRef(id).set(body);});
    } else if(ex&&!ex.resolved){
      q(function(){return mkRef(id).update({resolved:true,resolvedAt:Date.now()});});
    }
  });
}

}
var updateInfo = null;
function renderBanner(){
  var b = $("#gbanner"), h = "", p = Sync.pending();
  if(p){
    h += '<div class="key gb"><b>Có dữ liệu mới hơn từ thiết bị khác</b>Cập nhật lúc ' + esc(new Date(p.lastModified).toLocaleString("vi-VN")) +
      '. Áp dụng để thiết bị này giống thiết bị kia? Tiến độ chưa đồng bộ trên máy này sẽ được thay bằng bản đó.' +
      '<div class="row" style="margin-top:10px"><button class="btn pri sm" id="gbApply">Áp dụng</button><button class="btn sm" id="gbSkip">Bỏ qua</button></div></div>';
  }
  if(updateInfo){
    h += '<div class="note gb"><b>Có phiên bản mới ' + esc(updateInfo.version) + '</b>' + esc(updateInfo.notes || "") +
      '<div class="row" style="margin-top:10px"><button class="btn sm" id="gbReload">Tải lại trang</button></div></div>';
  }
  if(!Store.ok){
    h += '<div class="trap gb"><b>Trình duyệt đang chặn lưu trữ</b>Có thể do chế độ ẩn danh. Tiến độ sẽ mất khi đóng trang.</div>';
  }
  b.innerHTML = h; b.hidden = !h;
  var a = $("#gbApply"); if(a) a.onclick = function(){ Sync.apply(); toast("Đã áp dụng dữ liệu từ thiết bị khác"); };
  var s = $("#gbSkip"); if(s) s.onclick = function(){ Sync.dismiss(); };
  var r = $("#gbReload"); if(r) r.onclick = function(){ location.reload(); };
}
function vSettings(){
  var h = '<h1>Cài đặt</h1>';
  h += '<div class="card"><h2>Tên hiển thị</h2><div class="row"><input class="inp" id="setName" value="' + esc(pref("name") || "") + '" placeholder="Ví dụ: MXNN" maxlength="40"><button class="btn" id="setNameBtn">Lưu</button></div></div>';

  h += '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Đồng bộ điện thoại và laptop</h2>' +
       (Sync.on() ? '<span class="chip ' + (Sync.status() === "error" ? "bad" : "ok") + '">' + esc(syncText()[1]) + '</span>' : '<span class="chip">Chưa bật</span>') + '</div>';
  if(!Sync.on()){
    h += '<p class="muted" style="font-size:14px;margin-top:8px">Tiến độ, sổ lỗi và bài học nhập thêm được lưu vào một <b>Gist bí mật</b> trên tài khoản GitHub của bạn. Cách làm giống app The big dream.</p>';
    if(!ghForm.open){
      h += '<button class="btn pri" id="ghOpen">Thiết lập đồng bộ</button>';
    } else {
      h += '<div class="seg" role="group" style="margin-bottom:12px"><button data-gm="new" aria-pressed="' + (ghForm.mode === "new") + '">Thiết bị đầu tiên</button><button data-gm="link" aria-pressed="' + (ghForm.mode === "link") + '">Thiết bị thứ hai</button></div>' +
        '<ol style="font-size:14px">' +
        '<li>Vào <b>github.com/settings/tokens</b> → <i>Generate new token (classic)</i> → chỉ tick quyền <b>gist</b> → <i>Generate</i> → sao chép token (chỉ hiện 1 lần).</li>' +
        (ghForm.mode === "new" ? '<li>Dán token vào ô dưới và bấm <b>Tạo đồng bộ</b>. Dùng lại đúng token này trên thiết bị thứ hai.</li>'
                               : '<li>Dán token và <b>Gist ID</b> lấy từ thiết bị đầu tiên (mục Cài đặt → Xem Gist ID), rồi bấm <b>Kết nối</b>.</li>') +
        '</ol><div class="stack" style="gap:8px"><input class="inp" id="ghTok" type="password" placeholder="Dán token (ghp_…)" autocomplete="off">' +
        (ghForm.mode === "link" ? '<input class="inp" id="ghGid" placeholder="Gist ID" autocomplete="off">' : '') +
        '<div class="row"><button class="btn pri" id="ghGo">' + (ghForm.mode === "new" ? "Tạo đồng bộ" : "Kết nối") + '</button><button class="btn" id="ghCancel">Hủy</button></div></div>' +
        '<p class="muted" style="font-size:13px;margin-top:10px">Token chỉ lưu trên thiết bị này, không nằm trong file sao lưu. Không dán token trên máy dùng chung.</p>';
    }
  } else {
    h += '<p class="muted" style="font-size:14px;margin-top:8px">Mỗi khi bạn học, tiến độ tự đẩy lên GitHub. Khi mở app hoặc quay lại tab, app kiểm tra bản mới hơn từ thiết bị kia và hỏi trước khi áp dụng.' +
         (Sync.lastSynced() ? ' Lần đồng bộ gần nhất: ' + esc(new Date(Sync.lastSynced()).toLocaleString("vi-VN")) + '.' : '') + '</p>' +
         '<div class="row"><button class="btn pri" id="ghNow"' + (Sync.status() === "syncing" ? " disabled" : "") + '>Đồng bộ ngay</button><button class="btn" id="ghShow">' + (ghForm.showId ? "Ẩn" : "Xem") + ' Gist ID</button><button class="btn" id="ghOff">Ngắt đồng bộ</button></div>' +
         (ghForm.showId ? '<div class="key num" style="word-break:break-all;margin-top:12px"><b>Gist ID (dán vào thiết bị thứ hai)</b>' + esc(Sync.gistId()) + '</div>' : '');
  }
  if(Sync.message()) h += '<div class="trap" style="margin-top:12px"><b>Lỗi</b>' + esc(Sync.message()) + '</div>';
  h += '</div>';

  h += '<div class="card"><h2>Sao lưu</h2><p class="muted" style="font-size:14px">Tải file sao lưu định kỳ để không mất tiến độ khi đổi trình duyệt hoặc xóa dữ liệu duyệt web.</p>' +
       '<div class="row"><button class="btn" id="bkOut">Tải file sao lưu</button><label class="btn" for="bkIn" style="cursor:pointer">Khôi phục từ file</label><input type="file" id="bkIn" accept=".json,application/json" hidden></div></div>';

  h += '<div class="card"><h2>Cài lên màn hình chính</h2><p class="muted" style="font-size:14px;margin:0"><b>iPhone (Safari):</b> nút Chia sẻ → <i>Thêm vào MH chính</i>.<br><b>Android (Chrome):</b> menu ⋮ → <i>Thêm vào màn hình chính</i>.</p></div>';
  h += '<p class="muted num" style="font-size:13px;text-align:center">IAP Học Bài ' + APP_VERSION + '</p>';
  return h;
}
function bindSettings(){
  var nb = $("#setNameBtn"); if(nb) nb.onclick = function(){ var v = $("#setName").value.trim(); pref("name", v); S.name = v; toast("Đã lưu tên"); };
  var o = $("#ghOpen"); if(o) o.onclick = function(){ ghForm.open = true; render(); };
  $$("[data-gm]").forEach(function(b){ b.onclick = function(){ ghForm.mode = b.dataset.gm; render(); }; });
  var c = $("#ghCancel"); if(c) c.onclick = function(){ ghForm.open = false; render(); };
  var g = $("#ghGo"); if(g) g.onclick = function(){
    var tok = $("#ghTok").value.trim(), gid = $("#ghGid") ? $("#ghGid").value.trim() : "";
    if(!tok || (ghForm.mode === "link" && !gid)){ toast("Hãy nhập đủ thông tin"); return; }
    g.disabled = true; g.textContent = "Đang kết nối…";
    (ghForm.mode === "new" ? Sync.create(tok) : Sync.link(tok, gid)).then(function(){
      ghForm.open = false; ghForm.showId = ghForm.mode === "new"; toast("Đã bật đồng bộ"); render();
    }, function(){ render(); });
  };
  var n = $("#ghNow"); if(n) n.onclick = function(){ Sync.now().then(function(){ if(!Sync.pending() && Sync.status() !== "error") toast("Đã đồng bộ"); }); };
  var sh = $("#ghShow"); if(sh) sh.onclick = function(){ ghForm.showId = !ghForm.showId; render(); };
  var off = $("#ghOff"); if(off) off.onclick = function(){ if(confirm("Ngắt đồng bộ trên thiết bị này? Dữ liệu trên máy và trên GitHub vẫn giữ nguyên.")){ Sync.disconnect(); render(); } };
  var bo = $("#bkOut"); if(bo) bo.onclick = function(){
    var s = Store.state(), blob = new Blob([JSON.stringify({app:"iap-hoc-bai", docs:s.docs, lastModified:s.lastModified, exportedAt:new Date().toISOString()}, null, 2)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "iap-hoc-bai-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  };
  var bi = $("#bkIn"); if(bi) bi.onchange = function(){
    var f = bi.files[0]; if(!f) return; var r = new FileReader();
    r.onload = function(){
      try{ var d = JSON.parse(String(r.result)); if(!d.docs) throw new Error("x");
        if(!confirm("Thay toàn bộ dữ liệu trên máy này bằng file sao lưu?")) return;
        d.lastModified = new Date().toISOString(); Store.replace(d); Sync.schedulePush(); toast("Đã khôi phục dữ liệu");
      }catch(e){ toast("File không đúng định dạng sao lưu của IAP Học Bài"); }
    };
    r.readAsText(f); bi.value = "";
  };
}
function checkVersion(){
  function pv(v){ return String(v).replace(/^v/i, "").split(".").map(function(n){ return parseInt(n, 10) || 0; }); }
  function newer(a, b){ a = pv(a); b = pv(b); for(var i = 0; i < Math.max(a.length, b.length); i++){ if((a[i]||0) > (b[i]||0)) return true; if((a[i]||0) < (b[i]||0)) return false; } return false; }
  if(location.protocol === "file:") return;
  fetch("./version.json", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d && d.version && newer(d.version, APP_VERSION)){ updateInfo = d; renderBanner(); } }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") Sync.check(); });

/* ======================= start ======================= */
(function(){var t=pref("tab");if(t&&/^(home|plan|lessons|mistakes|settings)$/.test(t))S.tab=t;})();
boot();
renderBanner();
checkVersion();
Sync.check();
</script>
