<title>IAP Học Bài</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — bottom tab bar on phones, left rail on laptops; lesson opens as a full reading view inside the shell */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#e9ece7; --line:#d9ddd5; --text:#1c2422; --muted:#5b6662;
  --accent:#1d5c63; --accent-ink:#ffffff; --accent-soft:#dcebea;
  --scene:#3d3a7a; --scene-soft:#e9e8f6; --gold:#9a6a12; --gold-soft:#f4ead6;
  --ok:#1f7a4d; --ok-soft:#dff1e7; --bad:#b03a2e; --bad-soft:#f8e2df; --warn:#a8741a;
  --shadow:0 1px 2px rgba(20,40,38,.06),0 6px 20px rgba(20,40,38,.06);
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201e; --surface-2:#232a27; --line:#313a36; --text:#e6ebe8; --muted:#9aa6a1;
  --accent:#6fc0c6; --accent-ink:#0f1a1b; --accent-soft:#1d3335;
  --scene:#b8b3ff; --scene-soft:#23223a; --gold:#e0b25a; --gold-soft:#372c18;
  --ok:#5cc28e; --ok-soft:#183127; --bad:#ec7b6e; --bad-soft:#3a201d; --warn:#e0b25a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201e; --surface-2:#232a27; --line:#313a36; --text:#e6ebe8; --muted:#9aa6a1;
  --accent:#6fc0c6; --accent-ink:#0f1a1b; --accent-soft:#1d3335;
  --scene:#b8b3ff; --scene-soft:#23223a; --gold:#e0b25a; --gold-soft:#372c18;
  --ok:#5cc28e; --ok-soft:#183127; --bad:#ec7b6e; --bad-soft:#3a201d; --warn:#e0b25a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6}
h1,h2,h3,.disp{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,5vw,32px);line-height:1.25;margin:6px 0 10px}
h2{font-size:21px;line-height:1.3;margin:0 0 12px}
h3{font-size:17px;margin:18px 0 8px}
p{margin:0 0 12px} ul,ol{margin:0 0 12px;padding-left:22px} li{margin-bottom:4px}
button{font:inherit;cursor:pointer;color:var(--text)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .en{font-style:italic;color:var(--muted);font-size:.95em}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}

/* shell */
.app{min-height:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
.main{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.brand{display:none}
@media (min-width:900px){
  .app{padding-bottom:0;padding-left:220px}
  nav.tabs{top:0;right:auto;width:220px;bottom:0;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;gap:4px}
  nav.tabs button{height:auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:10px;font-size:15px}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft)}
  nav.tabs .badge{position:static;margin-left:auto}
  .brand{display:block;font-family:var(--f-display);font-weight:700;font-size:18px;padding:4px 12px 16px;color:var(--text)}
  .brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .sp{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--bad)}

/* cards & blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card.hero{box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.cur{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--gold-soft);color:var(--gold)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.ok i{background:var(--ok)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px;font-family:var(--f-display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px;left:calc(50% + 110px)}}

/* home */
.greet{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.greet h1{margin:2px 0 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}

.parts .p{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;padding:6px 0;font-size:14px}

/* roadmap */
.tl{position:relative;padding-left:22px}

.wk{position:relative;margin-bottom:10px}

.wk.done .dot{background:var(--ok);border-color:var(--ok)}

.wk.ms .dot{border-radius:3px;transform:rotate(45deg)}

.wk summary::-webkit-details-marker{display:none}
.wk .wn{font-weight:700;font-family:var(--f-display);font-size:14px;color:var(--muted);min-width:34px}
.wk .wt{font-weight:600;min-width:0}
.wk .wd{grid-column:2;font-size:13px;color:var(--muted)}
.wk .wbody{padding:0 14px 12px}
.ms-note{margin-top:6px;font-size:13px;font-weight:600;color:var(--gold)}
.exam{background:var(--scene-soft);border:1px solid var(--scene);border-radius:12px;padding:12px 14px;font-weight:600;color:var(--scene)}

/* lesson list */
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;text-align:left}
.lrow:hover{border-color:var(--accent)}
.lrow .code{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent);background:var(--accent-soft);border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center}
.lrow .lt{font-weight:600;min-width:0}
.lrow .ls{font-size:13px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* mistakes */
.mk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.mk .mq{font-weight:600;margin:6px 0 8px}
.mk .ans{font-size:14px;display:grid;gap:4px}
.mk .ans .w{color:var(--bad)} .mk .ans .r{color:var(--ok)}
.mk .ex{font-size:14px;color:var(--muted);margin-top:8px}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reasons button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.reasons button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}

/* ---------- lesson reading view ---------- */
.lesson .back{margin-bottom:10px}
.lesson .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lesson .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.ltoc{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:10px 0;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ltoc::-webkit-scrollbar{display:none}
.ltoc button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.ltoc button.done{border-color:var(--ok);color:var(--ok)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
.lesson section{margin-top:30px;scroll-margin-top:70px}
.note,.key,.trap{border-radius:10px;padding:13px 15px;margin:12px 0}
.note{background:var(--gold-soft);border-left:4px solid var(--gold)}
.key{background:var(--accent-soft);border-left:4px solid var(--accent)}
.trap{background:var(--bad-soft);border-left:4px solid var(--bad)}
.note>b:first-child,.key>b:first-child,.trap>b:first-child{display:block;margin-bottom:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:10px 0}

.tbl th{background:var(--surface-2);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}
.box h4{margin:0 0 6px;font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin-bottom:8px}
.tag.m{background:var(--accent-soft);color:var(--accent)} .tag.s{background:var(--gold-soft);color:var(--gold)}
.dom{display:grid;gap:10px}
.domrow{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.domrow>div{min-width:0}

.mnemo{font-size:19px;font-weight:700;color:var(--accent);font-family:var(--f-display)}

.opt .fb{display:none;margin-top:6px;font-size:14px;color:var(--muted)}
.opt.show .fb{display:block}
.c-reveal{border-top:1px solid var(--line)}
.c-gias{padding:14px 18px}
.c-gias .lbl,.c-take .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:6px}
.c-take{padding:13px 18px 16px;background:var(--accent-soft)}
.c-take .t{font-weight:600}
/* flashcards */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

.fc-in{position:relative;width:100%;height:100%;min-height:200px;transition:transform .45s;transform-style:preserve-3d}

.import-preview{margin-top:12px}
