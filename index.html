b> của KTNB do HĐQT quyết định.<\/p><p>Essential condition: HĐQT cùng quản lý cấp cao bảo đảm KTNB <b>không bị can thiệp<\/b> khi xác định phạm vi, thực hiện và truyền đạt kết quả.<\/p>","opts":[["Không nhắc vì không ảnh hưởng kết quả",false,"Sự cố có thể làm suy giảm độc lập phải được báo, kể cả khi đã xử lý."],["Xác nhận với HĐQT về độc lập tổ chức của KTNB, kèm các sự cố có thể làm suy giảm độc lập và biện pháp đã áp dụng",true,"Đúng 7.1: xác nhận ít nhất hằng năm."],["Chỉ báo Tổng giám đốc",false,"Xác nhận gửi HĐQT."],["Chỉ xác nhận khi có đánh giá chất lượng bên ngoài (5 năm/lần)",false,"Tần suất là ít nhất hằng năm."]],"q":"CAE nên làm gì về độc lập tổ chức trong báo cáo năm?","scene":"<p>Tháng 12, CAE chuẩn bị báo cáo năm. Trong năm có một lần Giám đốc vận hành yêu cầu dời một cuộc kiểm toán đột xuất; sau trao đổi, cuộc kiểm toán vẫn diễn ra đúng lịch. Một KTV đề nghị: <i>“Việc đã xong rồi, khỏi nhắc.”<\/i><\/p>","std":"GIAS 7.1","take":"Xác nhận độc lập = <b>≥ hằng năm, gửi HĐQT, kể cả sự cố đã xử lý<\/b>.","title":"Báo cáo cuối năm cho Ủy ban kiểm toán"},{"gias":"<p>7.1 – khi CAE có <b>vai trò lâu dài ngoài KTNB<\/b>:<\/p><ul><li>CAE phải <b>thảo luận<\/b> với HĐQT và quản lý cấp cao về vai trò hiện tại hoặc đề xuất có thể làm suy giảm độc lập (thực tế hoặc bề ngoài) và tư vấn các loại <b>biện pháp bảo vệ<\/b>.<\/li><li>Trách nhiệm, bản chất công việc và biện pháp bảo vệ phải <b>ghi trong Điều lệ<\/b>.<\/li><li>Nếu các mảng đó thuộc đối tượng KTNB: phải có <b>quy trình đảm bảo thay thế<\/b>, vd. thuê bên đảm bảo bên ngoài khách quan, đủ năng lực, <b>báo cáo độc lập với HĐQT<\/b>.<\/li><\/ul><p>Essential condition: HĐQT <b>thừa nhận<\/b> nguy cơ suy giảm độc lập khi phê duyệt vai trò ngoài KTNB cho CAE, và cùng thiết lập biện pháp bảo vệ.<\/p>","opts":[["Tuyệt đối không được nhận",false,"GIAS cho phép CAE có vai trò ngoài KTNB nếu có biện pháp bảo vệ."],["Nhận, và KTNB tự kiểm toán Phòng Tuân thủ như bình thường",false,"Tự kiểm toán việc mình phụ trách → suy giảm độc lập và khách quan."],["Có thể nhận: CAE thảo luận với HĐQT và quản lý cấp cao về nguy cơ và biện pháp bảo vệ; ghi trách nhiệm, bản chất công việc, biện pháp bảo vệ vào Điều lệ; đảm bảo về Phòng Tuân thủ do bên khách quan, đủ năng lực, báo cáo độc lập với HĐQT thực hiện",true,"Đúng 7.1."],["Nhận, chỉ cần thông báo Tổng giám đốc",false,"Phải thảo luận với HĐQT, ghi vào Điều lệ và có quy trình đảm bảo thay thế."]],"q":"Phương án nào phù hợp với GIAS?","scene":"<p>Để tiết kiệm chi phí, HĐQT muốn CAE phụ trách luôn Phòng Tuân thủ (pháp chế, quy định hóa đơn, an toàn thực phẩm) <b>lâu dài<\/b>. Phòng Tuân thủ nằm trong kế hoạch kiểm toán năm sau.<\/p>","std":"GIAS 7.1 – kiêm nhiệm lâu dài","take":"Kiêm nhiệm lâu dài → <b>Thảo luận – Ghi Điều lệ – Đảm bảo thay thế báo cáo thẳng HĐQT<\/b>.","title":"CAE được giao thêm Phòng Tuân thủ"},{"gias":"<p>7.1: Khi vai trò ngoài KTNB của CAE là <b>tạm thời<\/b>, đảm bảo cho các mảng đó phải do <b>bên thứ ba độc lập<\/b> thực hiện <b>trong thời gian kiêm nhiệm và 12 tháng sau đó<\/b>. CAE cũng phải lập <b>kế hoạch chuyển giao<\/b> các trách nhiệm đó cho ban điều hành.<\/p><div class=\"flow\" style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px\"><span class=\"pill\">01/2027 – 04/2027: tạm quyền<\/span><span class=\"pill\">05/2027 – 04/2028: thêm 12 tháng<\/span><span class=\"pill\">→ Bên thứ ba độc lập đảm bảo<\/span><\/div><p class=\"en\" style=\"margin-top:8px\">Cùng mốc 12 tháng với nguyên tắc khách quan cá nhân (2.2): KTV không cung cấp đảm bảo cho hoạt động mình phụ trách trong 12 tháng trước.<\/p>","opts":[["KTNB tự kiểm toán khối tài chính ngay khi CAE thôi tạm quyền",false,"Còn trong thời gian 12 tháng sau, cần bên thứ ba độc lập."],["Bên thứ ba độc lập thực hiện đảm bảo trong suốt thời gian tạm quyền và 12 tháng tiếp theo; CAE lập kế hoạch chuyển giao trách nhiệm cho ban điều hành",true,"Đúng 7.1."],["Chỉ cần ghi chú trong báo cáo năm",false,"Không đủ; phải có đảm bảo của bên thứ ba độc lập."],["Ngừng kiểm toán khối tài chính 5 năm",false,"Không có quy định này; để trống đảm bảo là bỏ sót rủi ro."]],"q":"Đảm bảo về khối tài chính phải được thực hiện thế nào?","scene":"<p>Giám đốc tài chính nghỉ việc đột ngột. HĐQT giao CAE <b>tạm quyền GĐTC 4 tháng<\/b> (tháng 1–4/2027) trong lúc tuyển người mới.<\/p>","std":"GIAS 7.1 – kiêm nhiệm tạm thời","take":"Kiêm nhiệm tạm thời → <b>bên thứ ba độc lập: trong thời gian kiêm nhiệm + 12 tháng<\/b> + kế hoạch chuyển giao.","title":"CAE tạm quyền Giám đốc tài chính"},{"gias":"<p>Essential conditions của 7.1:<\/p><div class=\"tbl\"><table><tr><th>HĐQT<\/th><th>Quản lý cấp cao<\/th><\/tr><tr><td>Thiết lập quan hệ báo cáo trực tiếp với CAE<\/td><td>Thừa nhận quan hệ báo cáo trực tiếp của CAE với HĐQT<\/td><\/tr><tr><td><b>Phê duyệt bổ nhiệm và miễn nhiệm CAE<\/b><\/td><td><b>Góp ý<\/b> cho HĐQT về bổ nhiệm và miễn nhiệm<\/td><\/tr><tr><td>Góp ý cho quản lý cấp cao về <b>đánh giá hiệu quả và thù lao<\/b> của CAE<\/td><td><b>Xin ý kiến HĐQT<\/b> khi đánh giá hiệu quả và thù lao của CAE<\/td><\/tr><tr><td>Cho CAE cơ hội bàn vấn đề quan trọng, nhạy cảm, kể cả họp không có quản lý cấp cao<\/td><td>Đặt KTNB ở cấp đủ để làm việc không bị can thiệp, theo chỉ đạo của HĐQT<\/td><\/tr><\/table><\/div>","opts":[["Tổng giám đốc, vì là người quản lý hành chính của CAE",false,"Quản lý cấp cao chỉ góp ý; HĐQT phê duyệt."],["HĐQT; quản lý cấp cao cung cấp ý kiến",true,"Đúng essential conditions của 7.1."],["Phòng Nhân sự theo quy trình chung",false,"Quy trình nhân sự hỗ trợ thủ tục, không thay quyền của HĐQT."],["CAE tự quyết định",false,"Không ai tự bổ nhiệm, miễn nhiệm chính mình."]],"q":"Theo GIAS, ai có thẩm quyền bổ nhiệm và miễn nhiệm CAE?","scene":"<p>Sau báo cáo nêu nhiều phát hiện nghiêm trọng về quy trình mua hàng, Tổng giám đốc ra quyết định chuyển CAE sang làm Trưởng phòng Hành chính, có hiệu lực ngay.<\/p>","std":"GIAS 7.1 – Essential conditions","take":"<b>HĐQT quyết người – Ban điều hành góp ý<\/b>. Thù lao, đánh giá CAE: ban điều hành làm thủ tục nhưng <b>phải có ý kiến HĐQT<\/b>.","title":"Tổng giám đốc muốn thay CAE"},{"gias":"<p>7.1: Nếu cấu trúc quản trị <b>không hỗ trợ độc lập tổ chức<\/b>, CAE phải <b>ghi lại đặc điểm<\/b> của cấu trúc đang hạn chế độc lập và <b>các biện pháp bảo vệ<\/b> có thể dùng để đạt nguyên tắc này.<\/p><p><b>“Board”<\/b> khi không có HĐQT: nhóm hoặc người đóng vai cơ quan quản trị cao nhất (vd. người đứng đầu và quản lý cấp cao). Khi cấu trúc khác định nghĩa, CAE nên ghi lại cấu trúc quản trị mà KTNB báo cáo.<\/p><div class=\"key\"><b class=\"h\">Liên hệ công việc<\/b>Theo kế hoạch v1.0, GSHĐ trực thuộc Giám đốc và nằm ở tuyến 2 (giám sát của quản lý), nên không phải là KTNB. Dù vậy, tư duy của 7.1 vẫn hữu ích: ghi rõ ai phê duyệt việc gì, việc nào GSHĐ không nên tự đánh giá, và kênh nào để báo khi phát hiện liên quan đến chính người quản lý trực tiếp.<\/div>","opts":[["Kết luận GIAS không áp dụng được",false,"GIAS áp dụng cho mọi chức năng cung cấp dịch vụ KTNB."],["Ghi lại đặc điểm của cấu trúc quản trị đang hạn chế độc lập và các biện pháp bảo vệ có thể dùng (vd. kênh báo cáo trực tiếp lên Chủ tịch công ty hoặc chủ sở hữu, họp riêng định kỳ)",true,"Đúng 7.1."],["Âm thầm báo cáo vượt cấp mà không có quy định",false,"Cần thiết lập kênh chính thức và ghi vào Điều lệ."],["Chỉ kiểm tra các giao dịch không do Giám đốc phê duyệt",false,"Tự giới hạn phạm vi, bỏ qua vùng rủi ro cao."]],"q":"Theo GIAS, người phụ trách bộ phận này nên làm gì?","scene":"<p>Một công ty TNHH một thành viên trong nhóm An Phát không có HĐQT hay Ủy ban kiểm toán. Bộ phận kiểm tra nội bộ trực thuộc Giám đốc công ty – cũng là người phê duyệt phần lớn giao dịch được kiểm tra.<\/p>","std":"GIAS 7.1 · Glossary “board”","take":"Cấu trúc không hỗ trợ độc lập → <b>ghi lại hạn chế + biện pháp bảo vệ<\/b>, không im lặng.","title":"Công ty không có HĐQT đúng nghĩa"},{"gias":"<p>7.2: CAE phải <b>giúp HĐQT hiểu<\/b> trình độ, năng lực cần thiết để quản lý chức năng KTNB, bằng cách cung cấp thông tin và ví dụ về tiêu chuẩn phổ biến và hàng đầu. CAE cũng phải <b>duy trì và nâng cao<\/b> trình độ, năng lực của mình.<\/p><p>Essential conditions: HĐQT <b>xem xét yêu cầu<\/b> quản lý KTNB (Domain IV), <b>phê duyệt vai trò, trách nhiệm<\/b> của CAE và <b>xác định trình độ, kinh nghiệm, năng lực<\/b> cần thiết; cùng quản lý cấp cao bổ nhiệm CAE. Quản lý cấp cao hỗ trợ bổ nhiệm, phát triển, thù lao qua quy trình nhân sự.<\/p>","opts":[["Tự tuyển người kế nhiệm",false,"HĐQT, cùng quản lý cấp cao, bổ nhiệm CAE."],["Giúp HĐQT hiểu trình độ và năng lực cần có của một CAE bằng cách cung cấp thông tin, ví dụ về tiêu chuẩn phổ biến và hàng đầu",true,"Đúng 7.2."],["Không can dự vì là việc của Phòng Nhân sự",false,"7.2 yêu cầu CAE hỗ trợ HĐQT hiểu tiêu chuẩn CAE."],["Xác nhận kế toán trưởng giỏi là đủ",false,"CAE cần năng lực quản lý chức năng KTNB theo Domain IV, không chỉ chuyên môn kế toán."]],"q":"Theo 7.2, vai trò của CAE (hoặc người tạm quyền) trong việc này là:","scene":"<p>CAE cũ nghỉ hưu. Ủy ban kiểm toán hỏi người tạm quyền CAE: <i>“Chúng tôi nên tuyển người thế nào? Chỉ cần là kế toán trưởng giỏi là được chứ?”<\/i><\/p>","std":"GIAS 7.2","take":"7.2: CAE <b>tư vấn tiêu chuẩn<\/b> · HĐQT <b>xác định và phê duyệt<\/b> · Nhân sự <b>làm thủ tục<\/b>.","title":"HĐQT tìm CAE mới"}],"code":"C3","eyebrow":"IAP (CIA Part 1) · Tuần 3 · Chủ đề C3 · Phần I – Nền tảng KTNB (35%)","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), Section A · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p>","goals":"<ol><li>Định nghĩa <b>độc lập<\/b> theo GIAS và phân biệt với <b>khách quan<\/b>.<\/li><li>Mô tả mô hình <b>hai tuyến báo cáo<\/b>: trực tiếp với HĐQT, hành chính với người đứng đầu ban điều hành.<\/li><li>Nhớ nghĩa vụ <b>xác nhận độc lập ít nhất hằng năm<\/b>.<\/li><li>Xử lý CAE <b>kiêm nhiệm lâu dài<\/b> và <b>kiêm nhiệm tạm thời<\/b> (mốc 12 tháng).<\/li><li>Biết ai <b>bổ nhiệm, miễn nhiệm, đánh giá<\/b> CAE và vai trò của CAE về tiêu chuẩn năng lực (7.2).<\/li><li>Biết làm gì khi <b>cấu trúc quản trị không hỗ trợ độc lập<\/b>.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán.<\/p>","id":"L03","lead":"Học qua 7 tình huống về tuyến báo cáo, kiêm nhiệm và bổ nhiệm CAE. Bài bám <b>GIAS Nguyên tắc 7 – Positioned Independently<\/b> (7.1, 7.2) và phần mở đầu Domain IV.","next":"<ol><li><b>Đọc gốc (≈ 45 phút):<\/b> GIAS Nguyên tắc 7 (7.1, 7.2) – bản rút gọn trang 30–32; phần mở đầu Domain IV trang 37.<\/li><li><b>Tự tóm tắt 1 trang:<\/b> sơ đồ hai tuyến báo cáo + bảng kiêm nhiệm lâu dài / tạm thời; liên hệ vị trí GSHĐ trực thuộc Giám đốc.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 1 câu 4–5; T3 (FreeFellow): 30 câu Phần I.<\/li><li><b>K3 (1 giờ):<\/b> Hệ thống tài khoản theo TT 99/2025/TT-BTC. Câu tự kiểm: TK 156, 632, 641, 642, 138 dùng cho gì?<\/li><li><b>Sổ lỗi:<\/b> ghi câu sai và tình huống không đúng ngay lần đầu.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 4 (C4)<\/b>Dịch vụ đảm bảo và tư vấn; quản lý chức năng KTNB – GIAS Nguyên tắc 9–12.<\/div>","order":3,"pills":["⏱ ~90 phút: 50 tình huống · 15 thẻ thuật ngữ · 25 trắc nghiệm","📄 GIAS 7.1, 7.2; Domain IV (mở đầu)","🎯 Đề cương Section A"],"quiz":[{"a":1,"e":"A là định nghĩa khách quan.","o":["Thái độ tư duy không thiên vị của KTV","Không bị các điều kiện làm suy giảm khả năng của chức năng KTNB thực hiện trách nhiệm một cách không thiên vị","Không chịu sự quản lý của bất kỳ ai","Không nhận thù lao từ tổ chức"],"q":"Theo GIAS, “independence” được định nghĩa là:","s":"GIAS Glossary; Nguyên tắc 7"},{"a":1,"e":"7.1.","o":["Mỗi quý","Ít nhất hằng năm","3 năm một lần","Khi đánh giá chất lượng bên ngoài"],"q":"CAE phải xác nhận với HĐQT về độc lập tổ chức của KTNB:","s":"GIAS 7.1"},{"a":1,"e":"Mô hình trong Nguyên tắc 7 và phần mở đầu Domain IV.","o":["CAE báo cáo GĐTC về mọi mặt","CAE báo cáo trực tiếp HĐQT; về hành chính báo cáo Tổng giám đốc","CAE báo cáo Tổng giám đốc về mọi mặt","CAE kiêm Kế toán trưởng"],"q":"Cách bố trí nào thể hiện TỐT NHẤT độc lập tổ chức?","s":"GIAS 7.1; Domain IV"},{"a":2,"e":"Essential condition của 7.1; quản lý cấp cao góp ý.","o":["Tổng giám đốc","Phòng Nhân sự","HĐQT","Kiểm toán độc lập"],"q":"Ai phê duyệt việc bổ nhiệm và miễn nhiệm CAE?","s":"GIAS 7.1"},{"a":1,"e":"Essential condition của 7.1 dành cho quản lý cấp cao.","o":["Tự quyết định, không cần hỏi ai","Xin ý kiến HĐQT khi đánh giá hiệu quả và quyết định thù lao","Không tham gia","Giao CAE tự đánh giá"],"q":"Vai trò của quản lý cấp cao trong đánh giá hiệu quả và thù lao của CAE là:","s":"GIAS 7.1"},{"a":1,"e":"7.1 – vai trò lâu dài ngoài KTNB.","o":["KTNB tiếp tục tự kiểm toán bộ phận đó","Ghi trách nhiệm và biện pháp bảo vệ vào Điều lệ; thiết lập quy trình đảm bảo thay thế, vd. bên bên ngoài khách quan báo cáo độc lập với HĐQT","Chỉ cần Tổng giám đốc phê duyệt","Không cần làm gì nếu CAE có chứng chỉ CIA"],"q":"CAE được giao phụ trách lâu dài bộ phận quản lý rủi ro, vốn nằm trong phạm vi KTNB. Yêu cầu nào ĐÚNG?","s":"GIAS 7.1"},{"a":1,"e":"7.1 – vai trò tạm thời.","o":["Chỉ 3 tháng tạm quyền","3 tháng tạm quyền và 12 tháng tiếp theo","3 tháng tạm quyền và 6 tháng tiếp theo","5 năm"],"q":"CAE tạm quyền Giám đốc tài chính 3 tháng. Đảm bảo về khối tài chính phải do bên thứ ba độc lập thực hiện trong:","s":"GIAS 7.1"},{"a":0,"e":"7.1.","o":["Lập kế hoạch chuyển giao các trách nhiệm đó cho ban điều hành","Xin ý kiến IIA","Tạm dừng kế hoạch KTNB","Từ chức sau khi kết thúc"],"q":"Ngoài đảm bảo của bên thứ ba, khi kiêm nhiệm tạm thời CAE còn phải:","s":"GIAS 7.1"},{"a":1,"e":"7.1.","o":["Ngừng hoạt động KTNB","Ghi lại đặc điểm của cấu trúc đang hạn chế độc lập và các biện pháp bảo vệ có thể áp dụng","Báo cơ quan nhà nước","Bỏ qua vì không thay đổi được"],"q":"Cấu trúc quản trị của tổ chức không hỗ trợ độc lập tổ chức. CAE phải:","s":"GIAS 7.1"},{"a":1,"e":"HĐQT xác định và phê duyệt; CAE hỗ trợ HĐQT hiểu.","o":["Tự xác định tiêu chuẩn CAE và phê duyệt","Giúp HĐQT hiểu trình độ, năng lực cần có của CAE bằng thông tin và ví dụ","Tuyển người kế nhiệm","Quyết định thù lao của mình"],"q":"Theo 7.2, CAE có trách nhiệm:","s":"GIAS 7.2"},{"a":1,"e":"Essential condition của 7.1.","o":["Phê duyệt mọi giao dịch lớn","Đưa vấn đề trực tiếp tới quản lý cấp cao và nâng lên HĐQT khi cần, không bị ban điều hành can thiệp","Quản lý trực tiếp các phòng ban","Ký báo cáo tài chính"],"q":"Vị trí tổ chức của CAE cần đủ cao để:","s":"GIAS 7.1"},{"a":1,"e":"7.1: thảo luận về vai trò hiện tại hoặc đề xuất.","o":["Nhận trước rồi báo sau","Thảo luận với HĐQT và quản lý cấp cao về nguy cơ và tư vấn các loại biện pháp bảo vệ","Từ chối mà không giải thích","Chỉ báo Tổng giám đốc"],"q":"Đề xuất giao thêm vai trò mới cho CAE có thể làm suy giảm độc lập. CAE phải:","s":"GIAS 7.1"},{"a":2,"e":"C thuộc Nguyên tắc 2 (12 tháng); A, B, D là vấn đề vị trí tổ chức.","o":["CAE báo cáo cho GĐTC về mọi mặt","Ngân sách KTNB do phòng kế toán quyết định","KTV kiểm toán quy trình thanh toán mà mình phụ trách 6 tháng trước","Tổng giám đốc quyết định miễn nhiệm CAE"],"q":"Tình huống nào là suy giảm KHÁCH QUAN cá nhân, không phải độc lập tổ chức?","s":"GIAS 2.2; 7.1"}],"short":"Độc lập tổ chức và vị trí của CAE","summary":"<div class=\"tbl\"><table><tr><th>Chủ đề<\/th><th>Điểm cần nhớ<\/th><\/tr><tr><td><b>Định nghĩa<\/b><\/td><td>Không bị điều kiện làm suy giảm khả năng thực hiện trách nhiệm không thiên vị (cấp chức năng)<\/td><\/tr><tr><td><b>Tuyến báo cáo<\/b><\/td><td>Trực tiếp với HĐQT; hành chính thường với Tổng giám đốc; ghi trong Điều lệ<\/td><\/tr><tr><td><b>Xác nhận<\/b><\/td><td>CAE xác nhận độc lập với HĐQT <b>≥ hằng năm<\/b>, kể cả sự cố và biện pháp bảo vệ<\/td><\/tr><tr><td><b>Kiêm nhiệm lâu dài<\/b><\/td><td>Thảo luận; ghi Điều lệ; đảm bảo thay thế bởi bên khách quan báo cáo độc lập với HĐQT<\/td><\/tr><tr><td><b>Kiêm nhiệm tạm thời<\/b><\/td><td>Bên thứ ba độc lập đảm bảo trong thời gian kiêm nhiệm <b>+ 12 tháng<\/b>; kế hoạch chuyển giao<\/td><\/tr><tr><td><b>Bổ nhiệm/miễn nhiệm<\/b><\/td><td>HĐQT phê duyệt; quản lý cấp cao góp ý; đánh giá, thù lao có ý kiến HĐQT<\/td><\/tr><tr><td><b>Cấu trúc không hỗ trợ<\/b><\/td><td>Ghi lại đặc điểm hạn chế và biện pháp bảo vệ<\/td><\/tr><tr><td><b>Tiêu chuẩn CAE (7.2)<\/b><\/td><td>CAE giúp HĐQT hiểu; HĐQT xác định, phê duyệt; CAE tự duy trì năng lực<\/td><\/tr><\/table><\/div><h3>Độc lập và khách quan<\/h3><div class=\"tbl\"><table><tr><th><\/th><th>Độc lập (independence)<\/th><th>Khách quan (objectivity)<\/th><\/tr><tr><td>Cấp độ<\/td><td>Chức năng KTNB (tổ chức)<\/td><td>Cá nhân KTV (thái độ tư duy)<\/td><\/tr><tr><td>Nguyên tắc GIAS<\/td><td>Nguyên tắc 7 (Domain III)<\/td><td>Nguyên tắc 2 (Domain II)<\/td><\/tr><tr><td>Ai chịu trách nhiệm chính<\/td><td>HĐQT thiết lập và bảo vệ; CAE xác nhận<\/td><td>Từng KTV; CAE thiết lập phương pháp xử lý<\/td><\/tr><tr><td>Ví dụ suy giảm<\/td><td>CAE báo cáo cho GĐTC – người bị kiểm toán<\/td><td>KTV kiểm toán quy trình mình phụ trách 6 tháng trước<\/td><\/tr><\/table><\/div>","terms":[["Independence","Độc lập","Không bị các điều kiện làm suy giảm khả năng của chức năng KTNB thực hiện trách nhiệm một cách không thiên vị.","CAE báo cáo trực tiếp Ủy ban kiểm toán, ngân sách do HĐQT duyệt."],["Objectivity","Khách quan","Thái độ tư duy không thiên vị của cá nhân KTV khi đưa ra xét đoán nghề nghiệp.","KTV không nhận quà của cửa hàng đang kiểm toán."],["Direct reporting relationship","Quan hệ báo cáo trực tiếp","Quan hệ giữa CAE và HĐQT giúp KTNB thực hiện mandate; trước đây gọi là functional reporting.","CAE trình kế hoạch, kết quả trực tiếp cho Ủy ban kiểm toán."],["Administrative reporting line","Tuyến báo cáo hành chính","Tuyến báo cáo thường tới người đứng đầu ban điều hành, hỗ trợ hoạt động hằng ngày và vị thế của KTNB.","Tổng giám đốc duyệt nghỉ phép, công tác phí của CAE."],["Impairment","Sự suy giảm (độc lập/khách quan)","Tình huống làm giảm hoặc có vẻ làm giảm độc lập hoặc khách quan – thực tế (in fact) hoặc bề ngoài (in appearance).","CAE kiêm phụ trách Phòng Tuân thủ mà KTNB phải kiểm toán."],["Safeguards","Biện pháp bảo vệ","Biện pháp giảm thiểu nguy cơ suy giảm độc lập, khách quan.","Thuê bên ngoài kiểm toán Phòng Tuân thủ, báo cáo thẳng HĐQT."],["Nonaudit roles","Vai trò ngoài KTNB","Trách nhiệm của CAE nằm ngoài phạm vi KTNB (quản lý rủi ro, tuân thủ, tạm quyền…). Cần thảo luận, ghi Điều lệ, có biện pháp bảo vệ.","CAE phụ trách thêm hệ thống tiếp nhận tố giác."],["Independent third party","Bên thứ ba độc lập","Bên ngoài KTNB, khách quan, đủ năng lực, cung cấp đảm bảo cho mảng CAE từng hoặc đang phụ trách.","Công ty tư vấn kiểm toán khối tài chính sau thời gian CAE tạm quyền GĐTC."],["Interference","Sự can thiệp","Tác động từ ban điều hành hoặc bên khác vào việc xác định phạm vi, thực hiện, truyền đạt kết quả của KTNB.","Giám đốc vận hành yêu cầu dời cuộc kiểm toán đột xuất."],["CAE qualifications","Tiêu chuẩn của CAE","Trình độ, kinh nghiệm, năng lực để quản lý chức năng KTNB; HĐQT xác định và phê duyệt, CAE hỗ trợ HĐQT hiểu.","Kinh nghiệm quản lý KTNB, hiểu GIAS, kỹ năng lãnh đạo, có chứng chỉ nghề nghiệp."]],"title":"Bài 3. Độc lập tổ chức và vị trí của CAE","traps":"<div class=\"trap\"><b class=\"h\">Kiêm nhiệm không bị cấm tuyệt đối<\/b>Đáp án “CAE tuyệt đối không được nhận vai trò ngoài KTNB” là sai. GIAS cho phép, kèm thảo luận, ghi Điều lệ và biện pháp bảo vệ.<\/div><div class=\"trap\"><b class=\"h\">Lâu dài khác tạm thời<\/b><b>Lâu dài<\/b>: ghi Điều lệ + đảm bảo thay thế. <b>Tạm thời<\/b>: bên thứ ba độc lập trong thời gian kiêm nhiệm <b>+ 12 tháng<\/b> + kế hoạch chuyển giao.<\/div><div class=\"trap\"><b class=\"h\">Tổng giám đốc là tuyến hành chính, không phải người quyết định CAE<\/b>Quyết định bổ nhiệm, miễn nhiệm CAE thuộc HĐQT. Tổng giám đốc góp ý.<\/div><div class=\"trap\"><b class=\"h\">“Đã xử lý xong” vẫn phải báo<\/b>Xác nhận độc lập hằng năm phải gồm cả các sự cố có thể làm suy giảm độc lập và biện pháp đã dùng.<\/div><div class=\"trap\"><b class=\"h\">Độc lập ≠ Khách quan<\/b>Câu hỏi về tuyến báo cáo, vị trí tổ chức → <b>độc lập<\/b>. Câu hỏi về quà tặng, quan hệ cá nhân, từng phụ trách → <b>khách quan<\/b>.<\/div>","week":3},"lessons/L04":{"code":"C4","id":"L04","order":4,"week":4,"title":"Bài 4. Đảm bảo, tư vấn và quản lý chức năng KTNB","short":"Đảm bảo, tư vấn và quản lý chức năng KTNB","eyebrow":"IAP (CIA Part 1) · Tuần 4 · Chủ đề C4 · Phần I – Nền tảng KTNB (35%)","lead":"Học qua 7 tình huống tại An Phát. Bài bám định nghĩa dịch vụ trong GIAS và <b>Domain IV – Quản lý chức năng KTNB<\/b>: Nguyên tắc 9 (Hoạch định chiến lược), 10 (Quản lý nguồn lực), 11 (Truyền thông hiệu quả), 12 (Nâng cao chất lượng).","pills":["⏱ ~102 phút: 7 tình huống · 12 thẻ thuật ngữ · 15 trắc nghiệm","📄 GIAS Glossary; 9.1–9.5, 10.1–10.3, 11.1–11.5, 12.1–12.3","🎯 Đề cương A.4, A.5, A.6"],"goals":"<ol><li>Phân biệt <b>dịch vụ đảm bảo<\/b> và <b>dịch vụ tư vấn<\/b>; chọn đúng loại cho từng tình huống.<\/li><li>Phân biệt <b>đảm bảo hợp lý<\/b> và <b>đảm bảo có giới hạn<\/b>.<\/li><li>Nắm yêu cầu về <b>chiến lược, phương pháp luận, kế hoạch KTNB<\/b> và việc <b>phối hợp, dựa vào<\/b> bên khác.<\/li><li>Biết CAE quản lý <b>tài chính, nhân lực, công nghệ<\/b> thế nào và khi nào phải báo HĐQT.<\/li><li>Biết cách xử lý khi ban điều hành <b>chấp nhận rủi ro vượt khẩu vị<\/b>; nắm khung <b>QAIP<\/b>.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Góp ý quy trình đặt hàng tự động","std":"Glossary · Domain V (mở đầu)","scene":"<p>Giám đốc vận hành sắp triển khai quy trình <b>đặt hàng tự động<\/b> theo mức tồn kho tối thiểu cho 120 cửa hàng. Ông mời KTNB <i>“xem giúp thiết kế còn lỗ hổng kiểm soát nào trước khi chạy thật”<\/i>. Kết quả chỉ dùng nội bộ cho khối vận hành.<\/p>","q":"Đây là loại dịch vụ nào và KTNB nên làm thế nào?","opts":[["Dịch vụ đảm bảo, vì có đánh giá kiểm soát; phải đưa ra kết luận về hiệu lực của quy trình",false,"Quy trình chưa vận hành, bên yêu cầu muốn lời khuyên chứ không cần kết luận đảm bảo."],["Tư vấn, và KTNB nên tự thiết kế rồi phê duyệt quy trình mới để bảo đảm chất lượng",false,"Phê duyệt và thiết kế thay ban điều hành là nhận trách nhiệm quản lý, làm suy giảm khách quan."],["Dịch vụ tư vấn: thống nhất phạm vi với Giám đốc vận hành, góp ý về thiết kế kiểm soát; ban điều hành tự quyết định và chịu trách nhiệm triển khai",true,"Đúng định nghĩa advisory services: phạm vi theo thỏa thuận, không nhận trách nhiệm quản lý."],["Từ chối, vì KTNB chỉ được cung cấp dịch vụ đảm bảo",false,"GIAS cho phép tư vấn; loại dịch vụ được ghi trong Điều lệ KTNB."]],"gias":"<p><b>Advisory services<\/b>: KTNB đưa lời khuyên <b>không cung cấp đảm bảo và không nhận trách nhiệm quản lý<\/b>. Bản chất và phạm vi do <b>thỏa thuận với bên yêu cầu<\/b>. Ví dụ: góp ý thiết kế chính sách, quy trình, hệ thống, sản phẩm mới; dịch vụ điều tra (forensic); đào tạo; điều phối thảo luận về rủi ro và kiểm soát.<\/p><div class=\"tbl\"><table><tr><th><\/th><th>Đảm bảo (assurance)<\/th><th>Tư vấn (advisory)<\/th><\/tr><tr><td>Mục đích<\/td><td>Tăng mức tin cậy của các bên liên quan về quản trị, rủi ro, kiểm soát<\/td><td>Đưa lời khuyên để cải thiện<\/td><\/tr><tr><td>Ai xác định phạm vi<\/td><td>KTNB (theo kế hoạch dựa trên rủi ro)<\/td><td>Thỏa thuận với bên yêu cầu<\/td><\/tr><tr><td>Đánh giá rủi ro, tiêu chí chính thức<\/td><td>Bắt buộc (13.2, 13.4)<\/td><td>Có thể không cần, tùy thỏa thuận<\/td><\/tr><tr><td>Kết luận về hiệu lực<\/td><td>Bắt buộc, kể cả khi quy trình hiệu quả (14.5)<\/td><td>Không bắt buộc<\/td><\/tr><tr><td>Ví dụ<\/td><td>Tuân thủ, tài chính, hoạt động/hiệu quả, công nghệ<\/td><td>Thiết kế hệ thống, đào tạo, đối chuẩn, vẽ quy trình<\/td><\/tr><\/table><\/div>","take":"<span class=\"mnemo\">“Đảm bảo kết luận – Tư vấn khuyên nhủ”<\/span><br>Tư vấn: phạm vi theo <b>thỏa thuận<\/b>, KTNB <b>không cầm bút quyết định<\/b>."},{"title":"Ủy ban kiểm toán muốn “chắc chắn 100%”","std":"Glossary – assurance services","scene":"<p>Sau vụ mất hàng ở kho Bình Dương, Chủ tịch UBKT yêu cầu KTNB <i>“xác nhận chắc chắn 100% là không còn gian lận ở các kho”<\/i>.<\/p>","q":"CAE nên trả lời thế nào?","opts":[["Từ chối, vì phát hiện gian lận không thuộc trách nhiệm KTNB",false,"KTNB phải xem xét rủi ro gian lận; chỉ không thể đảm bảo tuyệt đối."],["Giải thích KTNB chỉ cung cấp đảm bảo hợp lý hoặc có giới hạn tùy bản chất, thời điểm và mức độ thủ tục; không thể đảm bảo tuyệt đối",true,"Đúng khái niệm limited/reasonable assurance."],["Chuyển yêu cầu cho kiểm toán độc lập vì chỉ họ mới đảm bảo được",false,"Kiểm toán độc lập cũng chỉ cung cấp đảm bảo hợp lý."],["Nhận lời, kiểm tra 100% chứng từ để đảm bảo tuyệt đối",false,"Kể cả kiểm tra toàn bộ, thông đồng và giả mạo vẫn có thể không bị phát hiện."]],"gias":"<p>GIAS: KTNB có thể cung cấp <b>đảm bảo có giới hạn<\/b> hoặc <b>đảm bảo hợp lý<\/b>, tùy <b>bản chất, thời điểm và mức độ<\/b> thủ tục.<\/p><div class=\"tbl\"><table><tr><th><\/th><th>Đảm bảo hợp lý<\/th><th>Đảm bảo có giới hạn<\/th><\/tr><tr><td>Mức tin cậy<\/td><td>Cao, nhưng không tuyệt đối<\/td><td>Thấp hơn<\/td><\/tr><tr><td>Thủ tục<\/td><td>Rộng: kiểm tra chi tiết, chọn mẫu đủ lớn, chứng thực<\/td><td>Hẹp: phỏng vấn, phân tích, rà soát<\/td><\/tr><tr><td>Cách diễn đạt kết luận<\/td><td>Khẳng định: “kiểm soát hoạt động hiệu quả”<\/td><td>Phủ định: “không phát hiện vấn đề cho thấy…”<\/td><\/tr><\/table><\/div><p class=\"en\">Không có đảm bảo tuyệt đối vì: chọn mẫu, giới hạn vốn có của kiểm soát (thông đồng, ban điều hành vượt quyền), xét đoán của con người.<\/p>","take":"<b>Hợp lý ≠ tuyệt đối.<\/b> Có giới hạn = ít thủ tục hơn, kết luận dạng “không phát hiện…”."},{"title":"Bỏ kiểm toán CNTT để làm việc gấp","std":"GIAS 9.4","scene":"<p>Kế hoạch năm đã được HĐQT duyệt, trong đó có kiểm toán <b>phân quyền hệ thống POS<\/b> (xếp hạng rủi ro cao). Tổng giám đốc yêu cầu bỏ cuộc này để KTNB kiểm tra chương trình khuyến mãi Tết.<\/p>","q":"CAE phải làm gì?","opts":[["Đánh giá lại rủi ro; nếu thay đổi, trình bày với HĐQT và QLCC xung đột yêu cầu, lý do không thực hiện cuộc kiểm toán rủi ro cao, và xin HĐQT phê duyệt thay đổi đáng kể",true,"Đúng 9.4: kế hoạch động, nhưng thay đổi đáng kể phải được HĐQT phê duyệt."],["Âm thầm làm cả hai, giảm thủ tục của cuộc POS cho kịp",false,"Giảm phạm vi mà không thông báo vi phạm yêu cầu báo cáo ảnh hưởng của giới hạn nguồn lực."],["Từ chối mọi thay đổi vì kế hoạch đã duyệt thì không được sửa",false,"Kế hoạch phải động, cập nhật kịp thời theo thay đổi rủi ro."],["Làm theo Tổng giám đốc vì ông là cấp quản lý trực tiếp về hành chính",false,"Tuyến hành chính không có quyền thay đổi kế hoạch đã được HĐQT duyệt."]],"gias":"<p>9.4: Kế hoạch KTNB dựa trên <b>đánh giá có văn bản<\/b> về chiến lược, mục tiêu, rủi ro, thực hiện <b>ít nhất hằng năm<\/b>, có ý kiến HĐQT và QLCC. Kế hoạch phải xem xét <b>quản trị CNTT, rủi ro gian lận, hiệu quả chương trình tuân thủ và đạo đức<\/b> cùng các vùng rủi ro cao; phải <b>động<\/b>.<\/p><p>CAE phải trao đổi kịp thời với HĐQT và QLCC:<\/p><ul><li>Ảnh hưởng của giới hạn nguồn lực tới phạm vi bao quát.<\/li><li>Lý do không đưa cuộc đảm bảo ở vùng rủi ro cao vào kế hoạch.<\/li><li>Yêu cầu xung đột giữa các bên liên quan (vd. thay cuộc đảm bảo bằng tư vấn).<\/li><li>Giới hạn phạm vi, hạn chế tiếp cận.<\/li><\/ul><p>Kế hoạch và <b>thay đổi đáng kể<\/b> phải được <b>HĐQT phê duyệt<\/b>.<\/p>","take":"Kế hoạch: <b>dựa rủi ro – ≥ hằng năm – động – HĐQT duyệt<\/b>. Bỏ vùng rủi ro cao → phải <b>giải thích với HĐQT<\/b>."},{"title":"Dựa vào kết quả của phòng Quản lý chất lượng","std":"GIAS 9.5","scene":"<p>Phòng Quản lý chất lượng (QLCL) vừa kiểm tra an toàn thực phẩm toàn bộ 120 cửa hàng. KTNB định đưa vào báo cáo kết luận rằng <i>“kiểm soát an toàn thực phẩm hiệu quả”<\/i> dựa trên kết quả này.<\/p>","q":"Cách làm nào đúng GIAS?","opts":[["Dựa hoàn toàn và ghi trong báo cáo rằng trách nhiệm về kết luận thuộc phòng QLCL",false,"Dựa vào bên khác không chuyển trách nhiệm kết luận khỏi CAE."],["Dựa vào, không cần ghi lại vì QLCL là bộ phận nội bộ",false,"Phải ghi lại cơ sở của việc dựa vào."],["Không dựa vào bất kỳ bên nào; tự kiểm tra lại toàn bộ 120 cửa hàng",false,"Lãng phí, trái mục tiêu phối hợp để giảm trùng lặp."],["Đánh giá năng lực, khách quan và phương pháp của QLCL; ghi lại cơ sở để dựa vào; CAE vẫn chịu trách nhiệm về kết luận của KTNB",true,"Đúng 9.5."]],"gias":"<p>9.5: CAE phải <b>phối hợp<\/b> với các bên cung cấp đảm bảo trong và ngoài tổ chức và <b>cân nhắc dựa vào<\/b> công việc của họ. Phối hợp giúp <b>giảm trùng lặp, chỉ ra khoảng trống<\/b> trong bao quát rủi ro chính.<\/p><ul><li>Không phối hợp được → nêu với QLCC, nếu cần thì HĐQT.<\/li><li>Khi dựa vào → <b>ghi lại cơ sở<\/b>; CAE <b>vẫn chịu trách nhiệm<\/b> về kết luận.<\/li><\/ul><p class=\"en\">Công cụ hay dùng: bản đồ đảm bảo (assurance map) – ai đảm bảo rủi ro nào, ở mức nào.<\/p>","take":"<b>Dựa vào được, đổ trách nhiệm không được.<\/b> Dựa vào → ghi cơ sở → CAE vẫn ký."},{"title":"Kế hoạch có phân tích dữ liệu, đội không ai biết làm","std":"GIAS 10.2, 10.3","scene":"<p>Kế hoạch năm có cuộc kiểm toán <b>phân tích dữ liệu bán hàng POS<\/b> để tìm giao dịch hủy (void) bất thường. 3 thành viên KTNB đều chưa từng dùng công cụ phân tích dữ liệu, cũng chưa có phần mềm.<\/p>","q":"CAE nên làm gì trước tiên?","opts":[["Bỏ cuộc kiểm toán khỏi kế hoạch, không cần thông báo",false,"Phải báo ảnh hưởng của giới hạn nguồn lực tới phạm vi bao quát."],["Giao cho thành viên trẻ nhất tự học trong lúc làm, không cần giám sát",false,"Không bảo đảm năng lực và giám sát (12.3)."],["Nhờ bộ phận CNTT tự chạy và tự kết luận thay KTNB",false,"Có thể phối hợp, nhưng kết luận phải là của KTNB."],["Xác định khoảng trống năng lực và công nghệ, tìm cách bổ sung (đào tạo, thuê ngoài một phần, phối hợp bộ phận CNTT); nếu không bổ sung được thì báo HĐQT và QLCC ảnh hưởng",true,"Đúng 10.2, 10.3."]],"gias":"<p>10.2: Nhân lực phải <b>phù hợp<\/b> (cơ cấu kiến thức, kỹ năng), <b>đủ<\/b> (số lượng) và <b>được bố trí hiệu quả<\/b>. Thiếu thì CAE phải tìm cách bổ sung hoặc <b>báo kịp thời HĐQT và QLCC<\/b> ảnh hưởng.<\/p><p>10.3: CAE phải đảm bảo KTNB có <b>công nghệ<\/b> hỗ trợ, đào tạo khi đưa công nghệ mới vào, <b>phối hợp với CNTT và an ninh thông tin<\/b>, và báo ảnh hưởng nếu thiếu công nghệ.<\/p><p>10.1: CAE lập <b>ngân sách<\/b> (gồm đào tạo, công nghệ), xin <b>HĐQT phê duyệt<\/b>, báo ngay ảnh hưởng nếu thiếu tài chính.<\/p>","take":"Nguồn lực: <span class=\"mnemo\">“Phù hợp – Đủ – Bố trí hiệu quả”<\/span>. Thiếu → <b>bổ sung hoặc báo HĐQT<\/b>."},{"title":"Ban điều hành chấp nhận rủi ro vượt khẩu vị","std":"GIAS 11.5","scene":"<p>KTNB phát hiện 14 nhân viên đã nghỉ việc vẫn còn quyền duyệt chi trên hệ thống thanh toán. Mức rủi ro này vượt khẩu vị rủi ro HĐQT đã duyệt. Giám đốc tài chính trả lời: <i>“Chưa có ngân sách sửa, chấp nhận rủi ro.”<\/i><\/p>","q":"CAE phải làm gì?","opts":[["Báo ngay cơ quan thuế",false,"Không phải kênh phù hợp; thủ tục là QLCC rồi HĐQT."],["Ghi nhận ý kiến của Giám đốc tài chính và đóng phát hiện",false,"Rủi ro vượt khẩu vị phải được trao đổi, nâng lên nếu không giải quyết."],["Thảo luận với quản lý cấp cao; nếu không được giải quyết thì nâng vấn đề lên HĐQT; CAE không có trách nhiệm tự xử lý rủi ro",true,"Đúng 11.5."],["Tự khóa quyền của 14 tài khoản cho nhanh",false,"Đó là trách nhiệm quản lý; KTNB không tự xử lý rủi ro."]],"gias":"<p>11.5: CAE phải trao đổi về <b>mức rủi ro không chấp nhận được<\/b>. Khi ban điều hành chấp nhận rủi ro <b>vượt khẩu vị hoặc ngưỡng chịu đựng<\/b>:<\/p><div class=\"flow\"><span>Thảo luận với QLCC<\/span><em>→ chưa giải quyết →<\/em><span>Nâng lên HĐQT<\/span><\/div><p>Việc <b>giải quyết rủi ro không phải trách nhiệm của CAE<\/b>.<\/p>","take":"Rủi ro vượt khẩu vị: <b>QLCC trước → HĐQT sau<\/b>. KTNB <b>báo<\/b>, không <b>sửa<\/b>."},{"title":"Báo cáo chưa qua soát xét","std":"GIAS 12.1–12.3","scene":"<p>Cuối quý, một KTV muốn phát hành gấp báo cáo kiểm toán cửa hàng Thủ Đức. Hồ sơ làm việc chưa được trưởng nhóm soát xét. KTV nói: <i>“Em làm kỹ rồi, soát xét sau cũng được.”<\/i><\/p>","q":"Theo GIAS, yêu cầu nào đang bị bỏ qua?","opts":[["Giám sát cuộc kiểm toán: người giám sát phải xác nhận hồ sơ đủ để chứng minh phát hiện, bằng chứng giám sát phải được lưu; CAE duyệt trước khi phát hành",true,"Đúng 12.3 và 15.1."],["Yêu cầu xác nhận độc lập hằng năm",false,"Không liên quan đến soát xét hồ sơ."],["Đánh giá chất lượng bên ngoài 5 năm/lần",false,"Đó là 8.4, không phải lỗi trong tình huống này."],["Không có yêu cầu nào; soát xét là thông lệ tùy chọn",false,"12.3 yêu cầu giám sát và lưu bằng chứng giám sát."]],"gias":"<p><b>QAIP<\/b> gồm đánh giá <b>nội bộ<\/b> và <b>bên ngoài<\/b>.<\/p><div class=\"tbl\"><table><tr><th>Chuẩn mực<\/th><th>Nội dung chính<\/th><\/tr><tr><td>12.1 Đánh giá nội bộ<\/td><td>Giám sát liên tục + tự đánh giá định kỳ; kế hoạch hành động cho điểm không tuân thủ; báo HĐQT, QLCC; tài liệu được đưa vào đánh giá bên ngoài<\/td><\/tr><tr><td>12.2 Đo lường hiệu quả<\/td><td>Mục tiêu hiệu quả có ý kiến HĐQT, QLCC; phương pháp đo; xin phản hồi; kế hoạch cải tiến<\/td><\/tr><tr><td>12.3 Giám sát cuộc kiểm toán<\/td><td>Hướng dẫn suốt cuộc kiểm toán; xác nhận chương trình hoàn tất; hồ sơ đủ chứng minh; lưu bằng chứng giám sát; CAE chịu trách nhiệm cuối cùng<\/td><\/tr><\/table><\/div><p class=\"en\">Mức độ giám sát tùy độ trưởng thành của KTNB, năng lực KTV và độ phức tạp của cuộc kiểm toán.<\/p>","take":"<b>Không có bằng chứng soát xét = chưa được giám sát.<\/b> CAE có thể ủy quyền giám sát nhưng vẫn chịu trách nhiệm cuối cùng."}],"summary":"<div class=\"tbl\"><table><tr><th>Nguyên tắc<\/th><th>Chuẩn mực<\/th><th>Điểm cần nhớ<\/th><\/tr><tr><td>9 Hoạch định chiến lược<\/td><td>9.1–9.5<\/td><td>Hiểu quản trị, rủi ro, kiểm soát → chiến lược (tầm nhìn, mục tiêu, sáng kiến) → phương pháp luận → kế hoạch dựa rủi ro, ≥ hằng năm, HĐQT duyệt → phối hợp, dựa vào có ghi cơ sở<\/td><\/tr><tr><td>10 Quản lý nguồn lực<\/td><td>10.1–10.3<\/td><td>Ngân sách HĐQT duyệt; nhân lực phù hợp – đủ – bố trí hiệu quả; công nghệ; thiếu thì báo HĐQT, QLCC<\/td><\/tr><tr><td>11 Truyền thông hiệu quả<\/td><td>11.1–11.5<\/td><td>Xây dựng quan hệ; truyền thông chính xác, khách quan, rõ, súc tích, xây dựng, đầy đủ, kịp thời; báo kết quả; sửa sai sót; rủi ro vượt khẩu vị → QLCC → HĐQT<\/td><\/tr><tr><td>12 Nâng cao chất lượng<\/td><td>12.1–12.3<\/td><td>Đánh giá nội bộ; đo lường hiệu quả; giám sát cuộc kiểm toán, lưu bằng chứng giám sát<\/td><\/tr><\/table><\/div><h3>Loại dịch vụ theo đề cương A.5, A.6<\/h3><div class=\"tbl\"><table><tr><th>Đảm bảo (A.5)<\/th><th>Tư vấn (A.6)<\/th><\/tr><tr><td>Đánh giá rủi ro và kiểm soát<\/td><td>Đào tạo về rủi ro và kiểm soát<\/td><\/tr><tr><td>Kiểm toán bên thứ ba, tuân thủ hợp đồng<\/td><td>Tham gia thiết kế, phát triển hệ thống<\/td><\/tr><tr><td>An ninh CNTT và quyền riêng tư<\/td><td>Thẩm định (due diligence)<\/td><\/tr><tr><td>Hiệu quả và chất lượng<\/td><td>Hỗ trợ bảo vệ dữ liệu cá nhân<\/td><\/tr><tr><td>Hoạt động, tài chính, tuân thủ pháp luật<\/td><td>Đối chuẩn (benchmarking)<\/td><\/tr><tr><td>Văn hóa tổ chức<\/td><td>Đánh giá kiểm soát nội bộ theo yêu cầu<\/td><\/tr><tr><td>Quy trình báo cáo quản trị<\/td><td>Vẽ sơ đồ quy trình<\/td><\/tr><\/table><\/div>","terms":[["Assurance services","Dịch vụ đảm bảo","Đánh giá khách quan so với tiêu chí để tăng mức tin cậy về quản trị, rủi ro, kiểm soát.","Kiểm toán tuân thủ quy trình kiểm kê tại 20 cửa hàng."],["Advisory services","Dịch vụ tư vấn","Đưa lời khuyên, không cung cấp đảm bảo, không nhận trách nhiệm quản lý; phạm vi theo thỏa thuận.","Góp ý thiết kế quy trình đặt hàng tự động trước khi triển khai."],["Reasonable assurance","Đảm bảo hợp lý","Mức tin cậy cao nhưng không tuyệt đối, cần thủ tục rộng.","Kết luận: “Kiểm soát chi tiền hoạt động hiệu quả trong năm.”"],["Limited assurance","Đảm bảo có giới hạn","Mức tin cậy thấp hơn, thủ tục hẹp (phỏng vấn, phân tích).","“Không phát hiện vấn đề cho thấy báo cáo tồn kho sai lệch trọng yếu.”"],["Internal audit strategy","Chiến lược KTNB","Kế hoạch hành động dài hạn gồm tầm nhìn, mục tiêu chiến lược, sáng kiến; rà soát định kỳ với HĐQT, QLCC (9.2).","Tầm nhìn 3 năm: 50% cuộc kiểm toán có phân tích dữ liệu."],["Internal audit plan","Kế hoạch KTNB","Danh sách cuộc kiểm toán, dịch vụ dự kiến, dựa rủi ro và động; HĐQT phê duyệt (9.4).","Kế hoạch 2027: 12 cuộc đảm bảo, 3 cuộc tư vấn."],["Methodologies","Phương pháp luận","Chính sách, quy trình, thủ tục do CAE ban hành để hướng dẫn KTNB (9.3); thường gom trong sổ tay KTNB.","Sổ tay KTNB An Phát v2.0, có đào tạo cho KTV."],["Coordination and reliance","Phối hợp và dựa vào","Phối hợp các bên đảm bảo; dựa vào phải ghi cơ sở, CAE vẫn chịu trách nhiệm (9.5).","Dùng kết quả kiểm tra của phòng QLCL sau khi đánh giá năng lực của họ."],["Cosourcing","Thuê ngoài một phần","Chỉ một phần dịch vụ KTNB do bên ngoài thực hiện.","Thuê chuyên gia an ninh mạng cho cuộc kiểm toán CNTT."],["Themes","Chủ đề xuyên suốt","Xu hướng, nguyên nhân gốc rễ rút ra từ nhiều cuộc kiểm toán; phải báo HĐQT, QLCC kịp thời (11.3).","6/8 cửa hàng sai lệch kho do cùng một lỗi đào tạo."],["Quality assurance and improvement program (QAIP)","Chương trình đảm bảo và nâng cao chất lượng","Đánh giá tuân thủ GIAS, mục tiêu hiệu quả, cải tiến liên tục; gồm nội bộ và bên ngoài.","Tự đánh giá hằng năm + đánh giá độc lập 5 năm/lần."],["Risk appetite","Khẩu vị rủi ro","Loại và mức rủi ro tổ chức sẵn sàng chấp nhận để theo đuổi mục tiêu.","HĐQT: không chấp nhận rủi ro về an toàn thực phẩm."]],"traps":"<div class=\"trap\"><b class=\"h\">Có “đánh giá” chưa chắc là đảm bảo<\/b>Phải xem <b>ai xác định phạm vi<\/b> và <b>có kết luận<\/b> hay không. Góp ý thiết kế trước khi triển khai theo yêu cầu của quản lý là <b>tư vấn<\/b>.<\/div><div class=\"trap\"><b class=\"h\">Tư vấn vẫn phải tuân thủ GIAS<\/b>Chỉ một số bước có thể bỏ khi thỏa thuận (đánh giá rủi ro chính thức 13.2, tiêu chí 13.4, bằng chứng cho phát hiện 14.2). Đạo đức, khách quan vẫn áp dụng đầy đủ.<\/div><div class=\"trap\"><b class=\"h\">Chiến lược ≠ Kế hoạch<\/b><b>Chiến lược<\/b> (9.2): tầm nhìn, mục tiêu dài hạn. <b>Kế hoạch<\/b> (9.4): danh sách cuộc kiểm toán trong kỳ.<\/div><div class=\"trap\"><b class=\"h\">CAE không “giải quyết” rủi ro<\/b>Đáp án “CAE tự sửa, tự khóa quyền” luôn sai. CAE <b>trao đổi và nâng lên<\/b>.<\/div><div class=\"trap\"><b class=\"h\">Các mốc thời gian<\/b>Đánh giá rủi ro cho kế hoạch: <b>≥ hằng năm<\/b>. Đánh giá chất lượng nội bộ báo HĐQT: <b>≥ hằng năm<\/b> (8.3). Bên ngoài: <b>≥ 5 năm<\/b> (8.4).<\/div>","quiz":[{"q":"Theo GIAS, đặc điểm phân biệt dịch vụ tư vấn với dịch vụ đảm bảo là:","o":["Tư vấn chỉ do bên ngoài thực hiện","Tư vấn không cần tuân thủ GIAS","Tư vấn luôn phải có kết luận về hiệu lực kiểm soát","Phạm vi do thỏa thuận với bên yêu cầu, KTNB không cung cấp đảm bảo và không nhận trách nhiệm quản lý"],"a":3,"e":"GIAS áp dụng cho cả hai loại dịch vụ, trừ khi chuẩn mực quy định khác.","s":"Glossary; Domain V"},{"q":"Ví dụ nào là dịch vụ tư vấn?","o":["Kiểm toán báo cáo tài chính nội bộ quý","Đánh giá hiệu lực kiểm soát truy cập hệ thống","Kiểm tra tuân thủ quy trình kiểm kê","Đào tạo về rủi ro và kiểm soát cho cửa hàng trưởng"],"a":3,"e":"Đào tạo, góp ý thiết kế, điều phối thảo luận, điều tra (forensic) là ví dụ tư vấn trong GIAS.","s":"Glossary – advisory services"},{"q":"Mức đảm bảo KTNB cung cấp phụ thuộc vào:","o":["Mong muốn của Tổng giám đốc","Bản chất, thời điểm và mức độ thủ tục thực hiện","Quy mô doanh thu của tổ chức","Số năm kinh nghiệm của CAE"],"a":1,"e":"Glossary: limited hoặc reasonable tùy nature, timing, extent of procedures.","s":"Glossary – assurance services"},{"q":"Đánh giá rủi ro làm cơ sở cho kế hoạch KTNB phải được thực hiện tối thiểu:","o":["2 năm một lần","5 năm một lần","Hằng năm","Hằng quý"],"a":2,"e":"9.4: at least annually.","s":"GIAS 9.4"},{"q":"Ai phê duyệt kế hoạch KTNB và các thay đổi đáng kể?","o":["Kiểm toán độc lập","HĐQT","CAE","Tổng giám đốc"],"a":1,"e":"CAE lập và thảo luận; HĐQT phê duyệt.","s":"GIAS 9.4"},{"q":"Nội dung nào GIAS yêu cầu kế hoạch KTNB phải xem xét bao quát?","o":["Quản trị CNTT, rủi ro gian lận, hiệu quả chương trình tuân thủ và đạo đức","Chỉ các đơn vị chưa từng được kiểm toán","Chỉ những vùng ban điều hành đề nghị","Chỉ các rủi ro tài chính"],"a":0,"e":"9.4 nêu rõ IT governance, fraud risk, compliance and ethics programs và vùng rủi ro cao khác.","s":"GIAS 9.4"},{"q":"Chiến lược KTNB theo 9.2 phải gồm:","o":["Tầm nhìn, mục tiêu chiến lược và các sáng kiến hỗ trợ","Ngân sách chi tiết theo tháng","Danh sách cuộc kiểm toán năm","Đánh giá năng lực từng KTV"],"a":0,"e":"Danh sách cuộc kiểm toán là kế hoạch (9.4), không phải chiến lược.","s":"GIAS 9.2"},{"q":"Khi KTNB dựa vào công việc của bên cung cấp đảm bảo khác, điều nào ĐÚNG?","o":["Trách nhiệm kết luận chuyển sang bên kia","Không cần ghi lại nếu bên kia là bộ phận nội bộ","CAE ghi lại cơ sở của việc dựa vào và vẫn chịu trách nhiệm về kết luận","Chỉ được dựa vào kiểm toán độc lập"],"a":2,"e":"9.5.","s":"GIAS 9.5"},{"q":"“Sufficient” human resources theo 10.2 nghĩa là:","o":["Đúng cơ cấu kiến thức, kỹ năng","Được bố trí tối ưu","Đủ về số lượng","Có chứng chỉ CIA"],"a":2,"e":"Appropriate = cơ cấu năng lực; sufficient = số lượng; effective deployment = bố trí.","s":"GIAS 10.2"},{"q":"Ngân sách KTNB phải được ai phê duyệt?","o":["Giám đốc tài chính","CAE","HĐQT","Tổng giám đốc"],"a":2,"e":"10.1: CAE must seek budget approval from the board.","s":"GIAS 10.1"},{"q":"Ban điều hành chấp nhận rủi ro vượt khẩu vị và không xử lý sau khi CAE trao đổi. Bước tiếp theo là:","o":["Đóng phát hiện vì ban điều hành đã quyết","Báo cơ quan quản lý nhà nước","CAE tự xử lý rủi ro","CAE nâng vấn đề lên HĐQT"],"a":3,"e":"11.5: không giải quyết với QLCC → HĐQT; CAE không có trách nhiệm tự giải quyết.","s":"GIAS 11.5"},{"q":"Báo cáo cuối cùng đã phát hành có sai sót đáng kể. CAE phải:","o":["Chỉ sửa trong hồ sơ lưu","Gửi thông tin đã sửa kịp thời cho mọi bên đã nhận báo cáo gốc","Chỉ báo HĐQT","Chờ đến kỳ báo cáo sau"],"a":1,"e":"11.4; mức đáng kể theo tiêu chí đã thống nhất với HĐQT.","s":"GIAS 11.4"},{"q":"Kết quả dịch vụ KTNB mà CAE báo HĐQT KHÔNG bao gồm:","o":["Kết luận ở cấp đơn vị hoặc toàn tổ chức","Kết luận từng cuộc kiểm toán","Đánh giá năng lực cá nhân từng nhân viên của đơn vị được kiểm toán","Chủ đề xuyên suốt như nguyên nhân gốc rễ"],"a":2,"e":"11.3 liệt kê 3 loại kết quả: engagement conclusions, themes, conclusions at business unit/organization level.","s":"GIAS 11.3"},{"q":"Tự đánh giá định kỳ trong chương trình QAIP thuộc:","o":["Đánh giá chất lượng nội bộ (12.1)","Đánh giá chất lượng bên ngoài (8.4)","Đo lường hiệu quả (12.2)","Giám sát cuộc kiểm toán (12.3)"],"a":0,"e":"12.1 gồm giám sát liên tục và tự đánh giá định kỳ.","s":"GIAS 12.1"},{"q":"Ai chịu trách nhiệm cuối cùng về giám sát cuộc kiểm toán do bên thuê ngoài thực hiện?","o":["Trưởng nhóm của bên thuê ngoài","CAE","Bên thuê ngoài","UBKT"],"a":1,"e":"12.3: CAE chịu trách nhiệm giám sát dù công việc do nhân viên hay bên cung cấp dịch vụ khác thực hiện.","s":"GIAS 12.3"}],"next":"<ol><li><b>Đọc gốc (≈ 60 phút):<\/b> GIAS Domain IV, Nguyên tắc 9–12, bản rút gọn trang 37–47; phần mở đầu Domain V (định nghĩa đảm bảo, tư vấn).<\/li><li><b>Tự tóm tắt 1 trang:<\/b> bảng 2 cột Đảm bảo – Tư vấn; liệt kê 4 việc CAE phải báo HĐQT khi điều chỉnh kế hoạch (9.4).<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 1 câu 6–7.<\/li><li><b>K4 (1 giờ):<\/b> Đọc Bảng cân đối kế toán. Câu tự kiểm: Tài sản ngắn hạn gồm những nhóm nào? Vì sao hàng tồn kho của chuỗi bán lẻ cần chú ý?<\/li><li><b>Sổ lỗi:<\/b> ghi câu sai và tình huống không đúng ngay lần đầu.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 5 (C5)<\/b>Thực hiện cuộc kiểm tra – GIAS Nguyên tắc 13–15.<\/div>","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), Section A · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p>"},"lessons/L05":{"code":"C5","id":"L05","order":5,"week":5,"title":"Bài 5. Thực hiện cuộc kiểm toán: lập kế hoạch, thực hiện, báo cáo, theo dõi","short":"Thực hiện cuộc kiểm toán","eyebrow":"IAP (CIA Part 1) · Tuần 5 · Chủ đề C5 · Phần I – Nền tảng KTNB (35%)","lead":"Đi trọn một cuộc kiểm toán hao hụt hàng tại An Phát qua 8 tình huống. Bài bám <b>Domain V – Thực hiện dịch vụ KTNB<\/b>: Nguyên tắc 13 (Lập kế hoạch), 14 (Thực hiện), 15 (Báo cáo kết quả và theo dõi).","pills":["⏱ ~108 phút: 8 tình huống · 12 thẻ thuật ngữ · 15 trắc nghiệm","📄 GIAS 13.1–13.6, 14.1–14.6, 15.1–15.2","🎯 Đề cương Section A (bối cảnh Domain V)"],"goals":"<ol><li>Nắm trình tự <b>lập kế hoạch<\/b>: trao đổi, đánh giá rủi ro, mục tiêu, phạm vi, tiêu chí, nguồn lực, chương trình.<\/li><li>Xử lý <b>giới hạn phạm vi<\/b> và trường hợp <b>thiếu tiêu chí<\/b>.<\/li><li>Đánh giá bằng chứng theo <b>phù hợp – tin cậy – đủ<\/b>.<\/li><li>Viết phát hiện đủ <b>tiêu chí – thực trạng – nguyên nhân – ảnh hưởng – khuyến nghị<\/b>.<\/li><li>Biết nội dung bắt buộc của <b>báo cáo cuối<\/b> và cách <b>theo dõi khắc phục<\/b>.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Bắt đầu cuộc kiểm toán hao hụt hàng","std":"GIAS 13.1, 13.3","scene":"<p>KTNB chuẩn bị kiểm toán <b>hao hụt hàng hóa<\/b> tại 15 cửa hàng khu vực miền Tây. Trưởng nhóm muốn <i>“đến bất ngờ để thấy thực tế”<\/i>, không báo trước gì cho Giám đốc vùng.<\/p>","q":"Theo GIAS, việc trao đổi với ban quản lý trước cuộc kiểm toán phải gồm gì?","opts":[["Trao đổi với quản lý về mục tiêu, phạm vi và thời gian; thay đổi sau đó cũng phải thông báo kịp thời. Một số thủ tục bất ngờ như kiểm kê đột xuất vẫn có thể giữ kín thời điểm",true,"Đúng 13.1. Báo mục tiêu, phạm vi không loại trừ thủ tục đột xuất được thiết kế phù hợp."],["Chỉ cần gửi chương trình kiểm toán chi tiết cho cửa hàng trưởng",false,"Chương trình chi tiết là tài liệu nội bộ; trao đổi với quản lý về mục tiêu, phạm vi, thời gian."],["Không cần trao đổi gì để giữ yếu tố bất ngờ",false,"13.1 yêu cầu trao đổi mục tiêu, phạm vi, thời gian với quản lý."],["Chỉ thông báo sau khi đã kết thúc cuộc kiểm toán",false,"Trái 13.1."]],"gias":"<p>13.1: KTV phải <b>trao đổi hiệu quả suốt cuộc kiểm toán<\/b>; phải thông báo <b>mục tiêu, phạm vi, thời gian<\/b> cho quản lý và báo kịp thời mọi thay đổi.<\/p><p>13.3: Mục tiêu và phạm vi phải được <b>ghi lại<\/b>; phạm vi nêu rõ hoạt động, địa điểm, quy trình, hệ thống, <b>kỳ<\/b> được xem xét. <b>CAE phê duyệt<\/b> mục tiêu, phạm vi và mọi thay đổi.<\/p>","take":"Báo <b>mục tiêu – phạm vi – thời gian<\/b>. Thay đổi → báo lại. CAE duyệt."},{"title":"Dùng lại đánh giá rủi ro năm ngoái","std":"GIAS 13.2","scene":"<p>Năm ngoái KTNB đã kiểm toán quy trình <b>mua hàng<\/b> và có bảng đánh giá rủi ro chi tiết. Năm nay một KTV đề xuất dùng nguyên bảng cũ, bỏ qua bước đánh giá rủi ro <i>“vì quy trình không đổi”<\/i>. Trong năm có 3 nhà cung cấp mới được ký hợp đồng lớn.<\/p>","q":"Cách làm nào đúng?","opts":[["Bỏ đánh giá rủi ro vì đây là cuộc tư vấn",false,"Đây là cuộc đảm bảo; chỉ tư vấn mới có thể không cần đánh giá rủi ro chính thức."],["Rà soát và cập nhật đánh giá rủi ro cũ, có xem xét riêng rủi ro gian lận và các thay đổi như nhà cung cấp mới",true,"13.2: đã xác định rủi ro ở cuộc trước thì chỉ cần rà soát, cập nhật, nhưng phải xem xét rủi ro gian lận."],["Dùng nguyên bảng cũ, không cần xem lại",false,"Phải rà soát và cập nhật."],["Làm lại toàn bộ từ đầu như một quy trình mới",false,"Không bắt buộc; GIAS cho phép rà soát, cập nhật."]],"gias":"<p>13.2: KTV phải hiểu hoạt động được kiểm toán, thu thập thông tin <b>tin cậy, phù hợp, đủ<\/b> về:<\/p><ul><li>Chiến lược, mục tiêu, rủi ro của tổ chức liên quan hoạt động.<\/li><li>Ngưỡng chịu đựng rủi ro (nếu có).<\/li><li>Đánh giá rủi ro làm cơ sở cho kế hoạch KTNB.<\/li><li>Quy trình quản trị, quản lý rủi ro, kiểm soát của hoạt động.<\/li><li>Khung, hướng dẫn, tiêu chí có thể dùng để đánh giá.<\/li><\/ul><p>Xác định rủi ro cần xem xét: rủi ro trọng yếu tới mục tiêu, <b>rủi ro gian lận<\/b>, đánh giá mức trọng yếu và ưu tiên.<\/p>","take":"Có đánh giá cũ → <b>rà soát + cập nhật<\/b>, không bỏ. Luôn có dòng <b>rủi ro gian lận<\/b>."},{"title":"Không cho xem dữ liệu camera kho","std":"GIAS 13.3","scene":"<p>Giữa cuộc kiểm toán, Giám đốc vùng không cho KTNB xem dữ liệu camera và nhật ký ra vào kho với lý do <i>“bảo mật nội bộ”<\/i>. Không có dữ liệu này, KTNB không thực hiện được bước kiểm tra xuất kho ngoài giờ trong chương trình.<\/p>","q":"Trình tự xử lý đúng là:","opts":[["Tự sao chép dữ liệu camera khi quản lý vắng mặt",false,"Vi phạm quy trình và có thể vi phạm quy định bảo vệ thông tin."],["Bỏ bước kiểm tra, không ghi gì trong báo cáo",false,"Giới hạn phạm vi phải được nêu trong báo cáo cuối của cuộc đảm bảo."],["Thảo luận với quản lý để tìm cách giải quyết; nếu không được, CAE nâng lên HĐQT theo phương pháp đã ban hành; báo cáo cuối nêu giới hạn phạm vi",true,"Đúng 13.3 và 15.1."],["Dừng ngay cuộc kiểm toán và báo cơ quan công an",false,"Phản ứng quá mức; trình tự là quản lý → HĐQT."]],"gias":"<p>13.3: <b>Giới hạn phạm vi<\/b> = điều kiện của cuộc đảm bảo, như hạn chế nguồn lực hoặc hạn chế tiếp cận nhân sự, cơ sở, dữ liệu, thông tin, khiến KTV không làm được như chương trình.<\/p><div class=\"flow\"><span>Thảo luận với quản lý<\/span><em>→ không giải quyết →<\/em><span>CAE nâng lên HĐQT<\/span><em>→<\/em><span>Nêu trong báo cáo cuối (15.1)<\/span><\/div><p>KTV được <b>linh hoạt điều chỉnh<\/b> mục tiêu, phạm vi khi cần; CAE phê duyệt thay đổi.<\/p>","take":"Giới hạn phạm vi: <b>Quản lý → HĐQT → Báo cáo<\/b>."},{"title":"Không có tiêu chí để đánh giá","std":"GIAS 13.4","scene":"<p>KTNB được giao đánh giá <b>hiệu quả chương trình thẻ thành viên<\/b>. Ban điều hành chưa từng đặt chỉ tiêu nào: không có tỷ lệ khách quay lại mục tiêu, không có ngưỡng chi phí ưu đãi trên doanh thu.<\/p>","q":"KTNB nên làm gì về tiêu chí đánh giá?","opts":[["Tự đặt tiêu chí theo kinh nghiệm của trưởng nhóm, không cần trao đổi",false,"Tiêu chí phải được thảo luận để có giá trị với bên sử dụng."],["Kết luận chương trình không hiệu quả vì không có chỉ tiêu",false,"Thiếu tiêu chí là vấn đề cần xử lý ở bước lập kế hoạch, có thể thành một phát hiện, nhưng chưa đủ để kết luận hiệu quả."],["Xác định tiêu chí phù hợp bằng cách thảo luận với HĐQT và/hoặc QLCC trước khi đánh giá",true,"13.4: tiêu chí không đủ thì xác định qua thảo luận với HĐQT/QLCC."],["Lấy chỉ tiêu của một đối thủ và áp dụng luôn",false,"Đối chuẩn có thể tham khảo, nhưng vẫn phải thống nhất với HĐQT/QLCC."]],"gias":"<p><b>Tiêu chí (criteria)<\/b> = mô tả trạng thái mong muốn của hoạt động.<\/p><p>13.4: KTV đánh giá xem HĐQT và QLCC đã đặt tiêu chí <b>đầy đủ<\/b> chưa:<\/p><ul><li><b>Đầy đủ<\/b> → dùng tiêu chí đó.<\/li><li><b>Không đầy đủ<\/b> → xác định tiêu chí phù hợp <b>qua thảo luận với HĐQT và/hoặc QLCC<\/b>.<\/li><\/ul><p>Với tư vấn, có thể không cần tiêu chí, tùy thỏa thuận. Nguồn tiêu chí thường gặp: chính sách nội bộ, luật, hợp đồng, khung tham chiếu (COSO), đối chuẩn ngành.<\/p>","take":"Tiêu chí của quản lý <b>đủ → dùng<\/b>; <b>thiếu → bàn với HĐQT/QLCC<\/b>."},{"title":"Bảng kê tồn kho do cửa hàng tự gửi","std":"GIAS 14.1","scene":"<p>Để kiểm tra tồn kho, KTV dùng bảng kê do cửa hàng trưởng tự lập và gửi qua email. Một KTV khác đề xuất tự quan sát kiểm kê và đối chiếu với số liệu trên hệ thống ERP.<\/p>","q":"Vì sao cách thứ hai cho bằng chứng tốt hơn?","opts":[["Vì GIAS cấm dùng tài liệu do đơn vị được kiểm toán lập",false,"Không cấm; chỉ là độ tin cậy thấp hơn, cần chứng thực."],["Hai cách tương đương nếu bảng kê có chữ ký",false,"Chữ ký không thay thế việc chứng thực độc lập."],["Vì bảng kê qua email không có giá trị pháp lý",false,"Vấn đề là độ tin cậy, không phải giá trị pháp lý."],["Thông tin do KTV trực tiếp thu thập và được đối chiếu với nguồn khác thì tin cậy hơn",true,"Đúng 14.1: reliability tăng khi do KTV trực tiếp thu thập, từ nguồn độc lập, được chứng thực, hoặc từ hệ thống có kiểm soát hiệu quả."]],"gias":"<p>14.1: Thông tin phải:<\/p><div class=\"tbl\"><table><tr><th>Tiêu chí<\/th><th>Nghĩa<\/th><\/tr><tr><td><b>Phù hợp<\/b> (relevant)<\/td><td>Đúng mục tiêu, trong phạm vi, góp phần tạo kết quả<\/td><\/tr><tr><td><b>Tin cậy<\/b> (reliable)<\/td><td>Đúng sự thật và cập nhật; tăng khi: KTV trực tiếp thu thập hoặc từ nguồn độc lập; được chứng thực; lấy từ hệ thống có quản trị, kiểm soát hiệu quả<\/td><\/tr><tr><td><b>Đủ<\/b> (sufficient)<\/td><td>Người thận trọng, có hiểu biết có thể làm lại chương trình và đi đến cùng kết luận<\/td><\/tr><\/table><\/div><p>Bằng chứng chưa đạt → thu thập thêm. Không lấy được bằng chứng phù hợp → cân nhắc ghi nhận đó là một phát hiện.<\/p>","take":"<span class=\"mnemo\">“Phù hợp – Tin cậy – Đủ”<\/span>. Tự tay thu thập + đối chiếu > tài liệu đơn vị tự gửi."},{"title":"Viết một phát hiện hoàn chỉnh","std":"GIAS 14.2–14.4","scene":"<p>Quy chế yêu cầu mọi phiếu chi trên 20 triệu đồng có 2 chữ ký. KTV chọn mẫu 60 phiếu, thấy 18 phiếu chỉ có 1 chữ ký. Lý do: phần mềm không chặn khi thiếu người duyệt thứ hai, và nhân viên mới không được hướng dẫn.<\/p>","q":"Ghép đúng các thành phần của phát hiện:","opts":[["Chỉ cần nêu 18/60 phiếu sai, phần còn lại do ban điều hành tự tìm",false,"14.3 yêu cầu KTV phối hợp với quản lý tìm nguyên nhân gốc rễ, ảnh hưởng."],["Tiêu chí: quy chế 2 chữ ký · Điều kiện: 18/60 phiếu chỉ 1 chữ ký · Nguyên nhân: phần mềm không chặn và thiếu đào tạo · Ảnh hưởng: rủi ro chi sai, chi gian lận",true,"Đúng cấu trúc criteria – condition – root cause – effect."],["Tiêu chí: 18/60 phiếu · Điều kiện: quy chế 2 chữ ký · Nguyên nhân: nhân viên cẩu thả",false,"Đảo tiêu chí và điều kiện; quy lỗi cá nhân thay vì tìm nguyên nhân gốc rễ."],["Điều kiện: phần mềm lỗi · Ảnh hưởng: 18/60 phiếu",false,"Nhầm nguyên nhân với điều kiện."]],"gias":"<p>14.2: <b>Phát hiện<\/b> = khoảng cách giữa <b>tiêu chí<\/b> và <b>điều kiện<\/b> (thực trạng). Không có khoảng cách và không cần phân tích thêm → phải <b>đưa ra đảm bảo<\/b> rằng quy trình hiệu quả.<\/p><p>14.3: Đánh giá mức trọng yếu theo <b>khả năng xảy ra × mức ảnh hưởng<\/b>; phối hợp với quản lý tìm <b>nguyên nhân gốc rễ<\/b>; ưu tiên phát hiện theo phương pháp của CAE.<\/p><p>14.4: Khuyến nghị hoặc kế hoạch hành động nhằm: xử lý khoảng cách, giảm rủi ro về mức chấp nhận được, <b>giải quyết nguyên nhân gốc rễ<\/b>, cải thiện hoạt động. Phải thảo luận với quản lý; bất đồng thì theo phương pháp để hai bên nêu quan điểm.<\/p>","take":"<span class=\"mnemo\">5C: Criteria – Condition – Cause – Consequence – Corrective action<\/span>"},{"title":"Ban quản lý không đồng ý kết quả","std":"GIAS 13.1, 15.1","scene":"<p>Giám đốc vùng không đồng ý xếp phát hiện về hao hụt ở mức “Cao”, đề nghị hạ xuống “Thấp” rồi mới ký biên bản. Bằng chứng của KTNB đầy đủ và không có thông tin mới.<\/p>","q":"KTNB nên làm gì?","opts":[["Hạ mức xuống “Thấp” để giữ quan hệ",false,"Trái 1.1 (trung thực) và 13.1."],["Phát hành báo cáo mà không ghi nhận ý kiến của quản lý",false,"Phải có cơ chế để hai bên nêu quan điểm."],["Thảo luận để hiểu nhau; không có lý do xác đáng thì giữ nguyên kết quả và ghi quan điểm của cả hai bên theo phương pháp đã ban hành",true,"13.1: KTV không bắt buộc sửa kết quả nếu không có lý do xác đáng."],["Xóa phát hiện khỏi báo cáo",false,"Không được che giấu thông tin trọng yếu."]],"gias":"<p>13.1: Cuối cuộc kiểm toán, nếu bất đồng, KTV phải <b>thảo luận để đạt hiểu biết chung<\/b>. Nếu không đạt, KTV <b>không bắt buộc sửa<\/b> bất kỳ phần nào của kết quả <b>trừ khi có lý do xác đáng<\/b>; phải theo phương pháp cho phép hai bên nêu quan điểm.<\/p><p>15.1: Báo cáo cuối phải gồm <b>mục tiêu, phạm vi, khuyến nghị/kế hoạch hành động, kết luận<\/b>. Với đảm bảo còn có: <b>phát hiện<\/b> kèm mức trọng yếu và ưu tiên; <b>giới hạn phạm vi<\/b> (nếu có); <b>kết luận về hiệu lực<\/b>. Nêu <b>người chịu trách nhiệm<\/b> và <b>ngày hoàn thành<\/b>; ghi nhận hành động quản lý đã làm; CAE duyệt trước khi phát hành.<\/p>","take":"Bất đồng: <b>Thảo luận → giữ kết quả nếu không có lý do → ghi cả hai quan điểm<\/b>."},{"title":"Kế hoạch hành động quá hạn","std":"GIAS 15.2, 11.5","scene":"<p>Phát hiện “phân quyền POS” có hạn khắc phục 30/06. Đến 30/09, khối CNTT vẫn chưa làm gì và không trả lời email của KTNB.<\/p>","q":"KTNB phải làm gì?","opts":[["Đóng phát hiện vì đã quá hạn",false,"Không được đóng khi chưa xác nhận đã khắc phục."],["Yêu cầu và ghi lại giải trình của quản lý, trao đổi với CAE; CAE xác định QLCC có đang chấp nhận rủi ro vượt ngưỡng không và xử lý theo 11.5",true,"Đúng 15.2."],["Chờ đến cuộc kiểm toán năm sau rồi xem lại",false,"Theo dõi phải liên tục, dựa rủi ro."],["Tự sửa phân quyền để đóng phát hiện",false,"KTNB không làm thay trách nhiệm quản lý."]],"gias":"<p>15.2: Xác nhận việc thực hiện khuyến nghị hoặc kế hoạch hành động theo phương pháp gồm:<\/p><ul><li>Hỏi tiến độ.<\/li><li>Kiểm tra lại <b>dựa trên rủi ro<\/b>.<\/li><li>Cập nhật trạng thái trong <b>hệ thống theo dõi<\/b>.<\/li><\/ul><p>Mức độ thủ tục tùy mức trọng yếu của phát hiện. Quá hạn → <b>lấy và ghi lại giải trình<\/b>, trao đổi với CAE → CAE xác định QLCC có chấp nhận rủi ro vượt ngưỡng chịu đựng hay không (11.5).<\/p>","take":"Quá hạn: <b>Giải trình → CAE → (nếu cần) QLCC → HĐQT<\/b>."}],"summary":"<div class=\"flow\"><span>13 Lập kế hoạch<\/span><em>→<\/em><span>14 Thực hiện<\/span><em>→<\/em><span>15 Báo cáo &amp; theo dõi<\/span><\/div><div class=\"tbl\"><table><tr><th>Chuẩn mực<\/th><th>Việc chính<\/th><th>Ai duyệt<\/th><\/tr><tr><td>13.1 Trao đổi<\/td><td>Mục tiêu, phạm vi, thời gian; xử lý bất đồng<\/td><td>—<\/td><\/tr><tr><td>13.2 Đánh giá rủi ro<\/td><td>Hiểu hoạt động; rủi ro trọng yếu, gian lận; ưu tiên<\/td><td>—<\/td><\/tr><tr><td>13.3 Mục tiêu, phạm vi<\/td><td>Ghi lại; giới hạn phạm vi → quản lý → HĐQT<\/td><td>CAE<\/td><\/tr><tr><td>13.4 Tiêu chí<\/td><td>Dùng tiêu chí của quản lý nếu đủ; thiếu → bàn với HĐQT/QLCC<\/td><td>—<\/td><\/tr><tr><td>13.5 Nguồn lực<\/td><td>Bản chất, độ phức tạp, thời gian, nguồn lực; thiếu → bàn với CAE<\/td><td>—<\/td><\/tr><tr><td>13.6 Chương trình<\/td><td>Tiêu chí, công việc, phương pháp, người làm<\/td><td>CAE (trước khi triển khai)<\/td><\/tr><tr><td>14.1–14.3<\/td><td>Bằng chứng phù hợp, tin cậy, đủ → phát hiện → mức trọng yếu, nguyên nhân gốc rễ<\/td><td>Thay đổi chương trình: CAE<\/td><\/tr><tr><td>14.4–14.6<\/td><td>Khuyến nghị, kế hoạch hành động; kết luận; hồ sơ<\/td><td>Hồ sơ: CAE<\/td><\/tr><tr><td>15.1 Báo cáo cuối<\/td><td>Mục tiêu, phạm vi, phát hiện, giới hạn, kết luận, người và hạn khắc phục<\/td><td>CAE<\/td><\/tr><tr><td>15.2 Theo dõi<\/td><td>Hỏi tiến độ, kiểm tra lại dựa rủi ro, hệ thống theo dõi<\/td><td>—<\/td><\/tr><\/table><\/div>","terms":[["Engagement objectives","Mục tiêu cuộc kiểm toán","Nêu mục đích và các mục tiêu cụ thể cần đạt, kể cả mục tiêu do luật yêu cầu.","Đánh giá kiểm soát hao hụt hàng tại 15 cửa hàng miền Tây."],["Engagement scope","Phạm vi","Giới hạn và trọng tâm: hoạt động, địa điểm, quy trình, hệ thống, kỳ xem xét.","Kỳ 01/01–30/06; kho và quầy thu ngân; không gồm logistics."],["Scope limitation","Giới hạn phạm vi","Điều kiện khiến KTV không làm được như chương trình (thiếu nguồn lực, bị hạn chế tiếp cận).","Không được xem dữ liệu camera kho."],["Criteria","Tiêu chí","Trạng thái mong muốn của hoạt động, dùng để so sánh.","Quy chế: phiếu chi > 20 triệu cần 2 chữ ký."],["Condition","Điều kiện, thực trạng","Trạng thái thực tế KTV xác định từ bằng chứng.","18/60 phiếu chỉ có 1 chữ ký."],["Root cause","Nguyên nhân gốc rễ","Lý do cốt lõi gây khoảng cách giữa tiêu chí và thực trạng.","Phần mềm không chặn khi thiếu người duyệt thứ hai."],["Finding","Phát hiện","Kết luận rằng có khoảng cách giữa tiêu chí và thực trạng.","Kiểm soát 2 chữ ký không vận hành nhất quán."],["Engagement work program","Chương trình kiểm toán","Tiêu chí, công việc, phương pháp, công cụ, người thực hiện; CAE duyệt trước khi triển khai (13.6).","Bước 4: chọn mẫu 60 phiếu chi, KTV Lan thực hiện."],["Workpapers","Hồ sơ làm việc","Tài liệu ghi lại công việc, làm cơ sở cho phát hiện và kết luận.","File chọn mẫu, ảnh chụp chứng từ, biên bản phỏng vấn."],["Engagement conclusion","Kết luận cuộc kiểm toán","Xét đoán chuyên môn về tổng thể các phát hiện; nêu đạt hoặc không đạt.","“Kiểm soát chi tiền cần cải thiện.”"],["Action plan","Kế hoạch hành động","Việc quản lý cam kết làm, có người chịu trách nhiệm và hạn hoàn thành.","Khối CNTT bổ sung chặn duyệt đơn trước 30/06."],["Follow-up","Theo dõi khắc phục","Hỏi tiến độ, kiểm tra lại dựa rủi ro, cập nhật hệ thống theo dõi (15.2).","Bảng theo dõi 42 phát hiện, cập nhật hằng tháng."]],"traps":"<div class=\"trap\"><b class=\"h\">Tiêu chí ≠ Thực trạng<\/b>Tiêu chí là <b>nên là<\/b> (quy chế, luật, chỉ tiêu). Thực trạng là <b>đang là<\/b> (số liệu KTV tìm thấy). Đề hay đảo hai khái niệm này.<\/div><div class=\"trap\"><b class=\"h\">Quy chế chỉ nói “CAE duyệt”<\/b>Mục tiêu, phạm vi, chương trình, thay đổi chương trình, hồ sơ, báo cáo cuối: <b>CAE duyệt<\/b>. HĐQT duyệt kế hoạch <b>năm<\/b>, không duyệt từng cuộc.<\/div><div class=\"trap\"><b class=\"h\">Bất đồng không buộc phải sửa<\/b>KTV <b>không bắt buộc<\/b> sửa kết quả nếu không có lý do xác đáng, nhưng phải để hai bên nêu quan điểm.<\/div><div class=\"trap\"><b class=\"h\">Kết luận cả khi tốt<\/b>Cuộc đảm bảo phải nêu cả khi quy trình <b>hiệu quả<\/b>. Đáp án “không báo cáo nếu không có phát hiện” là sai.<\/div><div class=\"trap\"><b class=\"h\">Nguyên nhân gốc rễ không phải “nhân viên cẩu thả”<\/b>Hãy hỏi “vì sao” đến khi gặp lỗi hệ thống, đào tạo, thiết kế quy trình hoặc động cơ.<\/div>","quiz":[{"q":"Ai phê duyệt mục tiêu, phạm vi cuộc kiểm toán và các thay đổi trong quá trình thực hiện?","o":["HĐQT","Trưởng đơn vị được kiểm toán","CAE","KTV phụ trách"],"a":2,"e":"13.3.","s":"GIAS 13.3"},{"q":"Với cuộc tư vấn, bước nào có thể không cần làm, tùy thỏa thuận với bên liên quan?","o":["Duy trì khách quan","Đánh giá rủi ro chính thức có văn bản","Báo cáo kết quả cho bên yêu cầu","Tuân thủ yêu cầu bảo mật"],"a":1,"e":"13.2: For advisory services, a formal, documented risk assessment may not be necessary.","s":"GIAS 13.2"},{"q":"Khi lập kế hoạch cuộc kiểm toán, rủi ro nào GIAS yêu cầu KTV xem xét riêng?","o":["Rủi ro gian lận","Rủi ro tỷ giá","Rủi ro thời tiết","Rủi ro danh tiếng của KTNB"],"a":0,"e":"13.2: considering specific risks related to fraud.","s":"GIAS 13.2"},{"q":"Giới hạn phạm vi không giải quyết được với quản lý thì:","o":["CAE nâng lên HĐQT theo phương pháp đã ban hành","Báo kiểm toán độc lập","KTV tự bỏ bước kiểm tra","Hủy cuộc kiểm toán"],"a":0,"e":"13.3.","s":"GIAS 13.3"},{"q":"Tiêu chí của ban điều hành không đầy đủ. KTV phải:","o":["Xác định tiêu chí phù hợp qua thảo luận với HĐQT và/hoặc QLCC","Dùng tiêu chí của cuộc kiểm toán khác","Bỏ qua bước đánh giá","Kết luận ngay là không đạt"],"a":0,"e":"13.4.","s":"GIAS 13.4"},{"q":"Chương trình kiểm toán KHÔNG bắt buộc nêu nội dung nào?","o":["Tiêu chí đánh giá từng mục tiêu","Kết luận dự kiến của cuộc kiểm toán","KTV được phân công","Công việc cần làm"],"a":1,"e":"13.6: criteria, tasks, methodologies and tools, internal auditors assigned.","s":"GIAS 13.6"},{"q":"Theo 14.1, độ tin cậy của thông tin tăng khi:","o":["Thông tin có nhiều trang","Thông tin được gửi qua email nội bộ","Thông tin do đơn vị được kiểm toán tự tổng hợp","Thông tin được chứng thực bởi nguồn khác"],"a":3,"e":"Obtained directly / independent source; corroborated; from a system with effective controls.","s":"GIAS 14.1"},{"q":"Thông tin là “đủ” khi:","o":["Một người thận trọng, có hiểu biết có thể làm lại công việc và đi đến cùng kết luận","KTV thấy yên tâm","Quản lý đồng ý với kết luận","Đã kiểm tra 100% giao dịch"],"a":0,"e":"14.1 sufficient.","s":"GIAS 14.1"},{"q":"Không có khoảng cách giữa tiêu chí và thực trạng và không cần phân tích thêm. KTV phải:","o":["Đưa ra đảm bảo trong kết luận rằng quy trình hiệu quả","Chỉ ghi “không có ý kiến”","Tìm thêm bằng mọi giá đến khi có phát hiện","Không nói gì về hoạt động này"],"a":0,"e":"14.2 và 14.5: phải ghi nhận cả khi quy trình hiệu quả.","s":"GIAS 14.2, 14.5"},{"q":"Để xác định mức trọng yếu của rủi ro trong một phát hiện, KTV xem xét:","o":["Ý kiến của KTV khác","Số trang của hồ sơ","Khả năng xảy ra và mức ảnh hưởng","Chức vụ người vi phạm"],"a":2,"e":"14.3: likelihood and impact.","s":"GIAS 14.3"},{"q":"Hồ sơ làm việc phải đủ để:","o":["Gửi cho cơ quan thuế","Thay thế báo cáo cuối","Một KTV thận trọng, có hiểu biết có thể làm lại công việc và đạt cùng kết quả","Đánh giá năng lực KTV"],"a":2,"e":"14.6.","s":"GIAS 14.6"},{"q":"Báo cáo cuối của cuộc đảm bảo KHÔNG bắt buộc có:","o":["Giải thích giới hạn phạm vi (nếu có)","Kết luận về hiệu lực của quy trình","Danh sách toàn bộ chứng từ đã chọn mẫu","Phát hiện cùng mức trọng yếu và ưu tiên"],"a":2,"e":"15.1.","s":"GIAS 15.1"},{"q":"Ai phải duyệt báo cáo cuối trước khi phát hành?","o":["UBKT","Trưởng đơn vị được kiểm toán","Pháp chế","CAE"],"a":3,"e":"15.1.","s":"GIAS 15.1"},{"q":"Cuộc kiểm toán không tuân thủ một chuẩn mực. Báo cáo cuối phải nêu:","o":["Chỉ tên KTV chịu trách nhiệm","Không cần nêu nếu kết luận vẫn đúng","Chuẩn mực không tuân thủ, lý do và ảnh hưởng tới phát hiện, kết luận","Chỉ ghi “có ngoại lệ”"],"a":2,"e":"15.1.","s":"GIAS 15.1"},{"q":"Quản lý chậm thực hiện kế hoạch hành động. Ai xác định QLCC có đang chấp nhận rủi ro vượt ngưỡng chịu đựng không?","o":["Kiểm toán độc lập","Trưởng đơn vị chậm khắc phục","CAE","KTV phụ trách theo dõi"],"a":2,"e":"15.2 → 11.5.","s":"GIAS 15.2"}],"next":"<ol><li><b>Đọc gốc (≈ 60 phút):<\/b> GIAS Domain V, Nguyên tắc 13–15, bản rút gọn trang 48–60.<\/li><li><b>Tự tóm tắt 1 trang:<\/b> sơ đồ 3 bước 13 → 14 → 15, đánh dấu các bước “CAE duyệt”; thử viết lại 1 phát hiện GSHĐ gần nhất theo 5C.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 1 câu 8–10; T3: 40 câu Phần I.<\/li><li><b>K5 (1 giờ):<\/b> Đọc Báo cáo kết quả kinh doanh và Lưu chuyển tiền tệ. Câu tự kiểm: Vì sao lợi nhuận dương mà dòng tiền hoạt động vẫn âm?<\/li><li><b>Sổ lỗi:<\/b> xong Phần I, lọc lại các câu sai của Bài 1–5.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 6 (C6)<\/b>Chính trực và khách quan – GIAS Nguyên tắc 1–2, mở đầu Phần II.<\/div>","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2), Domain V · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1) · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p><p class=\"en\">Mô hình 5C là cách trình bày phổ biến trong thực hành, không phải thuật ngữ của GIAS.<\/p>"},"lessons/L06":{"code":"C6","id":"L06","order":6,"week":6,"title":"Bài 6. Chính trực và khách quan","short":"Chính trực và khách quan","eyebrow":"IAP (CIA Part 1) · Tuần 6 · Chủ đề C6 · Phần II – Đạo đức và chuyên nghiệp (20%)","lead":"Mở đầu Phần II với 7 tình huống về áp lực, quà tặng, xung đột lợi ích tại An Phát. Bài bám <b>Domain II<\/b>: <b>Nguyên tắc 1 – Thể hiện sự chính trực<\/b> và <b>Nguyên tắc 2 – Duy trì khách quan<\/b>.","pills":["⏱ ~102 phút: 7 tình huống · 10 thẻ thuật ngữ · 15 trắc nghiệm","📄 GIAS 1.1–1.3, 2.1–2.3","🎯 Đề cương B.1, B.2, B.3"],"goals":"<ol><li>Áp dụng <b>trung thực và can đảm nghề nghiệp<\/b> khi bị áp lực.<\/li><li>Biết xử lý khi phát hiện <b>vi phạm pháp luật<\/b>, hành vi trái đạo đức.<\/li><li>Nhận diện suy giảm khách quan: <b>tự kiểm tra (12 tháng)<\/b>, quen thuộc, xung đột lợi ích, quà tặng.<\/li><li>Chọn biện pháp: <b>phân công lại, luân chuyển, thuê ngoài, công bố<\/b>.<\/li><li>Biết <b>công bố cho ai<\/b> và khi nào, kể cả khi phát hiện muộn.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"“Bỏ dòng này đi, coi như giúp anh”","std":"GIAS 1.1","scene":"<p>Trong buổi trao đổi kết quả, Giám đốc vùng (người từng giới thiệu KTV Minh vào công ty) đề nghị: <i>“Bỏ giúp anh phát hiện về phiếu nhập kho ký khống, anh sẽ tự chấn chỉnh.”<\/i> Bằng chứng đầy đủ, mức ảnh hưởng đáng kể.<\/p>","q":"KTV Minh nên làm gì?","opts":[["Bỏ phát hiện vì Giám đốc vùng đã hứa khắc phục",false,"Che giấu phát hiện trọng yếu vi phạm 1.1."],["Chuyển phát hiện sang thư quản lý riêng, không đưa vào báo cáo",false,"Né tránh kênh báo cáo chính thức là che giấu."],["Giữ phát hiện, trình bày trung thực, đầy đủ; báo trưởng nhóm, CAE về đề nghị này",true,"1.1: không che giấu, bỏ sót thông tin; can đảm nghề nghiệp. Mối quan hệ cá nhân cũng cần được công khai (2.3)."],["Hạ mức phát hiện xuống “thấp” như một thỏa hiệp",false,"Sai lệch mức trọng yếu cũng là gây hiểu lầm."]],"gias":"<p>1.1 <b>Trung thực và can đảm nghề nghiệp<\/b>: KTV phải trung thực, chính xác, rõ ràng, cởi mở, tôn trọng; <b>không được<\/b> đưa ra tuyên bố sai, gây hiểu lầm, hay <b>che giấu, bỏ sót<\/b> phát hiện; phải công bố mọi sự thật trọng yếu mà nếu không công bố sẽ ảnh hưởng đến quyết định của tổ chức. KTV phải can đảm, kể cả khi gặp tình huống khó.<\/p><p>CAE phải duy trì môi trường để KTV <b>được hỗ trợ<\/b> khi báo kết quả có bằng chứng, dù thuận lợi hay không.<\/p>","take":"<b>Chính trực = nói thật + làm đúng<\/b>, kể cả khi khó chịu. Nền tảng cho 4 nguyên tắc còn lại."},{"title":"Phát hiện hóa đơn không có hàng thật","std":"GIAS 1.3, 1.2","scene":"<p>Khi kiểm toán chi phí marketing, KTV phát hiện 9 hóa đơn GTGT của một công ty quảng cáo nhưng không có bằng chứng dịch vụ được thực hiện. Có dấu hiệu dùng để kê khai khấu trừ thuế sai quy định.<\/p>","q":"KTV cần làm gì?","opts":[["Tự liên hệ cơ quan thuế ngay, không qua ai",false,"Phải theo kênh do luật, chính sách quy định; thường qua CAE, pháp chế."],["Bỏ qua vì đó là việc của phòng kế toán và kiểm toán thuế",false,"KTNB phải báo vi phạm pháp luật đã nhận biết."],["Báo cáo theo chính sách, quy trình đến người hoặc bộ phận có thẩm quyền xử lý (qua CAE, theo quy định pháp luật và quy chế)",true,"1.3: báo vi phạm pháp luật tới người có thẩm quyền theo luật và chính sách."],["Đăng thông tin lên nhóm chat nội bộ để cảnh báo mọi người",false,"Vi phạm bảo mật (Nguyên tắc 5)."]],"gias":"<p>1.3 <b>Hành vi hợp pháp và đạo đức<\/b>: KTV không được tham gia hoạt động bất hợp pháp hoặc làm mất uy tín tổ chức, nghề nghiệp. Phải hiểu và tuân thủ luật liên quan. Phát hiện vi phạm → <b>báo cho người, tổ chức có thẩm quyền<\/b> theo luật, quy định, chính sách.<\/p><p>1.2 <b>Kỳ vọng đạo đức của tổ chức<\/b>: KTV phải hiểu, tôn trọng, đóng góp vào kỳ vọng đạo đức hợp pháp của tổ chức; <b>thúc đẩy văn hóa đạo đức<\/b>; thấy hành vi trái kỳ vọng thì báo theo chính sách.<\/p>","take":"Vi phạm pháp luật → <b>báo đúng kênh có thẩm quyền<\/b>, không tự xử, không lan truyền."},{"title":"Chuyển từ kế toán sang KTNB được 8 tháng","std":"GIAS 2.2","scene":"<p>Chị Hà làm kế toán công nợ phải trả đến tháng 2, chuyển sang KTNB từ tháng 3. Tháng 10, CAE định giao chị kiểm toán quy trình <b>thanh toán nhà cung cấp<\/b> vì <i>“chị hiểu quy trình nhất”<\/i>.<\/p>","q":"Theo GIAS, cách phân công nào đúng?","opts":[["Giao chị Hà vì hiểu biết sâu giúp kiểm toán tốt hơn",false,"Đó chính là rủi ro tự kiểm tra (self-review)."],["Không giao chị Hà cuộc đảm bảo này; khách quan được coi là bị suy giảm khi đảm bảo cho hoạt động mình phụ trách trong 12 tháng trước",true,"Đúng 2.2: ngưỡng 12 tháng."],["Giao, vì chị đã rời bộ phận kế toán hơn 6 tháng",false,"Ngưỡng là 12 tháng, không phải 6."],["Giao, nhưng yêu cầu chị ký cam kết khách quan",false,"Cam kết không loại bỏ suy giảm được GIAS coi là mặc nhiên."]],"gias":"<p>2.2 <b>Bảo vệ khách quan<\/b>: KTV phải nhận biết và tránh hoặc giảm thiểu suy giảm <b>thực tế, tiềm ẩn và bị nhìn nhận<\/b>.<\/p><ul><li>Không đánh giá hoạt động mình từng phụ trách. Khách quan <b>được coi là bị suy giảm<\/b> nếu đảm bảo cho hoạt động mình phụ trách <b>trong 12 tháng trước<\/b>.<\/li><li>Đã tư vấn rồi làm đảm bảo: CAE xác nhận bản chất tư vấn không làm suy giảm và bố trí nguồn lực để quản lý khách quan cá nhân.<\/li><li>Đảm bảo cho chức năng <b>CAE phụ trách<\/b> → do <b>bên độc lập ngoài KTNB<\/b> giám sát.<\/li><li>Tư vấn về hoạt động mình từng phụ trách → <b>công bố<\/b> suy giảm tiềm ẩn cho bên yêu cầu <b>trước khi nhận<\/b>.<\/li><\/ul>","take":"<span class=\"mnemo\">“12 tháng – không tự chấm bài mình”<\/span>. Tư vấn thì được, nhưng <b>công bố trước<\/b>."},{"title":"Phiếu mua hàng từ nhà cung cấp","std":"GIAS 2.2","scene":"<p>Đang kiểm toán hợp đồng vận chuyển, KTV nhận từ nhà cung cấp một phong bì <b>phiếu mua hàng 5 triệu đồng<\/b> “nhân dịp Tết”, kèm lời mời đi du lịch Phú Quốc cùng đội của họ.<\/p>","q":"KTV nên làm gì?","opts":[["Từ chối cả hai, báo trưởng nhóm, CAE theo quy định về quà tặng",true,"2.2: không nhận vật hữu hình hay vô hình có thể làm, hoặc bị coi là làm suy giảm khách quan."],["Nhận để giữ quan hệ, sau cuộc kiểm toán sẽ trả lại",false,"Vẫn là nhận quà trong khi đang kiểm toán."],["Nhận và sau đó ghi rõ trong báo cáo kiểm toán",false,"Công khai không làm hết suy giảm; vẫn bị coi là không khách quan."],["Nhận phiếu mua hàng vì giá trị nhỏ, từ chối chuyến du lịch",false,"Đang kiểm toán chính bên tặng; giá trị không phải yếu tố duy nhất."]],"gias":"<p>2.2: KTV <b>không được nhận<\/b> bất kỳ vật <b>hữu hình hoặc vô hình<\/b> (quà, phần thưởng, ưu đãi) có thể làm, hoặc <b>bị coi là<\/b> làm suy giảm khách quan. KTV phải tránh <b>xung đột lợi ích<\/b> và không chịu ảnh hưởng quá mức từ lợi ích của mình, của người khác (kể cả QLCC), hay từ môi trường chính trị.<\/p><p class=\"en\">Thực tế: áp dụng thêm quy chế quà tặng của tổ chức (ngưỡng giá trị, kê khai); nếu chuẩn mực khắt khe hơn quy chế thì theo chuẩn mực.<\/p>","take":"Đang kiểm toán bên tặng → <b>từ chối + báo cáo<\/b>. Nhìn cả “bị coi là” chứ không chỉ “thực tế”."},{"title":"Bốn năm liền kiểm toán một cửa hàng","std":"GIAS 2.1, 2.2","scene":"<p>KTV Tuấn kiểm toán cửa hàng Gò Vấp 4 năm liền, thân thiết với cửa hàng trưởng, thường đi ăn cùng. Hai năm gần đây báo cáo luôn “không có phát hiện đáng kể”.<\/p>","q":"Rủi ro chính và biện pháp phù hợp là gì?","opts":[["Rủi ro năng lực; cử Tuấn đi đào tạo",false,"Không phải vấn đề năng lực."],["Thiên lệch do quen thuộc (familiarity); luân chuyển KTV hoặc phân công lại cho cuộc tới",true,"2.1: nhận biết, quản lý thiên lệch; 2.2: giảm thiểu suy giảm."],["Không có rủi ro vì kết quả 2 năm đều tốt",false,"Kết quả tốt kéo dài kèm quan hệ thân thiết là dấu hiệu cần xem xét."],["Rủi ro tự kiểm tra; yêu cầu Tuấn ký cam kết",false,"Tuấn không từng phụ trách cửa hàng; vấn đề là quen thuộc."]],"gias":"<p>2.1 <b>Khách quan cá nhân<\/b>: KTV áp dụng tư duy <b>không thiên vị<\/b>, xét đoán dựa trên đánh giá cân bằng mọi hoàn cảnh liên quan; phải <b>nhận biết và quản lý thiên lệch<\/b>.<\/p><div class=\"tbl\"><table><tr><th>Loại suy giảm thường gặp<\/th><th>Ví dụ<\/th><th>Biện pháp<\/th><\/tr><tr><td>Tự kiểm tra (self-review)<\/td><td>Đảm bảo cho quy trình mình từng làm, từng thiết kế<\/td><td>Phân công người khác; ngưỡng 12 tháng<\/td><\/tr><tr><td>Quen thuộc (familiarity)<\/td><td>Kiểm toán cùng một đơn vị nhiều năm, quan hệ thân thiết<\/td><td>Luân chuyển, giám sát chặt<\/td><\/tr><tr><td>Lợi ích cá nhân<\/td><td>Người thân làm ở đơn vị, có cổ phần ở nhà cung cấp<\/td><td>Công bố, rút khỏi cuộc kiểm toán<\/td><\/tr><tr><td>Áp lực, đe dọa<\/td><td>Bị dọa ảnh hưởng đánh giá cuối năm<\/td><td>Báo CAE; nâng lên HĐQT nếu cần<\/td><\/tr><\/table><\/div>","take":"Quen quá thành <b>dễ dãi<\/b>: <b>luân chuyển<\/b> là biện pháp kinh điển."},{"title":"Năm ngoái tư vấn, năm nay đảm bảo","std":"GIAS 2.2","scene":"<p>Năm ngoái KTNB tư vấn thiết kế quy trình <b>đổi trả hàng<\/b> (góp ý kiểm soát, ban điều hành tự quyết). Năm nay kế hoạch có cuộc đảm bảo cho chính quy trình này.<\/p>","q":"Điều kiện để KTNB thực hiện cuộc đảm bảo là gì?","opts":[["Được làm ngay, không cần điều kiện gì",false,"CAE phải xác nhận và bố trí nguồn lực phù hợp."],["Không bao giờ được đảm bảo cho quy trình KTNB đã tư vấn",false,"GIAS cho phép, kèm điều kiện."],["CAE xác nhận bản chất cuộc tư vấn không làm suy giảm khách quan và bố trí nhân sự để quản lý khách quan cá nhân, ví dụ dùng người không tham gia tư vấn",true,"Đúng 2.2."],["Phải thuê kiểm toán độc lập thực hiện thay",false,"Chỉ bắt buộc khi đảm bảo cho chức năng CAE phụ trách."]],"gias":"<p>2.2: Nếu KTNB đảm bảo cho hoạt động từng được tư vấn, <b>CAE phải xác nhận<\/b> bản chất tư vấn không làm suy giảm khách quan và <b>bố trí nguồn lực<\/b> để quản lý khách quan cá nhân.<\/p><p>CAE phải ban hành <b>phương pháp luận<\/b> xử lý suy giảm khách quan; KTV phải thảo luận và hành động theo phương pháp đó.<\/p>","take":"Tư vấn → đảm bảo: <b>CAE xác nhận + đổi người<\/b>."},{"title":"Phát hiện suy giảm sau khi đã phát hành báo cáo","std":"GIAS 2.3","scene":"<p>Hai tháng sau khi phát hành báo cáo kiểm toán quy trình mua hàng, CAE biết KTV chính có em ruột là chủ một nhà cung cấp trong mẫu kiểm tra. KTV không công bố quan hệ này.<\/p>","q":"CAE phải làm gì?","opts":[["Chỉ nhắc nhở KTV, không cần trao đổi với ai",false,"Phải trao đổi với các bên vì độ tin cậy của kết quả bị ảnh hưởng."],["Hủy báo cáo và xóa hồ sơ",false,"Không được xóa hồ sơ; cần xác định hành động khắc phục."],["Không làm gì vì báo cáo đã phát hành",false,"2.3 có yêu cầu riêng cho trường hợp phát hiện sau khi hoàn thành."],["Thảo luận với quản lý đơn vị được kiểm toán, HĐQT, QLCC và/hoặc các bên bị ảnh hưởng để xác định hành động phù hợp, vd. kiểm tra lại phần việc liên quan",true,"Đúng 2.3."]],"gias":"<p>2.3 <b>Công bố suy giảm<\/b>: suy giảm thực tế hoặc bề ngoài phải được công bố <b>kịp thời<\/b> cho bên phù hợp.<\/p><ul><li>KTV biết mình bị suy giảm → công bố cho <b>CAE hoặc người giám sát<\/b>.<\/li><li>CAE thấy suy giảm ảnh hưởng năng lực làm việc khách quan → thảo luận với quản lý hoạt động, HĐQT và/hoặc QLCC.<\/li><li>Phát hiện <b>sau khi hoàn thành<\/b>, ảnh hưởng độ tin cậy kết quả → thảo luận với các bên, xác định hành động (xem 11.4 Sai sót và bỏ sót).<\/li><li><b>CAE<\/b> bị suy giảm → công bố cho <b>HĐQT<\/b>.<\/li><\/ul>","take":"KTV → CAE · CAE → HĐQT. Phát hiện muộn vẫn phải <b>xử lý và trao đổi<\/b>."}],"summary":"<div class=\"tbl\"><table><tr><th>Chuẩn mực<\/th><th>Yêu cầu cốt lõi<\/th><\/tr><tr><td>1.1 Trung thực, can đảm<\/td><td>Không sai lệch, không che giấu; công bố sự thật trọng yếu; CAE tạo môi trường hỗ trợ<\/td><\/tr><tr><td>1.2 Kỳ vọng đạo đức của tổ chức<\/td><td>Hiểu, tôn trọng, đóng góp; thúc đẩy văn hóa đạo đức; báo hành vi trái kỳ vọng<\/td><\/tr><tr><td>1.3 Hợp pháp, đạo đức<\/td><td>Không tham gia việc bất hợp pháp, làm mất uy tín; báo vi phạm tới người có thẩm quyền<\/td><\/tr><tr><td>2.1 Khách quan cá nhân<\/td><td>Tư duy không thiên vị; nhận biết, quản lý thiên lệch<\/td><\/tr><tr><td>2.2 Bảo vệ khách quan<\/td><td>Tránh hoặc giảm suy giảm thực tế, tiềm ẩn, bị nhìn nhận; không nhận quà; 12 tháng; tư vấn → đảm bảo; chức năng CAE phụ trách → bên độc lập giám sát<\/td><\/tr><tr><td>2.3 Công bố suy giảm<\/td><td>KTV → CAE; CAE → quản lý, HĐQT, QLCC; phát hiện sau khi hoàn thành vẫn xử lý; CAE bị suy giảm → HĐQT<\/td><\/tr><\/table><\/div><h3>Độc lập (Nguyên tắc 7) và khách quan (Nguyên tắc 2)<\/h3><div class=\"tbl\"><table><tr><th><\/th><th>Độc lập<\/th><th>Khách quan<\/th><\/tr><tr><td>Cấp<\/td><td>Chức năng KTNB<\/td><td>Cá nhân KTV<\/td><\/tr><tr><td>Bảo vệ bởi<\/td><td>Vị trí tổ chức, báo cáo HĐQT<\/td><td>Phân công, luân chuyển, công bố<\/td><\/tr><\/table><\/div>","terms":[["Integrity","Chính trực","Tuân thủ nguyên tắc đạo đức: trung thực và can đảm hành động dựa trên sự thật.","Giữ phát hiện dù Giám đốc vùng xin bỏ."],["Professional courage","Can đảm nghề nghiệp","Nói thật, hành động đúng kể cả khi bị áp lực hoặc gặp hậu quả bất lợi.","Báo phát hiện liên quan đến cấp trên của mình."],["Objectivity","Khách quan","Thái độ tư duy không thiên vị để xét đoán chuyên môn không bị thỏa hiệp.","Đánh giá cân bằng cả giải trình của cửa hàng."],["Impairment to objectivity","Suy giảm khách quan","Có thể là thực tế, tiềm ẩn hoặc bị nhìn nhận (bề ngoài).","KTV có người thân làm ở đơn vị được kiểm toán."],["Conf
