lict of interest","Xung đột lợi ích","Tình huống, quan hệ có thể ảnh hưởng hoặc bị coi là ảnh hưởng tới xét đoán khách quan.","KTV góp vốn vào nhà cung cấp đang được kiểm toán."],["Self-review","Tự kiểm tra","Đánh giá công việc mình từng làm; GIAS coi là suy giảm nếu trong 12 tháng trước.","Cựu kế toán công nợ kiểm toán quy trình thanh toán."],["Familiarity bias","Thiên lệch quen thuộc","Quan hệ lâu dài khiến KTV dễ tin, dễ dãi.","4 năm liền kiểm toán cùng một cửa hàng."],["Gift, reward, favor","Quà, thưởng, ưu đãi","Vật hữu hình hoặc vô hình có thể làm hoặc bị coi là làm suy giảm khách quan; không được nhận.","Phiếu mua hàng, chuyến du lịch của nhà cung cấp."],["Disclosure","Công bố","Thông báo kịp thời chi tiết suy giảm cho bên phù hợp (2.3).","KTV báo CAE về quan hệ họ hàng trước khi nhận cuộc."],["Ethics-based culture","Văn hóa dựa trên đạo đức","KTV phải khuyến khích, thúc đẩy trong tổ chức (1.2).","Lồng ghép nội dung quy tắc ứng xử vào buổi họp mở đầu."]],"traps":"<div class=\"trap\"><b class=\"h\">12 tháng, không phải 6 hay 24<\/b>Đảm bảo cho hoạt động mình phụ trách trong <b>12 tháng trước<\/b> → khách quan <b>được coi là<\/b> bị suy giảm.<\/div><div class=\"trap\"><b class=\"h\">Tư vấn được, đảm bảo thì không<\/b>Hoạt động từng phụ trách: <b>tư vấn được nếu công bố trước<\/b>; <b>đảm bảo<\/b> trong 12 tháng thì không.<\/div><div class=\"trap\"><b class=\"h\">Cam kết không thay thế biện pháp<\/b>Đáp án “cho KTV ký cam kết khách quan” thường sai nếu suy giảm đã rõ. Cần <b>phân công lại<\/b>.<\/div><div class=\"trap\"><b class=\"h\">Công bố đúng người<\/b>KTV → <b>CAE<\/b> (hoặc người giám sát). CAE → <b>HĐQT<\/b>. Không công bố trực tiếp cho đơn vị được kiểm toán thay cho CAE.<\/div><div class=\"trap\"><b class=\"h\">Quà “nhỏ” vẫn có thể sai<\/b>Tiêu chí là <b>có thể làm hoặc bị coi là<\/b> làm suy giảm khách quan, đặc biệt khi đang kiểm toán bên tặng.<\/div>","quiz":[{"q":"Theo GIAS, Domain II (Đạo đức và chuyên nghiệp) thay thế văn bản nào của IIA trước đây?","o":["Định nghĩa KTNB","Bộ quy tắc đạo đức (Code of Ethics)","Hướng dẫn thực hành","Các nguyên tắc cốt lõi"],"a":1,"e":"Domain II replaces The IIA's former Code of Ethics.","s":"GIAS Domain II"},{"q":"Nguyên tắc nào được GIAS mô tả là nền tảng của các nguyên tắc đạo đức còn lại?","o":["Bảo mật","Năng lực","Khách quan","Chính trực"],"a":3,"e":"Integrity is the foundation of the other principles.","s":"GIAS Nguyên tắc 1"},{"q":"KTV phải công bố những sự thật nào?","o":["Chỉ những gì ban điều hành đồng ý","Chỉ những sự thật có lợi cho tổ chức","Mọi chi tiết dù không trọng yếu","Mọi sự thật trọng yếu mà nếu không công bố có thể ảnh hưởng đến khả năng ra quyết định của tổ chức"],"a":3,"e":"1.1.","s":"GIAS 1.1"},{"q":"Ai phải duy trì môi trường làm việc để KTV được hỗ trợ khi báo kết quả bất lợi có bằng chứng?","o":["Từng KTV","Tổng giám đốc","HĐQT","CAE"],"a":3,"e":"1.1.","s":"GIAS 1.1"},{"q":"KTV phát hiện vi phạm pháp luật. Theo 1.3, KTV phải:","o":["Báo cho người hoặc tổ chức có thẩm quyền xử lý, theo luật và chính sách","Chỉ ghi vào hồ sơ","Tự công bố ra công chúng","Chờ kiểm toán độc lập phát hiện"],"a":0,"e":"1.3.","s":"GIAS 1.3"},{"q":"Khách quan theo GIAS là:","o":["Việc không có quan hệ với bất kỳ ai trong tổ chức","Vị trí báo cáo trực tiếp HĐQT","Thái độ tư duy không thiên vị cho phép xét đoán chuyên môn không bị thỏa hiệp","Việc dùng số liệu định lượng"],"a":2,"e":"Glossary – objectivity.","s":"GIAS Nguyên tắc 2"},{"q":"Khách quan được coi là bị suy giảm nếu KTV đảm bảo cho hoạt động mình phụ trách trong khoảng:","o":["12 tháng trước","3 năm trước","24 tháng trước","6 tháng trước"],"a":0,"e":"2.2.","s":"GIAS 2.2"},{"q":"KTNB đảm bảo cho một chức năng mà CAE đang phụ trách. Yêu cầu là:","o":["Cuộc đảm bảo phải do bên độc lập ngoài KTNB giám sát","CAE tự giám sát","Do Tổng giám đốc phê duyệt","Không cần biện pháp gì"],"a":0,"e":"2.2.","s":"GIAS 2.2"},{"q":"KTV được mời tư vấn cho hoạt động mình từng phụ trách. KTV phải:","o":["Từ chối trong mọi trường hợp","Nhận mà không cần thông báo","Xin phép HĐQT","Công bố suy giảm tiềm ẩn cho bên yêu cầu trước khi nhận"],"a":3,"e":"2.2.","s":"GIAS 2.2"},{"q":"Suy giảm khách quan nào dưới đây là “bị nhìn nhận” (perceived)?","o":["KTV đã cố ý bỏ qua phát hiện","KTV thiếu kỹ năng phân tích dữ liệu","Người ngoài có thể nghĩ KTV thiên vị dù thực tế KTV vẫn khách quan","KTV bị giới hạn phạm vi"],"a":2,"e":"2.2: actual, potential, perceived.","s":"GIAS 2.2"},{"q":"KTV nhận ra mình có xung đột lợi ích. Trước tiên phải công bố cho:","o":["HĐQT","CAE hoặc người giám sát được chỉ định","Đồng nghiệp trong nhóm","Trưởng đơn vị được kiểm toán"],"a":1,"e":"2.3.","s":"GIAS 2.3"},{"q":"Khách quan của CAE bị suy giảm. CAE phải công bố cho:","o":["Tổng giám đốc","Kiểm toán độc lập","Phòng nhân sự","HĐQT"],"a":3,"e":"2.3; xem thêm 7.1.","s":"GIAS 2.3"},{"q":"Biện pháp phù hợp nhất cho thiên lệch quen thuộc là:","o":["Luân chuyển KTV giữa các đơn vị","Cho KTV ký cam kết","Tăng cỡ mẫu","Bỏ cuộc kiểm toán"],"a":0,"e":"Biện pháp phổ biến khi quản lý suy giảm (2.2).","s":"GIAS 2.2"},{"q":"Ai phải ban hành phương pháp luận xử lý suy giảm khách quan?","o":["IIA","Phòng pháp chế","CAE","HĐQT"],"a":2,"e":"2.2.","s":"GIAS 2.2"},{"q":"Nếu tổ chức có bộ quy tắc ứng xử riêng, KTV:","o":["Chỉ tuân thủ quy tắc của tổ chức","Chọn bộ nào dễ hơn","Vẫn phải tuân thủ các nguyên tắc, chuẩn mực đạo đức của GIAS","Không cần tuân thủ GIAS về đạo đức"],"a":2,"e":"Domain II intro.","s":"GIAS Domain II"}],"next":"<ol><li><b>Đọc gốc (≈ 45 phút):<\/b> GIAS Domain II mở đầu, Nguyên tắc 1–2, bản rút gọn trang 16–19; đối chiếu bản tiếng Việt Bộ quy tắc đạo đức (T2) để thấy GIAS mở rộng gì.<\/li><li><b>Tự tóm tắt 1 trang:<\/b> bảng 4 loại suy giảm khách quan + biện pháp; liệt kê quy định quà tặng của công ty, so với 2.2.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 2 câu 1–3.<\/li><li><b>K6 (1 giờ):<\/b> Doanh thu, giá vốn, hàng tồn kho. Câu tự kiểm: Thời điểm ghi nhận doanh thu bán lẻ là khi nào? Hàng khuyến mãi ghi nhận thế nào?<\/li><li><b>Sổ lỗi:<\/b> ghi câu sai và tình huống không đúng ngay lần đầu.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 7 (C7)<\/b>Năng lực, thận trọng nghề nghiệp, bảo mật – GIAS Nguyên tắc 3–5.<\/div>","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2), Domain II · Bộ quy tắc đạo đức IIA bản tiếng Việt (T2) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), Section B · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p><p class=\"en\">Bảng loại suy giảm là cách hệ thống hóa để học, không phải danh mục chính thức trong GIAS.<\/p>"},"lessons/L07":{"code":"C7","id":"L07","order":7,"week":7,"title":"Bài 7. Năng lực, thận trọng nghề nghiệp và bảo mật","short":"Năng lực, thận trọng nghề nghiệp, bảo mật","eyebrow":"IAP (CIA Part 1) · Tuần 7 · Chủ đề C7 · Phần II – Đạo đức và chuyên nghiệp (20%)","lead":"Khép lại Phần II với 7 tình huống. Bài bám <b>Domain II<\/b>: <b>Nguyên tắc 3 – Thể hiện năng lực<\/b>, <b>4 – Thận trọng nghề nghiệp<\/b>, <b>5 – Bảo mật<\/b>.","pills":["⏱ ~102 phút: 7 tình huống · 10 thẻ thuật ngữ · 15 trắc nghiệm","📄 GIAS 3.1–3.2, 4.1–4.3, 5.1–5.2; T10","🎯 Đề cương B.4, B.5, B.6"],"goals":"<ol><li>Biết yêu cầu năng lực <b>cá nhân<\/b> và <b>tập thể<\/b>; cách xử lý khi thiếu.<\/li><li>Nắm yêu cầu <b>CPE<\/b> của người có chứng chỉ IIA.<\/li><li>Kể đủ các yếu tố <b>thận trọng nghề nghiệp<\/b> (4.2) và 4 hành vi của <b>hoài nghi nghề nghiệp<\/b> (4.3).<\/li><li>Biết xử lý khi <b>không tuân thủ được<\/b> một phần GIAS.<\/li><li>Phân biệt <b>sử dụng<\/b> và <b>bảo vệ<\/b> thông tin; áp dụng cho cả bên thuê ngoài.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Được giao kiểm toán an ninh mạng","std":"GIAS 3.1","scene":"<p>Kế hoạch có cuộc kiểm toán <b>an ninh mạng hệ thống thanh toán thẻ<\/b>. Cả 3 KTV của An Phát đều có nền tảng kế toán, chưa ai được đào tạo về bảo mật hệ thống.<\/p>","q":"Cách xử lý phù hợp nhất là:","opts":[["Vẫn làm, dùng bảng câu hỏi tải trên mạng",false,"Thực hiện dịch vụ không đủ năng lực vi phạm 3.1."],["Nhờ bộ phận CNTT tự kiểm tra và KTNB ký tên kết luận",false,"KTNB phải có cơ sở cho kết luận; CNTT là đơn vị được kiểm toán."],["Bỏ cuộc kiểm toán, không cần báo ai",false,"Bỏ vùng rủi ro cao phải giải thích với HĐQT (9.4)."],["CAE bổ sung năng lực còn thiếu, ví dụ thuê chuyên gia bên ngoài cùng thực hiện, hoặc báo HĐQT nếu không bổ sung được",true,"3.1: KTV chỉ nhận dịch vụ có hoặc đạt được năng lực cần thiết; CAE bảo đảm năng lực tập thể."]],"gias":"<p>3.1 <b>Năng lực<\/b>: KTV phải <b>có hoặc đạt được<\/b> năng lực (kiến thức, kỹ năng, khả năng) phù hợp vị trí; phải hiểu GIAS. KTV chỉ nhận dịch vụ mà mình <b>có hoặc có thể đạt<\/b> năng lực.<\/p><p>CAE phải bảo đảm KTNB <b>tập thể<\/b> có năng lực thực hiện các dịch vụ trong Điều lệ, <b>hoặc phải có được<\/b> năng lực đó (thuê ngoài, tuyển dụng, đào tạo).<\/p>","take":"Năng lực: <b>cá nhân có hoặc đạt được<\/b> + <b>tập thể đủ<\/b>. Thiếu → bổ sung, không làm liều."},{"title":"Thi đậu CIA rồi có cần học tiếp?","std":"GIAS 3.2 · T10","scene":"<p>Sau khi đậu CIA, KTV Lan nói: <i>“Có chứng chỉ rồi, không cần học thêm nữa. Năm nay em bận, bỏ khai báo CPE.”<\/i><\/p>","q":"Nhận định nào đúng?","opts":[["Đúng, chứng chỉ CIA có giá trị vĩnh viễn",false,"Không khai báo CPE sẽ chuyển sang trạng thái không hoạt động."],["KTV phải phát triển nghề nghiệp liên tục; người có chứng chỉ phải đáp ứng chính sách CPE của chứng chỉ, với CIA là khai báo hằng năm trước 31/12, trong đó có 2 giờ về đạo đức",true,"3.2 và Sổ tay ứng viên (T10)."],["CPE chỉ cần khai báo 5 năm một lần",false,"Khai báo hằng năm."],["Chỉ CAE mới phải học tập liên tục",false,"3.2 áp dụng cho mọi KTV."]],"gias":"<p>3.2 <b>Phát triển nghề nghiệp liên tục<\/b>: KTV phải duy trì và phát triển năng lực, theo đuổi giáo dục, đào tạo. Người đã có chứng chỉ phải tuân thủ chính sách CPE của chứng chỉ đó.<\/p><p>Sổ tay ứng viên IIA (T10): người có chứng chỉ phải xác nhận hoàn thành giờ CPE, <b>gồm 2 giờ đạo đức<\/b>, trước <b>31/12 hằng năm<\/b>. Không đáp ứng → vào <b>“Grace Period”<\/b> (không hoạt động); IIA có thể kiểm tra ngẫu nhiên chứng nhận CPE.<\/p>","take":"Có chứng chỉ ≠ hết học. <b>CPE hằng năm, có 2 giờ đạo đức, hạn 31/12<\/b>."},{"title":"Kiểm tra 100% hóa đơn của 120 cửa hàng?","std":"GIAS 4.2","scene":"<p>UBKT muốn kiểm tra hóa đơn đầu vào. Một KTV đề xuất kiểm tra tay <b>100% hóa đơn<\/b> của 120 cửa hàng trong 2 tháng. Hệ thống ERP đã có dữ liệu hóa đơn điện tử đầy đủ.<\/p>","q":"Theo yêu cầu thận trọng nghề nghiệp, KTV nên cân nhắc gì?","opts":[["Để ban điều hành chọn hóa đơn cần kiểm tra",false,"Mất khách quan; KTV tự xác định phương pháp."],["Cân nhắc chi phí so với lợi ích, mức trọng yếu, khả năng có sai sót, gian lận, và dùng kỹ thuật, công cụ phù hợp như phân tích dữ liệu toàn bộ hóa đơn rồi kiểm tra sâu các ngoại lệ",true,"4.2 liệt kê các yếu tố này."],["Chỉ kiểm tra 5 hóa đơn cho nhanh",false,"Mức độ công việc phải đủ để đạt mục tiêu."],["Luôn kiểm tra 100% vì thận trọng nghĩa là không bỏ sót",false,"Thận trọng không có nghĩa là hoàn hảo; phải cân nhắc chi phí – lợi ích."]],"gias":"<p>Nguyên tắc 4: thận trọng = siêng năng, xét đoán, hoài nghi của một KTV thận trọng, có năng lực; <b>không đòi hỏi không bao giờ sai<\/b>.<\/p><p>4.2: Xem xét bản chất, hoàn cảnh, yêu cầu của dịch vụ, gồm:<\/p><ul><li>Chiến lược, mục tiêu của tổ chức.<\/li><li>Lợi ích của người nhận dịch vụ và các bên liên quan.<\/li><li>Mức đầy đủ, hiệu lực của quản trị, rủi ro, kiểm soát.<\/li><li><b>Chi phí so với lợi ích<\/b> tiềm năng.<\/li><li>Mức độ, tính kịp thời của công việc.<\/li><li>Độ phức tạp, trọng yếu của rủi ro.<\/li><li><b>Khả năng có sai sót, gian lận, không tuân thủ<\/b> trọng yếu.<\/li><li>Dùng <b>kỹ thuật, công cụ, công nghệ<\/b> phù hợp.<\/li><\/ul>","take":"Thận trọng ≠ hoàn hảo. Nhớ <b>chi phí – lợi ích<\/b> và <b>công nghệ phù hợp<\/b>."},{"title":"“Hàng hư đã hủy rồi”","std":"GIAS 4.3","scene":"<p>Cửa hàng Bình Thạnh lệch kho 82 triệu đồng. Cửa hàng trưởng giải thích: <i>“Hàng hư, đã hủy tháng trước.”<\/i> Không có biên bản hủy, không có ảnh, kế toán không ghi nhận chi phí hủy.<\/p>","q":"KTV nên làm gì?","opts":[["Ghi nhận lời giải thích vào hồ sơ và đóng mục kiểm tra",false,"Thông tin không nhất quán phải được tìm thêm bằng chứng."],["Thận trọng với lời giải thích, nêu thắc mắc thẳng thắn và tìm thêm bằng chứng như biên bản, chứng từ, camera, xác nhận của người chứng kiến",true,"4.3: hoài nghi nghề nghiệp."],["Kết luận ngay là gian lận và báo kỷ luật",false,"Hoài nghi không phải là định kiến; cần bằng chứng."],["Chấp nhận vì cửa hàng trưởng làm việc lâu năm, đáng tin",false,"Kinh nghiệm hay thâm niên không thay thế bằng chứng."]],"gias":"<p>4.3 <b>Hoài nghi nghề nghiệp<\/b>: KTV phải:<\/p><ul><li>Giữ thái độ <b>tò mò, đặt câu hỏi<\/b>.<\/li><li><b>Đánh giá phê phán<\/b> độ tin cậy của thông tin.<\/li><li><b>Thẳng thắn, trung thực<\/b> khi nêu thắc mắc về thông tin không nhất quán.<\/li><li><b>Tìm thêm bằng chứng<\/b> cho thông tin có thể chưa đầy đủ, không nhất quán, sai hoặc gây hiểu lầm.<\/li><\/ul>","take":"Hoài nghi = <b>hỏi + kiểm chứng<\/b>, không phải <b>nghi ngờ mọi người<\/b>."},{"title":"Luật yêu cầu khác với GIAS","std":"GIAS 4.1","scene":"<p>Một công ty con của An Phát hoạt động trong lĩnh vực mà quy định pháp luật bắt buộc báo cáo KTNB phải gửi Tổng giám đốc trước khi gửi HĐQT, khác với cách KTNB đang làm theo GIAS.<\/p>","q":"CAE phải xử lý thế nào?","opts":[["Tuân thủ luật ở phần bị luật chi phối, tuân thủ mọi phần còn lại của GIAS, và công bố phù hợp: ghi lại hoàn cảnh, biện pháp thay thế, ảnh hưởng, lý do",true,"4.1."],["Bỏ tuân thủ toàn bộ GIAS ở công ty con này",false,"Phải tuân thủ mọi phần còn lại."],["Lờ luật đi để tuân thủ GIAS",false,"KTV phải tuân thủ pháp luật (1.3)."],["Không cần ghi lại gì vì đây là yêu cầu pháp lý",false,"CAE phải ghi lại và trao đổi về việc không tuân thủ."]],"gias":"<p>4.1: KTV phải lập kế hoạch và thực hiện dịch vụ theo GIAS và <b>phương pháp luận<\/b> của KTNB. Nếu dùng kèm yêu cầu của tổ chức khác thì nêu rõ trong báo cáo.<\/p><ul><li>Luật cấm tuân thủ một phần → <b>tuân thủ mọi phần còn lại<\/b>, công bố phù hợp.<\/li><li>Không tuân thủ được một yêu cầu → CAE <b>ghi lại và trao đổi<\/b>: hoàn cảnh, biện pháp thay thế, ảnh hưởng, lý do (xem 8.3, 12.1, 15.1).<\/li><\/ul>","take":"Không tuân thủ được một phần → <b>tuân thủ phần còn lại + ghi lại + công bố<\/b>."},{"title":"Biết trước kế hoạch đóng cửa hàng","std":"GIAS 5.1","scene":"<p>Qua cuộc kiểm toán, KTV biết công ty sẽ <b>đóng 10 cửa hàng<\/b> vào quý sau, trong đó có cửa hàng nằm trên mặt bằng mà anh trai KTV muốn thuê lại để mở quán cà phê.<\/p>","q":"KTV nên làm gì với thông tin này?","opts":[["Không nói với anh trai, nhưng tự đứng tên thuê mặt bằng",false,"Vẫn là dùng thông tin vì lợi ích cá nhân."],["Báo trước cho anh trai vì không gây thiệt hại cho công ty",false,"Dùng thông tin vì lợi ích cá nhân là vi phạm 5.1."],["Đăng thông tin lên mạng xã hội sau khi kết thúc kiểm toán",false,"Vi phạm bảo mật 5.2."],["Chỉ dùng cho mục đích công việc; không tiết lộ cho anh trai; công bố xung đột lợi ích tiềm ẩn cho CAE",true,"5.1 và 2.3."]],"gias":"<p>Nguyên tắc 5: KTV có quyền tiếp cận không hạn chế nên thường nhận thông tin <b>bảo mật, độc quyền, định danh cá nhân<\/b> (giấy tờ, dữ liệu số, cả thông tin từ trao đổi miệng).<\/p><p>5.1 <b>Sử dụng thông tin<\/b>: theo chính sách, quy trình, luật; <b>không dùng vì lợi ích cá nhân<\/b> hay trái mục tiêu hợp pháp, đạo đức của tổ chức.<\/p>","take":"Thông tin kiểm toán = <b>chỉ dùng cho công việc<\/b>. Lợi ích cá nhân là vùng cấm."},{"title":"Gửi file lương qua email cá nhân","std":"GIAS 5.2","scene":"<p>Để làm thêm ở nhà, KTV gửi file <b>bảng lương 2.400 nhân viên<\/b> về email cá nhân. Ngoài ra, chuyên gia thuê ngoài cho cuộc kiểm toán CNTT lưu hồ sơ trên máy tính riêng của công ty họ.<\/p>","q":"Yêu cầu nào của GIAS đang bị vi phạm?","opts":[["Chỉ chuyên gia thuê ngoài vi phạm vì không phải nhân viên",false,"Cả hai đều liên quan; CAE chịu trách nhiệm với bên thuê ngoài."],["Chỉ vi phạm nếu thông tin thực sự bị lộ",false,"KTV phải quản lý rủi ro lộ thông tin, kể cả khi chưa xảy ra."],["Bảo vệ thông tin: KTV phải quản lý rủi ro lộ thông tin vô ý và tuân thủ quy định về bảo mật, quyền riêng tư; CAE phải bảo đảm bên hỗ trợ KTNB tuân thủ cùng yêu cầu bảo vệ",true,"Đúng 5.2."],["Không vi phạm gì vì đều để phục vụ công việc",false,"Mục đích công việc không loại trừ yêu cầu bảo vệ thông tin."]],"gias":"<p>5.2 <b>Bảo vệ thông tin<\/b>: tôn trọng tính bảo mật, quyền riêng tư, quyền sở hữu thông tin; tuân thủ luật, chính sách về bảo mật, an ninh thông tin. Điểm cần chú ý:<\/p><ul><li>Lưu giữ, thời hạn lưu, tiêu hủy hồ sơ kiểm toán.<\/li><li>Cung cấp hồ sơ cho bên trong và bên ngoài.<\/li><li>Xử lý bản sao thông tin bảo mật khi không còn cần.<\/li><\/ul><p>Không tiết lộ cho bên không có thẩm quyền, <b>trừ khi có trách nhiệm pháp lý hoặc nghề nghiệp<\/b>. Phải <b>quản lý rủi ro lộ vô ý<\/b>. CAE bảo đảm <b>người hỗ trợ KTNB<\/b> tuân thủ cùng yêu cầu.<\/p>","take":"Bảo mật áp dụng cho <b>cả người thuê ngoài<\/b>. Lộ vô ý cũng phải phòng ngừa."}],"summary":"<div class=\"tbl\"><table><tr><th>Nguyên tắc<\/th><th>Chuẩn mực<\/th><th>Điểm cần nhớ<\/th><\/tr><tr><td>3 Năng lực<\/td><td>3.1, 3.2<\/td><td>Có hoặc đạt được; CAE bảo đảm năng lực tập thể; CPE theo chứng chỉ<\/td><\/tr><tr><td>4 Thận trọng<\/td><td>4.1–4.3<\/td><td>Tuân thủ GIAS và phương pháp luận; 8 yếu tố cân nhắc; hoài nghi: tò mò, đánh giá phê phán, thẳng thắn, tìm thêm bằng chứng; không đòi hỏi không bao giờ sai<\/td><\/tr><tr><td>5 Bảo mật<\/td><td>5.1, 5.2<\/td><td>Chỉ dùng cho mục đích nghề nghiệp; bảo vệ khỏi tiếp cận, tiết lộ trái phép; quản lý lộ vô ý; áp dụng cho bên hỗ trợ<\/td><\/tr><\/table><\/div><h3>5 nguyên tắc Domain II<\/h3><div class=\"tbl\"><table><tr><th>#<\/th><th>Nguyên tắc<\/th><th>Từ khóa<\/th><\/tr><tr><td>1<\/td><td>Chính trực<\/td><td>Trung thực, can đảm<\/td><\/tr><tr><td>2<\/td><td>Khách quan<\/td><td>Không thiên vị, 12 tháng<\/td><\/tr><tr><td>3<\/td><td>Năng lực<\/td><td>Có hoặc đạt được, CPE<\/td><\/tr><tr><td>4<\/td><td>Thận trọng<\/td><td>Chi phí – lợi ích, hoài nghi<\/td><\/tr><tr><td>5<\/td><td>Bảo mật<\/td><td>Dùng đúng, bảo vệ<\/td><\/tr><\/table><\/div>","terms":[["Competency","Năng lực","Kiến thức, kỹ năng và khả năng phù hợp với vị trí, trách nhiệm.","Biết dùng công cụ phân tích dữ liệu POS."],["Continuing professional development (CPD/CPE)","Phát triển nghề nghiệp liên tục","Học tập, đào tạo để duy trì năng lực; người có chứng chỉ khai báo CPE hằng năm.","CIA khai báo CPE trước 31/12, có 2 giờ đạo đức."],["Due professional care","Thận trọng nghề nghiệp","Siêng năng, xét đoán, hoài nghi của KTV thận trọng, có năng lực; không đòi hỏi tuyệt đối không sai.","Cân nhắc chi phí – lợi ích khi chọn kiểm tra 100% hay chọn mẫu."],["Professional skepticism","Hoài nghi nghề nghiệp","Đặt câu hỏi và đánh giá phê phán độ tin cậy của thông tin.","Yêu cầu biên bản hủy hàng thay vì tin lời giải thích."],["Confidentiality","Bảo mật","Dùng và bảo vệ thông tin phù hợp, chỉ cho mục đích nghề nghiệp.","Không tiết lộ kế hoạch đóng cửa hàng."],["Personally identifiable information","Thông tin định danh cá nhân","Thông tin xác định được một cá nhân cụ thể.","Bảng lương có họ tên, số tài khoản, CCCD."],["Engagement records","Hồ sơ kiểm toán","Tài liệu của cuộc kiểm toán; cần quy định lưu, cung cấp, tiêu hủy.","Quy định lưu hồ sơ 10 năm, tiêu hủy có biên bản."],["Nonconformance","Không tuân thủ chuẩn mực","Không đáp ứng một yêu cầu của GIAS; phải ghi lại, trao đổi, công bố khi cần.","Luật chuyên ngành yêu cầu tuyến báo cáo khác GIAS."],["Methodologies","Phương pháp luận","Chính sách, quy trình, thủ tục của KTNB; KTV phải tuân thủ khi làm việc (4.1).","Sổ tay KTNB quy định cách chọn mẫu."],["Infallible","Không bao giờ sai","GIAS nói rõ thận trọng nghề nghiệp không đòi hỏi KTV không bao giờ sai.","Gian lận được che giấu tinh vi có thể không bị phát hiện dù KTV đã thận trọng."]],"traps":"<div class=\"trap\"><b class=\"h\">Thận trọng ≠ hoàn hảo<\/b>Đáp án “KTV phải phát hiện mọi sai phạm” luôn sai. GIAS: <b>not expected to be infallible<\/b>.<\/div><div class=\"trap\"><b class=\"h\">Hoài nghi ≠ định kiến<\/b>Hoài nghi là <b>kiểm chứng<\/b>, không phải giả định mọi người gian lận.<\/div><div class=\"trap\"><b class=\"h\">Bảo mật có ngoại lệ<\/b>Được tiết lộ khi có <b>trách nhiệm pháp lý hoặc nghề nghiệp<\/b> (vd. theo yêu cầu cơ quan có thẩm quyền).<\/div><div class=\"trap\"><b class=\"h\">Năng lực tập thể<\/b>Không phải mọi KTV đều phải giỏi mọi lĩnh vực; <b>CAE<\/b> bảo đảm KTNB <b>tập thể<\/b> đủ năng lực hoặc có được năng lực.<\/div>","quiz":[{"q":"KTV được giao một dịch vụ mà mình chưa có năng lực. Theo 3.1, KTV:","o":["Phải từ chối trong mọi trường hợp","Được nhận nếu đơn vị được kiểm toán đồng ý","Được nhận nếu CAE đồng ý, không cần năng lực","Chỉ nhận nếu có thể đạt được năng lực cần thiết"],"a":3,"e":"3.1: have or can attain.","s":"GIAS 3.1"},{"q":"Ai phải bảo đảm KTNB tập thể có năng lực thực hiện các dịch vụ trong Điều lệ?","o":["CAE","HĐQT","Từng KTV","Phòng nhân sự"],"a":0,"e":"3.1.","s":"GIAS 3.1"},{"q":"Năng lực (competency) theo GIAS gồm:","o":["Thái độ khách quan","Kiến thức, kỹ năng và khả năng","Bằng cấp và số năm kinh nghiệm","Chứng chỉ CIA"],"a":1,"e":"Glossary.","s":"GIAS Glossary"},{"q":"Người có chứng chỉ CIA phải khai báo CPE:","o":["Không bắt buộc","Chỉ khi đổi việc","3 năm một lần","Hằng năm trước 31/12, có 2 giờ đạo đức"],"a":3,"e":"Sổ tay ứng viên IIA.","s":"T10; GIAS 3.2"},{"q":"Theo GIAS, thận trọng nghề nghiệp đòi hỏi:","o":["Không bao giờ để sót sai phạm","Kiểm tra 100% giao dịch","Làm theo yêu cầu của ban điều hành","Siêng năng, xét đoán và hoài nghi của một KTV thận trọng, có năng lực"],"a":3,"e":"Nguyên tắc 4.","s":"GIAS Nguyên tắc 4"},{"q":"Yếu tố nào KHÔNG được liệt kê trong 4.2 khi thực hiện thận trọng nghề nghiệp?","o":["Dùng kỹ thuật, công cụ, công nghệ phù hợp","Chi phí so với lợi ích","Khả năng có gian lận, không tuân thủ trọng yếu","Mong muốn của KTV về thời gian kết thúc sớm"],"a":3,"e":"4.2.","s":"GIAS 4.2"},{"q":"Hoài nghi nghề nghiệp là:","o":["Chỉ tin bằng chứng từ bên ngoài","Không tin bất kỳ tài liệu nào","Cho rằng mọi nhân viên đều có thể gian lận","Đặt câu hỏi và đánh giá phê phán độ tin cậy của thông tin"],"a":3,"e":"Glossary.","s":"GIAS 4.3"},{"q":"Thông tin có thể sai hoặc gây hiểu lầm. KTV phải:","o":["Tìm thêm bằng chứng trước khi xét đoán","Kết luận là gian lận","Bỏ qua thông tin đó","Báo ngay HĐQT"],"a":0,"e":"4.3.","s":"GIAS 4.3"},{"q":"Luật cấm tuân thủ một phần GIAS. Yêu cầu là:","o":["Xin IIA miễn trừ","Chọn phần GIAS thuận tiện","Không cần tuân thủ GIAS nữa","Tuân thủ mọi phần còn lại và công bố phù hợp"],"a":3,"e":"4.1.","s":"GIAS 4.1"},{"q":"Ai phải ghi lại và trao đổi khi KTV không tuân thủ được một yêu cầu của GIAS?","o":["KTV đó","HĐQT","CAE","Kiểm toán độc lập"],"a":2,"e":"4.1.","s":"GIAS 4.1"},{"q":"Thông tin KTV phải bảo mật gồm:","o":["Chỉ thông tin tài chính","Chỉ tài liệu đóng dấu “Mật”","Chỉ dữ liệu trên hệ thống","Thông tin giấy, số và cả thông tin từ trao đổi miệng"],"a":3,"e":"Nguyên tắc 5.","s":"GIAS Nguyên tắc 5"},{"q":"KTV được phép tiết lộ thông tin bảo mật cho bên không có thẩm quyền khi:","o":["Cuộc kiểm toán đã kết thúc","Có trách nhiệm pháp lý hoặc nghề nghiệp phải làm vậy","Người nhận là người thân","Thông tin đã cũ hơn 1 năm"],"a":1,"e":"5.2.","s":"GIAS 5.2"},{"q":"Chuyên gia thuê ngoài hỗ trợ KTNB phải:","o":["Theo quy định bảo mật của công ty họ","Không bị ràng buộc vì không phải nhân viên","Tuân thủ cùng yêu cầu bảo vệ thông tin như KTNB, do CAE bảo đảm","Chỉ ký cam kết khi có sự cố"],"a":2,"e":"5.2.","s":"GIAS 5.2"},{"q":"Nội dung nào là điểm cần chú ý về bảo vệ thông tin của KTNB theo 5.2?","o":["Ngân sách KTNB","Tiêu chuẩn tuyển dụng CAE","Lưu giữ, thời hạn lưu và tiêu hủy hồ sơ kiểm toán","Số lượng cuộc kiểm toán trong năm"],"a":2,"e":"5.2.","s":"GIAS 5.2"},{"q":"Dùng thông tin kiểm toán để mua cổ phiếu trước khi công ty công bố là vi phạm:","o":["Phát triển liên tục (3.2)","Sử dụng thông tin (5.1)","Năng lực (3.1)","Hoài nghi nghề nghiệp (4.3)"],"a":1,"e":"5.1.","s":"GIAS 5.1"}],"next":"<ol><li><b>Đọc gốc (≈ 45 phút):<\/b> GIAS Nguyên tắc 3–5, bản rút gọn trang 20–24; T10 mục chính sách duy trì chứng chỉ, CPE.<\/li><li><b>Tự tóm tắt 1 trang:<\/b> bảng 5 nguyên tắc Domain II, mỗi nguyên tắc 1 câu tình huống của GSHĐ.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 2 câu 4–6; T3: 30 câu Phần II.<\/li><li><b>K7 (1 giờ):<\/b> Nợ phải thu, phải trả, dự phòng. Câu tự kiểm: Khi nào phải trích lập dự phòng nợ phải thu khó đòi?<\/li><li><b>Tuần 8 – Ôn I–II:<\/b> tự viết bảng 15 nguyên tắc GIAS; làm 50 câu hỗn hợp, mục tiêu ≥ 70%.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 8 (C8)<\/b>Quản trị tổ chức và Mô hình Ba tuyến (Three Lines Model) – mở đầu Phần III.<\/div>","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2), Domain II · IIA Certification Candidate Handbook (T10) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), Section B · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p>"},"lessons/L08":{"code":"C8","id":"L08","order":8,"week":9,"title":"Bài 8. Quản trị tổ chức và Mô hình Ba tuyến","short":"Quản trị tổ chức, Mô hình Ba tuyến","eyebrow":"IAP (CIA Part 1) · Tuần 9 · Chủ đề C8 · Phần III – Quản trị, rủi ro và kiểm soát (30%)","lead":"Mở đầu Phần III với 6 tình huống về vai trò HĐQT, ban điều hành, KTNB và các bên đảm bảo tại An Phát. Bài bám <b>Mô hình Ba tuyến (IIA 2020)<\/b>, GIAS 7.1, 9.1, 9.5.","pills":["⏱ ~96 phút: 6 tình huống · 10 thẻ thuật ngữ · 15 trắc nghiệm","📄 Three Lines Model 2020 (T4); GIAS 7.1, 9.1, 9.5","🎯 Đề cương A.8, C.1"],"goals":"<ol><li>Định nghĩa <b>quản trị<\/b>; nêu vai trò của HĐQT, QLCC, KTNB, các bên đảm bảo khác.<\/li><li>Phân loại vai trò <b>tuyến 1, tuyến 2, tuyến 3<\/b> và <b>bên đảm bảo bên ngoài<\/b>.<\/li><li>Nắm <b>6 nguyên tắc<\/b> và 3 loại quan hệ của Mô hình Ba tuyến.<\/li><li>Nhận diện vai trò tuyến 1, 2 có thể làm <b>suy giảm độc lập<\/b> và <b>biện pháp bảo vệ<\/b>.<\/li><li>Biết dùng <b>bản đồ đảm bảo<\/b> để phối hợp.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Ai thuộc tuyến nào?","std":"Three Lines Model 2020","scene":"<p>An Phát có: <b>(1)<\/b> cửa hàng trưởng và khối vận hành; <b>(2)<\/b> phòng Quản lý rủi ro và Tuân thủ, ban hành khung rủi ro, theo dõi và phản biện các khối; <b>(3)<\/b> bộ phận KTNB báo cáo UBKT; <b>(4)<\/b> công ty kiểm toán độc lập.<\/p>","q":"Phân loại nào đúng theo Mô hình Ba tuyến?","opts":[["(1), (2) tuyến thứ nhất · (3), (4) tuyến thứ ba",false,"Kiểm toán độc lập là bên đảm bảo bên ngoài, không thuộc ba tuyến."],["(1) tuyến thứ nhất · (2) tuyến thứ hai · (3) tuyến thứ ba · (4) bên cung cấp đảm bảo bên ngoài",true,"Đúng mô hình 2020."],["(1) tuyến thứ hai · (2) tuyến thứ nhất · (3) tuyến thứ ba · (4) tuyến thứ tư",false,"Mô hình 2020 không có “tuyến thứ tư”; (1) là tuyến thứ nhất."],["(2) tuyến thứ ba vì cũng làm giám sát",false,"Giám sát, phản biện về rủi ro là vai trò tuyến hai; tuyến ba phải độc lập với quản lý."]],"gias":"<p><b>Mô hình Ba tuyến (IIA, 2020)<\/b>, cập nhật từ “Ba tuyến phòng thủ” 2013:<\/p><div class=\"tbl\"><table><tr><th>Vai trò<\/th><th>Ai<\/th><th>Làm gì<\/th><\/tr><tr><td><b>Cơ quan quản trị<\/b> (HĐQT)<\/td><td>HĐQT, UBKT<\/td><td>Giải trình với các bên liên quan; ủy quyền, cấp nguồn lực, giám sát ban điều hành; đặt khẩu vị rủi ro; thành lập, giám sát KTNB độc lập<\/td><\/tr><tr><td><b>Tuyến 1<\/b> (quản lý)<\/td><td>Bộ phận cung cấp sản phẩm, dịch vụ, kể cả bộ phận hỗ trợ<\/td><td>Sở hữu và quản lý rủi ro; duy trì kiểm soát nội bộ; tuân thủ<\/td><\/tr><tr><td><b>Tuyến 2<\/b> (quản lý)<\/td><td>Quản lý rủi ro, tuân thủ, kiểm soát chất lượng, an ninh thông tin…<\/td><td>Chuyên môn bổ trợ, hỗ trợ, <b>theo dõi và phản biện<\/b> về rủi ro; phân tích, báo cáo<\/td><\/tr><tr><td><b>Tuyến 3<\/b><\/td><td>KTNB<\/td><td>Đảm bảo và tư vấn <b>độc lập, khách quan<\/b>; giải trình chính với cơ quan quản trị<\/td><\/tr><tr><td><b>Bên đảm bảo bên ngoài<\/b><\/td><td>Kiểm toán độc lập, cơ quan quản lý<\/td><td>Đảm bảo bổ sung theo luật hoặc theo yêu cầu<\/td><\/tr><\/table><\/div>","take":"Tuyến 1 <b>làm và sở hữu<\/b> rủi ro · Tuyến 2 <b>hỗ trợ, theo dõi, phản biện<\/b> · Tuyến 3 <b>đảm bảo độc lập<\/b>."},{"title":"Ai chịu trách nhiệm về hàng hết hạn trên kệ?","std":"Three Lines Model – Nguyên tắc 3","scene":"<p>Khách phản ánh mua phải sữa hết hạn. Tổng giám đốc hỏi trong cuộc họp: <i>“KTNB và phòng Quản lý chất lượng đâu mà để xảy ra?”<\/i><\/p>","q":"Theo Mô hình Ba tuyến, trách nhiệm chính thuộc về:","opts":[["KTNB, vì không phát hiện kịp",false,"KTNB đảm bảo độc lập, không chịu trách nhiệm vận hành kiểm soát."],["Phòng Quản lý chất lượng, vì là tuyến hai",false,"Tuyến hai hỗ trợ, theo dõi; tuyến một vẫn sở hữu rủi ro."],["HĐQT, vì chịu trách nhiệm cuối cùng mọi việc",false,"HĐQT giải trình và giám sát, không vận hành kiểm soát hằng ngày."],["Ban điều hành, trực tiếp là khối vận hành, cửa hàng (tuyến 1) vì họ sở hữu và quản lý rủi ro trong hoạt động hằng ngày",true,"Quản lý chịu trách nhiệm đạt mục tiêu, gồm cả quản lý rủi ro."]],"gias":"<p>Nguyên tắc 3 của mô hình: <b>trách nhiệm của ban điều hành<\/b> trong việc đạt mục tiêu gồm <b>cả vai trò tuyến một và tuyến hai<\/b>.<\/p><ul><li>Tuyến một: dẫn dắt hành động, kể cả quản lý rủi ro; duy trì cơ cấu, quy trình quản lý hoạt động và rủi ro (gồm kiểm soát nội bộ); bảo đảm tuân thủ.<\/li><li>Tuyến hai có thể do chuyên gia riêng hoặc ngay trong tuyến một đảm nhận; mô hình <b>không cứng nhắc<\/b>.<\/li><\/ul><p class=\"en\">Mô hình 2020 bỏ chữ “phòng thủ” để nhấn mạnh việc tạo và bảo vệ giá trị, không chỉ phòng ngừa.<\/p>","take":"<b>Ai làm thì người đó sở hữu rủi ro.<\/b> Tuyến 2, tuyến 3 không gánh thay tuyến 1."},{"title":"CAE kiêm phụ trách quản lý rủi ro doanh nghiệp","std":"GIAS 7.1 · Three Lines – Nguyên tắc 5","scene":"<p>HĐQT muốn tiết kiệm chi phí nên giao CAE <b>kiêm lâu dài<\/b> phụ trách phòng Quản lý rủi ro doanh nghiệp (tuyến hai).<\/p>","q":"Theo GIAS, cần những biện pháp bảo vệ nào?","opts":[["CAE phải từ chức vì vi phạm độc lập tuyệt đối",false,"GIAS cho phép kèm biện pháp bảo vệ."],["Không cần biện pháp gì vì HĐQT đã quyết",false,"Phải ghi vào Điều lệ và có kênh đảm bảo thay thế."],["KTNB tự kiểm toán mảng quản lý rủi ro như bình thường",false,"Tự kiểm tra; trái 2.2 và 7.1."],["Ghi trách nhiệm, bản chất công việc và biện pháp bảo vệ vào Điều lệ KTNB; đảm bảo cho mảng quản lý rủi ro được thực hiện qua kênh thay thế, như bên ngoài khách quan, có năng lực, báo cáo độc lập với HĐQT",true,"Đúng 7.1."]],"gias":"<p>7.1: Khi CAE có <b>vai trò lâu dài ngoài KTNB<\/b>:<\/p><ul><li>Ghi trách nhiệm, bản chất công việc và <b>biện pháp bảo vệ<\/b> vào <b>Điều lệ KTNB<\/b>.<\/li><li>Nếu mảng đó thuộc phạm vi kiểm toán → lập <b>kênh đảm bảo thay thế<\/b>, ví dụ thuê bên ngoài khách quan, có năng lực, <b>báo cáo độc lập với HĐQT<\/b>.<\/li><\/ul><p>Kiêm <b>tạm thời<\/b>: bên thứ ba độc lập đảm bảo trong thời gian kiêm nhiệm <b>và 12 tháng sau<\/b>; CAE lập kế hoạch chuyển giao cho ban điều hành.<\/p><p>Mô hình Ba tuyến, Nguyên tắc 5: độc lập của tuyến ba với trách nhiệm của quản lý là then chốt; KTNB báo cáo suy giảm và áp dụng biện pháp bảo vệ khi cần.<\/p>","take":"Kiêm nhiệm tuyến 2: <b>Điều lệ ghi rõ + đảm bảo thay thế báo cáo HĐQT<\/b>."},{"title":"KTNB làm luôn bản đăng ký rủi ro","std":"Đề cương A.8.b, A.8.c","scene":"<p>Phòng Quản lý rủi ro thiếu người. Tổng giám đốc đề nghị KTNB <b>tự cập nhật bản đăng ký rủi ro<\/b>, đặt mức xếp hạng và quyết định biện pháp xử lý cho các khối.<\/p>","q":"Việc nào KTNB có thể làm mà vẫn giữ độc lập?","opts":[["Làm chủ sở hữu bản đăng ký rủi ro từ nay",false,"Sở hữu quy trình quản lý rủi ro làm suy giảm độc lập."],["Tự đặt xếp hạng và quyết định biện pháp xử lý rủi ro thay các khối",false,"Đó là trách nhiệm quản lý (tuyến 1, tuyến 2)."],["Phê duyệt khẩu vị rủi ro thay HĐQT",false,"Khẩu vị rủi ro do cơ quan quản trị đặt."],["Điều phối hội thảo nhận diện rủi ro và góp ý phương pháp, còn các khối tự đánh giá, quyết định xử lý và chịu trách nhiệm",true,"Tư vấn có biện pháp bảo vệ; không nhận trách nhiệm quản lý."]],"gias":"<p>Đề cương A.8 yêu cầu nhận diện <b>trách nhiệm tuyến 1, tuyến 2 có thể làm suy giảm độc lập<\/b> của KTNB và biện pháp bảo vệ khi KTV thực hiện, hoặc bị coi là thực hiện, các vai trò đó.<\/p><div class=\"tbl\"><table><tr><th>Thường được chấp nhận (có biện pháp bảo vệ)<\/th><th>Không nên làm<\/th><\/tr><tr><td>Điều phối hội thảo nhận diện, đánh giá rủi ro<\/td><td>Đặt khẩu vị rủi ro<\/td><\/tr><tr><td>Hướng dẫn, đào tạo quản lý về rủi ro<\/td><td>Quyết định biện pháp xử lý rủi ro<\/td><\/tr><tr><td>Hỗ trợ xây dựng khung quản lý rủi ro<\/td><td>Thực hiện biện pháp xử lý thay quản lý<\/td><\/tr><tr><td>Tổng hợp báo cáo rủi ro<\/td><td>Chịu trách nhiệm giải trình về quản lý rủi ro<\/td><\/tr><\/table><\/div><p>Biện pháp bảo vệ thường gặp: ghi rõ trong Điều lệ; HĐQT chấp thuận; quản lý vẫn là chủ sở hữu rủi ro; người khác hoặc bên ngoài đảm bảo cho chính mảng đó.<\/p><p class=\"en\">Bảng tham khảo theo tài liệu IIA về vai trò KTNB trong quản lý rủi ro doanh nghiệp (Position Paper), không phải nội dung của GIAS.<\/p>","take":"KTNB <b>điều phối, hướng dẫn<\/b> được; <b>quyết định, sở hữu<\/b> thì không."},{"title":"Ba bên cùng kiểm tra một kho","std":"GIAS 9.5 · Three Lines – Nguyên tắc 6","scene":"<p>Trong cùng một quý, kho Long An được phòng Quản lý chất lượng, phòng Tuân thủ và KTNB lần lượt đến kiểm tra; kiểm toán độc lập cũng chứng kiến kiểm kê. Thủ kho than <i>“tiếp đoàn suốt”<\/i>, trong khi kho Cần Thơ cả năm chưa ai kiểm tra.<\/p>","q":"CAE nên đề xuất gì?","opts":[["Giao toàn bộ việc kiểm tra kho cho kiểm toán độc lập",false,"Kiểm toán độc lập có mục tiêu riêng, không thay thế được."],["Đề nghị bỏ các phòng tuyến hai cho gọn",false,"Tuyến hai là chức năng của quản lý; vấn đề là phối hợp."],["Lập bản đồ đảm bảo để phối hợp với các bên: ai đảm bảo rủi ro nào, khi nào; giảm trùng lặp, chỉ ra khoảng trống, và cân nhắc dựa vào công việc của bên khác",true,"9.5 và nguyên tắc phối hợp của mô hình."],["KTNB tiếp tục làm theo kế hoạch riêng, không cần quan tâm bên khác",false,"Trái 9.5."]],"gias":"<p>Mô hình Ba tuyến, Nguyên tắc 6: mọi vai trò cùng phối hợp để <b>tạo và bảo vệ giá trị<\/b>, thống nhất với nhau và với lợi ích ưu tiên của các bên liên quan. Quan hệ giữa ban điều hành và KTNB: <b>thống nhất, trao đổi, phối hợp, hợp tác<\/b>.<\/p><p>GIAS 9.5: phối hợp giúp <b>giảm trùng lặp, chỉ ra khoảng trống<\/b>; không phối hợp được thì báo QLCC, HĐQT.<\/p><div class=\"tbl\"><table><tr><th>Quan hệ trong mô hình<\/th><th>Chiều<\/th><\/tr><tr><td>Giải trình, báo cáo<\/td><td>Ban điều hành, KTNB → Cơ quan quản trị<\/td><\/tr><tr><td>Ủy quyền, chỉ đạo, nguồn lực, giám sát<\/td><td>Cơ quan quản trị → Ban điều hành<\/td><\/tr><tr><td>Thống nhất, trao đổi, phối hợp, hợp tác<\/td><td>Ban điều hành ↔ KTNB<\/td><\/tr><\/table><\/div>","take":"<b>Bản đồ đảm bảo<\/b>: không trùng, không sót."},{"title":"Quản trị tổ chức gồm những gì?","std":"Đề cương C.1 · GIAS 9.1","scene":"<p>Sau khi An Phát chuẩn bị niêm yết, UBKT yêu cầu KTNB đánh giá <b>quy trình quản trị<\/b>. Một KTV cho rằng chỉ cần xem điều lệ công ty và biên bản họp HĐQT.<\/p>","q":"Theo GIAS, KTNB cần hiểu những khía cạnh nào của quản trị?","opts":[["Chỉ đánh giá năng lực của Tổng giám đốc",false,"Quản trị là hệ thống quy trình và cấu trúc, không phải một cá nhân."],["Cách tổ chức đặt mục tiêu chiến lược và ra quyết định, giám sát rủi ro và kiểm soát, thúc đẩy văn hóa đạo đức, quản lý hiệu quả và trách nhiệm giải trình, cơ cấu tổ chức, truyền thông về rủi ro, phối hợp giữa HĐQT, các bên đảm bảo và quản lý",true,"Đúng 9.1."],["Chỉ cần xem cơ cấu sở hữu cổ đông",false,"Cơ cấu sở hữu chỉ là một phần bối cảnh."],["Chỉ cần điều lệ công ty và biên bản họp",false,"Quá hẹp; thiếu văn hóa, giải trình, truyền thông, phối hợp."]],"gias":"<p><b>Quản trị (governance)<\/b> = kết hợp quy trình và cấu trúc do <b>HĐQT<\/b> thiết lập để <b>thông tin, định hướng, quản lý và giám sát<\/b> hoạt động nhằm đạt mục tiêu.<\/p><p>9.1: Để hiểu quản trị, CAE xem tổ chức:<\/p><ul><li>Đặt mục tiêu chiến lược, ra quyết định chiến lược và vận hành.<\/li><li>Giám sát quản lý rủi ro và kiểm soát.<\/li><li>Thúc đẩy văn hóa đạo đức.<\/li><li>Quản lý hiệu quả hoạt động và trách nhiệm giải trình.<\/li><li>Tổ chức các chức năng quản lý và vận hành.<\/li><li>Truyền thông thông tin rủi ro, kiểm soát.<\/li><li>Phối hợp giữa HĐQT, các bên đảm bảo và quản lý.<\/li><\/ul><p class=\"en\">Khung, nguyên tắc quản trị tham khảo: Nguyên tắc quản trị công ty G20/OECD; tại Việt Nam có Luật Doanh nghiệp 2020 và quy định về quản trị công ty đại chúng.<\/p>","take":"Quản trị = <b>HĐQT thiết lập<\/b> để <b>thông tin – định hướng – quản lý – giám sát<\/b>."}],"summary":"<div class=\"tbl\"><table><tr><th>#<\/th><th>Nguyên tắc của Mô hình Ba tuyến<\/th><th>Ý chính<\/th><\/tr><tr><td>1<\/td><td>Quản trị<\/td><td>Cấu trúc, quy trình cho: giải trình (cơ quan quản trị), hành động (quản lý), đảm bảo và tư vấn (KTNB)<\/td><\/tr><tr><td>2<\/td><td>Vai trò cơ quan quản trị<\/td><td>Bảo đảm cấu trúc quản trị; ủy quyền, nguồn lực cho quản lý; đặt khẩu vị rủi ro; giám sát; thành lập KTNB<\/td><\/tr><tr><td>3<\/td><td>Vai trò quản lý, tuyến 1 và 2<\/td><td>Quản lý chịu trách nhiệm đạt mục tiêu, gồm cả vai trò tuyến 1 và 2<\/td><\/tr><tr><td>4<\/td><td>Vai trò tuyến 3<\/td><td>KTNB đảm bảo, tư vấn độc lập, khách quan<\/td><\/tr><tr><td>5<\/td><td>Độc lập của tuyến 3<\/td><td>Độc lập với trách nhiệm quản lý; giải trình với cơ quan quản trị; tiếp cận không hạn chế<\/td><\/tr><tr><td>6<\/td><td>Tạo và bảo vệ giá trị<\/td><td>Mọi vai trò phối hợp, thống nhất với lợi ích các bên liên quan<\/td><\/tr><\/table><\/div>","terms":[["Governance","Quản trị","Kết hợp quy trình và cấu trúc HĐQT thiết lập để thông tin, định hướng, quản lý, giám sát hoạt động.","Quy chế phân cấp, lịch họp UBKT, quy trình phê duyệt đầu tư."],["Governing body","Cơ quan quản trị","Giải trình với các bên liên quan; ủy quyền, giám sát ban điều hành; đặt khẩu vị rủi ro.","HĐQT, UBKT của An Phát."],["Three Lines Model","Mô hình Ba tuyến","Mô hình IIA 2020 mô tả vai trò cơ quan quản trị, quản lý (tuyến 1, 2) và KTNB (tuyến 3); có 6 nguyên tắc.","Bản đồ vai trò của An Phát theo 3 tuyến."],["First line roles","Vai trò tuyến một","Cung cấp sản phẩm, dịch vụ (kể cả bộ phận hỗ trợ); sở hữu và quản lý rủi ro.","Cửa hàng trưởng tổ chức kiểm kê hằng tuần."],["Second line roles","Vai trò tuyến hai","Chuyên môn bổ trợ, hỗ trợ, theo dõi và phản biện về rủi ro.","Phòng Tuân thủ ban hành bộ chỉ tiêu, theo dõi hóa đơn điện tử."],["Third line roles","Vai trò tuyến ba","Đảm bảo và tư vấn độc lập, khách quan về quản trị và quản lý rủi ro.","KTNB kiểm toán quy trình kiểm kê."],["External assurance providers","Bên cung cấp đảm bảo bên ngoài","Đảm bảo bổ sung theo luật hoặc theo yêu cầu, ngoài ba tuyến.","Công ty kiểm toán độc lập, thanh tra thuế."],["Assurance map","Bản đồ đảm bảo","Bảng thể hiện bên nào đảm bảo rủi ro nào, ở mức nào; giúp phối hợp.","Ma trận 25 rủi ro chính × 5 bên đảm bảo."],["Safeguards","Biện pháp bảo vệ","Cách giảm suy giảm độc lập, khách quan khi KTNB có vai trò ngoài kiểm toán.","Thuê bên ngoài đảm bảo mảng quản lý rủi ro do CAE kiêm nhiệm."],["Accountability","Trách nhiệm giải trình","Nghĩa vụ báo cáo và chịu trách nhiệm về kết quả với cấp trên, các bên liên quan.","HĐQT giải trình với cổ đông; KTNB giải trình với HĐQT."]],"traps":"<div class=\"trap\"><b class=\"h\">Không có “tuyến thứ tư”<\/b>Kiểm toán độc lập, cơ quan quản lý là <b>bên đảm bảo bên ngoài<\/b>.<\/div><div class=\"trap\"><b class=\"h\">Tuyến 2 vẫn là quản lý<\/b>Tuyến hai <b>thuộc ban điều hành<\/b>, không độc lập như KTNB. Đáp án xếp phòng Quản lý rủi ro vào tuyến ba là sai.<\/div><div class=\"trap\"><b class=\"h\">Tên mô hình<\/b>Bản 2020 là <b>Three Lines Model<\/b>, bỏ chữ “Defense”. Đề mới dùng tên này.<\/div><div class=\"trap\"><b class=\"h\">Ai sở hữu rủi ro<\/b>Rủi ro vận hành do <b>tuyến một<\/b> sở hữu. KTNB không chịu trách nhiệm vì “không phát hiện”.<\/div><div class=\"trap\"><b class=\"h\">Kiêm nhiệm có điều kiện<\/b>CAE kiêm vai trò tuyến hai không tự động vi phạm GIAS, nhưng phải có <b>Điều lệ ghi rõ + đảm bảo thay thế<\/b>.<\/div>","quiz":[{"q":"Mô hình Ba tuyến của IIA được cập nhật năm 2020 thay cho mô hình nào?","o":["Mô hình quản trị OECD","Bốn tuyến bảo vệ","Ba tuyến phòng thủ (Three Lines of Defense)","COSO ERM"],"a":2,"e":"Mô hình 2020 bỏ chữ “phòng thủ”.","s":"Three Lines Model 2020"},{"q":"Mô hình Ba tuyến 2020 có bao nhiêu nguyên tắc?","o":["6","5","8","3"],"a":0,"e":"Governance; Governing body roles; Management and first/second line roles; Third line roles; Third line independence; Creating and protecting value.","s":"Three Lines Model 2020"},{"q":"Vai trò “theo dõi và phản biện” về rủi ro thuộc:","o":["Tuyến một","Tuyến ba","Cơ quan quản trị","Tuyến hai"],"a":3,"e":"Second line: expertise, support, monitoring and challenge.","s":"Three Lines Model 2020"},{"q":"Trong mô hình, KTNB giải trình chính với:","o":["Tuyến hai","Cơ quan quản trị","Kiểm toán độc lập","Tổng giám đốc"],"a":1,"e":"Third line: primary accountability to the governing body.","s":"Three Lines Model – Nguyên tắc 5"},{"q":"Ai đặt khẩu vị rủi ro của tổ chức?","o":["Phòng quản lý rủi ro","Cửa hàng trưởng","Cơ quan quản trị","KTNB"],"a":2,"e":"Governing body sets organizational appetite for risk.","s":"Three Lines Model – Nguyên tắc 2"},{"q":"Vai trò tuyến một và tuyến hai đều thuộc trách nhiệm của:","o":["Ban điều hành","Cơ quan quản trị","KTNB","Bên đảm bảo bên ngoài"],"a":0,"e":"Nguyên tắc 3.","s":"Three Lines Model – Nguyên tắc 3"},{"q":"Quan hệ giữa ban điều hành và KTNB trong mô hình là:","o":["Thống nhất, trao đổi, phối hợp, hợp tác","Chỉ đạo trực tiếp","Không có quan hệ","Ủy quyền và giám sát"],"a":0,"e":"Alignment, communication, coordination, collaboration.","s":"Three Lines Model 2020"},{"q":"Kiểm toán độc lập trong mô hình là:","o":["Bên cung cấp đảm bảo bên ngoài","Tuyến ba","Tuyến hai","Một phần của cơ quan quản trị"],"a":0,"e":"External assurance providers.","s":"Three Lines Model 2020"},{"q":"CAE kiêm lâu dài một vai trò ngoài KTNB. GIAS yêu cầu ghi trách nhiệm và biện pháp bảo vệ vào:","o":["Điều lệ KTNB","Kế hoạch KTNB năm","Hợp đồng lao động của CAE","Báo cáo thường niên"],"a":0,"e":"7.1.","s":"GIAS 7.1"},{"q":"CAE tạm thời kiêm một chức năng quản lý. Đảm bảo cho mảng đó phải do bên thứ ba độc lập thực hiện:","o":["Trong thời gian kiêm nhiệm và 12 tháng sau","Không cần nếu thời gian dưới 1 năm","Chỉ trong thời gian kiêm nhiệm","6 tháng sau khi thôi kiêm"],"a":0,"e":"7.1.","s":"GIAS 7.1"},{"q":"Việc nào KTNB KHÔNG nên làm vì là trách nhiệm quản lý?","o":["Điều phối hội thảo nhận diện rủi ro","Đảm bảo về quy trình quản lý rủi ro","Đào tạo về rủi ro cho quản lý","Quyết định biện pháp xử lý rủi ro cho các khối"],"a":3,"e":"Đề cương A.8.","s":"T1 A.8"},{"q":"Quản trị theo GIAS là quy trình và cấu trúc do ai thiết lập?","o":["KTNB","Tổng giám đốc","HĐQT","Cổ đông lớn nhất"],"a":2,"e":"Glossary – governance.","s":"GIAS Glossary"},{"q":"Khía cạnh nào thuộc nội dung CAE phải hiểu về quản trị theo 9.1?","o":["Lương của từng nhân viên","Giá cổ phiếu trên thị trường","Kế hoạch marketing quý","Cách tổ chức thúc đẩy văn hóa đạo đức"],"a":3,"e":"9.1.","s":"GIAS 9.1"},{"q":"Ý nào phản ánh đúng tinh thần Mô hình Ba tuyến 2020?","o":["Các vai trò có thể kết hợp linh hoạt, không phải các “tuyến phòng thủ” cứng nhắc","Chỉ áp dụng cho ngân hàng","Mỗi tuyến phải là một phòng ban riêng biệt","Tuyến ba báo cáo tuyến hai"],"a":0,"e":"Mô hình nguyên tắc, không cứng nhắc.","s":"Three Lines Model 2020"},{"q":"Lợi ích chính của bản đồ đảm bảo là:","o":["Giảm trùng lặp và chỉ ra khoảng trống trong đảm bảo rủi ro chính","Loại bỏ tuyến hai","Thay thế kế hoạch KTNB","Giảm số lần họp HĐQT"],"a":0,"e":"9.5.","s":"GIAS 9.5"}],"next":"<ol><li><b>Đọc gốc (≈ 45 phút):<\/b> IIA – The IIA's Three Lines Model (2020) (T4); GIAS 7.1 về vai trò ngoài KTNB, 9.1, 9.5.<\/li><li><b>Tự tóm tắt 1 trang:<\/b> vẽ sơ đồ 3 tuyến của chuỗi bán lẻ, đặt vị trí GSHĐ vào sơ đồ và ghi biện pháp bảo vệ nếu GSHĐ có làm việc tuyến hai.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 3 câu 1–2.<\/li><li><b>K9 (1 giờ):<\/b> Hóa đơn điện tử, thời điểm lập hóa đơn. Câu tự kiểm: Bán lẻ qua POS lập hóa đơn thế nào khi khách không lấy hóa đơn?<\/li><li><b>Sổ lỗi:<\/b> ghi câu sai và tình huống không đúng ngay lần đầu.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 9 (C9)<\/b>Quản lý rủi ro: loại rủi ro, rủi ro tiềm tàng và còn lại, khẩu vị, phản ứng rủi ro.<\/div>","footer":"<p><b>Nguồn:<\/b> The IIA – The IIA's Three Lines Model (2020) · The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), A.8, C.1 · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p><p class=\"en\">Tài liệu T4 không có trong Project; nội dung Mô hình Ba tuyến được tóm lược theo bản công bố của IIA năm 2020. Nên đối chiếu khi đọc gốc.<\/p>"},"lessons/L09":{"code":"C9","id":"L09","order":9,"week":10,"title":"Bài 9. Quản lý rủi ro","short":"Quản lý rủi ro","eyebrow":"IAP (CIA Part 1) · Tuần 10 · Chủ đề C9 · Phần III – Quản trị, rủi ro và kiểm soát (30%)","lead":"6 tình huống từ bản đăng ký rủi ro của An Phát: loại rủi ro, rủi ro tiềm tàng và còn lại, khẩu vị và ngưỡng chịu đựng, phản ứng rủi ro, vai trò của KTNB trong ERM.","pills":["⏱ ~96 phút: 6 tình huống · 11 thẻ thuật ngữ · 15 trắc nghiệm","📄 GIAS Glossary, 9.1, 11.5; COSO ERM 2017, ISO 31000 (T6, T7)","🎯 Đề cương C.4, C.5, C.6"],"goals":"<ol><li>Phân biệt 6 <b>loại rủi ro<\/b>: chiến lược, hoạt động, tài chính, tuân thủ, danh tiếng, môi trường – xã hội.<\/li><li>Phân biệt <b>rủi ro tiềm tàng<\/b> và <b>rủi ro còn lại<\/b>.<\/li><li>Phân biệt <b>khẩu vị rủi ro<\/b> và <b>ngưỡng chịu đựng<\/b>.<\/li><li>Nắm <b>chu trình quản lý rủi ro<\/b> và các <b>phản ứng rủi ro<\/b>.<\/li><li>Biết cấu trúc <b>COSO ERM 2017<\/b>, <b>ISO 31000<\/b>, cách đánh giá quy trình quản lý rủi ro.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Gọi đúng tên rủi ro","std":"Đề cương C.4.a","scene":"<p>Bản đăng ký rủi ro của An Phát có 4 dòng: <b>(a)<\/b> chuỗi đối thủ mở 50 cửa hàng giảm giá cạnh khu dân cư; <b>(b)<\/b> hệ thống POS ngừng 3 giờ ngày cao điểm; <b>(c)<\/b> quy định mới về hóa đơn điện tử áp dụng từ quý sau; <b>(d)<\/b> clip nhân viên bán thực phẩm hết hạn lan truyền trên mạng.<\/p>","q":"Phân loại nào hợp lý nhất?","opts":[["Tất cả đều là rủi ro hoạt động",false,"Gộp chung khiến không xác định được chủ sở hữu, biện pháp phù hợp."],["(a) danh tiếng · (b) tuân thủ · (c) chiến lược · (d) tài chính",false,"Sai bản chất từng rủi ro."],["(a) chiến lược · (b) hoạt động · (c) tuân thủ · (d) danh tiếng",true,"Phân loại theo nguồn và tác động chính."],["(a) tài chính · (b) chiến lược · (c) hoạt động · (d) tuân thủ",false,"Đối thủ mở rộng là rủi ro chiến lược; POS ngừng là rủi ro hoạt động."]],"gias":"<div class=\"tbl\"><table><tr><th>Loại rủi ro<\/th><th>Bản chất<\/th><th>Ví dụ bán lẻ<\/th><\/tr><tr><td>Chiến lược<\/td><td>Ảnh hưởng đến định hướng, lợi thế cạnh tranh, mô hình kinh doanh<\/td><td>Đối thủ, thay đổi hành vi mua sắm sang online<\/td><\/tr><tr><td>Hoạt động<\/td><td>Quy trình, con người, hệ thống, sự kiện bên ngoài<\/td><td>POS ngừng, hao hụt kho, tai nạn lao động<\/td><\/tr><tr><td>Tài chính<\/td><td>Thanh khoản, tín dụng, thị trường, báo cáo tài chính<\/td><td>Thiếu tiền trả nhà cung cấp, tỷ giá nhập khẩu<\/td><\/tr><tr><td>Tuân thủ<\/td><td>Vi phạm luật, quy định, hợp đồng, chính sách<\/td><td>Hóa đơn, an toàn thực phẩm, lao động<\/td><\/tr><tr><td>Danh tiếng<\/td><td>Niềm tin của khách hàng, đối tác, công chúng<\/td><td>Khủng hoảng truyền thông<\/td><\/tr><tr><td>Môi trường, bền vững, xã hội<\/td><td>Tác động tới môi trường, cộng đồng, khí hậu<\/td><td>Rác thải nhựa, điều kiện lao động của nhà cung cấp<\/td><\/tr><\/table><\/div><p class=\"en\">Một sự kiện có thể mang nhiều loại rủi ro (POS ngừng → hoạt động, rồi tài chính, danh tiếng). Phân loại theo nguồn chính để giao chủ sở hữu.<\/p>","take":"<b>Chiến lược – Hoạt động – Tài chính – Tuân thủ – Danh tiếng – Môi trường/xã hội<\/b>."},{"title":"Trước và sau khi lắp camera","std":"GIAS Glossary","scene":"<p>Trước đây quầy thu ngân không có kiểm soát gì, rủi ro mất tiền mặt được đánh giá <b>cao<\/b>. Sau khi lắp camera và áp dụng <b>đếm tiền 2 người<\/b> cuối ca, rủi ro được đánh giá <b>thấp<\/b>.<\/p>","q":"Mức “cao” và “thấp” lần lượt là:","opts":[["Rủi ro kiểm soát và rủi ro phát hiện",false,"Đó là thuật ngữ của kiểm toán báo cáo tài chính."],["Rủi ro còn lại và rủi ro tiềm tàng",false,"Đảo ngược thứ tự."],["Khẩu vị rủi ro và ngưỡng chịu đựng",false,"Đó là mức tổ chức chấp nhận, không phải mức rủi ro đánh giá."],["Rủi ro tiềm tàng và rủi ro còn lại",true,"Đúng định nghĩa GIAS."]],"gias":"<p><b>Rủi ro tiềm tàng<\/b> (inherent risk): kết hợp các yếu tố rủi ro bên trong, bên ngoài <b>khi chưa có hành động nào của quản lý<\/b>.<\/p><p><b>Rủi ro còn lại<\/b> (residual risk): phần rủi ro tiềm tàng <b>còn lại sau khi<\/b> quản lý đã có hành động.<\/p><div class=\"flow\"><span>Rủi ro tiềm tàng<\/span><em>− hiệu quả kiểm soát =<\/em><span>Rủi ro còn lại<\/span><em>so với<\/em><span>Khẩu vị rủi ro<\/span><\/div><p>Rủi ro còn lại vẫn <b>vượt khẩu vị<\/b> → cần thêm biện pháp, hoặc nâng lên theo 11.5.<\/p>","take":"Tiềm tàng = <b>trước<\/b> kiểm soát · Còn lại = <b>sau<\/b> kiểm soát."},{"title":"Khẩu vị và ngưỡng chịu đựng","std":"GIAS Glossary, 11.5","scene":"<p>HĐQT tuyên bố: <i>“Không chấp nhận rủi ro về an toàn thực phẩm; chấp nhận rủi ro vừa phải để mở rộng mạng lưới.”<\/i> Chỉ tiêu hao hụt hàng: <b>tối đa 0,5% doanh thu<\/b>. Thực tế 6 tháng đầu năm: 0,9%.<\/p>","q":"Nhận định nào đúng?","opts":[["KTNB nên tự hạ chỉ tiêu xuống 0,3% cho an toàn",false,"Đặt khẩu vị, ngưỡng là việc của HĐQT và ban điều hành."],["Câu tuyên bố là khẩu vị rủi ro; 0,5% là ngưỡng chịu đựng; mức 0,9% đã vượt ngưỡng nên cần trao đổi với QLCC và nâng lên HĐQT nếu không được xử lý",true,"Đúng định nghĩa và 11.5."],["Vượt 0,4% là nhỏ, chưa cần báo",false,"Vượt ngưỡng chịu đựng đã thống nhất là vấn đề phải trao đổi."],["0,5% là khẩu vị rủi ro, câu tuyên bố là ngưỡng chịu đựng",false,"Đảo ngược hai khái niệm."]],"gias":"<div class=\"tbl\"><table><tr><th><\/th><th>Khẩu vị rủi ro (risk appetite)<\/th><th>Ngưỡng chịu đựng (risk tolerance)<\/th><\/tr><tr><td>Định nghĩa GIAS<\/td><td>Loại và mức rủi ro tổ chức sẵn sàng chấp nhận để theo đuổi chiến lược, mục tiêu<\/td><td>Mức biến động chấp nhận được của kết quả so với mục tiêu<\/td><\/tr><tr><td>Cấp độ<\/td><td>Tổng thể, định hướng<\/td><td>Cụ thể, đo được<\/td><\/tr><tr><td>Ví dụ<\/td><td>“Không chấp nhận rủi ro an toàn thực phẩm”<\/td><td>“Hao hụt ≤ 0,5% doanh thu”<\/td><\/tr><tr><td>Ai đặt<\/td><td>Cơ quan quản trị (HĐQT)<\/td><td>Ban điều hành, trong khuôn khổ khẩu vị<\/td><\/tr><\/table><\/div>","take":"Khẩu vị = <b>bao nhiêu rủi ro thì chịu<\/b> · Ngưỡng chịu đựng = <b>lệch bao nhiêu thì chấp nhận<\/b>."},{"title":"Bốn cách phản ứng với rủi ro","std":"Đề cương C.5.d","scene":"<p>An Phát xem xét 4 biện pháp: <b>(1)<\/b> mua bảo hiểm cháy nổ cho kho; <b>(2)<\/b> ngừng kinh doanh pháo hoa trang trí do quy định chặt; <b>(3)<\/b> lắp cảm biến nhiệt cho tủ đông; <b>(4)<\/b> không làm gì với rủi ro mất giỏ xách tay vì chi phí kiểm soát cao hơn thiệt hại.<\/p>","q":"Ghép đúng phản ứng rủi ro:","opts":[["(1) né tránh · (2) giảm thiểu · (3) chấp nhận · (4) chia sẻ",false,"Sai bản chất từng biện pháp."],["(1) chia sẻ, chuyển giao · (2) né tránh · (3) giảm thiểu · (4) chấp nhận",true,"Đúng các phản ứng phổ biến."],["Cả 4 đều là giảm thiểu",false,"Mỗi biện pháp tác động khác nhau tới khả năng xảy ra, mức ảnh hưởng hoặc người gánh chịu."],["(1) giảm thiểu · (2) chấp nhận · (3) chia sẻ · (4) né tránh",false,"Bảo hiểm là chuyển giao; ngừng kinh doanh là né tránh."]],"gias":"<div class=\"tbl\"><table><tr><th>Phản ứng<\/th><th>Cách làm<\/th><th>Tác động<\/th><\/tr><tr><td><b>Né tránh<\/b> (avoid)<\/td><td>Dừng hoạt động gây rủi ro<\/td><td>Loại bỏ rủi ro, mất cơ hội<\/td><\/tr><tr><td><b>Giảm thiểu<\/b> (reduce)<\/td><td>Thêm kiểm soát<\/td><td>Giảm khả năng xảy ra hoặc mức ảnh hưởng<\/td><\/tr><tr><td><b>Chia sẻ, chuyển giao<\/b> (share)<\/td><td>Bảo hiểm, thuê ngoài, hợp đồng<\/td><td>Chuyển một phần thiệt hại; trách nhiệm quản lý vẫn còn<\/td><\/tr><tr><td><b>Chấp nhận<\/b> (accept)<\/td><td>Không hành động thêm, theo dõi<\/td><td>Phù hợp khi rủi ro trong khẩu vị hoặc chi phí > lợi ích<\/td><\/tr><\/table><\/div><p class=\"en\">COSO ERM 2017 thêm <b>“theo đuổi” (pursue)<\/b>: chấp nhận rủi ro cao hơn để đạt kết quả tốt hơn, ví dụ mở rộng mạnh sang online.<\/p>","take":"<span class=\"mnemo\">“Tránh – Giảm – Chia – Chịu”<\/span> (+ Theo đuổi trong COSO ERM)."},{"title":"Tổng giám đốc giao KTNB quyết định khẩu vị rủi ro","std":"Đề cương C.6 · GIAS 9.1","scene":"<p>An Phát lần đầu triển khai quản lý rủi ro doanh nghiệp (ERM). Tổng giám đốc đề nghị CAE <b>soạn và quyết định khẩu vị rủi ro<\/b>, rồi tự chấm điểm rủi ro cho các khối.<\/p>","q":"CAE nên phản hồi thế nào?","opts":[["Nhận cả hai việc vì KTNB hiểu rủi ro tốt nhất",false,"Đặt khẩu vị, đánh giá thay khối là trách nhiệm quản lý."],["Từ chối mọi việc liên quan đến ERM",false,"KTNB có thể tư vấn, hỗ trợ ERM có biện pháp bảo vệ."],["Thuê công ty tư vấn làm thay, KTNB phê duyệt kết quả",false,"Phê duyệt khẩu vị rủi ro vẫn là việc của HĐQT."],["Đề nghị HĐQT đặt khẩu vị rủi ro, các khối tự đánh giá rủi ro; KTNB có thể hỗ trợ xây dựng khung và điều phối hội thảo với biện pháp bảo vệ, sau đó đảm bảo về quy trình",true,"Đúng vai trò KTNB."]],"gias":"<p><b>Quản lý rủi ro<\/b> (GIAS): quy trình nhận diện, đánh giá, quản lý, kiểm soát sự kiện tiềm ẩn để có <b>đảm bảo hợp lý<\/b> về việc đạt mục tiêu.<\/p><p><b>Khung tham chiếu<\/b>:<\/p><div class=\"tbl\"><table><tr><th>Khung<\/th><th>Cấu trúc chính<\/th><\/tr><tr><td>COSO ERM 2017<\/td><td>5 thành phần: Quản trị và văn hóa · Chiến lược và đặt mục tiêu · Thực hiện · Rà soát và điều chỉnh · Thông tin, truyền thông, báo cáo (20 nguyên tắc)<\/td><\/tr><tr><td>ISO 31000:2018<\/td><td>Quy trình: Trao đổi, tham vấn · Phạm vi, bối cảnh, tiêu chí · Đánh giá rủi ro (nhận diện, phân tích, đánh giá) · Xử lý · Theo dõi, rà soát · Ghi nhận, báo cáo<\/td><\/tr><\/table><\/div><p>Lợi ích của khung: ngôn ngữ chung, cách làm nhất quán, dễ so sánh và đánh giá.<\/p>","take":"HĐQT <b>đặt khẩu vị<\/b> · Ban điều hành <b>sở hữu rủi ro<\/b> · KTNB <b>hỗ trợ và đảm bảo<\/b>."},{"title":"Bản đăng ký rủi ro 2 năm không cập nhật","std":"Đề cương C.6.a · GIAS 9.1","scene":"<p>Khi kiểm toán quy trình ERM, KTNB thấy bản đăng ký rủi ro cập nhật lần cuối từ 2 năm trước; chưa có rủi ro về kênh bán online (đang chiếm 18% doanh thu); 40% rủi ro chưa có chủ sở hữu; HĐQT chưa từng nhận báo cáo rủi ro.<\/p>","q":"Đánh giá nào phù hợp nhất?","opts":[["KTNB tự cập nhật bản đăng ký rồi kết luận đạt",false,"KTNB không làm thay quản lý."],["Hiệu quả, vì đã có bản đăng ký rủi ro",false,"Có tài liệu không có nghĩa là quy trình vận hành."],["Chỉ cần thêm dòng rủi ro online là đủ",false,"Chỉ xử lý triệu chứng, chưa xử lý nguyên nhân gốc rễ."],["Quy trình quản lý rủi ro chưa hiệu quả về cả thiết kế lẫn vận hành: thiếu cập nhật, thiếu chủ sở hữu, thiếu báo cáo lên HĐQT; cần khuyến nghị theo chu trình quản lý rủi ro",true,"Đánh giá theo các bước của chu trình."]],"gias":"<p><b>Chu trình quản lý rủi ro<\/b> (đề cương C.5.c):<\/p><div class=\"flow\"><span>Đặt mục tiêu, bối cảnh<\/span><em>→<\/em><span>Nhận diện<\/span><em>→<\/em><span>Đánh giá (khả năng × ảnh hưởng)<\/span><em>→<\/em><span>Phản ứng<\/span><em>→<\/em><span>Theo dõi, báo cáo<\/span><\/div><p>Câu hỏi đánh giá thiết kế, hiệu quả:<\/p><ul><li>Rủi ro có gắn với <b>mục tiêu chiến lược<\/b> không?<\/li><li>Có <b>chủ sở hữu<\/b> rủi ro, hạn xử lý không?<\/li><li>Cập nhật khi có <b>thay đổi lớn<\/b> (kênh mới, luật mới)?<\/li><li>Rủi ro trọng yếu có được <b>báo HĐQT<\/b>?<\/li><li>Rủi ro còn lại có nằm trong <b>khẩu vị<\/b>?<\/li><\/ul>","take":"Có giấy tờ ≠ có quản lý rủi ro. Kiểm tra <b>cập nhật – chủ sở hữu – báo cáo<\/b>."}],"summary":"<div class=\"tbl\"><table><tr><th>Khái niệm<\/th><th>Điểm cần nhớ<\/th><\/tr><tr><td>Rủi ro<\/td><td>Tích cực hoặc tiêu cực; gắn với mục tiêu<\/td><\/tr><tr><td>Tiềm tàng / Còn lại<\/td><td>Trước / sau hành động của quản lý<\/td><\/tr><tr><td>Khẩu vị / Ngưỡng chịu đựng<\/td><td>Tổng thể, HĐQT đặt / Cụ thể, đo được<\/td><\/tr><tr><td>Đánh giá<\/td><td>Khả năng xảy ra × Mức ảnh hưởng<\/td><\/tr><tr><td>Phản ứng<\/td><td>Né tránh · Giảm thiểu · Chia sẻ · Chấp nhận (+ Theo đuổi)<\/td><\/tr><tr><td>Chu trình<\/td><td>Bối cảnh → Nhận diện → Đánh giá → Phản ứng → Theo dõi, báo cáo<\/td><\/tr><tr><td>COSO ERM 2017<\/td><td>5 thành phần, 20 nguyên tắc; gắn rủi ro với chiến lược và kết quả<\/td><\/tr><tr><td>ISO 31000:2018<\/td><td>Nguyên tắc, khung, quy trình<\/td><\/tr><tr><td>Vai trò KTNB<\/td><td>Đảm bảo về quy trình; tư vấn có biện pháp bảo vệ; không đặt khẩu vị, không sở hữu rủi ro<\/td><\/tr><\/table><\/div>","terms":[["Risk","Rủi ro","Tác động tích cực hoặc tiêu cực của sự không chắc chắn tới mục tiêu.","Mở thêm 30 cửa hàng có thể tăng doanh thu hoặc thua lỗ."],["Inherent risk","Rủi ro tiềm tàng","Rủi ro khi chưa có hành động nào của quản lý.","Quầy thu ngân không camera, một người đếm tiền."],["Residual risk","Rủi ro còn lại","Phần rủi ro tiềm tàng còn lại sau khi quản lý có hành động.","Sau khi có camera và đếm 2 người, rủi ro còn thấp."],["Risk appetite","Khẩu vị rủi ro","Loại và mức rủi ro tổ chức sẵn sàng chấp nhận để theo đuổi mục tiêu.","Không chấp nhận rủi ro an toàn thực phẩm."],["Risk tolerance","Ngưỡng chịu đựng rủi ro","Mức biến động chấp nhận được của kết quả so với mục tiêu.","Hao hụt tối đa 0,5% doanh thu."],["Likelihood","Khả năng xảy ra","Mức có thể xảy ra của một sự kiện.","POS ngừng: 2 lần/năm."],["Impact","Mức ảnh hưởng","Kết quả, tác động của sự kiện.","Mỗi giờ POS ngừng mất 400 triệu doanh thu."],["Risk response","Phản ứng rủi ro","Né tránh, giảm thiểu, chia sẻ, chấp nhận (COSO ERM thêm theo đuổi).","Mua bảo hiểm cháy nổ cho kho."],["Risk register","Bản đăng ký rủi ro","Danh mục rủi ro, đánh giá, chủ sở hữu, biện pháp, trạng thái.","File 60 rủi ro của An Phát."],["Risk owner","Chủ sở hữu rủi ro","Người chịu trách nhiệm quản lý một rủi ro cụ thể.","Giám đốc CNTT sở hữu rủi ro POS ngừng."],["Enterprise risk management (ERM)","Quản lý rủi ro doanh nghiệp","Cách tiếp cận toàn tổ chức, gắn rủi ro với chiến lược và kết quả.","COSO ERM 2017, ISO 31000:2018."]],"traps":"<div class=\"trap\"><b class=\"h\">Tiềm tàng hay còn lại<\/b>Đề hay mô tả “sau khi có kiểm soát” rồi hỏi tên. <b>Sau = còn lại<\/b>.<\/div><div class=\"trap\"><b class=\"h\">Khẩu vị ≠ ngưỡng<\/b>Câu định tính, tổng thể = <b>khẩu vị<\/b>. Con số cụ thể, đo được = <b>ngưỡng chịu đựng<\/b>.<\/div><div class=\"trap\"><b class=\"h\">Bảo hiểm không chuyển hết trách nhiệm<\/b>Chia sẻ rủi ro chuyển một phần <b>thiệt hại tài chính<\/b>, ban điều hành vẫn chịu trách nhiệm quản lý.<\/div><div class=\"trap\"><b class=\"h\">COSO ERM khác COSO IC<\/b>ERM 2017: 5 thành phần, 20 nguyên tắc. Kiểm soát nội bộ 2013: 5 thành phần, 17 nguyên tắc. Đừng lẫn tên thành phần.<\/div><div class=\"trap\"><b class=\"h\">Rủi ro có cả mặt tích cực<\/b>GIAS định nghĩa rủi ro là tác động <b>tích cực hoặc tiêu cực<\/b>; đáp án “chỉ là thiệt hại” là sai.<\/div>","quiz":[{"q":"Theo GIAS, rủi ro là:","o":["Sai sót trong báo cáo tài chính","Tác động tích cực hoặc tiêu cực của sự không chắc chắn tới mục tiêu","Xác suất xảy ra gian lận","Chỉ các sự kiện gây thiệt hại"],"a":1,"e":"Glossary.","s":"GIAS Glossary"},{"q":"Rủi ro tiềm tàng là rủi ro:","o":["Đã được chấp nhận","Khi chưa có hành động nào của quản lý","Sau khi đã có kiểm soát","Mà KTV không phát hiện được"],"a":1,"e":"Glossary.","s":"GIAS Glossary"},{"q":"Mức biến động chấp nhận được của kết quả so với mục tiêu là:","o":["Ngưỡng chịu đựng rủi ro","Năng lực rủi ro","Rủi ro còn lại","Khẩu vị rủi ro"],"a":0,"e":"Glossary – risk tolerance.","s":"GIAS Glossary"},{"q":"Mua bảo hiểm để chuyển một phần thiệt hại tiềm ẩn sang công ty bảo hiểm là phản ứng:","o":["Chấp nhận","Giảm thiểu","Chia sẻ, chuyển giao","Né tránh"],"a":2,"e":"Share/transfer.","s":"T1 C.5.d"},{"q":"Ngừng một dòng sản phẩm vì rủi ro pháp lý quá cao là phản ứng:","o":["Chấp nhận","Né tránh","Theo đuổi","Chia sẻ"],"a":1,"e":"Avoid.","s":"T1 C.5.d"},{"q":"Một chuỗi đối thủ mở cửa hàng giảm giá sát các điểm bán là rủi ro:","o":["Chiến lược","Tài chính","Môi trường","Tuân thủ"],"a":0,"e":"Ảnh hưởng tới lợi thế cạnh tranh.","s":"T1 C.4.a"},{"q":"Ai đặt khẩu vị rủi ro của tổ chức?","o":["HĐQT (cơ quan quản trị)","Kiểm toán độc lập","KTNB","Trưởng phòng quản lý rủi ro"],"a":0,"e":"Three Lines Model – Nguyên tắc 2.","s":"Three Lines Model 2020"},{"q":"Theo GIAS, quản lý rủi ro nhằm cung cấp:","o":["Đảm bảo hợp lý về việc đạt mục tiêu","Loại bỏ mọi rủi ro","Lợi nhuận tối đa","Đảm bảo tuyệt đối không có tổn thất"],"a":0,"e":"Glossary – risk management.","s":"GIAS Glossary"},{"q":"COSO ERM 2017 có bao nhiêu thành phần?","o":["17","5","3","8"],"a":1,"e":"Governance & Culture; Strategy & Objective-Setting; Performance; Review & Revision; Information, Communication & Reporting.","s":"COSO ERM 2017"},{"q":"Thành phần nào KHÔNG thuộc COSO ERM 2017?","o":["Hoạt động kiểm soát","Quản trị và văn hóa","Rà soát và điều chỉnh","Chiến lược và đặt mục tiêu"],"a":0,"e":"Hoạt động kiểm soát là thành phần của COSO Kiểm soát nội bộ 2013.","s":"COSO ERM 2017"},{"q":"Trong ISO 31000:2018, “đánh giá rủi ro” gồm các bước:","o":["Nhận diện, xử lý, báo cáo","Lập kế hoạch, thực hiện, kết thúc","Nhận diện, phân tích, đánh giá rủi ro","Phân tích, kiểm toán, theo dõi"],"a":2,"e":"ISO 31000 – risk assessment.","s":"ISO 31000:2018"},{"q":"Mức trọng yếu của rủi ro thường được đánh giá theo:","o":["Khả năng xảy ra và mức ảnh hưởng","Thời gian tồn tại","Số người liên quan","Chi phí kiểm soát"],"a":0,"e":"Glossary – risk assessment.","s":"GIAS Glossary"},{"q":"Rủi ro còn lại vượt khẩu vị và ban điều hành không xử lý. CAE phải:","o":["Tự lắp thêm kiểm soát","Trao đổi với QLCC, nâng lên HĐQT nếu chưa giải quyết","Bỏ qua vì là quyết định quản lý","Hạ khẩu vị rủi ro"],"a":1,"e":"11.5.","s":"GIAS 11.5"},{"q":"Việc nào là vai trò cốt lõi của KTNB đối với ERM?","o":["Sở hữu bản đăng ký rủi ro","Quyết định phản ứng rủi ro","Đặt khẩu vị rủi ro","Đảm bảo về quy trình quản lý rủi ro"],"a":3,"e":"KTNB đảm bảo, không thay quản lý.","s":"T1 C.6"},{"q":"Khi đánh giá thiết kế quy trình quản lý rủi ro, dấu hiệu nào cho thấy yếu kém?","o":["Bản đăng ký cập nhật hằng quý","Rủi ro không có chủ sở hữu và không được báo cáo lên HĐQT","Rủi ro có xếp hạng theo khả năng và ảnh hưởng","Có khẩu vị rủi ro được HĐQT duyệt"],"a":1,"e":"Chu trình quản lý rủi ro.","s":"T1 C.6.a"}],"next":"<ol><li><b>Đọc gốc (≈ 60 phút):<\/b> COSO ERM 2017 – bản tóm tắt điều hành (T6); ISO 31000:2018 (T7); GIAS Glossary các mục rủi ro.<\/li><li><b>Tự tóm tắt 1 trang:<\/b> lập ma trận 5×5 (khả năng × ảnh hưởng) cho 5 rủi ro GSHĐ đang theo dõi; ghi rủi ro tiềm tàng, kiểm soát, rủi ro còn lại.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 3 câu 3–5.<\/li><li><b>K10 (1 giờ):<\/b> Thuế GTGT – điều kiện khấu trừ. Câu tự kiểm: Hóa đơn từ 5 triệu đồng trở lên phải thanh toán thế nào mới được khấu trừ?<\/li><li><b>Sổ lỗi:<\/b> ghi câu sai và tình huống không đúng ngay lần đầu.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 10 (C10)<\/b>Kiểm soát nội bộ theo COSO 2013: 5 thành phần, 17 nguyên tắc, loại kiểm soát.<\/div>","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2), Glossary · COSO – Enterprise Risk Management: Integrating with Strategy and Performance (2017) · ISO 31000:2018 · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), C.4–C.6 · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p><p class=\"en\">Tài liệu T6, T7 không có trong Project; nội dung COSO ERM, ISO 31000 được tóm lược theo bản công bố chính thức. Nên đối chiếu khi đọc gốc.<\/p>"},"lessons/L10":{"code":"C10","id":"L10","order":10,"week":11,"title":"Bài 10. Kiểm soát nội bộ theo COSO","short":"Kiểm soát nội bộ COSO","eyebrow":"IAP (CIA Part 1) · Tuần 11 · Chủ đề C10 · Phần III – Quản trị, rủi ro và kiểm soát (30%)","lead":"6 tình huống tại cửa hàng, kho và hệ thống của An Phát. Bài bám <b>COSO Kiểm soát nội bộ – Khung tích hợp (2013)<\/b>: 3 nhóm mục tiêu, 5 thành phần, 17 nguyên tắc; loại kiểm soát; thiết kế và vận hành.","pills":["⏱ ~96 phút: 6 tình huống · 12 thẻ thuật ngữ · 15 trắc nghiệm","📄 COSO Internal Control – Integrated Framework 2013 (T5)","🎯 Đề cương C.7, C.8"],"goals":"<ol><li>Nêu mục đích của kiểm soát nội bộ và <b>3 nhóm mục tiêu<\/b> COSO.<\/li><li>Kể đủ <b>5 thành phần, 17 nguyên tắc<\/b>; xếp tình huống vào đúng thành phần.<\/li><li>Phân biệt kiểm soát <b>phòng ngừa, phát hiện, khắc phục, chỉ dẫn, bù đắp<\/b>.<\/li><li>Phân biệt khiếm khuyết <b>thiết kế<\/b> và <b>vận hành<\/b>.<\/li><li>Đề xuất kiểm soát phù hợp; nhận biết <b>giới hạn vốn có<\/b>.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Phòng ngừa, phát hiện hay khắc phục?","std":"Đề cương C.7.b","scene":"<p>Ba kiểm soát tại An Phát: <b>(1)<\/b> hệ thống không cho tạo đơn mua hàng vượt hạn mức nếu chưa có người duyệt; <b>(2)<\/b> kế toán đối chiếu tiền mặt nộp ngân hàng với doanh thu POS mỗi ngày; <b>(3)<\/b> khi phát hiện tài khoản bị lộ mật khẩu, CNTT khóa tài khoản, đổi mật khẩu và rà soát giao dịch liên quan.<\/p>","q":"Ghép đúng loại kiểm soát:","opts":[["Cả ba đều là phòng ngừa",false,"Chỉ (1) ngăn sự việc trước khi xảy ra."],["(1) phòng ngừa · (2) phát hiện · (3) khắc phục",true,"Đúng bản chất: chặn trước, tìm sau, sửa sau khi xảy ra."],["(1) chỉ dẫn · (2) phát hiện · (3) phòng ngừa",false,"Khóa tài khoản sau sự cố là khắc phục."],["(1) phát hiện · (2) phòng ngừa · (3) khắc phục",false,"Đối chiếu sau khi giao dịch xảy ra là phát hiện."]],"gias":"<div class=\"tbl\"><table><tr><th>Loại<\/th><th>Mục đích<\/th><th>Ví dụ bán lẻ<\/th><\/tr><tr><td><b>Phòng ngừa<\/b> (preventive)<\/td><td>Ngăn sai sót, gian lận xảy ra<\/td><td>Phân quyền, hạn mức duyệt, phân chia nhiệm vụ, chặn trên hệ thống<\/td><\/tr><tr><td><b>Phát hiện<\/b> (detective)<\/td><td>Tìm ra sau khi đã xảy ra<\/td><td>Đối chiếu, kiểm kê, rà soát báo cáo ngoại lệ, camera<\/td><\/tr><tr><td><b>Khắc phục<\/b> (corrective)<\/td><td>Sửa hậu quả, ngăn tái diễn<\/td><td>Khóa tài khoản, điều chỉnh sổ, đào tạo lại, kỷ luật<\/td><\/tr><tr><td><b>Chỉ dẫn<\/b> (directive)<\/td><td>Hướng hành vi theo mong muốn<\/td><td>Quy chế, quy trình, quy tắc ứng xử, đào tạo<\/td><\/tr><tr><td><b>Bù đắp<\/b> (compensating)<\/td><td>Thay thế khi kiểm soát chính không khả thi<\/td><td>Quản lý vùng rà soát khi cửa hàng nhỏ không phân chia được nhiệm vụ<\/td><\/tr><\/table><\/div><p class=\"en\">Kiểm soát còn được chia theo cách thực hiện: thủ công, tự động, bán tự động; kiểm soát chung CNTT và kiểm soát ứng dụng.<\/p>","take":"<b>Chặn trước<\/b> = phòng ngừa · <b>Bắt sau<\/b> = phát hiện · <b>Sửa<\/b> = khắc phục."},{"title":"Thành phần nào của COSO?","std":"COSO IC 2013","scene":"<p>Khi đánh giá kiểm soát nội bộ, KTNB ghi nhận: <b>(a)<\/b> HĐQT có UBKT độc lập, Tổng giám đốc thường nhắc về chính trực; <b>(b)<\/b> mỗi năm các khối đánh giá rủi ro gian lận; <b>(c)<\/b> phiếu chi cần 2 chữ ký; <b>(d)<\/b> báo cáo tồn kho hằng ngày gửi giám đốc vùng; <b>(e)<\/b> KTNB đánh giá định kỳ, báo cáo khiếm khuyết lên UBKT.<\/p>","q":"Ghép thành phần COSO cho (a)–(e):","opts":[["Môi trường kiểm soát · Đánh giá rủi ro · Hoạt động kiểm soát · Thông tin và truyền thông · Giám sát",true,"Đúng 5 thành phần theo thứ tự."],["Môi trường kiểm soát · Hoạt động kiểm soát · Đánh giá rủi ro · Giám sát · Thông tin và truyền thông",false,"Đánh giá rủi ro gian lận là thành phần Đánh giá rủi ro (nguyên tắc 8)."],["Hoạt động kiểm soát · Giám sát · Môi trường kiểm soát · Đánh giá rủi ro · Thông tin và truyền thông",false,"Sai từ dòng đầu: UBKT, tone at the top thuộc môi trường kiểm soát."],["Tất cả đều thuộc Hoạt động kiểm soát",false,"COSO gồm 5 thành phần khác nhau."]],"gias":"<p><b>COSO Kiểm soát nội bộ – Khung tích hợp (2013)<\/b>: 3 nhóm mục tiêu (<b>hoạt động, báo cáo, tuân thủ<\/b>), 5 thành phần, 17 nguyên tắc.<\/p><div class=\"tbl\"><table><tr><th>Thành phần<\/th><th>Nguyên tắc<\/th><\/tr><tr><td><b>Môi trường kiểm soát<\/b><\/td><td>1 Cam kết chính trực, giá trị đạo đức · 2 HĐQT độc lập, giám sát · 3 Cơ cấu, tuyến báo cáo, thẩm quyền · 4 Cam kết năng lực · 5 Trách nhiệm giải trình<\/td><\/tr><tr><td><b>Đánh giá rủi ro<\/b><\/td><td>6 Xác định mục tiêu phù hợp · 7 Nhận diện, phân tích rủi ro · 8 Đánh giá rủi ro gian lận · 9 Nhận diện, phân tích thay đổi trọng yếu<\/td><\/tr><tr><td><b>Hoạt động kiểm soát<\/b><\/td><td>10 Chọn, xây dựng hoạt động kiểm soát · 11 Kiểm soát chung về công nghệ · 12 Triển khai qua chính sách, thủ tục<\/td><\/tr><tr><td><b>Thông tin và truyền thông<\/b><\/td><td>13 Dùng thông tin chất lượng · 14 Truyền thông nội bộ · 15 Truyền thông bên ngoài<\/td><\/tr><tr><td><b>Giám sát<\/b><\/td><td>16 Đánh giá liên tục và/hoặc định kỳ · 17 Đánh giá, thông báo khiếm khuyết<\/td><\/tr><\/table><\/div>","take":"<span class=\"mnemo\">“5 – 4 – 3 – 3 – 2” = 17 nguyên tắc<\/span>. Gian lận nằm ở <b>nguyên tắc 8<\/b>."},{"title":"Quy chế có, thực tế không làm","std":"Đề cương C.8.a","scene":"<p>Quy chế tài chính yêu cầu phiếu chi trên 50 triệu đồng có <b>2 chữ ký<\/b>. Quy chế được ban hành đúng và phổ biến đầy đủ. Chọn mẫu 40 phiếu thì 12 phiếu chỉ có 1 chữ ký.<\/p>","q":"Đây là khiếm khuyết gì?","opts":[["Không có khiếm khuyết vì đa số phiếu vẫn đúng",false,"30% sai lệch là đáng kể với kiểm soát chi tiền."],["Khiếm khuyết về môi trường kiểm soát nên không cần xem hoạt động kiểm soát",false,"Phải xác định đúng kiểm soát bị lỗi; môi trường có thể là nguyên nhân gốc rễ."],["Khiếm khuyết về vận hành: thiết kế phù hợp nhưng kiểm soát không được thực hiện nhất quán",true,"Thiết kế đạt, vận hành không đạt."],["Khiếm khuyết về thiết kế",false,"Thiết kế 2 chữ ký là phù hợp với rủi ro."]],"gias":"<div class=\"tbl\"><table><tr><th><\/th><th>Hiệu quả thiết kế<\/th><th>Hiệu quả vận hành<\/th><\/tr><tr><td>Câu hỏi<\/td><td>Nếu thực hiện đúng, kiểm soát có xử lý được rủi ro không?<\/td><td>Kiểm soát có thực sự được thực hiện đúng, nhất quán, trong suốt kỳ không?<\/td><\/tr><tr><td>Cách kiểm tra<\/td><td>Phỏng vấn, xem quy trình, walkthrough một giao dịch<\/td><td>Chọn mẫu kiểm tra, quan sát, thực hiện lại<\/td><\/tr><tr><td>Ví dụ lỗi<\/td><td>Không có quy định duyệt chi, hoặc người duyệt là người lập<\/td><td>Có quy định nhưng 12/40 phiếu thiếu chữ ký<\/td><\/tr><\/table><\/div><p>Thứ tự hợp lý: <b>đánh giá thiết kế trước<\/b>; thiết kế không đạt thì thường không cần kiểm tra vận hành của kiểm soát đó.<\/p>","take":"<b>Thiết kế<\/b> = có đúng thuốc không · <b>Vận hành<\/b> = có uống đều không."},{"title":"Cửa hàng nhỏ chỉ có 2 nhân viên","std":"Đề cương C.7.c","scene":"<p>Cửa hàng mini tại Bến Tre chỉ có 2 nhân viên: một người vừa thu ngân vừa nhập hàng, người kia vừa bán hàng vừa kiểm kê. Không thể <b>phân chia nhiệm vụ<\/b> như cửa hàng lớn.<\/p>","q":"Đề xuất nào phù hợp nhất?","opts":[["Chấp nhận rủi ro, không làm gì",false,"Rủi ro tiền mặt và hàng hóa cao, cần kiểm soát."],["Đóng cửa hàng",false,"Né tránh rủi ro quá mức so với vấn đề."],["Áp dụng kiểm soát bù đắp: quản lý vùng kiểm kê đột xuất, rà soát báo cáo hủy giao dịch hằng ngày từ xa, camera, đối chiếu tiền nộp ngân hàng tự động",true,"Kiểm soát bù đắp khi không phân chia được nhiệm vụ."],["Tuyển thêm 3 người để phân chia nhiệm vụ đầy đủ",false,"Chi phí vượt lợi ích; kiểm soát phải cân nhắc chi phí."]],"gias":"<p><b>Phân chia nhiệm vụ<\/b>: tách <b>phê duyệt – ghi chép – giữ tài sản<\/b> (và đối chiếu) cho những người khác nhau để một người không vừa gây vừa che giấu sai phạm.<\/p><p>Khi không phân chia được → <b>kiểm soát bù đắp<\/b>: tăng giám sát của cấp trên, rà soát độc lập, kiểm tra đột xuất, phân tích dữ liệu.<\/p><p>Khi đề xuất kiểm soát, cân nhắc: <b>rủi ro cần xử lý, chi phí – lợi ích, tự động hay thủ công, phòng ngừa hay phát hiện<\/b>.<\/p>","take":"Không tách được nhiệm vụ → <b>tăng rà soát độc lập<\/b> (bù đắp)."},{"title":"Thủ kho và bảo vệ cùng thông đồng","std":"COSO IC 2013 – giới hạn","scene":"<p>Kho Bình Dương có đủ kiểm soát: phiếu xuất phải có chữ ký thủ kho, bảo vệ đối chiếu khi xe ra cổng, camera. Tuy vậy, thủ kho và bảo vệ <b>thông đồng<\/b> đưa hàng ra ngoài suốt 6 tháng.<\/p>","q":"Điều này cho thấy:","opts":[["Thiết kế kiểm soát sai hoàn toàn",false,"Thiết kế hợp lý; vấn đề là thông đồng."],["Giới hạn vốn có của kiểm soát nội bộ: thông đồng có thể vô hiệu hóa kiểm soát dựa trên phân chia nhiệm vụ, nên kiểm soát chỉ đem lại đảm bảo hợp lý",true,"COSO: limitations."],["Kiểm soát nội bộ vô dụng, nên bỏ",false,"Kiểm soát giảm rủi ro, chỉ không loại bỏ tuyệt đối."],["KTNB chịu trách nhiệm vì không phát hiện",false,"KTNB không đảm bảo tuyệt đối; trách nhiệm kiểm soát thuộc quản lý."]],"gias":"<p>Kiểm soát nội bộ chỉ đem lại <b>đảm bảo hợp lý<\/b> vì có giới hạn vốn có:<\/p><ul><li><b>Thông đồng<\/b> giữa hai người trở lên.<\/li><li><b>Ban điều hành vượt quyền<\/b> kiểm soát (management override).<\/li><li><b>Sai sót của con người<\/b>, xét đoán sai.<\/li><li><b>Chi phí – lợi ích<\/b>: không thể kiểm soát mọi thứ.<\/li><li>Sự kiện bên ngoài ngoài tầm kiểm soát.<\/li><\/ul><p>Biện pháp giảm rủi ro thông đồng: luân chuyển, kiểm tra đột xuất, phân tích dữ liệu bất thường, đường dây nóng.<\/p>","take":"Giới hạn: <span class=\"mnemo\">“Thông đồng – Vượt quyền – Sai sót – Chi phí”<\/span>."},{"title":"Giá bán sai trên POS","std":"Đề cương C.7.c · COSO nguyên tắc 11","scene":"<p>Nhiều cửa hàng bán sai giá vì nhân viên vùng có thể sửa <b>bảng giá gốc<\/b> trên hệ thống. Không ai rà soát lịch sử thay đổi giá.<\/p>","q":"Bộ kiểm soát nào phù hợp nhất?","opts":[["Giới hạn quyền sửa bảng giá cho một nhóm được phân quyền, có phê duyệt (phòng ngừa, tự động); kèm báo cáo nhật ký thay đổi giá được rà soát hằng ngày (phát hiện)",true,"Kết hợp phòng ngừa tự động và phát hiện, xử lý đúng nguyên nhân là quyền truy cập."],["Kiểm tra giá bằng tay 100% sản phẩm mỗi ngày",false,"Tốn kém, không xử lý quyền truy cập."],["Gửi email nhắc nhân viên cẩn thận hơn",false,"Kiểm soát chỉ dẫn yếu, không xử lý nguyên nhân."],["Phạt nhân viên thu ngân khi bán sai giá",false,"Thu ngân không gây ra lỗi; chỉ là biện pháp khắc phục sai đối tượng."]],"gias":"<p>COSO nguyên tắc 11: tổ chức chọn và xây dựng <b>kiểm soát chung về công nghệ<\/b>, như quản lý truy cập, quản lý thay đổi, vận hành hệ thống.<\/p><p>Khi đề xuất kiểm soát (đề cương C.7.c):<\/p><ul><li>Xử lý <b>nguyên nhân gốc rễ<\/b> (ở đây là quyền truy cập).<\/li><li>Ưu tiên kiểm soát <b>tự động, phòng ngừa<\/b> cho rủi ro lặp lại nhiều.<\/li><li>Kết hợp <b>phát hiện<\/b> để bắt ngoại lệ.<\/li><li>Cân nhắc <b>chi phí – lợi ích<\/b>.<\/li><\/ul>","take":"Kiểm soát tốt: <b>đúng nguyên nhân + tự động phòng ngừa + có lưới phát hiện<\/b>."}],"summary":"<div class=\"tbl\"><table><tr><th>Thành phần<\/th><th>Số nguyên tắc<\/th><th>Từ khóa<\/th><\/tr><tr><td>Môi trường kiểm soát<\/td><td>5 (1–5)<\/td><td>Chính trực, HĐQT độc lập, cơ cấu, năng lực, giải trình<\/td><\/tr><tr><td>Đánh giá rủi ro<\/td><td>4 (6–9)<\/td><td>Mục tiêu, rủi ro, gian lận, thay đổi<\/td><\/tr><tr><td>Hoạt động kiểm soát<\/td><td>3 (10–12)<\/td><td>Hoạt động kiểm soát, công nghệ, chính sách<\/td><\/tr><tr><td>Thông tin và truyền thông<\/td><td>3 (13–15)<\/td><td>Thông tin chất lượng, nội bộ, bên ngoài<\/td><\/tr><tr><td>Giám sát<\/td><td>2 (16–17)<\/td><td>Đánh giá liên tục, định kỳ; báo khiếm khuyết<\/td><\/tr><\/table><\/div><h3>Loại kiểm soát<\/h3><div class=\"tbl\"><table><tr><th>Theo mục đích<\/th><th>Theo cách thực hiện<\/th><\/tr><tr><td>Phòng ngừa · Phát hiện · Khắc phục · Chỉ dẫn · Bù đắp<\/td><td>Thủ công · Tự động · Bán tự động; Kiểm soát chung CNTT · Kiểm soát ứng dụng<\/td><\/tr><\/table><\/div>","terms":[["Internal control","Kiểm soát nội bộ","Quy trình do HĐQT, ban điều hành và nhân sự thực hiện để có đảm bảo hợp lý về mục tiêu hoạt động, báo cáo, tuân thủ.","Hệ thống phân quyền, đối chiếu, kiểm kê của An Phát."],["Preventive control","Kiểm soát phòng ngừa","Ngăn sai sót, gian lận xảy ra.","Hệ thống chặn đơn mua hàng vượt hạn mức."],["Detective control","Kiểm soát phát hiện","Tìm ra sai sót, gian lận sau khi xảy ra.","Đối chiếu tiền nộp ngân hàng với doanh thu POS."],["Corrective control","Kiểm soát khắc phục","Sửa hậu quả và ngăn tái diễn.","Khóa tài khoản bị lộ, rà soát giao dịch liên quan."],["Directive control","Kiểm soát chỉ dẫn","Định hướng hành vi mong muốn.","Quy trình kiểm kê, quy tắc ứng xử."],["Compensating control","Kiểm soát bù đắp","Thay thế khi kiểm soát chính không khả thi.","Quản lý vùng rà soát hủy giao dịch tại cửa hàng 2 người."],["Segregation of duties","Phân chia nhiệm vụ","Tách phê duyệt, ghi chép, giữ tài sản cho người khác nhau.","Người tạo nhà cung cấp mới không được duyệt thanh toán."],["Control environment","Môi trường kiểm soát","Nền tảng của kiểm soát: chính trực, HĐQT giám sát, cơ cấu, năng lực, giải trình.","Tổng giám đốc làm gương tuân thủ quy định quà tặng."],["Design effectiveness","Hiệu quả thiết kế","Kiểm soát, nếu được thực hiện đúng, có xử lý được rủi ro không.","Có quy định 2 chữ ký cho phiếu chi lớn."],["Operating effectiveness","Hiệu quả vận hành","Kiểm soát có được thực hiện đúng, nhất quán trong kỳ không.","40/40 phiếu chi lớn có đủ 2 chữ ký."],["Management override","Ban điều hành vượt quyền","Người quản lý bỏ qua kiểm soát; là giới hạn vốn có.","Giám đốc tài chính ra lệnh chi không qua duyệt."],["IT general controls (ITGC)","Kiểm soát chung CNTT","Kiểm soát truy cập, thay đổi, vận hành hệ thống; nền cho kiểm soát ứng dụng.","Rà soát định kỳ danh sách người có quyền sửa bảng giá."]],"traps":"<div class=\"trap\"><b class=\"h\">Môi trường kiểm soát là nền<\/b>Tone at the top, đạo đức, HĐQT, cơ cấu, năng lực → <b>Môi trường kiểm soát<\/b>, không phải Hoạt động kiểm soát.<\/div><div class=\"trap\"><b class=\"h\">Gian lận nằm ở Đánh giá rủi ro<\/b>Đánh giá rủi ro gian lận là <b>nguyên tắc 8<\/b>, thuộc <b>Đánh giá rủi ro<\/b>.<\/div><div class=\"trap\"><b class=\"h\">Camera là gì?<\/b>Camera thường là <b>phát hiện<\/b> (xem lại sau). Nó chỉ có tác dụng <b>răn đe, phòng ngừa<\/b> khi người ta biết có camera; đọc kỹ câu hỏi.<\/div><div class=\"trap\"><b class=\"h\">Đối chiếu là phát hiện<\/b>Đối chiếu, kiểm kê, rà soát ngoại lệ đều diễn ra <b>sau<\/b> giao dịch → phát hiện.<\/div><div class=\"trap\"><b class=\"h\">Thiết kế trước, vận hành sau<\/b>Thiết kế không đạt thì không cần kiểm tra vận hành của kiểm soát đó.<\/div>","quiz":[{"q":"COSO Kiểm soát nội bộ 2013 có bao nhiêu nguyên tắc?","o":["20","5","12","17"],"a":3,"e":"5 thành phần, 17 nguyên tắc.","s":"COSO IC 2013"},{"q":"Nguyên tắc “đánh giá rủi ro gian lận” thuộc thành phần nào?","o":["Giám sát","Hoạt động kiểm soát","Đánh giá rủi ro","Môi trường kiểm soát"],"a":2,"e":"Nguyên tắc 8.","s":"COSO IC 2013"},{"q":"HĐQT thể hiện tính độc lập với ban điều hành và giám sát kiểm soát nội bộ thuộc:","o":["Thông tin và truyền thông","Giám sát","Đánh giá rủi ro","Môi trường kiểm soát"],"a":3,"e":"Nguyên tắc 2.","s":"COSO IC 2013"},{"q":"Ba nhóm mục tiêu của COSO Kiểm soát nội bộ là:","o":["Chiến lược, tài chính, nhân sự","Hiệu quả, tiết kiệm, công bằng","Phòng ngừa, phát hiện, khắc phục","Hoạt động, báo cáo, tuân thủ"],"a":3,"e":
