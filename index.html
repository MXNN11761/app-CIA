"COSO IC 2013.","s":"COSO IC 2013"},{"q":"Kiểm kê hàng tồn kho cuối tháng là kiểm soát:","o":["Phòng ngừa","Chỉ dẫn","Khắc phục","Phát hiện"],"a":3,"e":"Tìm chênh lệch sau khi xảy ra.","s":"T1 C.7.b"},{"q":"Yêu cầu mật khẩu và phân quyền trước khi vào hệ thống là kiểm soát:","o":["Khắc phục","Bù đắp","Phát hiện","Phòng ngừa"],"a":3,"e":"Ngăn truy cập trái phép.","s":"T1 C.7.b"},{"q":"Kiểm soát được thiết kế đúng nhưng không được thực hiện nhất quán là khiếm khuyết về:","o":["Mục tiêu","Môi trường","Vận hành","Thiết kế"],"a":2,"e":"Operating deficiency.","s":"T1 C.8.a"},{"q":"Kiểm tra hiệu quả vận hành thường dùng:","o":["Chọn mẫu, quan sát, thực hiện lại","Chỉ đọc quy chế","Đọc báo cáo thường niên","Chỉ phỏng vấn trưởng bộ phận"],"a":0,"e":"Kiểm tra thực tế việc thực hiện.","s":"T1 C.8.a"},{"q":"Giới hạn vốn có nào khiến phân chia nhiệm vụ không còn tác dụng?","o":["Luân chuyển công việc","Thông đồng","Đào tạo nhân viên","Kiểm soát tự động"],"a":1,"e":"Collusion.","s":"COSO IC 2013"},{"q":"Kiểm soát nội bộ chỉ đem lại đảm bảo hợp lý vì:","o":["Luật không yêu cầu","Kiểm toán viên không đủ năng lực","Có giới hạn vốn có như sai sót con người, thông đồng, vượt quyền","Chi phí kiểm soát luôn bằng không"],"a":2,"e":"Limitations.","s":"COSO IC 2013"},{"q":"Khi không thể phân chia nhiệm vụ, biện pháp phù hợp là:","o":["Tăng lương nhân viên","Bỏ qua kiểm soát","Giao toàn quyền cho một người","Kiểm soát bù đắp như rà soát độc lập của cấp trên"],"a":3,"e":"Compensating controls.","s":"T1 C.7.c"},{"q":"Phân chia nhiệm vụ cơ bản là tách:","o":["Lập kế hoạch, thực hiện, báo cáo","Phê duyệt, ghi chép, giữ tài sản","Mua hàng, bán hàng, kế toán","Tuyển dụng, đào tạo, đánh giá"],"a":1,"e":"Authorization, recording, custody.","s":"T1 D.4.b"},{"q":"Quản lý truy cập và quản lý thay đổi hệ thống thuộc nguyên tắc nào của COSO?","o":["Nguyên tắc 4 – Năng lực","Nguyên tắc 16 – Đánh giá liên tục","Nguyên tắc 11 – Kiểm soát chung về công nghệ","Nguyên tắc 14 – Truyền thông nội bộ"],"a":2,"e":"COSO IC 2013.","s":"COSO IC 2013"},{"q":"Lợi ích chính của việc dùng một khung kiểm soát nội bộ như COSO là:","o":["Có cấu trúc và tiêu chí chung để thiết kế, đánh giá kiểm soát","Thay thế quy chế nội bộ","Bảo đảm tuyệt đối không có gian lận","Không cần đánh giá rủi ro nữa"],"a":0,"e":"Đề cương C.8.b.","s":"T1 C.8.b"},{"q":"KTNB đánh giá định kỳ và báo khiếm khuyết lên UBKT thuộc thành phần:","o":["Hoạt động kiểm soát","Đánh giá rủi ro","Giám sát","Môi trường kiểm soát"],"a":2,"e":"Nguyên tắc 16, 17.","s":"COSO IC 2013"}],"next":"<ol><li><b>Đọc gốc (≈ 60 phút):<\/b> COSO Internal Control – Integrated Framework 2013, bản tóm tắt điều hành (T5).<\/li><li><b>Tự tóm tắt 1 trang:<\/b> bảng 17 nguyên tắc, mỗi nguyên tắc một ví dụ ở chuỗi bán lẻ; tự viết công thức nhớ “5-4-3-3-2”.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 3 câu 6–8.<\/li><li><b>K11 (1 giờ):<\/b> Thuế TNDN – chi phí được trừ. Câu tự kiểm: Chi phí nào không được trừ dù có hóa đơn hợp lệ?<\/li><li><b>Sổ lỗi:<\/b> ghi câu sai và tình huống không đúng ngay lần đầu.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 11 (C11)<\/b>Văn hóa và đạo đức tổ chức; tuần 12 cũng là tuần đăng ký thi trên CCMS.<\/div>","footer":"<p><b>Nguồn:<\/b> COSO – Internal Control – Integrated Framework (2013) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), C.7, C.8 · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p><p class=\"en\">Tài liệu T5 không có trong Project; nội dung COSO được tóm lược theo bản công bố chính thức. Nên đối chiếu khi đọc gốc.<\/p>"},"lessons/L11":{"code":"C11","id":"L11","order":11,"week":12,"title":"Bài 11. Văn hóa và đạo đức tổ chức","short":"Văn hóa, đạo đức tổ chức","eyebrow":"IAP (CIA Part 1) · Tuần 12 · Chủ đề C11 · Phần III – Quản trị, rủi ro và kiểm soát (30%)","lead":"6 tình huống về chỉ tiêu, đường dây nóng, tone at the top và cách kiểm toán văn hóa tại An Phát. Bài bám đề cương C.2, C.3 và các chuẩn mực GIAS 1.2, 9.4.","pills":["⏱ ~96 phút: 6 tình huống · 11 thẻ thuật ngữ · 15 trắc nghiệm","📄 GIAS 1.2, 1.3, 9.1, 9.4; COSO nguyên tắc 1–5 (T5, T6)","🎯 Đề cương A.5.f, C.2, C.3"],"goals":"<ol><li>Định nghĩa <b>văn hóa tổ chức<\/b>, <b>môi trường kiểm soát<\/b>; nhận ra tác động của văn hóa tới rủi ro, kiểm soát.<\/li><li>Phân biệt <b>tone at the top<\/b> và <b>tone in the middle<\/b>; nhận ra cơ chế khuyến khích sai lệch.<\/li><li>Biết cách <b>kiểm toán văn hóa<\/b>, kiểm soát mềm.<\/li><li>Đánh giá <b>chương trình đạo đức và tuân thủ<\/b>, đường dây nóng.<\/li><li>Nhận diện <b>rủi ro của chính cuộc kiểm toán<\/b> và cách kiểm soát.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Chỉ tiêu doanh số và “mượn” đơn","std":"Đề cương C.2.a, C.2.c","scene":"<p>Thưởng quý của cửa hàng trưởng tính <b>100% theo doanh số<\/b>. Cuối mỗi quý, nhiều cửa hàng ghi nhận đơn đặt trước của khách thành doanh thu, đầu quý sau lại hủy. Các giám đốc vùng biết nhưng <i>“miễn đạt chỉ tiêu”<\/i>.<\/p>","q":"Nguyên nhân gốc rễ KTNB nên nêu là:","opts":[["Kiểm toán độc lập không phát hiện",false,"Không phải nguyên nhân của hành vi."],["Văn hóa và cơ chế khuyến khích: thưởng chỉ dựa vào doanh số tạo áp lực, quản lý cấp giữa ngầm chấp nhận, làm yếu môi trường kiểm soát",true,"Văn hóa, động cơ là nguyên nhân gốc rễ; hành vi của cửa hàng chỉ là biểu hiện."],["Nhân viên thu ngân thao tác sai",false,"Không giải thích được vì sao lặp lại ở nhiều cửa hàng vào cuối quý."],["Phần mềm POS cho phép hủy đơn",false,"Kiểm soát hệ thống có thể bổ sung, nhưng không phải gốc rễ."]],"gias":"<p><b>Văn hóa tổ chức<\/b>: giá trị, niềm tin, chuẩn mực hành vi được chia sẻ, thể hiện qua cách mọi người thực sự làm việc và ra quyết định. Văn hóa là lõi của <b>môi trường kiểm soát<\/b> (COSO nguyên tắc 1–5).<\/p><ul><li><b>Tone at the top<\/b>: thông điệp, hành vi của HĐQT, ban điều hành.<\/li><li><b>Tone in the middle<\/b>: hành vi của quản lý cấp giữa, thường quyết định nhân viên làm gì.<\/li><li><b>Cơ chế khuyến khích<\/b>: thưởng, phạt, chỉ tiêu, có thể tạo áp lực sai lệch.<\/li><\/ul><p>Quy trình <b>ra quyết định<\/b> (ai quyết, dựa trên thông tin gì, có bị chi phối bởi chỉ tiêu ngắn hạn) ảnh hưởng tới quản trị, rủi ro, kiểm soát.<\/p>","take":"Cùng một hành vi ở nhiều nơi → tìm <b>văn hóa và cơ chế thưởng<\/b>, không đổ lỗi cá nhân."},{"title":"Kiểm toán văn hóa bằng cách nào?","std":"Đề cương A.5.f, C.2","scene":"<p>UBKT yêu cầu KTNB đánh giá <b>văn hóa tuân thủ<\/b> tại khối mua hàng. Một KTV hỏi: <i>“Văn hóa vô hình, kiểm tra bằng chứng từ nào?”<\/i><\/p>","q":"Cách tiếp cận phù hợp nhất là:","opts":[["Hỏi trưởng khối mua hàng một câu: “Văn hóa ở đây có tốt không?”",false,"Một nguồn, thiên lệch."],["Chỉ đọc quy tắc ứng xử và kết luận văn hóa tốt",false,"Có văn bản không có nghĩa là có hành vi."],["Kết hợp khảo sát ẩn danh, phỏng vấn, nhóm thảo luận, quan sát hành vi và phân tích dữ liệu như phản ánh qua đường dây nóng, tỷ lệ nghỉ việc, ngoại lệ phê duyệt",true,"Đánh giá kiểm soát mềm cần nhiều nguồn bằng chứng."],["Từ chối vì văn hóa không thuộc phạm vi KTNB",false,"Đề cương liệt kê kiểm toán văn hóa là dịch vụ đảm bảo."]],"gias":"<p><b>Kiểm soát mềm<\/b> (soft controls): yếu tố vô hình như chính trực, tin cậy, sự cởi mở, phong cách lãnh đạo, mức độ dám lên tiếng. <b>Kiểm soát cứng<\/b>: quy trình, phê duyệt, hệ thống.<\/p><div class=\"tbl\"><table><tr><th>Nguồn bằng chứng<\/th><th>Cho biết gì<\/th><\/tr><tr><td>Khảo sát ẩn danh<\/td><td>Nhận thức của nhân viên về tone at the top, áp lực, dám lên tiếng<\/td><\/tr><tr><td>Phỏng vấn, nhóm thảo luận<\/td><td>Cách ra quyết định thực tế, câu chuyện điển hình<\/td><\/tr><tr><td>Dữ liệu nhân sự<\/td><td>Nghỉ việc, phỏng vấn thôi việc, kỷ luật nhất quán hay không<\/td><\/tr><tr><td>Dữ liệu đường dây nóng<\/td><td>Số phản ánh, loại, thời gian xử lý, có trả đũa không<\/td><\/tr><tr><td>Dữ liệu giao dịch<\/td><td>Ngoại lệ phê duyệt, vượt quyền, sửa đổi cuối kỳ<\/td><\/tr><\/table><\/div>","take":"Văn hóa đo bằng <b>nhiều nguồn<\/b>: khảo sát + phỏng vấn + dữ liệu."},{"title":"Đường dây nóng không ai gọi","std":"Đề cương C.3 · GIAS 9.4","scene":"<p>An Phát có đường dây nóng đạo đức từ 3 năm nay nhưng chỉ nhận <b>2 phản ánh<\/b>, cả hai đều về chất lượng hàng. Khảo sát cho thấy nhân viên không biết số điện thoại; số máy do trợ lý Tổng giám đốc trực.<\/p>","q":"Đánh giá nào phù hợp?","opts":[["Chương trình đạo đức và tuân thủ chưa hiệu quả: kênh không được truyền thông, không độc lập, không bảo đảm ẩn danh nên nhân viên không tin tưởng",true,"Ít phản ánh không có nghĩa là ít vi phạm."],["Hiệu quả, vì ít phản ánh nghĩa là ít vi phạm",false,"Diễn giải sai; phải xem kênh có được biết và tin cậy không."],["Không cần đánh giá vì đường dây nóng là việc của nhân sự",false,"9.4 yêu cầu kế hoạch xem xét hiệu quả chương trình tuân thủ và đạo đức."],["KTNB nên trực đường dây nóng thay trợ lý",false,"Có thể bàn phương án, nhưng KTNB không nên sở hữu chương trình."]],"gias":"<p>Thành phần thường thấy của <b>chương trình đạo đức và tuân thủ<\/b>:<\/p><ul><li>Quy tắc ứng xử, chính sách (quà tặng, xung đột lợi ích, chống hối lộ).<\/li><li>Đào tạo, xác nhận hằng năm.<\/li><li>Kênh báo cáo, đường dây nóng <b>độc lập, ẩn danh, chống trả đũa<\/b>.<\/li><li>Điều tra, xử lý kỷ luật <b>nhất quán<\/b>.<\/li><li>Người phụ trách, báo cáo HĐQT.<\/li><\/ul><p>GIAS 9.4: kế hoạch KTNB phải xem xét <b>hiệu quả chương trình tuân thủ và đạo đức<\/b>. GIAS 1.2: KTV thúc đẩy văn hóa đạo đức.<\/p>","take":"Ít phản ánh ≠ ít vi phạm. Kiểm tra <b>biết đến – tin tưởng – ẩn danh – xử lý<\/b>."},{"title":"Tổng giám đốc bỏ qua quy định quà tặng","std":"GIAS 1.2, 1.3 · Đề cương C.3.b","scene":"<p>Quy định cấm nhận quà trên 2 triệu đồng từ đối tác. Trong cuộc kiểm toán khối mua hàng, KTV thấy <b>Tổng giám đốc nhận chuyến du lịch<\/b> từ nhà cung cấp lớn nhất và yêu cầu trưởng khối mua hàng <i>“linh động”<\/i> trong lần gia hạn hợp đồng.<\/p>","q":"KTV và CAE nên làm gì?","opts":[["Bỏ qua vì Tổng giám đốc là cấp cao nhất",false,"Né tránh vi phạm 1.1, 1.2."],["Công bố cho toàn công ty để răn đe",false,"Vi phạm bảo mật, và không qua kênh có thẩm quyền."],["Ghi nhận bằng chứng, báo theo chính sách đến người có thẩm quyền; vì liên quan Tổng giám đốc, CAE trao đổi với HĐQT hoặc UBKT",true,"Tone at the top là rủi ro trọng yếu; kênh báo cáo phải vượt người có liên quan."],["Báo cáo cho chính Tổng giám đốc",false,"Người có liên quan không thể là người xử lý."]],"gias":"<p>Vai trò KTNB trong <b>khung đạo đức<\/b> của tổ chức (đề cương C.3.b):<\/p><ul><li>Đánh giá chương trình đạo đức, tuân thủ; đánh giá <b>tone at the top<\/b>.<\/li><li>Báo hành vi trái kỳ vọng đạo đức theo chính sách (1.2).<\/li><li>Báo vi phạm pháp luật tới người có thẩm quyền (1.3).<\/li><li>Tư vấn xây dựng quy tắc, đào tạo, nhưng <b>không sở hữu<\/b> chương trình.<\/li><\/ul><p>Nhờ quan hệ báo cáo trực tiếp với HĐQT (Nguyên tắc 7), CAE nâng được vấn đề liên quan đến QLCC.<\/p>","take":"Vấn đề ở <b>đỉnh<\/b> → báo <b>HĐQT<\/b>. Đây là lý do CAE cần tuyến báo cáo trực tiếp với HĐQT."},{"title":"Mở 30 cửa hàng trong một cuộc họp","std":"Đề cương C.2.c","scene":"<p>Dự án mở <b>30 cửa hàng<\/b> trong 6 tháng được duyệt trong một cuộc họp 20 phút. Không có phân tích địa điểm, không có ý kiến của giám đốc tài chính. Các thành viên ban điều hành nói: <i>“Chủ tịch đã muốn thì làm.”<\/i><\/p>","q":"Rủi ro quản trị nổi bật nhất là:","opts":[["Quy trình ra quyết định yếu: thiếu thông tin, thiếu phản biện, tư duy theo số đông; ảnh hưởng tới quản trị, quản lý rủi ro và kiểm soát",true,"Đề cương C.2.c."],["Rủi ro tỷ giá",false,"Không liên quan đến tình huống."],["Không có rủi ro vì Chủ tịch có kinh nghiệm",false,"Kinh nghiệm không thay thế quy trình ra quyết định có kiểm soát."],["Rủi ro tuân thủ thuế",false,"Không phải vấn đề chính trong tình huống."]],"gias":"<p>Dấu hiệu quy trình ra quyết định yếu:<\/p><ul><li><b>Tư duy theo số đông<\/b> (groupthink), không ai dám phản biện.<\/li><li>Quyết định tập trung vào một người, bỏ qua phân cấp.<\/li><li>Thiếu thông tin, thiếu phân tích rủi ro.<\/li><li>Áp lực mục tiêu ngắn hạn.<\/li><\/ul><p>KTNB có thể: kiểm toán quy trình phê duyệt đầu tư; đánh giá việc áp dụng khẩu vị rủi ro; tư vấn về quy trình ra quyết định; báo HĐQT về <b>chủ đề xuyên suốt<\/b> (11.3).<\/p>","take":"Quyết định không phản biện = <b>rủi ro quản trị<\/b>."},{"title":"Rủi ro của cuộc kiểm toán văn hóa","std":"Đề cương C.2.b","scene":"<p>Chuẩn bị kiểm toán văn hóa khối bán hàng, trưởng nhóm lo ngại: nhân viên sợ bị trả đũa nên không nói thật; kết quả khảo sát có thể bị hiểu là đánh giá cá nhân; thông tin phỏng vấn có thể bị lộ.<\/p>","q":"KTNB nên xử lý các rủi ro này thế nào khi lập kế hoạch?","opts":[["Bỏ phỏng vấn, chỉ dùng số liệu tài chính",false,"Mất bằng chứng chính cho đánh giá văn hóa."],["Nhận diện rủi ro của chính cuộc kiểm toán và lập kiểm soát: bảo đảm ẩn danh, công cụ khảo sát độc lập, quy định bảo mật dữ liệu phỏng vấn, thống nhất trước với ban điều hành cách sử dụng kết quả",true,"Rủi ro và kiểm soát ở cấp cuộc kiểm toán (13.2, 5.2)."],["Công bố tên người trả lời để tăng độ tin cậy",false,"Phá ẩn danh, tăng rủi ro trả đũa, vi phạm bảo mật."],["Không cần lập kế hoạch riêng vì đây là cuộc kiểm toán bình thường",false,"Cuộc kiểm toán văn hóa có rủi ro đặc thù cần xử lý."]],"gias":"<p>Đề cương C.2.b yêu cầu định nghĩa <b>rủi ro và kiểm soát của cuộc kiểm toán<\/b> (engagement risks and controls), tức các rủi ro của hoạt động được kiểm toán và rủi ro khiến chính cuộc kiểm toán không đạt mục tiêu.<\/p><ul><li>Rủi ro: bằng chứng thiên lệch, thiếu hợp tác, lộ thông tin, kết luận bị hiểu sai.<\/li><li>Kiểm soát: thiết kế mẫu, ẩn danh, bảo mật (5.2), trao đổi mục tiêu, phạm vi với quản lý (13.1), giám sát (12.3).<\/li><\/ul>","take":"Mỗi cuộc kiểm toán cũng có <b>rủi ro riêng<\/b> → lập kiểm soát ngay từ kế hoạch."}],"summary":"<div class=\"tbl\"><table><tr><th>Chủ đề<\/th><th>Điểm cần nhớ<\/th><\/tr><tr><td>Văn hóa<\/td><td>Giá trị và hành vi thực tế; lõi của môi trường kiểm soát<\/td><\/tr><tr><td>Tone<\/td><td>Đỉnh (HĐQT, ban điều hành) và giữa (quản lý cấp giữa)<\/td><\/tr><tr><td>Khuyến khích<\/td><td>Chỉ tiêu một chiều tạo áp lực sai lệch<\/td><\/tr><tr><td>Ra quyết định<\/td><td>Thông tin, phản biện, phân cấp; dấu hiệu groupthink<\/td><\/tr><tr><td>Chương trình đạo đức<\/td><td>Quy tắc, đào tạo, đường dây nóng độc lập, điều tra, kỷ luật nhất quán<\/td><\/tr><tr><td>Kiểm toán văn hóa<\/td><td>Khảo sát, phỏng vấn, nhóm thảo luận, dữ liệu nhân sự, hotline, giao dịch<\/td><\/tr><tr><td>Vai trò KTNB<\/td><td>Đánh giá, tư vấn, báo cáo; không sở hữu chương trình<\/td><\/tr><tr><td>Rủi ro cuộc kiểm toán<\/td><td>Nhận diện và kiểm soát ngay từ kế hoạch<\/td><\/tr><\/table><\/div>","terms":[["Organizational culture","Văn hóa tổ chức","Giá trị, niềm tin, chuẩn mực hành vi được chia sẻ, thể hiện qua cách làm việc và ra quyết định thực tế.","“Miễn đạt chỉ tiêu” là văn hóa ngầm ở khối bán hàng."],["Tone at the top","Thông điệp từ cấp cao nhất","Thông điệp, hành vi của HĐQT và ban điều hành về đạo đức, kiểm soát.","Tổng giám đốc công khai từ chối quà của nhà cung cấp."],["Tone in the middle","Thông điệp từ quản lý cấp giữa","Hành vi của quản lý cấp giữa, ảnh hưởng trực tiếp tới nhân viên.","Giám đốc vùng ngầm chấp nhận ghi nhận doanh thu sớm."],["Soft controls","Kiểm soát mềm","Yếu tố vô hình: chính trực, tin cậy, cởi mở, dám lên tiếng, phong cách lãnh đạo.","Nhân viên dám báo sai phạm của cấp trên."],["Code of conduct","Quy tắc ứng xử","Văn bản nêu chuẩn mực hành vi mong muốn.","Quy định về quà tặng, xung đột lợi ích."],["Ethics and compliance program","Chương trình đạo đức và tuân thủ","Quy tắc, đào tạo, kênh báo cáo, điều tra, kỷ luật, người phụ trách.","Chương trình do phòng Pháp chế – Tuân thủ quản lý."],["Whistleblower hotline","Đường dây nóng tố giác","Kênh báo cáo độc lập, ẩn danh, chống trả đũa.","Số điện thoại, email do bên thứ ba vận hành."],["Speak-up culture","Văn hóa dám lên tiếng","Nhân viên tin rằng nêu vấn đề là an toàn và được xử lý.","Tỷ lệ phản ánh được điều tra trong 30 ngày cao."],["Incentive","Cơ chế khuyến khích","Thưởng, phạt, chỉ tiêu; có thể tạo áp lực hành vi sai lệch.","Thưởng 100% theo doanh số."],["Groupthink","Tư duy theo số đông","Nhóm đồng thuận mà không phản biện, bỏ qua rủi ro.","“Chủ tịch đã muốn thì làm.”"],["Engagement risks","Rủi ro của cuộc kiểm toán","Rủi ro của hoạt động được xem xét và rủi ro cuộc kiểm toán không đạt mục tiêu.","Nhân viên không nói thật vì sợ trả đũa."]],"traps":"<div class=\"trap\"><b class=\"h\">Ít phản ánh ≠ tốt<\/b>Đáp án “ít phản ánh qua đường dây nóng chứng tỏ văn hóa tốt” thường sai.<\/div><div class=\"trap\"><b class=\"h\">Có văn bản ≠ có văn hóa<\/b>Quy tắc ứng xử đã ban hành chỉ là kiểm soát chỉ dẫn; văn hóa thể hiện qua <b>hành vi<\/b>.<\/div><div class=\"trap\"><b class=\"h\">KTNB không sở hữu chương trình đạo đức<\/b>KTNB <b>đánh giá và tư vấn<\/b>; ban điều hành (thường là Pháp chế – Tuân thủ) sở hữu.<\/div><div class=\"trap\"><b class=\"h\">Vấn đề ở cấp cao<\/b>Liên quan Tổng giám đốc → báo <b>HĐQT/UBKT<\/b>, không báo chính người đó.<\/div>","quiz":[{"q":"Văn hóa tổ chức là cốt lõi của thành phần COSO nào?","o":["Hoạt động kiểm soát","Thông tin và truyền thông","Môi trường kiểm soát","Giám sát"],"a":2,"e":"COSO nguyên tắc 1–5.","s":"COSO IC 2013"},{"q":"“Tone at the top” chỉ:","o":["Thông điệp và hành vi của HĐQT, ban điều hành về đạo đức, kiểm soát","Giọng điệu của báo cáo kiểm toán","Chỉ tiêu doanh số của năm","Quy định về trang phục"],"a":0,"e":"Khái niệm văn hóa.","s":"T1 D.4.a, C.2"},{"q":"Ví dụ nào là kiểm soát mềm?","o":["Đối chiếu ngân hàng","Hạn mức phê duyệt trên hệ thống","Mức độ nhân viên tin tưởng để báo sai phạm","Mật khẩu đăng nhập"],"a":2,"e":"Soft control.","s":"T1 C.2"},{"q":"Thưởng chỉ dựa trên doanh số có thể làm tăng:","o":["Mức độ phân chia nhiệm vụ","Áp lực ghi nhận doanh thu sai kỳ","Chất lượng kiểm kê","Tính độc lập của KTNB"],"a":1,"e":"Incentive pressure.","s":"T1 C.2.c"},{"q":"Theo GIAS 9.4, kế hoạch KTNB phải xem xét bao quát:","o":["Hiệu quả chiến dịch quảng cáo","Hiệu quả chương trình tuân thủ và đạo đức","Giá cổ phiếu","Lương của HĐQT"],"a":1,"e":"9.4.","s":"GIAS 9.4"},{"q":"Đường dây nóng nhận rất ít phản ánh. Kết luận phù hợp nhất là:","o":["Không cần quan tâm","Nên đóng đường dây nóng","Tổ chức gần như không có vi phạm","Cần đánh giá nhân viên có biết và tin tưởng kênh này không"],"a":3,"e":"Ít phản ánh có thể do kênh không hiệu quả.","s":"T1 C.3"},{"q":"Đặc điểm quan trọng nhất của một đường dây nóng hiệu quả là:","o":["Độc lập, cho phép ẩn danh và chống trả đũa","Chỉ nhận phản ánh có ký tên","Chỉ hoạt động giờ hành chính","Do Tổng giám đốc trực tiếp nghe"],"a":0,"e":"Thực hành tốt.","s":"T1 D.4.d"},{"q":"Hành vi sai lệch liên quan đến Tổng giám đốc. CAE nên báo:","o":["Trưởng phòng nhân sự","HĐQT hoặc UBKT","Báo chí","Chính Tổng giám đốc"],"a":1,"e":"Tuyến báo cáo trực tiếp HĐQT.","s":"GIAS 1.2, 7.1"},{"q":"Vai trò nào KHÔNG phù hợp với KTNB trong khung đạo đức tổ chức?","o":["Tư vấn xây dựng quy tắc ứng xử","Sở hữu và vận hành chương trình đạo đức","Báo hành vi trái đạo đức theo chính sách","Đánh giá hiệu quả chương trình đạo đức"],"a":1,"e":"KTNB không sở hữu chương trình.","s":"T1 C.3.b"},{"q":"Bằng chứng nào yếu nhất khi đánh giá văn hóa?","o":["Nhóm thảo luận","Chỉ đọc quy tắc ứng xử đã ban hành","Khảo sát ẩn danh","Phân tích dữ liệu đường dây nóng"],"a":1,"e":"Văn bản không cho thấy hành vi thực tế.","s":"T1 A.5.f"},{"q":"“Tư duy theo số đông” trong ra quyết định là rủi ro vì:","o":["Có quá nhiều thông tin","Ra quyết định quá chậm","Tốn chi phí họp","Thiếu phản biện, bỏ qua rủi ro"],"a":3,"e":"Groupthink.","s":"T1 C.2.c"},{"q":"Kiểm toán văn hóa tổ chức theo đề cương là:","o":["Một dịch vụ chỉ dành cho bên ngoài","Không thuộc phạm vi KTNB","Một loại dịch vụ đảm bảo","Một loại kiểm toán thuế"],"a":2,"e":"A.5.f.","s":"T1 A.5.f"},{"q":"KTV thấy hành vi trái kỳ vọng đạo đức của tổ chức. Theo 1.2, KTV phải:","o":["Bỏ qua nếu không vi phạm luật","Báo theo chính sách và thủ tục áp dụng","Chỉ ghi vào hồ sơ cá nhân","Tự xử lý kỷ luật"],"a":1,"e":"1.2.","s":"GIAS 1.2"},{"q":"Rủi ro “nhân viên không nói thật vì sợ trả đũa” trong cuộc kiểm toán văn hóa là:","o":["Rủi ro tài chính","Rủi ro tỷ giá","Rủi ro của cuộc kiểm toán","Rủi ro chiến lược"],"a":2,"e":"Engagement risk.","s":"T1 C.2.b"},{"q":"Biện pháp tốt nhất cho rủi ro trên là:","o":["Bỏ phỏng vấn","Mời trưởng khối dự mọi buổi phỏng vấn","Bảo đảm ẩn danh và bảo mật dữ liệu phỏng vấn","Công bố danh sách người được phỏng vấn"],"a":2,"e":"5.2, 13.2.","s":"GIAS 5.2"}],"next":"<ol><li><b>Đọc gốc (≈ 45 phút):<\/b> COSO nguyên tắc 1–5 (môi trường kiểm soát, T5); GIAS 1.2, 9.4; T10 phần quy tắc đạo đức của ứng viên.<\/li><li><b>Tự tóm tắt 1 trang:<\/b> 5 câu hỏi khảo sát văn hóa cho khối cửa hàng; 5 chỉ số dữ liệu để theo dõi văn hóa.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 3 câu 9–10; T3: 40 câu Phần III.<\/li><li><b>K12 (1 giờ):<\/b> Xử phạt vi phạm hóa đơn. Câu tự kiểm: Lập hóa đơn sai thời điểm bị xử phạt thế nào?<\/li><li>◆ <b>Mốc tuần 12:<\/b> đăng ký IAP trên CCMS, đóng phí, đặt lịch thi tuần 08/03.<\/li><\/ol><div class=\"note\"><b class=\"h\">Tuần 13 – Ôn Phần III<\/b>Làm 60 câu hỗn hợp Phần I–III. Mốc 1: điểm tổng hợp < 65% thì cân nhắc mua Gleim.<\/div><div class=\"note\"><b class=\"h\">Bài sau – Bài 12 (C12)<\/b>Tam giác gian lận và cây phân loại gian lận – mở đầu Phần IV.<\/div>","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2) · COSO – Internal Control – Integrated Framework (2013) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), A.5, C.2, C.3 · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p>"},"lessons/L12":{"code":"C12","id":"L12","order":12,"week":14,"title":"Bài 12. Tam giác gian lận và cây phân loại gian lận","short":"Tam giác gian lận, cây phân loại gian lận","eyebrow":"IAP (CIA Part 1) · Tuần 14 · Chủ đề C12 · Phần IV – Rủi ro gian lận (15%)","lead":"Mở đầu Phần IV với 6 tình huống tại quầy thu ngân, khối mua hàng, kế toán và nhân sự của An Phát. Bài bám <b>tam giác gian lận<\/b>, <b>cây phân loại gian lận nghề nghiệp của ACFE<\/b> và GIAS 13.2.","pills":["⏱ ~96 phút: 6 tình huống · 13 thẻ thuật ngữ · 15 trắc nghiệm","📄 ACFE Fraud Tree, Report to the Nations (T8); GIAS 9.4, 13.2","🎯 Đề cương D.1, D.2"],"goals":"<ol><li>Giải thích <b>tam giác gian lận<\/b>: áp lực, cơ hội, hợp lý hóa.<\/li><li>Phân loại sơ đồ theo <b>3 nhánh<\/b>: tham nhũng, biển thủ tài sản, gian lận báo cáo tài chính.<\/li><li>Phân biệt <b>skimming<\/b>, <b>cash larceny<\/b>, chi tiền gian lận.<\/li><li>Nhận diện quy trình có <b>rủi ro gian lận cao<\/b> trong bán lẻ.<\/li><li>Biết cách <b>xem xét rủi ro gian lận khi lập kế hoạch<\/b> một cuộc kiểm toán.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Ba cạnh của tam giác","std":"Đề cương D.1.a","scene":"<p>Chị Hoa, thu ngân 6 năm, đang nợ khoản vay lớn để chữa bệnh cho mẹ. Chị biết không ai rà soát giao dịch <b>hủy (void)<\/b> sau khi khách đã trả tiền mặt. Chị nghĩ: <i>“Công ty lời nhiều, lương mình thấp, lấy một ít rồi trả sau.”<\/i><\/p>","q":"Ghép đúng các yếu tố của tam giác gian lận, và yếu tố nào tổ chức kiểm soát được nhiều nhất?","opts":[["Nợ vay = cơ hội · không rà soát = áp lực · “lấy rồi trả sau” = hợp lý hóa; kiểm soát được nhiều nhất là áp lực",false,"Đảo áp lực và cơ hội."],["Nợ vay = hợp lý hóa · không rà soát = cơ hội · “lấy rồi trả sau” = áp lực; kiểm soát được nhiều nhất là hợp lý hóa",false,"Sai bản chất từng yếu tố."],["Nợ vay = áp lực · không rà soát hủy giao dịch = cơ hội · “lấy rồi trả sau” = hợp lý hóa; tổ chức kiểm soát được nhiều nhất là cơ hội",true,"Đúng mô hình Cressey."],["Cả ba đều là cơ hội; tổ chức kiểm soát được cả ba như nhau",false,"Ba yếu tố khác nhau; cơ hội chịu tác động mạnh nhất của kiểm soát nội bộ."]],"gias":"<div class=\"tbl\"><table><tr><th>Yếu tố<\/th><th>Nghĩa<\/th><th>Dấu hiệu<\/th><th>Tổ chức tác động<\/th><\/tr><tr><td><b>Áp lực, động cơ<\/b> (pressure/motivation)<\/td><td>Nhu cầu tài chính, áp lực chỉ tiêu, lối sống<\/td><td>Nợ nần, chi tiêu vượt thu nhập<\/td><td>Hạn chế: hỗ trợ nhân viên, chỉ tiêu hợp lý<\/td><\/tr><tr><td><b>Cơ hội<\/b> (opportunity)<\/td><td>Kiểm soát yếu, có thể làm và che giấu<\/td><td>Không phân chia nhiệm vụ, không rà soát<\/td><td><b>Mạnh nhất<\/b>: kiểm soát nội bộ<\/td><\/tr><tr><td><b>Hợp lý hóa<\/b> (rationalization)<\/td><td>Tự biện minh cho hành vi<\/td><td>“Mượn rồi trả”, “công ty nợ mình”<\/td><td>Hạn chế: văn hóa, tone at the top<\/td><\/tr><\/table><\/div><p class=\"en\">Mô hình của Donald Cressey. “Kim cương gian lận” bổ sung yếu tố <b>năng lực<\/b> (capability) của người thực hiện.<\/p>","take":"<span class=\"mnemo\">“Cần – Có thể – Tự cho là được”<\/span>. Kiểm soát nội bộ đánh vào <b>cơ hội<\/b>."},{"title":"Bán hàng không qua máy tính tiền","std":"Đề cương D.1.c · ACFE Fraud Tree","scene":"<p>Camera cho thấy một thu ngân <b>nhận tiền mặt của khách nhưng không quét mã<\/b> sản phẩm vào POS, rồi bỏ tiền vào túi riêng. Doanh thu không bao giờ được ghi nhận.<\/p>","q":"Đây là loại gian lận nào theo cây phân loại gian lận?","opts":[["Biển thủ tài sản → tiền → <b>cash larceny<\/b>",false,"Cash larceny là lấy tiền <b>sau khi<\/b> đã ghi nhận."],["Gian lận báo cáo tài chính",false,"Mục đích là chiếm tiền, không phải làm đẹp báo cáo."],["Biển thủ tài sản → tiền → trộm tiền thu → <b>skimming<\/b> (lấy tiền trước khi ghi sổ)",true,"Skimming: tiền bị lấy trước khi được ghi nhận."],["Tham nhũng → hối lộ",false,"Không có bên thứ ba đưa lợi ích."]],"gias":"<p><b>Cây phân loại gian lận nghề nghiệp<\/b> (ACFE) có 3 nhánh:<\/p><div class=\"tbl\"><table><tr><th>Nhánh<\/th><th>Nhóm chính<\/th><th>Ví dụ bán lẻ<\/th><\/tr><tr><td><b>Tham nhũng<\/b> (corruption)<\/td><td>Xung đột lợi ích · Hối lộ (lại quả, thông thầu) · Quà tặng bất hợp pháp · Tống tiền<\/td><td>Nhân viên mua hàng nhận lại quả từ nhà cung cấp<\/td><\/tr><tr><td><b>Biển thủ tài sản<\/b> (asset misappropriation)<\/td><td>Tiền: trộm tiền tồn quỹ, trộm tiền thu (skimming, cash larceny), chi tiền gian lận (hóa đơn khống, lương khống, hoàn ứng khống, giả mạo séc, hoàn tiền giả tại quầy) · Hàng tồn kho và tài sản khác: sử dụng sai, trộm<\/td><td>Skimming tại quầy, hoàn trả hàng giả, lấy hàng trong kho<\/td><\/tr><tr><td><b>Gian lận báo cáo tài chính<\/b> (financial statement fraud)<\/td><td>Khai khống hoặc khai thiếu: sai kỳ, doanh thu khống, giấu nợ phải trả, chi phí, thuyết minh sai, định giá tài sản sai<\/td><td>Ghi nhận doanh thu khống cuối năm<\/td><\/tr><\/table><\/div><p class=\"en\">Theo báo cáo của ACFE, biển thủ tài sản phổ biến nhất nhưng thiệt hại trung vị thấp nhất; gian lận báo cáo tài chính ít gặp nhất nhưng thiệt hại trung vị cao nhất.<\/p>","take":"<b>Skimming = lấy trước khi ghi sổ<\/b> · <b>Cash larceny = lấy sau khi ghi sổ<\/b>."},{"title":"Lại quả từ nhà cung cấp","std":"ACFE Fraud Tree – Corruption","scene":"<p>Trưởng nhóm mua hàng ngành hàng gia dụng luôn chọn một nhà cung cấp có giá cao hơn thị trường 8–12%. Điều tra cho thấy nhà cung cấp chuyển <b>3% giá trị đơn hàng<\/b> vào tài khoản của em vợ ông.<\/p>","q":"Đây là sơ đồ gian lận nào?","opts":[["Tham nhũng → hối lộ → lại quả (kickback)",true,"Bên ngoài trả lợi ích để được chọn."],["Không phải gian lận vì giá vẫn trong phạm vi chấp nhận",false,"Nhận tiền để chọn nhà cung cấp là hối lộ."],["Biển thủ tài sản → hóa đơn khống",false,"Hàng hóa có thật, chỉ là giá cao và có lại quả."],["Gian lận báo cáo tài chính",false,"Không nhằm làm sai báo cáo."]],"gias":"<p><b>Tham nhũng<\/b>: nhân viên dùng ảnh hưởng của mình trong giao dịch kinh doanh để có lợi ích cá nhân, trái với nghĩa vụ với tổ chức.<\/p><ul><li><b>Lại quả<\/b> (kickback): nhà cung cấp trả một phần giá trị hợp đồng.<\/li><li><b>Thông thầu<\/b> (bid rigging): sắp xếp kết quả đấu thầu.<\/li><li><b>Xung đột lợi ích<\/b>: có lợi ích không công bố với nhà cung cấp, khách hàng.<\/li><\/ul><p>Dấu hiệu: giá cao hơn thị trường, một nhà cung cấp được ưu tiên bất thường, hồ sơ chọn thầu sơ sài, nhân viên có lối sống vượt thu nhập.<\/p>","take":"Có <b>bên thứ ba trả lợi ích<\/b> để được ưu ái → <b>tham nhũng<\/b>."},{"title":"Chiết khấu cuối năm “để sang năm”","std":"ACFE Fraud Tree – Financial statement fraud","scene":"<p>Để đạt lợi nhuận kế hoạch trước khi phát hành trái phiếu, Giám đốc tài chính chỉ đạo <b>không ghi nhận 6 tỷ đồng chiết khấu<\/b> phải trả cho chuỗi đối tác trong tháng 12, đồng thời ghi nhận doanh thu cho hàng giao ngày 3/1 năm sau.<\/p>","q":"Loại gian lận và động cơ chính là:","opts":[["Chỉ là sai sót kế toán",false,"Có chỉ đạo cố ý → gian lận."],["Gian lận báo cáo tài chính (giấu chi phí, sai kỳ doanh thu); động cơ là áp lực đạt kết quả trước khi huy động vốn",true,"Làm đẹp báo cáo, không chiếm đoạt trực tiếp tài sản."],["Tham nhũng vì có đối tác bên ngoài",false,"Đối tác không trả lợi ích cho ai."],["Biển thủ tài sản vì làm thất thoát tiền",false,"Không có tài sản bị chiếm đoạt."]],"gias":"<p><b>Gian lận báo cáo tài chính<\/b>: cố ý làm sai, bỏ sót số liệu hoặc thuyết minh để đánh lừa người sử dụng báo cáo.<\/p><ul><li><b>Sai kỳ<\/b> (timing differences): ghi doanh thu sớm, ghi chi phí muộn.<\/li><li><b>Doanh thu khống<\/b>.<\/li><li><b>Giấu nợ phải trả, chi phí<\/b>.<\/li><li><b>Thuyết minh sai<\/b>.<\/li><li><b>Định giá tài sản sai<\/b>: không lập dự phòng hàng tồn kho chậm luân chuyển.<\/li><\/ul><p>Người thực hiện thường là <b>quản lý cấp cao<\/b>, qua <b>vượt quyền kiểm soát<\/b>.<\/p>","take":"Gian lận BCTC thường do <b>cấp cao<\/b>, động cơ <b>áp lực kết quả<\/b>."},{"title":"Nhân viên ma trong bảng lương","std":"ACFE Fraud Tree – Payroll","scene":"<p>Khi đối chiếu bảng lương với dữ liệu chấm công, KTNB thấy 7 nhân viên của kho Đồng Nai <b>nhận lương đều đặn<\/b> nhưng không có dữ liệu chấm công, không có hồ sơ bảo hiểm, cùng một số tài khoản ngân hàng.<\/p>","q":"Đây là sơ đồ gì và kiểm soát nào ngăn được tốt nhất?","opts":[["Gian lận báo cáo tài chính; kiểm soát: kiểm toán độc lập",false,"Mục đích là chiếm tiền lương."],["Biển thủ tài sản → chi tiền gian lận → lương khống (nhân viên ma); kiểm soát: tách người tạo hồ sơ nhân sự với người duyệt lương, đối chiếu định kỳ bảng lương với chấm công, kiểm tra trùng tài khoản",true,"Đúng nhánh và kiểm soát."],["Tham nhũng → xung đột lợi ích; kiểm soát: ký cam kết",false,"Không có bên thứ ba trả lợi ích."],["Sai sót nhập liệu; kiểm soát: đào tạo nhân viên nhân sự",false,"Có dấu hiệu cố ý: cùng tài khoản, không chấm công."]],"gias":"<p><b>Sơ đồ chi tiền gian lận<\/b> thường gặp:<\/p><div class=\"tbl\"><table><tr><th>Sơ đồ<\/th><th>Cách làm<\/th><th>Phát hiện bằng dữ liệu<\/th><\/tr><tr><td>Hóa đơn khống, công ty vỏ bọc<\/td><td>Lập nhà cung cấp giả để thanh toán<\/td><td>Nhà cung cấp trùng địa chỉ, tài khoản với nhân viên<\/td><\/tr><tr><td>Lương khống<\/td><td>Nhân viên ma, khai khống giờ làm<\/td><td>Không chấm công, trùng tài khoản<\/td><\/tr><tr><td>Hoàn ứng khống<\/td><td>Chứng từ chi phí giả, kê khai nhiều lần<\/td><td>Hóa đơn trùng, số tròn, cuối tuần<\/td><\/tr><tr><td>Hoàn tiền giả tại quầy<\/td><td>Ghi hoàn trả hàng không có khách<\/td><td>Tỷ lệ hoàn trả cao theo thu ngân, theo ca<\/td><\/tr><\/table><\/div>","take":"Dữ liệu tốt nhất để tìm gian lận chi tiền: <b>trùng lặp<\/b> (địa chỉ, tài khoản, mã số thuế)."},{"title":"Lập kế hoạch kiểm toán mua hàng","std":"GIAS 13.2 · Đề cương D.2","scene":"<p>KTNB lập kế hoạch kiểm toán quy trình <b>mua hàng<\/b> (chiếm 70% chi phí). Một KTV nói: <i>“Không có tố giác nên không cần quan tâm gian lận, chỉ kiểm tra tuân thủ quy trình.”<\/i><\/p>","q":"Theo GIAS và đề cương, KTNB nên làm gì?","opts":[["Giao toàn bộ việc tìm gian lận cho kiểm toán độc lập",false,"KTNB vẫn phải xem xét rủi ro gian lận."],["Xem xét riêng rủi ro gian lận khi lập kế hoạch: thảo luận nhóm về các sơ đồ có thể xảy ra (lại quả, nhà cung cấp giả, chia nhỏ đơn hàng), xác định dấu hiệu và thủ tục kiểm tra phù hợp",true,"13.2: phải xem xét rủi ro gian lận cụ thể."],["Chỉ xem xét gian lận khi có tố giác",false,"13.2 yêu cầu xem xét trong mọi cuộc kiểm toán."],["Mở điều tra gian lận ngay từ đầu",false,"Lập kế hoạch có xem xét gian lận khác với điều tra."]],"gias":"<p>GIAS 13.2: khi xác định rủi ro cần xem xét, KTV phải <b>xem xét rủi ro cụ thể liên quan đến gian lận<\/b>. GIAS 9.4: kế hoạch năm phải xem xét bao quát <b>rủi ro gian lận<\/b>.<\/p><p>Quy trình có rủi ro gian lận cao trong bán lẻ (đề cương D.2.b): <b>tiền mặt tại quầy, mua hàng, thanh toán, lương, hàng tồn kho, khuyến mãi, hoàn trả, ghi nhận doanh thu<\/b>.<\/p><p>Cách làm: thảo luận nhóm (brainstorm) “nếu tôi muốn gian lận ở đây thì làm thế nào và che giấu ra sao”, rồi gắn mỗi sơ đồ với dấu hiệu và thủ tục.<\/p>","take":"Mọi cuộc kiểm toán đều có <b>dòng rủi ro gian lận<\/b>, không cần chờ tố giác."}],"summary":"<div class=\"flow\"><span>Áp lực<\/span><em>+<\/em><span>Cơ hội<\/span><em>+<\/em><span>Hợp lý hóa<\/span><em>→<\/em><span>Gian lận<\/span><\/div><div class=\"tbl\"><table><tr><th>Nhánh<\/th><th>Ai thường làm<\/th><th>Phổ biến<\/th><th>Thiệt hại trung vị<\/th><\/tr><tr><td>Biển thủ tài sản<\/td><td>Nhân viên<\/td><td>Cao nhất<\/td><td>Thấp nhất<\/td><\/tr><tr><td>Tham nhũng<\/td><td>Nhân viên mua hàng, quản lý<\/td><td>Trung bình<\/td><td>Trung bình<\/td><\/tr><tr><td>Gian lận BCTC<\/td><td>Quản lý cấp cao<\/td><td>Thấp nhất<\/td><td>Cao nhất<\/td><\/tr><\/table><\/div><p class=\"en\">Xếp hạng tương đối theo báo cáo Report to the Nations của ACFE.<\/p>","terms":[["Fraud","Gian lận","Hành vi cố ý lừa dối, che giấu, chiếm đoạt tài sản hoặc thông tin, giả mạo, lạm dụng lòng tin để có lợi ích bất chính.","Thu ngân bỏ túi tiền bán hàng không quét mã."],["Fraud triangle","Tam giác gian lận","Áp lực, cơ hội, hợp lý hóa (Cressey).","Nợ nần + không rà soát hủy + “mượn rồi trả”."],["Pressure / motivation","Áp lực, động cơ","Nhu cầu hoặc sức ép thúc đẩy gian lận.","Áp lực đạt lợi nhuận trước khi phát hành trái phiếu."],["Opportunity","Cơ hội","Kiểm soát yếu cho phép thực hiện và che giấu.","Một người vừa tạo vừa duyệt nhà cung cấp."],["Rationalization","Hợp lý hóa","Tự biện minh cho hành vi sai.","“Công ty trả lương thấp nên mình lấy bù.”"],["Asset misappropriation","Biển thủ tài sản","Chiếm đoạt hoặc sử dụng sai tài sản của tổ chức.","Lấy hàng trong kho, lương khống."],["Corruption","Tham nhũng","Lạm dụng ảnh hưởng trong giao dịch để có lợi ích cá nhân.","Nhận 3% lại quả từ nhà cung cấp."],["Financial statement fraud","Gian lận báo cáo tài chính","Cố ý làm sai, bỏ sót số liệu, thuyết minh trên báo cáo tài chính.","Không ghi nhận chiết khấu phải trả cuối năm."],["Skimming","Lấy tiền trước khi ghi sổ","Chiếm tiền trước khi giao dịch được ghi nhận.","Bán không quét mã, bỏ túi tiền."],["Cash larceny","Trộm tiền sau khi ghi sổ","Chiếm tiền đã được ghi nhận trong hệ thống.","Lấy tiền trong két sau khi chốt ca."],["Kickback","Lại quả","Phần lợi ích nhà cung cấp trả cho người giúp họ được chọn.","Chuyển tiền vào tài khoản người thân của nhân viên mua hàng."],["Ghost employee","Nhân viên ma","Người không có thật hoặc đã nghỉ vẫn nhận lương.","7 tên trên bảng lương không có chấm công."],["Shell company","Công ty vỏ bọc","Doanh nghiệp không có hoạt động thật, dùng để xuất hóa đơn khống.","Nhà cung cấp mới cùng địa chỉ với nhân viên mua hàng."]],"traps":"<div class=\"trap\"><b class=\"h\">Skimming hay cash larceny?<\/b>Hỏi: tiền bị lấy <b>trước<\/b> hay <b>sau<\/b> khi ghi vào hệ thống? Trước = skimming.<\/div><div class=\"trap\"><b class=\"h\">Có bên ngoài chưa chắc là tham nhũng<\/b>Tham nhũng cần <b>lợi ích<\/b> trao đổi qua ảnh hưởng của nhân viên. Đối tác chỉ liên quan giao dịch mà không trả lợi ích → không phải tham nhũng.<\/div><div class=\"trap\"><b class=\"h\">Kiểm soát đánh vào cơ hội<\/b>Đáp án “giảm áp lực tài chính của nhân viên” ít khi là đáp án đúng cho câu hỏi về kiểm soát.<\/div><div class=\"trap\"><b class=\"h\">Gian lận BCTC không chiếm đoạt trực tiếp<\/b>Mục đích là <b>đánh lừa người đọc báo cáo<\/b>, không phải lấy tài sản.<\/div><div class=\"trap\"><b class=\"h\">Không chờ tố giác<\/b>GIAS 13.2: rủi ro gian lận được xem xét trong <b>mọi<\/b> cuộc kiểm toán.<\/div>","quiz":[{"q":"Ba yếu tố của tam giác gian lận là:","o":["Áp lực, năng lực, che giấu","Áp lực, cơ hội, hợp lý hóa","Động cơ, phương tiện, thời điểm","Cơ hội, phát hiện, xử lý"],"a":1,"e":"Cressey.","s":"T1 D.1.a"},{"q":"Yếu tố nào của tam giác gian lận tổ chức tác động được nhiều nhất bằng kiểm soát nội bộ?","o":["Cơ hội","Hợp lý hóa","Áp lực","Cả ba như nhau"],"a":0,"e":"Kiểm soát giảm cơ hội.","s":"T1 D.1.a"},{"q":"“Mình chỉ mượn tạm, tháng sau sẽ trả” là ví dụ của:","o":["Cơ hội","Năng lực","Hợp lý hóa","Áp lực"],"a":2,"e":"Rationalization.","s":"T1 D.1.a"},{"q":"Cây phân loại gian lận nghề nghiệp của ACFE gồm 3 nhánh:","o":["Tham nhũng, biển thủ tài sản, gian lận báo cáo tài chính","Gian lận nội bộ, bên ngoài, hỗn hợp","Trộm cắp, lừa đảo, giả mạo","Gian lận thuế, gian lận bảo hiểm, gian lận thẻ"],"a":0,"e":"ACFE Fraud Tree.","s":"ACFE"},{"q":"Theo báo cáo của ACFE, loại gian lận phổ biến nhất là:","o":["Gian lận thuế","Tham nhũng","Biển thủ tài sản","Gian lận báo cáo tài chính"],"a":2,"e":"Phổ biến nhất nhưng thiệt hại trung vị thấp nhất.","s":"ACFE Report to the Nations"},{"q":"Theo báo cáo của ACFE, loại gian lận có thiệt hại trung vị cao nhất là:","o":["Tham nhũng","Lương khống","Biển thủ tài sản","Gian lận báo cáo tài chính"],"a":3,"e":"Ít gặp nhất nhưng thiệt hại trung vị cao nhất.","s":"ACFE Report to the Nations"},{"q":"Thu ngân lấy tiền trong két sau khi giao dịch đã được ghi nhận vào POS là:","o":["Skimming","Kickback","Hoàn ứng khống","Cash larceny"],"a":3,"e":"Sau khi ghi sổ.","s":"ACFE Fraud Tree"},{"q":"Nhà cung cấp chia một phần giá trị hợp đồng cho nhân viên mua hàng là:","o":["Hóa đơn khống","Gian lận báo cáo tài chính","Lại quả (hối lộ)","Skimming"],"a":2,"e":"Corruption – bribery.","s":"ACFE Fraud Tree"},{"q":"Ghi nhận doanh thu cho hàng giao ngày 3/1 vào năm trước là:","o":["Biển thủ tài sản","Tham nhũng","Sai sót không trọng yếu","Gian lận báo cáo tài chính do sai kỳ"],"a":3,"e":"Timing differences.","s":"ACFE Fraud Tree"},{"q":"Thủ tục dữ liệu hiệu quả nhất để tìm nhà cung cấp giả là:","o":["Đối chiếu địa chỉ, tài khoản ngân hàng của nhà cung cấp với dữ liệu nhân viên","Đếm số trang hợp đồng","Xem báo cáo thường niên","Phỏng vấn nhà cung cấp lớn nhất"],"a":0,"e":"Kiểm tra trùng lặp.","s":"T1 D.5.d"},{"q":"Theo GIAS 13.2, rủi ro gian lận được xem xét:","o":["Chỉ trong cuộc kiểm toán tài chính","Chỉ khi HĐQT yêu cầu","Chỉ khi có tố giác","Trong mọi cuộc kiểm toán khi xác định rủi ro cần xem xét"],"a":3,"e":"13.2.","s":"GIAS 13.2"},{"q":"Gian lận báo cáo tài chính thường do ai thực hiện?","o":["Nhân viên thu ngân","Khách hàng","Quản lý cấp cao, qua vượt quyền kiểm soát","Bảo vệ"],"a":2,"e":"Management override.","s":"T1 D.1"},{"q":"Quy trình nào trong bán lẻ thường có rủi ro gian lận cao nhất về tiền mặt?","o":["Lập kế hoạch marketing","Đào tạo nhân viên mới","Thiết kế đồng phục","Thu ngân và hoàn trả hàng tại quầy"],"a":3,"e":"T1 D.2.b.","s":"T1 D.2.b"},{"q":"Mô hình “kim cương gian lận” bổ sung yếu tố:","o":["Quy mô tổ chức","Văn hóa","Năng lực của người thực hiện","Thời điểm"],"a":2,"e":"Capability.","s":"Fraud diamond"},{"q":"Nhân viên có cổ phần không công bố tại nhà cung cấp mà mình đề xuất chọn là:","o":["Lương khống","Skimming","Định giá tài sản sai","Xung đột lợi ích (tham nhũng)"],"a":3,"e":"Corruption – conflicts of interest.","s":"ACFE Fraud Tree"}],"next":"<ol><li><b>Đọc gốc (≈ 60 phút):<\/b> ACFE – Occupational Fraud: A Report to the Nations, mục Fraud Tree và các con số chính (T8).<\/li><li><b>Tự tóm tắt 1 trang:<\/b> vẽ cây gian lận 3 nhánh; mỗi nhánh 2 sơ đồ bạn từng gặp hoặc dễ xảy ra ở chuỗi bán lẻ.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 4 câu 1–3.<\/li><li><b>K14 (1 giờ):<\/b> Quy chế tài chính, phân định cấp độ phê duyệt 1–5. Câu tự kiểm: Chia nhỏ đơn hàng để né hạn mức phát hiện thế nào?<\/li><li><b>Sổ lỗi:<\/b> ghi câu sai và tình huống không đúng ngay lần đầu.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 13 (C13)<\/b>Quản lý rủi ro gian lận, kiểm soát phòng ngừa, phát hiện, vai trò KTNB trong điều tra.<\/div>","footer":"<p><b>Nguồn:<\/b> ACFE – Occupational Fraud and Abuse Classification System (Fraud Tree); ACFE – Occupational Fraud: A Report to the Nations · The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), D.1, D.2 · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p><p class=\"en\">Tài liệu T8 không có trong Project; bài chỉ dùng xếp hạng tương đối, không dùng số liệu cụ thể. Nên đối chiếu báo cáo ACFE mới nhất khi đọc gốc.<\/p>"},"lessons/L13":{"code":"C13","id":"L13","order":13,"week":15,"title":"Bài 13. Quản lý rủi ro gian lận và điều tra","short":"Quản lý rủi ro gian lận, điều tra","eyebrow":"IAP (CIA Part 1) · Tuần 15 · Chủ đề C13 · Phần IV – Rủi ro gian lận (15%)","lead":"Bài cuối của lộ trình: theo một vụ nhà cung cấp giả tại An Phát, từ dấu hiệu cảnh báo đến phỏng vấn và bằng chứng, qua 7 tình huống. Bài bám <b>Hướng dẫn quản lý rủi ro gian lận của COSO và ACFE<\/b> và đề cương D.3–D.5.","pills":["⏱ ~102 phút: 7 tình huống · 11 thẻ thuật ngữ · 15 trắc nghiệm","📄 COSO/ACFE Fraud Risk Management Guide (T9); ACFE (T8); GIAS 3.1, 13.2","🎯 Đề cương D.3, D.4, D.5"],"goals":"<ol><li>Đánh giá <b>chương trình quản lý rủi ro gian lận<\/b> theo 5 nguyên tắc.<\/li><li>Nhận diện <b>dấu hiệu cảnh báo<\/b> ở cấp tổ chức, quy trình, cá nhân; biết KTV phải báo gì, báo ai.<\/li><li>Nêu kiểm soát <b>phòng ngừa<\/b> (tone at the top, phân chia nhiệm vụ, hạn mức) và <b>phát hiện<\/b> (đường dây nóng, đối chiếu, rà soát).<\/li><li>Nắm <b>kỹ thuật phỏng vấn, điều tra<\/b>, thử nghiệm gian lận.<\/li><li>Xác định <b>vai trò KTNB<\/b> trong điều tra và cách phối hợp.<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán (UBKT), bộ phận KTNB 3 người do CAE phụ trách.<\/p>","cases":[{"title":"Chương trình quản lý rủi ro gian lận còn thiếu gì?","std":"Đề cương D.3.a · COSO/ACFE Fraud Risk Management Guide","scene":"<p>An Phát có quy tắc ứng xử, đường dây nóng và quy trình xử lý kỷ luật. Tuy nhiên, công ty <b>chưa từng đánh giá rủi ro gian lận<\/b> theo quy trình, kiểm soát được thiết kế rời rạc, và không ai đánh giá định kỳ chương trình có hiệu quả không.<\/p>","q":"Theo Hướng dẫn quản lý rủi ro gian lận của COSO và ACFE, những nguyên tắc nào đang yếu?","opts":[["Không thiếu gì vì đã có quy tắc ứng xử",false,"Quy tắc chỉ là một phần của nguyên tắc quản trị."],["Đánh giá rủi ro gian lận, hoạt động kiểm soát phòng ngừa và phát hiện gắn với rủi ro, và giám sát chương trình",true,"Có quản trị và kênh báo cáo, thiếu nguyên tắc 2, 3, 5."],["Chỉ thiếu đường dây nóng",false,"Đã có đường dây nóng."],["Chỉ thiếu điều tra",false,"Đã có quy trình xử lý; thiếu đánh giá, kiểm soát, giám sát."]],"gias":"<p><b>Hướng dẫn quản lý rủi ro gian lận<\/b> (COSO và ACFE) có 5 nguyên tắc, tương ứng 5 thành phần COSO:<\/p><div class=\"tbl\"><table><tr><th>#<\/th><th>Nguyên tắc<\/th><th>Nội dung<\/th><\/tr><tr><td>1<\/td><td>Quản trị rủi ro gian lận<\/td><td>Chương trình được HĐQT, QLCC cam kết; chính sách, vai trò rõ ràng<\/td><\/tr><tr><td>2<\/td><td>Đánh giá rủi ro gian lận<\/td><td>Định kỳ, toàn diện: sơ đồ có thể xảy ra, khả năng, ảnh hưởng, kiểm soát hiện có<\/td><\/tr><tr><td>3<\/td><td>Hoạt động kiểm soát phòng ngừa và phát hiện<\/td><td>Gắn với rủi ro đã đánh giá<\/td><\/tr><tr><td>4<\/td><td>Điều tra và hành động khắc phục<\/td><td>Kênh tiếp nhận thông tin, điều tra phối hợp, xử lý<\/td><\/tr><tr><td>5<\/td><td>Giám sát<\/td><td>Đánh giá liên tục, báo khiếm khuyết, cải tiến<\/td><\/tr><\/table><\/div><p>Đề cương D.3.a yêu cầu KTV <b>đánh giá<\/b> quy trình quản lý rủi ro gian lận của tổ chức theo các bước này.<\/p>","take":"<span class=\"mnemo\">“Quản trị – Đánh giá – Kiểm soát – Điều tra – Giám sát”<\/span>."},{"title":"Nhà cung cấp mới trùng địa chỉ nhân viên","std":"Đề cương D.3.b, D.3.c","scene":"<p>Khi kiểm toán thanh toán, KTV thấy một nhà cung cấp mới (thành lập 4 tháng, đã nhận 2,1 tỷ đồng) có <b>cùng địa chỉ<\/b> với một nhân viên mua hàng. Hóa đơn của họ có số tròn, thường được duyệt ngay dưới hạn mức.<\/p>","q":"KTV nên làm gì tiếp theo?","opts":[["Bỏ qua vì chưa có bằng chứng chắc chắn",false,"Dấu hiệu gian lận phải được báo theo phương pháp."],["Tự mở điều tra toàn diện, sao chép email của nhân viên",false,"Điều tra phải theo thẩm quyền, có phối hợp pháp chế."],["Gọi nhân viên mua hàng lên hỏi ngay để làm rõ",false,"Có thể làm lộ thông tin, nhân viên tiêu hủy bằng chứng."],["Ghi lại dấu hiệu, giữ bảo mật, báo CAE theo phương pháp đã ban hành; không đối chất với nhân viên; CAE quyết định bước tiếp theo theo Điều lệ và chính sách điều tra",true,"Đúng vai trò KTNB khi gặp dấu hiệu gian lận."]],"gias":"<p><b>Dấu hiệu cảnh báo<\/b> (red flags):<\/p><div class=\"tbl\"><table><tr><th>Cấp tổ chức<\/th><th>Cấp quy trình<\/th><th>Hành vi cá nhân<\/th><\/tr><tr><td>Áp lực kết quả lớn, tone at the top yếu<\/td><td>Nhà cung cấp mới nhận tiền lớn<\/td><td>Lối sống vượt thu nhập<\/td><\/tr><tr><td>Thay đổi nhân sự chủ chốt liên tục<\/td><td>Hóa đơn số tròn, ngay dưới hạn mức<\/td><td>Không nghỉ phép, không cho ai thay<\/td><\/tr><tr><td>Kiểm soát nội bộ bị bỏ qua thường xuyên<\/td><td>Điều chỉnh, hủy giao dịch nhiều cuối kỳ<\/td><td>Quan hệ thân thiết bất thường với nhà cung cấp<\/td><\/tr><\/table><\/div><p>Vai trò KTV khi phát hiện dấu hiệu (D.3.c): <b>ghi lại, báo cáo đúng kênh<\/b> (CAE, theo chính sách), <b>bảo mật<\/b>, không cáo buộc, không tự điều tra ngoài thẩm quyền.<\/p>","take":"Thấy dấu hiệu: <b>Ghi lại → Báo CAE → Giữ kín<\/b>. Không đối chất."},{"title":"Thứ tự phỏng vấn trong điều tra","std":"Đề cương D.5.b","scene":"<p>Sau khi có quyết định điều tra vụ nhà cung cấp giả, nhóm điều tra (KTNB phối hợp pháp chế) lên danh sách phỏng vấn: kế toán thanh toán, trưởng phòng mua hàng, nhân viên kho nhận hàng, và nhân viên mua hàng bị nghi ngờ.<\/p>","q":"Thứ tự phỏng vấn hợp lý là:","opts":[["Phỏng vấn tất cả cùng lúc trong một phòng",false,"Làm mất tính độc lập của lời khai."],["Phỏng vấn người bị nghi ngờ đầu tiên để có lời khai sớm",false,"Nghi phạm biết bị điều tra, có thể tiêu hủy bằng chứng, thông đồng."],["Bắt đầu từ người trung lập, ít liên quan (kế toán thanh toán, nhân viên kho), rồi người có thể xác nhận thông tin (trưởng phòng mua hàng), cuối cùng là người bị nghi ngờ",true,"Từ ngoài vào trong, nghi phạm sau cùng."],["Không cần phỏng vấn, chỉ cần dữ liệu",false,"Phỏng vấn là kỹ thuật điều tra quan trọng."]],"gias":"<p><b>Kỹ thuật phỏng vấn<\/b> (D.5.b):<\/p><ul><li>Thứ tự: <b>nhân chứng trung lập → người xác nhận → người có thể đồng phạm → người bị nghi ngờ<\/b>.<\/li><li>Chuẩn bị kỹ; có <b>2 người<\/b> tham gia (một người hỏi, một người ghi).<\/li><li>Bắt đầu bằng câu hỏi <b>mở, không đe dọa<\/b>; chỉ dùng phỏng vấn <b>tìm lời thừa nhận<\/b> (admission-seeking) khi đã có cơ sở hợp lý.<\/li><li>Không hứa hẹn, không đe dọa; ghi biên bản ngay.<\/li><li>Quan sát ngôn ngữ cơ thể nhưng không kết luận chỉ dựa vào đó.<\/li><\/ul>","take":"Phỏng vấn <b>từ ngoài vào trong<\/b>; người bị nghi ngờ <b>sau cùng<\/b>."},{"title":"Bằng chứng trên máy tính của nghi phạm","std":"Đề cương D.5.c, D.5.d","scene":"<p>Nhóm điều tra cần dữ liệu trên laptop của nhân viên bị nghi ngờ. Một KTV đề nghị <i>“mở máy, xem nhanh thư mục, chép file cần thiết ra USB”<\/i>.<\/p>","q":"Cách làm đúng là:","opts":[["Không cần quan tâm cách thu thập vì đây là điều tra nội bộ",false,"Bằng chứng có thể phải dùng trong xử lý kỷ luật hoặc tố tụng."],["Mở máy và chép file như đề nghị",false,"Làm thay đổi dữ liệu gốc, mất giá trị bằng chứng."],["Yêu cầu nhân viên tự gửi các file liên quan",false,"Nghi phạm có thể xóa, sửa dữ liệu."],["Theo thẩm quyền và chính sách, phối hợp pháp chế và CNTT, tạo bản sao pháp y của ổ đĩa, ghi chuỗi bàn giao bằng chứng, phân tích trên bản sao",true,"Giữ nguyên tính toàn vẹn của bằng chứng."]],"gias":"<p><b>Kỹ thuật điều tra<\/b> (D.5.c) và <b>thử nghiệm gian lận<\/b> (D.5.d):<\/p><div class=\"tbl\"><table><tr><th>Kỹ thuật<\/th><th>Ví dụ<\/th><\/tr><tr><td>Phân tích dữ liệu<\/td><td>Trùng thanh toán, trùng tài khoản, Luật Benford, giao dịch ngoài giờ, chia nhỏ đơn hàng<\/td><\/tr><tr><td>Kiểm tra tài liệu<\/td><td>Hóa đơn, hợp đồng, chữ ký, dấu hiệu sửa chữa<\/td><\/tr><tr><td>Pháp y số<\/td><td>Bản sao ổ đĩa, email, nhật ký hệ thống<\/td><\/tr><tr><td>Hồ sơ công khai<\/td><td>Đăng ký kinh doanh, người đại diện, địa chỉ<\/td><\/tr><tr><td>Quan sát, kiểm kê đột xuất<\/td><td>Đếm quỹ, kiểm kê kho không báo trước<\/td><\/tr><tr><td>Phỏng vấn<\/td><td>Theo thứ tự, có biên bản<\/td><\/tr><\/table><\/div><p><b>Chuỗi bàn giao<\/b> (chain of custody): ghi ai thu, khi nào, ở đâu, giao cho ai, để chứng minh bằng chứng không bị thay đổi.<\/p>","take":"Bằng chứng số: <b>bản sao pháp y + chuỗi bàn giao<\/b>, không “xem nhanh”."},{"title":"Chia nhỏ đơn hàng để né hạn mức","std":"Đề cương D.4.b, D.4.c","scene":"<p>Quy chế tài chính: đơn hàng dưới 100 triệu đồng do trưởng phòng duyệt, từ 100 triệu trở lên do Giám đốc khối duyệt. Phân tích dữ liệu cho thấy một nhà cung cấp có <b>27 đơn trong 2 tháng<\/b>, mỗi đơn 92–99 triệu đồng, nhiều đơn cùng ngày.<\/p>","q":"Đây là dấu hiệu gì và kiểm soát nào phù hợp?","opts":[["Chỉ cần nhắc nhở trưởng phòng",false,"Không xử lý được nguyên nhân hệ thống."],["Bình thường, vì mỗi đơn đều đúng thẩm quyền",false,"Mỗi đơn đúng, nhưng tổng thể có dấu hiệu né hạn mức."],["Tăng hạn mức của trưởng phòng lên 200 triệu",false,"Làm yếu thêm kiểm soát."],["Chia nhỏ đơn hàng để né cấp phê duyệt; kiểm soát: hệ thống cộng dồn giá trị theo nhà cung cấp, kỳ để áp hạn mức, kèm báo cáo ngoại lệ các đơn sát ngưỡng",true,"Hạn mức chỉ hiệu quả khi không bị chia nhỏ."]],"gias":"<p><b>Kiểm soát phòng ngừa gian lận<\/b> (D.4):<\/p><ul><li><b>Tone at the top<\/b> (D.4.a): lãnh đạo làm gương, xử lý nhất quán → giảm hợp lý hóa.<\/li><li><b>Phân chia nhiệm vụ<\/b> (D.4.b): tách tạo nhà cung cấp, đặt hàng, nhận hàng, thanh toán.<\/li><li><b>Hạn mức phê duyệt<\/b> (D.4.c): ma trận thẩm quyền; cộng dồn để chống chia nhỏ.<\/li><li>Kiểm tra lý lịch khi tuyển dụng, chọn nhà cung cấp.<\/li><\/ul>","take":"Hạn mức + <b>cộng dồn<\/b> + báo cáo đơn <b>sát ngưỡng<\/b>."},{"title":"Chọn kiểm soát phát hiện gian lận","std":"Đề cương D.4.d","scene":"<p>Ban điều hành muốn tăng khả năng <b>phát hiện<\/b> gian lận ở 120 cửa hàng với ngân sách hạn chế. Có 4 đề xuất: (1) đường dây nóng do bên thứ ba vận hành; (2) đối chiếu tiền mặt, ngân hàng hằng ngày tự động; (3) kiểm kê quỹ đột xuất của quản lý vùng; (4) treo thêm khẩu hiệu “Trung thực là vàng”.<\/p>","q":"Đề xuất nào KHÔNG phải kiểm soát phát hiện?","opts":[["(1) đường dây nóng",false,"Theo ACFE, tố giác là cách phát hiện gian lận phổ biến nhất."],["(3) kiểm kê đột xuất",false,"Kiểm tra đột xuất vừa phát hiện vừa răn đe."],["(4) treo khẩu hiệu: chỉ là kiểm soát chỉ dẫn, không phát hiện được gian lận",true,"(1), (2), (3) đều là kiểm soát phát hiện phổ biến."],["(2) đối chiếu tự động",false,"Đối chiếu là kiểm soát phát hiện."]],"gias":"<p><b>Kiểm soát phát hiện gian lận<\/b> (D.4.d):<\/p><ul><li><b>Đường dây nóng<\/b>: theo ACFE, tố giác là phương thức phát hiện gian lận <b>phổ biến nhất<\/b>.<\/li><li><b>Đối chiếu<\/b>: tiền, ngân hàng, công nợ, kho.<\/li><li><b>Rà soát của cấp trên<\/b>: báo cáo ngoại lệ, hủy, hoàn trả.<\/li><li><b>Kiểm tra đột xuất<\/b>, <b>nghỉ phép bắt buộc<\/b>, <b>luân chuyển công việc<\/b>: người gian lận khó duy trì che giấu khi vắng mặt.<\/li><li><b>Phân tích dữ liệu liên tục<\/b>.<\/li><\/ul>","take":"Tố giác phát hiện nhiều nhất → <b>đầu tư cho đường dây nóng<\/b>."},{"title":"KTNB có được điều tra gian lận không?","std":"Đề cương D.5.a, D.5.e","scene":"<p>HĐQT yêu cầu KTNB điều tra vụ nhà cung cấp giả. Trưởng nhóm lo: <i>“Mình không phải công an, có được làm không?”<\/i> Phòng Pháp chế cũng muốn tham gia.<\/p>","q":"Nhận định nào đúng về vai trò KTNB?","opts":[["KTNB chịu trách nhiệm chính về phòng ngừa gian lận",false,"Phòng ngừa là trách nhiệm của ban điều hành."],["Tùy Điều lệ và chính sách: KTNB có thể chủ trì, hỗ trợ hoặc không tham gia điều tra; khi tham gia phải đủ năng lực, phối hợp pháp chế, nhân sự, và dùng kết quả điều tra trước đây để hoàn thiện đánh giá rủi ro",true,"D.5.a, D.5.e."],["KTNB không bao giờ được điều tra gian lận",false,"GIAS nêu dịch vụ điều tra (forensic) là ví dụ tư vấn."],["KTNB tự điều tra, không cần báo pháp chế để giữ độc lập",false,"Điều tra cần phối hợp pháp chế để bảo đảm quyền, nghĩa vụ pháp lý."]],"gias":"<p>Vai trò KTNB liên quan đến điều tra gian lận (D.5.a):<\/p><ul><li>Được quy định trong <b>Điều lệ KTNB<\/b> và chính sách điều tra: <b>chủ trì, hỗ trợ<\/b>, hoặc <b>không tham gia<\/b>.<\/li><li>Có <b>năng lực<\/b> phù hợp (3.1), hoặc thuê chuyên gia điều tra.<\/li><li>Phối hợp <b>pháp chế<\/b>, nhân sự, CNTT; cân nhắc báo cơ quan chức năng theo luật.<\/li><\/ul><p>Phối hợp với người điều tra (D.5.e): xem đánh giá rủi ro của họ, các vụ điều tra trước, xu hướng, phản ánh qua đường dây nóng → đưa vào kế hoạch KTNB.<\/p><p>Trách nhiệm chính về <b>phòng ngừa, phát hiện<\/b> gian lận thuộc <b>ban điều hành<\/b>; KTNB đánh giá rủi ro gian lận và kiểm soát.<\/p>","take":"Vai trò điều tra do <b>Điều lệ<\/b> quy định; luôn <b>phối hợp pháp chế<\/b>."}],"summary":"<div class=\"tbl\"><table><tr><th>Chủ đề<\/th><th>Điểm cần nhớ<\/th><\/tr><tr><td>Chương trình<\/td><td>Quản trị · Đánh giá · Kiểm soát · Điều tra, khắc phục · Giám sát<\/td><\/tr><tr><td>Dấu hiệu<\/td><td>Ghi lại → báo CAE → bảo mật; không đối chất<\/td><\/tr><tr><td>Phòng ngừa<\/td><td>Tone at the top · Phân chia nhiệm vụ · Hạn mức, cộng dồn · Kiểm tra lý lịch<\/td><\/tr><tr><td>Phát hiện<\/td><td>Đường dây nóng (phổ biến nhất) · Đối chiếu · Rà soát cấp trên · Đột xuất · Nghỉ phép bắt buộc · Phân tích dữ liệu<\/td><\/tr><tr><td>Phỏng vấn<\/td><td>Trung lập → xác nhận → đồng phạm → nghi phạm; 2 người; câu hỏi mở<\/td><\/tr><tr><td>Bằng chứng<\/td><td>Bản sao pháp y · Chuỗi bàn giao · Tài liệu · Hồ sơ công khai<\/td><\/tr><tr><td>Vai trò KTNB<\/td><td>Theo Điều lệ: chủ trì, hỗ trợ, không tham gia; phối hợp pháp chế; ban điều hành chịu trách nhiệm chính về phòng ngừa<\/td><\/tr><\/table><\/div>","terms":[["Fraud risk governance","Quản trị rủi ro gian lận","Cam kết của HĐQT, QLCC; chính sách, vai trò rõ ràng cho chương trình.","Chính sách chống gian lận do HĐQT phê duyệt."],["Fraud risk assessment","Đánh giá rủi ro gian lận","Nhận diện sơ đồ có thể xảy ra, khả năng, ảnh hưởng, kiểm soát hiện có.","Hội thảo hằng năm với từng khối."],["Red flag","Dấu hiệu cảnh báo","Dấu hiệu cho thấy có thể có gian lận; chưa phải bằng chứng.","Nhà cung cấp mới trùng địa chỉ nhân viên."],["Chain of custody","Chuỗi bàn giao bằng chứng","Ghi nhận ai thu, giữ, chuyển bằng chứng để chứng minh không bị thay đổi.","Biên bản niêm phong laptop, giao cho pháp chế."],["Forensic image","Bản sao pháp y","Bản sao nguyên trạng của ổ đĩa để phân tích mà không đổi dữ liệu gốc.","CNTT tạo bản sao ổ cứng trước khi phân tích."],["Admission-seeking interview","Phỏng vấn tìm lời thừa nhận","Phỏng vấn người bị nghi ngờ khi đã có cơ sở hợp lý, thường sau cùng.","Buổi phỏng vấn cuối với nhân viên mua hàng."],["Benford's Law","Luật Benford","Phân phối chữ số đầu trong dữ liệu tự nhiên; lệch nhiều có thể là dấu hiệu bịa số.","Chữ số đầu “9” xuất hiện bất thường trong hóa đơn."],["Split purchase","Chia nhỏ đơn hàng","Tách đơn để né cấp phê duyệt.","27 đơn 92–99 triệu đồng cho một nhà cung cấp."],["Authority matrix","Ma trận thẩm quyền","Quy định ai được duyệt gì, đến hạn mức nào.","Quy chế tài chính phân cấp 1–5."],["Mandatory vacation","Nghỉ phép bắt buộc","Buộc nhân viên vị trí nhạy cảm nghỉ liên tục để người khác thay, lộ sai phạm bị che giấu.","Thủ quỹ nghỉ 5 ngày liên tục mỗi năm."],["Surprise count","Kiểm kê đột xuất","Đếm quỹ, kiểm kê kho không báo trước.","Quản lý vùng đếm quỹ cửa hàng bất kỳ mỗi tuần."]],"traps":"<div class=\"trap\"><b class=\"h\">Nghi phạm phỏng vấn sau cùng<\/b>Đáp án “phỏng vấn người bị nghi ngờ trước để tránh bỏ trốn” là sai.<\/div><div class=\"trap\"><b class=\"h\">Dấu hiệu ≠ bằng chứng<\/b>Thấy red flag thì <b>báo và đánh giá thêm<\/b>, không kết luận gian lận.<\/div><div class=\"trap\"><b class=\"h\">KTNB không chịu trách nhiệm chính về phòng ngừa<\/b>Ban điều hành thiết kế, vận hành kiểm soát chống gian lận; KTNB đánh giá.<\/div><div class=\"trap\"><b class=\"h\">Khẩu hiệu không phải kiểm soát phát hiện<\/b>Truyền thông đạo đức là <b>chỉ dẫn<\/b>; không phát hiện được gian lận.<\/div><div class=\"trap\"><b class=\"h\">Tố giác là số 1<\/b>Câu hỏi “cách phát hiện phổ biến nhất” → <b>tố giác (tips)<\/b>, không phải kiểm toán.<\/div>","quiz":[{"q":"Hướng dẫn quản lý rủi ro gian lận của COSO và ACFE có bao nhiêu nguyên tắc?","o":["5","8","3","17"],"a":0,"e":"Tương ứng 5 thành phần COSO.","s":"COSO/ACFE Fraud Risk Management Guide"},{"q":"Nguyên tắc nào KHÔNG thuộc Hướng dẫn quản lý rủi ro gian lận?","o":["Giám sát","Điều tra và hành động khắc phục","Tối đa hóa lợi nhuận","Đánh giá rủi ro gian lận"],"a":2,"e":"Quản trị, đánh giá, kiểm soát, điều tra, giám sát.","s":"COSO/ACFE Fraud Risk Management Guide"},{"q":"Theo ACFE, gian lận được phát hiện nhiều nhất qua:","o":["Kiểm toán nội bộ","Kiểm toán độc lập","Tố giác","Tình cờ"],"a":2,"e":"Tips là phương thức phổ biến nhất.","s":"ACFE Report to the Nations"},{"q":"KTV thấy dấu hiệu gian lận trong cuộc kiểm toán. Việc đầu tiên nên làm là:","o":["Bỏ qua nếu số tiền nhỏ","Báo công an","Đối chất ngay với người liên quan","Ghi lại và báo CAE theo phương pháp, giữ bảo mật"],"a":3,"e":"D.3.c.","s":"T1 D.3.c"},{"q":"Trong điều tra, người bị nghi ngờ thường được phỏng vấn:","o":["Cùng lúc với nhân chứng","Không cần phỏng vấn","Sau cùng","Đầu tiên"],"a":2,"e":"Từ ngoài vào trong.","s":"T1 D.5.b"},{"q":"Khi phỏng vấn tr ,"s":"T1 D.5.e"},{"q":"Để chống chia nhỏ đơn hàng, kiểm soát hệ thống phù hợp nhất là:","o":["Cho phép duyệt bằng email","Cộng dồn giá trị theo nhà cung cấp và kỳ để áp hạn mức","Bỏ ma trận thẩm quyền","Tăng hạn mức phê duyệt"],"a":1,"e":"D.4.c.","s":"T1 D.4.c"}],"next":"<ol><li><b>Đọc gốc (≈ 60 phút):<\/b> COSO/ACFE – Fraud Risk Management Guide, bản tóm tắt điều hành (T9); ACFE – phần phương thức phát hiện (T8).<\/li><li><b>Tự tóm tắt 1 trang:<\/b> sơ đồ xử lý khi GSHĐ phát hiện dấu hiệu gian lận: ai được báo, ai quyết định điều tra, ai giữ bằng chứng.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 4 câu 4–6; T3: 30 câu Phần IV.<\/li><li><b>K15 (1 giờ):<\/b> Tổng kết: bộ câu hỏi chuẩn khi kiểm tra khối Kế toán.<\/li><li><b>Sổ lỗi:<\/b> lọc toàn bộ câu sai của Bài 1–13 để ôn trong tuần Tết.<\/li><\/ol><div class=\"note\"><b class=\"h\">Tiếp theo trong lộ trình<\/b>Tuần 16 nghỉ Tết (tùy chọn đọc lại sổ lỗi). Tuần 17: Thi thử 1 – 125 câu/150 phút; Mốc 2: điểm < 70% thì cân nhắc bộ đề thi thử IIA.<\/div>","footer":"<p><b>Nguồn:<\/b> COSO và ACFE – Fraud Risk Management Guide · ACFE – Occupational Fraud: A Report to the Nations · The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), D.3–D.5 · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p><p class=\"en\">Tài liệu T8, T9 không có trong Project; nội dung được tóm lược theo bản công bố chính thức. Nên đối chiếu khi đọc gốc.<\/p>"}}</script>
<script>
/* ============== Lưu trữ cục bộ + đồng bộ GitHub Gist (thay cho CSDL của Claude) ==============
   - Mọi dữ liệu (tiến độ, sổ lỗi, bài học nhập thêm) lưu trong localStorage của trình duyệt.
   - Bài 1–3 và lộ trình 20 tuần được nhúng sẵn trong file (SEED); bài nhập sau ghi đè/bổ sung.
   - Nếu bật đồng bộ: mỗi thay đổi tự đẩy lên 1 Gist bí mật; khi mở app/quay lại tab sẽ kiểm tra
     bản mới hơn từ thiết bị khác và hỏi trước khi áp dụng (giống The big dream). */
var APP_VERSION = "v1.1";
var STORE_KEY = "iap-state", GH_KEY = "iap-gh-sync", GIST_FILE = "iap-hoc-bai-sync.json";
var SEED = JSON.parse(document.getElementById("iap-seed").textContent);

var Store = (function(){
  var st = {docs:{}, lastModified:null}, ok = true, subs = [];
  try{ var raw = localStorage.getItem(STORE_KEY); if(raw){ var p = JSON.parse(raw); if(p && p.docs) st = p; } }
  catch(e){ ok = false; }
  try{ localStorage.setItem("__iap_t","1"); localStorage.removeItem("__iap_t"); }catch(e){ ok = false; }
  function get(path){ return Object.prototype.hasOwnProperty.call(st.docs, path) ? st.docs[path] : (SEED[path] || null); }
  function persist(silent){
    if(!silent) st.lastModified = new Date().toISOString();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(st)); }catch(e){}
    subs.forEach(function(f){ f(); });
    if(!silent) Sync.schedulePush();
  }
  function write(path, data, merge){
    var cur = get(path);
    st.docs[path] = merge && cur ? Object.assign({}, cur, data) : data;
    persist(false);
    return Promise.resolve();
  }
  function children(coll){
    var keys = {}, pre = coll + "/";
    Object.keys(SEED).concat(Object.keys(st.docs)).forEach(function(k){
      if(k.indexOf(pre) === 0 && k.slice(pre.length).indexOf("/") < 0) keys[k] = 1;
    });
    return Object.keys(keys).map(function(k){ return {id:k.slice(pre.length), v:get(k)}; }).filter(function(x){ return x.v; });
  }
  return {
    ok: ok, get: get, write: write, children: children,
    state: function(){ return st; },
    replace: function(s){ st = {docs:s.docs || {}, lastModified:s.lastModified || new Date().toISOString()}; persist(true); },
    subscribe: function(f){ subs.push(f); }
  };
})();

function LocalDB(){
  function snapDoc(path){ var v = Store.get(path); return {id:path.split("/").pop(), exists:!!v, data:function(){ return v ? JSON.parse(JSON.stringify(v)) : undefined; }, metadata:{hasPendingWrites:false}}; }
  function makeColl(path, filter){
    function snap(){
      var docs = Store.children(path).filter(function(x){ return !filter || x.v[filter[0]] === filter[1]; })
        .map(function(x){ return {id:x.id, data:function(){ return JSON.parse(JSON.stringify(x.v)); }}; });
      return {docs:docs};
    }
    return {
      where: function(f, op, v){ return makeColl(path, [f, v]); },
      onSnapshot: function(cb){ var fire = function(){ cb(snap()); }; Store.subscribe(fire); setTimeout(fire, 0); return function(){}; }
    };
  }
  return {
    collection: function(p){ return makeColl(p, null); },
    doc: function(p){
      return {
        set: function(d){ return Store.write(p, d, false); },
        update: function(d){ return Store.write(p, d, true); },
        onSnapshot: function(cb){ var fire = function(){ cb(snapDoc(p)); }; Store.subscribe(fire); setTimeout(fire, 0); return function(){}; }
      };
    }
  };
}
window.claude = {
  use: function(name){
    if(name === "db") return Promise.resolve(LocalDB());
    if(name === "user") return Promise.resolve({
      id: function(){ return Promise.resolve("me"); },
      canEdit: function(){ return Promise.resolve(true); },
      name: function(){ return Promise.resolve(pref("name") || ""); }
    });
    return Promise.resolve(null);
  }
};

/* ---------------- GitHub Gist ---------------- */
var Sync = (function(){
  var cfg = {token:"", gistId:""}, status = "idle", msg = "", lastSynced = null, pending = null, timer = null;
  try{ var r = localStorage.getItem(GH_KEY); if(r){ var p = JSON.parse(r); cfg.token = p.token || ""; cfg.gistId = p.gistId || ""; lastSynced = p.lastSynced || null; } }catch(e){}
  function saveCfg(){ try{ if(cfg.token || cfg.gistId) localStorage.setItem(GH_KEY, JSON.stringify({token:cfg.token, gistId:cfg.gistId, lastSynced:lastSynced})); else localStorage.removeItem(GH_KEY); }catch(e){} }
  function hdr(){ return {Authorization:"token " + cfg.token, Accept:"application/vnd.github+json"}; }
  function body(){ var s = Store.state(); return {app:"iap-hoc-bai", docs:s.docs, lastModified:s.lastModified}; }
  function on(){ return !!(cfg.token && cfg.gistId); }
  function set(s, m){ status = s; msg = m || ""; if(typeof onSyncChange === "function") onSyncChange(); }
  function push(){
    if(!on()) return Promise.resolve();
    set("syncing");
    var files = {}; files[GIST_FILE] = {content:JSON.stringify(body())};
    return fetch("https://api.github.com/gists/" + cfg.gistId, {method:"PATCH", headers:hdr(), body:JSON.stringify({files:files})})
      .then(function(r){ if(!r.ok) throw new Error("Đồng bộ lên thất bại (mã " + r.status + ")"); lastSynced = Store.state().lastModified; saveCfg(); set("idle"); })
      .catch(function(e){ set("error", e.message || "Lỗi đồng bộ lên GitHub"); });
  }
  function pull(token, gistId){
    return fetch("https://api.github.com/gists/" + gistId, {headers:{Authorization:"token " + token, Accept:"application/vnd.github+json"}, cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("Tải dữ liệu đồng bộ thất bại (mã " + r.status + ")"); return r.json(); })
      .then(function(d){ var f = d.files && d.files[GIST_FILE]; return f && f.content ? JSON.parse(f.content) : null; });
  }
  function newer(remote){ var l = Store.state().lastModified; return remote && remote.lastModified && (!l || new Date(remote.lastModified) > new Date(l)); }
  function check(){
    if(!on() || status === "syncing") return Promise.resolve();
    return pull(cfg.token, cfg.gistId).then(function(remote){
      if(newer(remote)){ pending = remote; set("idle"); }
    }).catch(function(e){ set("error", e.message); });
  }
  return {
    on: on, status: function(){ return status; }, message: function(){ return msg; }, lastSynced: function(){ return lastSynced; },
    gistId: function(){ return cfg.gistId; }, pending: function(){ return pending; },
    schedulePush: function(){ if(!on()) return; clearTimeout(timer); timer = setTimeout(push, 1200); },
    check: check,
    create: function(token){
      set("syncing");
      var files = {}; files[GIST_FILE] = {content:JSON.stringify(body())};
      return fetch("https://api.github.com/gists", {method:"POST", headers:{Authorization:"token " + token, Accept:"application/vnd.github+json"},
        body:JSON.stringify({description:"IAP Học Bài — dữ liệu đồng bộ (bí mật, không chia sẻ)", public:false, files:files})})
        .then(function(r){ if(!r.ok) throw new Error("Tạo Gist thất bại (mã " + r.status + ") — kiểm tra lại token và quyền gist"); return r.json(); })
        .then(function(g){ cfg.token = token; cfg.gistId = g.id; lastSynced = Store.state().lastModified; saveCfg(); set("idle"); })
        .catch(function(e){ set("error", e.message); throw e; });
    },
    link: function(token, gistId){
      set("syncing");
      return pull(token, gistId).then(function(remote){
        cfg.token = token; cfg.gistId = gistId; saveCfg();
        if(newer(remote)) pending = remote; set("idle");
      }).catch(function(e){ set("error", e.message); throw e; });
    },
    now: function(){
      if(!on()) return Promise.resolve();
      set("syncing");
      return pull(cfg.token, cfg.gistId).then(function(remote){
        if(newer(remote)){ pending = remote; set("idle"); } else return push();
      }).catch(function(e){ set("error", e.message); });
    },
    apply: function(){ if(pending){ Store.replace(pending); lastSynced = pending.lastModified; saveCfg(); pending = null; set("idle"); } },
    dismiss: function(){ pending = null; set("idle"); },
    disconnect: function(){ cfg = {token:"", gistId:""}; pending = null; lastSynced = null; saveCfg(); set("idle"); }
  };
})();

function partOf(code){var n=parseInt(String(code||"").replace(/\D/g,""),10);if(!n)return null;return n<=5?"I":n<=7?"II":n<=11?"III":n<=13?"IV":null;}

function lessonList(){return Object.keys(S.lessons).map(function(k){return S.lessons[k];}).sort(function(a,b){return (a.order||0)-(b.order||0);});}
function lp(id){return S.prog.lessons[id]||{};}
function lessonStat(L1){
  var p=lp(L1.id), nc=(L1.cases||[]).length, solved=0, first=0, cs=p.cases||{};
  Object.keys(cs).forEach(function(k){if(cs[k].ok){solved++;if(cs[k].first)first++;}});
  var q=p.quiz||null, best=q?q.best:null;
  var casesDone = nc===0 || solved>=nc;
  var done = casesDone && best!=null && best>=70;
  var started = solved>0 || q;
  var pct = (nc? solved/nc*0.5 : 0) + (best!=null ? (nc?0.5:1)*Math.min(best,100)/100 : 0);
  if(!nc && best==null) pct=0;
  return {nc:nc,solved:solved,first:first,best:best,last:q?q.last:null,attempts:q?q.attempts:0,done:done,started:!!started,pct:Math.round(pct*100)};
}
function curWeek(){
  if(!S.plan) return null;
  var t=today(), st=d0(S.plan.start);
  var n=Math.floor(daysBetween(st,t)/7)+1;
  return n;
}
function weekItems(w){
  var it=[];
  if(w.code && /^C\d+$/.test(w.code)) it.push({k:"lesson",t:"Học bài "+w.code,s:w.title});
  if(w.read && w.read!=="—") it.push({k:"read",t:"Đọc tài liệu gốc",s:w.read});
  if(w.practice && w.practice!=="—") it.push({k:"practice",t:"Luyện tập",s:w.practice});
  if(w.k) it.push({k:"k",t:"Kế toán – thuế "+w.k.split(" ")[0],s:w.k});
  if(w.milestone) it.push({k:"ms",t:"Mốc quan trọng",s:w.milestone});
  return it;
}
function lessonForCode(code){var l=lessonList();for(var i=0;i<l.length;i++)if(l[i].code===code)return l[i];return null;}
function weekDone(w){
  var it=weekItems(w), st=S.prog.weeks[w.n]||{};
  if(!it.length) return false;
  return it.every(function(x){
    if(x.k==="lesson"){var L1=lessonForCode(w.code);if(L1&&lessonStat(L1).done)return true;}
    return !!st[x.k];});
}
function openMistakes(){return Object.keys(S.mistakes).map(function(k){return S.mistakes[k];}).filter(function(m){return !m.resolved;});}

var writeChain=Promise.resolve(), progTimer=null, inflight=0;
function progRef(){return S.db.doc("data/users/"+S.uid+"/progress");}
function saveProg(){
  if(!S.db||!S.uid) return;
  clearTimeout(progTimer);
  progTimer=setTimeout(function(){
    progTimer=null; inflight++;
    var body=JSON.parse(JSON.stringify(S.prog)); body.updatedAt=Date.now();
    writeChain=writeChain.then(function(){return progRef().set(body);}).then(function(){inflight--;setSync("on");},function(e){inflight--;setSync("err");toast("Chưa lưu được tiến độ: "+(e&&e.message||"lỗi kết nối"));});
  },500);
}
function mkRef(id){return S.db.doc("data/users/"+S.uid+"/"+id);}
function q(fn){writeChain=writeChain.then(fn).catch(function(e){setSync("err");toast("Chưa lưu được: "+(e&&e.message||"lỗi"));});return writeChain;}

function boot(){
  try{var th=pref("theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
  render();
  if(!window.claude||!window.claude.use){S.sync="off";S.lessonsLoaded=S.planLoaded=S.progLoaded=true;render();return;}
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0], user=r[1];
    if(!db){S.lessonsLoaded=S.planLoaded=S.progLoaded=true;render();return;}
    S.db=db;
    db.collection("lessons").onSnapshot(function(snap){
      var o={};snap.docs.forEach(function(d){var v=d.data();if(v&&v.id)o[v.id]=v;});
      S.lessons=o;S.lessonsLoaded=true;setSync("on");render();
    },function(){S.lessonsLoaded=true;setSync("err");render();});
    db.doc("plan/main").onSnapshot(function(d){S.plan=d.exists?d.data():null;S.planLoaded=true;render();},function(){S.planLoaded=true;render();});
    var p1 = user? user.id():Promise.resolve(null);
    var p2 = user? user.canEdit():Promise.resolve(false);
    var p3 = user&&user.name? user.name():Promise.resolve("");
    Promise.all([p1,p2,p3]).then(function(v){
      S.uid=v[0];S.canAdmin=!!v[1];S.name=v[2]||"";
      if(!S.uid){S.progLoaded=true;render();return;}
      progRef().onSnapshot(function(d){
        if((d.metadata&&d.metadata.hasPendingWrites)||progTimer||inflight>0) return;
        var v2=d.exists?d.data():null;
        S.prog={lessons:(v2&&v2.lessons)||{},weeks:(v2&&v2.weeks)||{}};
        S.progLoaded=true;render();
      },function(){S.progLoaded=true;render();});
      db.collection("data/users/"+S.uid).where("kind","==","mistake").onSnapshot(function(snap){
        var o={};snap.docs.forEach(function(d){o[d.id]=Object.assign({_id:d.id},d.data());});
        S.mistakes=o;render();
      },function(){});
      render();
    });
  }).catch(function(){S.lessonsLoaded=S.planLoaded=S.progLoaded=true;render();});
}

var pendingImport=null;
function bindImport(){
  var f=$("#impFile"),dr=$("#drop"); if(!f) return;
  f.onchange=function(){if(f.files[0])readImport(f.files[0]);};
  dr.ondragover=function(e){e.preventDefault();dr.classList.add("over");};
  dr.ondragleave=function(){dr.classList.remove("over");};
  dr.ondrop=function(e){e.preventDefault();dr.classList.remove("over");if(e.dataTransfer.files[0])readImport(e.dataTransfer.files[0]);};
  if(pendingImport) showImport();
}
function readImport(file){
  var r=new FileReader();
  r.onload=function(){
    try{pendingImport=parseLesson(String(r.result),file.name);showImport();}
    catch(e){pendingImport=null;$("#impOut").innerHTML='<div class="trap"><b>Không đọc được file này</b>'+esc(e.message)+'. Hãy dùng file .json Claude gửi kèm bài học.</div>';}
  };
  r.readAsText(file);
}
function parseLesson(text,name){
  var o=null,t=text.trim();
  if(t[0]==="{") o=JSON.parse(t);
  else{
    var m=t.match(/<script[^>]+id="iap-lesson"[^>]*>([\s\S]*?)<\/script>/);
    if(m) o=JSON.parse(m[1]);
    else{ m=t.match(/var D=(\{[\s\S]*?\});\s*\(function\(\)\{var root/); if(m) o=JSON.parse(m[1].replace(/<\\\//g,"</")); }
  }
  if(!o) throw new Error("File không chứa dữ liệu bài học theo định dạng của công cụ");
  if(!o.code) throw new Error("Thiếu mã chủ đề (ví dụ C4)");
  var n=parseInt(String(o.code).replace(/\D/g,""),10)||0;
  o.id=o.id||("L"+("0"+n).slice(-2));
  o.order=o.order||n;
  if(!o.title&&o.h1) o.title=o.h1;
  if(!o.week&&S.plan){var w=S.plan.weeks.filter(function(x){return x.code===o.code;})[0];if(w)o.week=w.n;}
  delete o.h1; delete o.tab;
  if(!o.quiz||!o.quiz.length) throw new Error("Bài không có câu trắc nghiệm");
  return o;
}

    (ex?'<br>Bài '+esc(o.id)+' đã có, sẽ được thay bằng phiên bản này.':'')+'</div><div class="row"><button class="btn pri" id="impGo">'+(ex?"Cập nhật bài":"Thêm bài")+'</button><button class="btn" id="impCancel">Hủy</button></div>';
  $("#impCancel").onclick=function(){pendingImport=null;$("#impOut").innerHTML="";};
  $("#impGo").onclick=function(){

      function(e){b.disabled=false;b.textContent="Thử lại";toast(e&&e.code==="quota_exceeded"?"Bộ nhớ đã đầy, hãy xóa bớt bài cũ":"Chưa lưu được bài: "+(e&&e.message||"lỗi"));});
  };
}
