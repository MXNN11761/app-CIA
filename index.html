<title>IAP Học Bài</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — bottom tab bar on phones, left rail on laptops; lesson opens as a full reading view inside the shell */
:root{
  --bg:#eef8f3; --surface:#ffffff; --surface-2:#e1f3ea; --line:#c9e6d8; --text:#17302a; --muted:#4f6b62;
  --accent:#206f58; --accent-ink:#ffffff; --accent-soft:#d3f1e4;
  --scene:#5b57a6; --scene-soft:#ecebfa; --gold:#8f6410; --gold-soft:#fbf0d6;
  --ok:#1d7650; --ok-soft:#d9f3e5; --bad:#b2433a; --bad-soft:#fbe3df; --warn:#9a6c14;
  --shadow:0 1px 2px rgba(30,90,70,.06),0 6px 20px rgba(30,90,70,.07);
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1916; --surface:#142320; --surface-2:#1b2e29; --line:#284039; --text:#e2f2ec; --muted:#94b1a6;
  --accent:#86dcbf; --accent-ink:#0b1f19; --accent-soft:#183a30;
  --scene:#bdb8ff; --scene-soft:#232239; --gold:#e6c27a; --gold-soft:#33291a;
  --ok:#72d4a4; --ok-soft:#15322a; --bad:#f08b80; --bad-soft:#3a201e; --warn:#e6c27a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1916; --surface:#142320; --surface-2:#1b2e29; --line:#284039; --text:#e2f2ec; --muted:#94b1a6;
  --accent:#86dcbf; --accent-ink:#0b1f19; --accent-soft:#183a30;
  --scene:#bdb8ff; --scene-soft:#232239; --gold:#e6c27a; --gold-soft:#33291a;
  --ok:#72d4a4; --ok-soft:#15322a; --bad:#f08b80; --bad-soft:#3a201e; --warn:#e6c27a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6}
h1,h2,h3,.disp{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,5vw,32px);line-height:1.25;margin:6px 0 10px}
h2{font-size:21px;line-height:1.3;margin:0 0 12px}
h3{font-size:17px;margin:18px 0 8px}
p{margin:0 0 12px} ul,ol{margin:0 0 12px;padding-left:22px} li{margin-bottom:4px}
button{font:inherit;cursor:pointer;color:var(--text)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .en{font-style:italic;color:var(--muted);font-size:.95em}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}

/* shell */
.app{min-height:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
.main{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.brand{display:none}
@media (min-width:900px){
  .app{padding-bottom:0;padding-left:220px}
  nav.tabs{top:0;right:auto;width:220px;bottom:0;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;gap:4px}
  nav.tabs button{height:auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:10px;font-size:15px}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft)}
  nav.tabs .badge{position:static;margin-left:auto}
  .brand{display:block;font-family:var(--f-display);font-weight:700;font-size:18px;padding:4px 12px 16px;color:var(--text)}
  .brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .sp{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--bad)}

/* cards & blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card.hero{box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.cur{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--gold-soft);color:var(--gold)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.ok i{background:var(--ok)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px;font-family:var(--f-display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px;left:calc(50% + 110px)}}

/* home */
.greet{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.greet h1{margin:2px 0 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}

.cont{display:flex;flex-direction:column;gap:10px}

.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}

.parts .p{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.parts .p b{text-align:right}
@media (max-width:420px){.parts .p{grid-template-columns:96px 1fr 42px}}

/* roadmap */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.wk{position:relative;margin-bottom:10px}
.wk .dot{position:absolute;left:-22px;top:16px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.wk.done .dot{background:var(--ok);border-color:var(--ok)}
.wk.cur .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.wk.ms .dot{border-radius:3px;transform:rotate(45deg)}
.wk details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.wk.cur details{border-color:var(--accent)}
.wk summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.wk summary::-webkit-details-marker{display:none}
.wk .wn{font-weight:700;font-family:var(--f-display);font-size:14px;color:var(--muted);min-width:34px}
.wk .wt{font-weight:600;min-width:0}
.wk .wd{grid-column:2;font-size:13px;color:var(--muted)}
.wk .wbody{padding:0 14px 12px}
.ms-note{margin-top:6px;font-size:13px;font-weight:600;color:var(--gold)}
.exam{background:var(--scene-soft);border:1px solid var(--scene);border-radius:12px;padding:12px 14px;font-weight:600;color:var(--scene)}

/* lesson list */
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;text-align:left}
.lrow:hover{border-color:var(--accent)}
.lrow .code{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent);background:var(--accent-soft);border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center}
.lrow .lt{font-weight:600;min-width:0}
.lrow .ls{font-size:13px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* mistakes */
.mk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.mk .mq{font-weight:600;margin:6px 0 8px}
.mk .ans{font-size:14px;display:grid;gap:4px}
.mk .ans .w{color:var(--bad)} .mk .ans .r{color:var(--ok)}
.mk .ex{font-size:14px;color:var(--muted);margin-top:8px}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reasons button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.reasons button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}

/* ---------- lesson reading view ---------- */
.lesson .back{margin-bottom:10px}
.lesson .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lesson .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.ltoc{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:10px 0;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ltoc::-webkit-scrollbar{display:none}
.ltoc button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.ltoc button.done{border-color:var(--ok);color:var(--ok)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
.lesson section{margin-top:30px;scroll-margin-top:70px}
.note,.key,.trap{border-radius:10px;padding:13px 15px;margin:12px 0}
.note{background:var(--gold-soft);border-left:4px solid var(--gold)}
.key{background:var(--accent-soft);border-left:4px solid var(--accent)}
.trap{background:var(--bad-soft);border-left:4px solid var(--bad)}
.note>b:first-child,.key>b:first-child,.trap>b:first-child{display:block;margin-bottom:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:10px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:15px}

.tbl th{background:var(--surface-2);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}
.box h4{margin:0 0 6px;font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin-bottom:8px}
.tag.m{background:var(--accent-soft);color:var(--accent)} .tag.s{background:var(--gold-soft);color:var(--gold)}
.dom{display:grid;gap:10px}
.domrow{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.domrow>div{min-width:0}
.domrow .dn{font-weight:700;color:var(--accent)} .domrow .dn small{display:block;font-weight:500;color:var(--muted);font-size:12px}

.mnemo{font-size:19px;font-weight:700;color:var(--accent);font-family:var(--f-display)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}

.c-q{padding:14px 18px 2px;font-weight:600}
.c-opts{padding:0 18px 14px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;line-height:1.5;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

.opt .fb{display:none;margin-top:6px;font-size:14px;color:var(--muted)}
.opt.show .fb{display:block}
.c-reveal{border-top:1px solid var(--line)}
.c-gias{padding:14px 18px}
.c-gias .lbl,.c-take .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:6px}
.c-take{padding:13px 18px 16px;background:var(--accent-soft)}
.c-take .t{font-weight:600}
/* flashcards */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.fc{perspective:900px;cursor:pointer;min-height:200px;background:none;border:0;padding:0;text-align:left}
.fc-in{position:relative;width:100%;height:100%;min-height:200px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:15px;border:1px solid var(--line);background:var(--surface);overflow:auto}
.fc-f{display:flex;flex-direction:column;justify-content:center}
.fc-f .t{font-size:18px;font-weight:700;font-family:var(--f-display)} .fc-f .v{color:var(--accent);font-weight:600;margin-top:4px}
.fc-f .h{font-size:12px;color:var(--muted);margin-top:auto}
.fc-b{transform:rotateY(180deg);background:var(--accent-soft);font-size:14px;line-height:1.55}
.fc-b .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

.q{margin-bottom:18px} .q .qt{font-weight:600;margin-bottom:8px} .q .qn{color:var(--accent);margin-right:6px}

.big{font-size:40px;font-weight:700;color:var(--accent);line-height:1;font-family:var(--f-display)}
.lesson footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.import-preview{margin-top:12px}

"n":9,"practice":"Bộ 3: câu 1–2","read":"T4","title":"Quản trị, Three Lines Model"},{"code":"C9","date":"2026-12-21","k":"K10 · Thuế GTGT: điều kiện khấu trừ","milestone":null,"n":10,"practice":"Bộ 3: câu 3–5","read":"T6, T7","title":"Quản lý rủi ro"},{"code":"C10","date":"2026-12-28","k":"K11 · Thuế TNDN: chi phí được trừ","milestone":null,"n":11,"practice":"Bộ 3: câu 6–8","read":"T5","title":"Kiểm soát nội bộ COSO"},{"code":"C11","date":"2027-01-04","k":"K12 · Xử phạt vi phạm hóa đơn","milestone":"Đăng ký IAP trên CCMS, đóng phí, đặt lịch thi tuần 08/03","n":12,"practice":"Bộ 3: câu 9–10; T3: 40 câu Phần III","read":"T5, T6; T10","title":"Văn hóa, đạo đức tổ chức"},{"code":"Ôn III","date":"2027-01-11","k":"K13 · Chuẩn mực KTNB Việt Nam, so với GIAS","milestone":"Mốc 1: điểm tổng hợp < 65% thì cân nhắc mua Gleim","n":13,"practice":"T3: 60 câu hỗn hợp Phần I–III","read":"Sổ lỗi","title":"Ôn Phần III"},{"code":"C12","date":"2027-01-18","k":"K14 · Quy chế Tài chính, phân định cấp độ 1–5","milestone":null,"n":14,"practice":"Bộ 4: câu 1–3","read":"T8","title":"Tam giác gian lận, cây phân loại gian lận"},{"code":"C13","date":"2027-01-25","k":"K15 · Tổng kết: bộ câu hỏi chuẩn khi kiểm tra khối Kế toán","milestone":null,"n":15,"practice":"Bộ 4: câu 4–6; T3: 30 câu Phần IV","read":"T9, T8","title":"Quản lý rủi ro gian lận, điều tra"},{"code":"Tết","date":"2027-02-01","k":null,"milestone":null,"n":16,"practice":"—","read":"—","title":"Nghỉ Tết (tùy chọn: đọc lại sổ lỗi 1–2 giờ)"},{"code":"Thi thử 1","date":"2027-02-08","k":null,"milestone":"Mốc 2: điểm < 70% thì cân nhắc bộ đề thi thử IIA","n":17,"practice":"Bộ 5 + câu T3 chưa làm, theo tỷ trọng 35/20/30/15","read":"—","title":"Thi thử 1: 125 câu / 150 phút, chữa lỗi"},{"code":"Ôn","date":"2027-02-15","k":null,"milestone":null,"n":18,"practice":"T3 theo chủ đề yếu","read":"Nguồn gốc của phần yếu","title":"Ôn điểm yếu theo sổ lỗi"},{"code":"Thi thử 2","date":"2027-02-22","k":null,"milestone":null,"n":19,"practice":"Mục tiêu ≥ 75%","read":"—","title":"Thi thử 2: 125 câu mới, chữa lỗi"},{"code":"Ôn nhẹ","date":"2027-03-01","k":null,"milestone":null,"n":20,"practice":"30 câu nhẹ","read":"Tóm tắt của chị","title":"Ôn nhẹ: 15 nguyên tắc GIAS, 17 nguyên tắc COSO, cây gian lận; kiểm tra lịch thi, giấy tờ"}]},"lessons/L01":{"cases":[],"code":"C1","eyebrow":"IAP (CIA Part 1) · Tuần 1 · Chủ đề C1 · Phần I – Nền tảng KTNB (35%)","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2): About the IPPF, Fundamentals, Glossary, Domain I và các chuẩn mực 4.1, 7.1, 8.4 · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), Section A · Two-way mapping IPPF 2017 ↔ GIAS 2024 (T2) · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p>","goals":"<div class=\"card\">\n    <ol>\n      <li>Diễn đạt lại <b>Purpose of Internal Auditing<\/b> bằng lời của mình: tạo – bảo vệ – duy trì giá trị; 5 điều KTNB tăng cường; 3 điều kiện để KTNB hiệu quả nhất.<\/li>\n      <li>Kể đủ 3 thành phần của <b>IPPF 2024<\/b> và nói được cái nào bắt buộc.<\/li>\n      <li>Vẽ lại khung <b>5 domain – 15 nguyên tắc<\/b> của GIAS, biết domain nào do ai chịu trách nhiệm chính.<\/li>\n      <li>Phân biệt <b>must / should / may<\/b>; <b>Requirements / Considerations / Examples of evidence<\/b>.<\/li>\n      <li>Phân biệt sơ bộ <b>dịch vụ đảm bảo<\/b> và <b>dịch vụ tư vấn<\/b>; đảm bảo <b>có giới hạn<\/b> và <b>hợp lý<\/b> (học sâu ở tuần 4).<\/li>\n      <li>Biết xử lý khi <b>không thể tuân thủ<\/b> một yêu cầu của GIAS.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"note\"><b>Vị trí trong lộ trình<\/b>Kế hoạch v1.0 bắt đầu tuần 1 vào 19/10/2026. Hôm nay (13/10) là bài học sớm của tuần 1 – chủ đề C1. Tuần 1 còn lại: làm bài chẩn đoán 12 câu trên FreeFellow (T3), đọc T10 và bài K1 kế toán – thuế.<\/div>","html":"<section style=\"margin-top:28px\"><h2>1. IPPF – “ngôi nhà” của nghề KTNB<\/h2>\n  <p><b>IPPF<\/b> <span class=\"en\">(International Professional Practices Framework – Khuôn khổ thực hành chuyên nghiệp quốc tế)<\/span> là bộ khung do IIA ban hành, gom toàn bộ “kiến thức có thẩm quyền” của nghề KTNB vào một hệ thống thống nhất. Từ bản 2024, IPPF chỉ còn <b>3 thành phần<\/b>:<\/p>\n  <div class=\"grid3\">\n    <div class=\"box\"><span class=\"tag m\">BẮT BUỘC<\/span><h4>Global Internal Audit Standards (GIAS)<\/h4><p>Chuẩn mực KTNB toàn cầu: 5 domain, 15 nguyên tắc. Đây là trọng tâm của ≈55% đề thi Part 1. Có hiệu lực từ 09/01/2025.<\/p><\/div>\n    <div class=\"box\"><span class=\"tag m\">BẮT BUỘC KHI THUỘC PHẠM VI<\/span><h4>Topical Requirements<\/h4><p>Yêu cầu theo chủ đề rủi ro cụ thể (ví dụ an ninh mạng). Phải tuân thủ khi phạm vi cuộc kiểm toán có chủ đề đó.<\/p><\/div>\n    <div class=\"box\"><span class=\"tag s\">BỔ TRỢ – KHÔNG BẮT BUỘC<\/span><h4>Global Guidance<\/h4><p>Hướng dẫn thực hành: <b>Global Practice Guides<\/b> (cách làm, quy trình từng bước) và <b>GTAG<\/b> (hướng dẫn kiểm toán CNTT).<\/p><\/div>\n  <\/div>\n  <h3>So sánh nhanh với IPPF 2017 (chỉ để hiểu tài liệu cũ, đề thi dùng bản 2024)<\/h3>\n  <div class=\"tbl\"><table>\n    <tr><th>IPPF 2017<\/th><th>Đi về đâu trong IPPF 2024<\/th><\/tr>\n    <tr><td>Mission, Definition of Internal Auditing, Core Principles<\/td><td>Gộp vào <b>Domain I – Purpose of Internal Auditing<\/b> (và định nghĩa trong Glossary)<\/td><\/tr>\n    <tr><td>Code of Ethics (Quy tắc đạo đức)<\/td><td>Được <b>thay thế<\/b> bởi <b>Domain II – Ethics and Professionalism<\/b><\/td><\/tr>\n    <tr><td>Standards (nhóm 1000 – thuộc tính, 2000 – thực hiện)<\/td><td>Phân bổ vào <b>Domain III, IV, V<\/b><\/td><\/tr>\n    <tr><td>Implementation Guidance (hướng dẫn thực hiện)<\/td><td>Phần lớn đưa vào mục <b>Considerations for Implementation<\/b> trong từng chuẩn mực<\/td><\/tr>\n    <tr><td>Supplemental Guidance<\/td><td><b>Global Guidance<\/b><\/td><\/tr>\n  <\/table><\/div>\n  <div class=\"key\"><b>Ghi nhớ<\/b>Tài liệu tiếng Việt chị có trong Project (bản IPPF 2017, Code of Ethics tiếng Việt) dùng để <i>tra nghĩa từ<\/i> là chính. Khi nội dung khác nhau, <b>GIAS 2024 là chuẩn<\/b>; file “two-way mapping” trong Project giúp đối chiếu từng điều.<\/div><\/section><section style=\"margin-top:28px\"><h2>2. Cấu trúc GIAS: 5 domain – 15 nguyên tắc<\/h2>\n  <div class=\"dom\">\n    <div class=\"domrow\"><div class=\"dn\">Domain I<small>Mục đích<\/small><\/div><div><b>Purpose of Internal Auditing<\/b> – chỉ có <b>một tuyên bố mục đích<\/b>, không có nguyên tắc/chuẩn mực con. Là “kim chỉ nam” cho 4 domain sau.<\/div><\/div>\n    <div class=\"domrow\"><div class=\"dn\">Domain II<small>5 nguyên tắc · 1–5<\/small><\/div><div><b>Ethics and Professionalism<\/b> – Đạo đức & chuyên nghiệp: (1) Chính trực, (2) Khách quan, (3) Năng lực, (4) Thận trọng nghề nghiệp, (5) Bảo mật. <i>Áp dụng cho mọi KTV.<\/i><\/div><\/div>\n    <div class=\"domrow\"><div class=\"dn\">Domain III<small>3 nguyên tắc · 6–8<\/small><\/div><div><b>Governing the Internal Audit Function<\/b> – Quản trị chức năng KTNB: (6) Được HĐQT ủy quyền, (7) Định vị độc lập, (8) Được HĐQT giám sát. <i>Có “Essential Conditions” – việc HĐQT và quản lý cấp cao cần làm.<\/i><\/div><\/div>\n    <div class=\"domrow\"><div class=\"dn\">Domain IV<small>4 nguyên tắc · 9–12<\/small><\/div><div><b>Managing the Internal Audit Function<\/b> – Quản lý chức năng KTNB: (9) Hoạch định chiến lược, (10) Quản lý nguồn lực, (11) Truyền thông hiệu quả, (12) Nâng cao chất lượng. <i>Trách nhiệm chính của CAE.<\/i><\/div><\/div>\n    <div class=\"domrow\"><div class=\"dn\">Domain V<small>3 nguyên tắc · 13–15<\/small><\/div><div><b>Performing Internal Audit Services<\/b> – Thực hiện dịch vụ: (13) Lập kế hoạch cuộc kiểm toán, (14) Thực hiện công việc, (15) Truyền đạt kết quả & theo dõi kế hoạch hành động. <i>Áp dụng cho mọi KTV.<\/i><\/div><\/div>\n  <\/div>\n  <div class=\"key\"><b>Mẹo nhớ: “5 – 3 – 4 – 3”<\/b><span class=\"mnemo\">Đạo đức 5 · HĐQT 3 · CAE 4 · Cuộc kiểm toán 3<\/span><br>Cộng lại = 15 nguyên tắc. Domain I đứng riêng, không đếm nguyên tắc.<\/div>\n\n  <h3>Mỗi chuẩn mực (Standard) gồm 3 lớp<\/h3>\n  <div class=\"tbl\"><table>\n    <tr><th>Lớp<\/th><th>Tính chất<\/th><th>Từ khóa nhận diện<\/th><\/tr>\n    <tr><td><b>Requirements<\/b> – Yêu cầu<\/td><td>Thực hành <b>bắt buộc<\/b><\/td><td><b>must<\/b> = yêu cầu vô điều kiện<\/td><\/tr>\n    <tr><td><b>Considerations for Implementation<\/b> – Lưu ý khi triển khai<\/td><td>Thực hành phổ biến, được ưu tiên<\/td><td><b>should<\/b> = ưu tiên nhưng không bắt buộc · <b>may<\/b> = tùy chọn<\/td><\/tr>\n    <tr><td><b>Examples of Evidence of Conformance<\/b> – Ví dụ bằng chứng tuân thủ<\/td><td>Không phải yêu cầu, cũng không phải cách duy nhất; giúp chuẩn bị cho đánh giá chất lượng<\/td><td>“examples”<\/td><\/tr>\n  <\/table><\/div>\n  <p style=\"margin-top:12px\">Thứ bậc: <b>Domain → Principle (nguyên tắc) → Standard (chuẩn mực, đánh số 1.1, 6.2…)<\/b>. Ví dụ: Domain III → Nguyên tắc 6 “Authorized by the Board” → Chuẩn mực 6.2 “Internal Audit Charter”.<\/p>\n  <div class=\"note\"><b>Chú ý thuật ngữ<\/b>GIAS yêu cầu hiểu và dùng đúng nghĩa các từ trong <b>Glossary<\/b> (bảng thuật ngữ, trang 10–14 bản rút gọn). Nhiều câu hỏi thi chỉ là kiểm tra định nghĩa trong Glossary – vì vậy phần 7 bên dưới rất quan trọng.<\/div><\/section><section style=\"margin-top:28px\"><h2>3. Domain I – Mục đích của kiểm toán nội bộ<\/h2>\n  <div class=\"card\">\n    <p style=\"font-size:17px\"><b>Diễn đạt lại Purpose Statement:<\/b> KTNB <b>tăng cường khả năng của tổ chức trong việc tạo ra, bảo vệ và duy trì giá trị<\/b>, bằng cách cung cấp cho <b>HĐQT và ban quản lý<\/b> sự <b>đảm bảo, tư vấn, hiểu biết sâu và tầm nhìn trước<\/b> – một cách <b>độc lập, dựa trên rủi ro và khách quan<\/b>.<\/p>\n    <p class=\"en\">Từ khóa gốc: create, protect, and sustain value · assurance, advice, insight, and foresight · independent, risk-based, objective<\/p>\n  <\/div>\n  <div class=\"grid3\">\n    <div class=\"box\"><h4>🎯 KTNB tăng cường 5 điều<\/h4><ol style=\"margin:0\"><li>Việc đạt được mục tiêu của tổ chức<\/li><li>Quy trình quản trị, quản lý rủi ro, kiểm soát (<b>GRC<\/b>)<\/li><li>Việc ra quyết định và giám sát<\/li><li>Uy tín, sự tín nhiệm với các bên liên quan<\/li><li>Khả năng phục vụ lợi ích công chúng<\/li><\/ol><\/div>\n    <div class=\"box\"><h4>✅ Hiệu quả nhất khi (3 điều kiện)<\/h4><ol style=\"margin:0\"><li>Do <b>người có năng lực<\/b> thực hiện, tuân thủ GIAS (vốn được ban hành vì lợi ích công chúng)<\/li><li>Chức năng KTNB được <b>định vị độc lập<\/b>, <b>giải trình trực tiếp với HĐQT<\/b><\/li><li>KTV <b>không chịu ảnh hưởng không thích đáng<\/b>, cam kết đánh giá khách quan<\/li><\/ol><\/div>\n    <div class=\"box\"><h4>🧠 Mẹo nhớ<\/h4><p><b>“3 – 4 – 3”<\/b><\/p><p>3 động từ giá trị: <b>Tạo · Bảo vệ · Duy trì<\/b><br>4 đầu ra: <b>Đảm bảo · Tư vấn · Insight · Foresight<\/b><br>3 tính chất: <b>Độc lập · Dựa trên rủi ro · Khách quan<\/b><\/p><\/div>\n  <\/div>\n\n  <h3>Định nghĩa “Internal auditing” (Glossary)<\/h3>\n  <p>Hoạt động <b>đảm bảo và tư vấn độc lập, khách quan<\/b>, được thiết kế để <b>gia tăng giá trị và cải thiện hoạt động<\/b> của tổ chức. KTNB giúp tổ chức đạt mục tiêu bằng một <b>cách tiếp cận có hệ thống, có kỷ luật<\/b> để đánh giá và nâng cao hiệu lực của quy trình quản trị, quản lý rủi ro và kiểm soát.<\/p>\n\n  <h3>KTNB và lợi ích công chúng (Public interest)<\/h3>\n  <p>Lợi ích công chúng là lợi ích kinh tế – xã hội và sự an lành chung của xã hội và các tổ chức trong đó (người lao động, nhà đầu tư, khách hàng, cơ quan quản lý…). Chức năng chính của KTNB là củng cố GRC, nhưng tác động lan ra ngoài tổ chức: KTNB đưa ra đảm bảo về <b>hiệu quả hoạt động, độ tin cậy của báo cáo, tuân thủ pháp luật, bảo vệ tài sản và văn hóa đạo đức<\/b> → tăng niềm tin của công chúng.<\/p>\n  <div class=\"key\"><b>Liên hệ đề cương (T1 – A.1)<\/b>Đề hỏi: (a) mục tiêu và lợi ích tổng thể của chức năng KTNB; (b) các điều kiện góp phần vào hiệu quả của KTNB. Đó chính là danh sách “5 điều” và “3 điều kiện” ở trên.<\/div><\/section><section style=\"margin-top:28px\"><h2>4. Hai loại dịch vụ: Đảm bảo và Tư vấn<\/h2>\n  <div class=\"tbl\"><table>\n    <tr><th><\/th><th>Dịch vụ đảm bảo <span class=\"en\">(Assurance services)<\/span><\/th><th>Dịch vụ tư vấn <span class=\"en\">(Advisory / Consulting services)<\/span><\/th><\/tr>\n    <tr><td><b>Bản chất<\/b><\/td><td>Đánh giá khách quan để đưa ra <b>đảm bảo<\/b>: tăng mức tin cậy của các bên về GRC <b>so với tiêu chí đã thiết lập<\/b><\/td><td>Đưa ra <b>lời khuyên<\/b>, không đưa ra đảm bảo và <b>không nhận trách nhiệm quản lý<\/b><\/td><\/tr>\n    <tr><td><b>Ai quyết định phạm vi<\/b><\/td><td>KTNB (theo kế hoạch dựa trên rủi ro)<\/td><td>Thỏa thuận với bên yêu cầu<\/td><\/tr>\n    <tr><td><b>Ví dụ<\/b><\/td><td>Kiểm toán tuân thủ, tài chính, hoạt động/hiệu quả, công nghệ<\/td><td>Góp ý thiết kế chính sách, quy trình, hệ thống mới; điều tra (forensic); đào tạo; điều phối thảo luận về rủi ro, kiểm soát<\/td><\/tr>\n    <tr><td><b>Có phải tuân thủ GIAS?<\/b><\/td><td>Có<\/td><td><b>Có<\/b> (trừ khi chuẩn mực cụ thể ghi khác – ví dụ đánh giá rủi ro, tiêu chí có thể không cần chính thức hóa)<\/td><\/tr>\n  <\/table><\/div>\n  <h3>Đảm bảo có giới hạn vs. đảm bảo hợp lý<\/h3>\n  <p>KTNB có thể đưa ra <b>limited assurance<\/b> (đảm bảo có giới hạn) hoặc <b>reasonable assurance<\/b> (đảm bảo hợp lý), tùy vào <b>bản chất, thời điểm và phạm vi<\/b> của thủ tục đã thực hiện. Thủ tục càng sâu, rộng, trực tiếp → mức đảm bảo càng cao. Không có “đảm bảo tuyệt đối”.<\/p>\n  <div class=\"flow\"><span>Phân tích xu hướng hao hụt 3 tháng<\/span><em>→ ít thủ tục →<\/em><span><b>có giới hạn<\/b><\/span><\/div>\n  <div class=\"flow\"><span>Kiểm kê, chọn mẫu, đối chiếu chứng từ – camera<\/span><em>→ thủ tục đầy đủ →<\/em><span><b>hợp lý<\/b><\/span><\/div>\n  <div class=\"note\"><b>Học sâu ở đâu?<\/b>Phần này là mở đầu; tuần 4 (C4 – nguyên tắc 9–12, đề cương A.4) sẽ học kỹ cách chọn loại dịch vụ theo tình huống.<\/div><\/section><section style=\"margin-top:28px\"><h2>5. GIAS áp dụng cho ai, và khi không tuân thủ được thì sao?<\/h2>\n  <div class=\"card\">\n    <h3 style=\"margin-top:0\">Phạm vi áp dụng<\/h3>\n    <ul>\n      <li>Áp dụng cho <b>mọi cá nhân hoặc chức năng cung cấp dịch vụ KTNB<\/b> – dù là nhân viên của tổ chức, thuê ngoài (outsourcing) hay kết hợp (cosourcing).<\/li>\n      <li><b>CAE chịu trách nhiệm giải trình<\/b> (accountable) cho việc cả chức năng tuân thủ <b>tất cả<\/b> nguyên tắc và chuẩn mực.<\/li>\n      <li><b>Mỗi KTV<\/b> chịu trách nhiệm tuân thủ phần liên quan đến công việc của mình – chủ yếu <b>Domain II<\/b> (đạo đức) và <b>Domain V<\/b> (thực hiện).<\/li>\n    <\/ul>\n    <h3>Khi không thể tuân thủ một yêu cầu<\/h3>\n    <div class=\"flow\"><span>Nguyên nhân thường gặp: thiếu nguồn lực, đặc thù ngành / pháp luật<\/span><em>→<\/em><span>Thực hiện <b>hành động thay thế<\/b> để vẫn đạt <b>mục đích<\/b> của chuẩn mực<\/span><em>→<\/em><span>CAE <b>lập văn bản<\/b> lý do, hành động thay thế, tác động và <b>truyền đạt<\/b> cho các bên phù hợp<\/span><\/div>\n    <ul>\n      <li>Nếu <b>luật cấm<\/b> tuân thủ một phần GIAS → vẫn phải tuân thủ <b>mọi phần còn lại<\/b> và <b>công bố thích hợp<\/b> (Chuẩn mực 4.1).<\/li>\n      <li><b>KTNB quy mô nhỏ<\/b>: nếu chỉ có <b>1 người<\/b>, chương trình đảm bảo chất lượng (QAIP) phải có <b>hỗ trợ từ bên ngoài chức năng KTNB<\/b>.<\/li>\n      <li><b>Khu vực công<\/b>: có phần hướng dẫn riêng ở cuối GIAS (môi trường chính trị, cấu trúc quản trị, ngân sách khác khu vực tư).<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"key\"><b>Thế nào là “board” khi công ty không có HĐQT?<\/b>“Board” = cơ quan quản trị cao nhất: HĐQT, Ủy ban kiểm toán, hội đồng thành viên/ủy thác, nhóm quan chức được bầu… Nếu không có cơ quan nào như vậy → hiểu là <b>nhóm hoặc người đóng vai trò cơ quan quản trị cao nhất<\/b>, ví dụ người đứng đầu tổ chức và quản lý cấp cao. Khi cấu trúc khác định nghĩa, CAE nên ghi lại cấu trúc quản trị mà KTNB báo cáo.<\/div><\/section><section style=\"margin-top:28px\"><h2>6. Ví dụ áp dụng vào bối cảnh chuỗi cửa hàng<\/h2>\n  <div class=\"card\">\n    <h3 style=\"margin-top:0\">Ví dụ 1 – “Tạo – Bảo vệ – Duy trì giá trị” trong thực tế<\/h3>\n    <div class=\"tbl\"><table>\n      <tr><th>Giá trị<\/th><th>KTNB làm gì<\/th><th>Đầu ra<\/th><\/tr>\n      <tr><td><b>Bảo vệ<\/b><\/td><td>Đánh giá quy trình kiểm quỹ cuối ngày ở 20 cửa hàng, phát hiện 3 cửa hàng thu ngân tự kiểm quỹ của chính mình<\/td><td>Đảm bảo (assurance) + khuyến nghị tách biệt nhiệm vụ<\/td><\/tr>\n      <tr><td><b>Tạo<\/b><\/td><td>Phân tích dữ liệu tồn kho cho thấy 15% mã hàng tồn quá 90 ngày ở nhóm cửa hàng ngoại thành<\/td><td>Insight cho ban điều hành về luân chuyển hàng<\/td><\/tr>\n      <tr><td><b>Duy trì<\/b><\/td><td>Trước kế hoạch mở 50 cửa hàng mới, cảnh báo mô hình kiểm soát hiện tại phụ thuộc vào cửa hàng trưởng giàu kinh nghiệm<\/td><td>Foresight về rủi ro mở rộng<\/td><\/tr>\n    <\/table><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3 style=\"margin-top:0\">Ví dụ 2 – Giám sát hoạt động (GSHĐ) khác KTNB thế nào?<\/h3>\n    <p>Cùng vấn đề <b>chênh lệch quỹ tiền mặt<\/b>:<\/p>\n    <ul>\n      <li><b>GSHĐ<\/b> kiểm tra hằng ngày/tuần, nhắc cửa hàng khắc phục, báo cáo Giám đốc → đây là <b>giám sát của quản lý<\/b> (tuyến 2 trong Three Lines Model – học tuần 9).<\/li>\n      <li><b>KTNB<\/b> đánh giá <b>độc lập<\/b> xem cả hệ thống kiểm soát quỹ – <i>kể cả cơ chế giám sát của GSHĐ<\/i> – có hiệu quả không, rồi báo cáo <b>HĐQT<\/b> (tuyến 3).<\/li>\n    <\/ul>\n    <p>Điểm phân biệt cốt lõi theo Domain I: KTNB <b>giải trình trực tiếp với HĐQT<\/b> và <b>độc lập<\/b> với hoạt động được kiểm tra.<\/p>\n  <\/div>\n  <div class=\"card\">\n    <h3 style=\"margin-top:0\">Ví dụ 3 – Đảm bảo hay tư vấn?<\/h3>\n    <ul>\n      <li>HĐQT yêu cầu KTNB cho ý kiến quy trình bán hàng tại cửa hàng có đang vận hành đúng quy chế không → <b>Đảm bảo<\/b> (có tiêu chí: quy chế; có người dựa vào kết quả: HĐQT).<\/li>\n      <li>Phòng vận hành nhờ KTNB góp ý thiết kế quy trình đổi trả hàng mới trước khi ban hành → <b>Tư vấn<\/b> (phạm vi do hai bên thỏa thuận; KTNB không ký duyệt hay vận hành quy trình).<\/li>\n      <li>Phòng vận hành nhờ KTNB <b>trực tiếp phê duyệt<\/b> các phiếu đổi trả hằng ngày → <b>Không phù hợp<\/b>: đây là <b>trách nhiệm quản lý<\/b>, làm suy giảm khách quan.<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"card\">\n    <h3 style=\"margin-top:0\">Ví dụ 4 – Không tuân thủ được một yêu cầu<\/h3>\n    <p>Bộ phận KTNB chỉ có 1 người, không thể tự đánh giá chất lượng một cách khách quan. Cách làm phù hợp: nhờ một chuyên gia bên ngoài chức năng KTNB (ví dụ chuyên gia độc lập hoặc bộ phận khác có hiểu biết về KTNB) hỗ trợ đánh giá; CAE ghi lại lý do và cách xử lý thay thế, báo cáo cho HĐQT.<\/p>\n  <\/div><\/section><section style=\"margin-top:28px\"><h2>9. Tự nhớ lại trong 3 phút (trả lời trong đầu rồi mới mở)<\/h2>\n  <div class=\"recall\">\n    <details><summary>IPPF 2024 có mấy thành phần? Cái nào bắt buộc?<\/summary><p>3: GIAS (bắt buộc), Topical Requirements (bắt buộc khi thuộc phạm vi), Global Guidance (bổ trợ).<\/p><\/details>\n    <details><summary>Đọc thuộc khung domain – số nguyên tắc.<\/summary><p>I Mục đích (0) · II Đạo đức (5) · III Quản trị chức năng KTNB (3) · IV Quản lý chức năng KTNB (4) · V Thực hiện dịch vụ (3) = 15.<\/p><\/details>\n    <details><summary>Purpose Statement: 3 động từ, 4 đầu ra, 3 tính chất?<\/summary><p>Tạo – bảo vệ – duy trì giá trị; đảm bảo – tư vấn – insight – foresight; độc lập – dựa trên rủi ro – khách quan.<\/p><\/details>\n    <details><summary>3 điều kiện để KTNB hiệu quả nhất?<\/summary><p>Người có năng lực tuân thủ GIAS; định vị độc lập, giải trình trực tiếp với HĐQT; không chịu ảnh hưởng không thích đáng, cam kết khách quan.<\/p><\/details>\n    <details><summary>Không thể tuân thủ một yêu cầu – làm gì?<\/summary><p>Hành động thay thế để đạt mục đích chuẩn mực; CAE lập văn bản lý do, hành động thay thế, tác động và truyền đạt cho bên phù hợp. Nếu luật cấm: tuân thủ phần còn lại + công bố.<\/p><\/details>\n  <\/div><\/section>","id":"L01","lead":"Bài khởi động cho lộ trình 20 tuần. Mục tiêu: hiểu <b>KTNB tồn tại để làm gì<\/b>, <b>bộ chuẩn mực được sắp xếp ra sao<\/b>, và nắm chắc các thuật ngữ nền sẽ xuất hiện trong mọi câu hỏi Phần I.","next":"\n    <ol>\n      <li><b>Đọc gốc (≈ 60 phút):<\/b> GIAS bản rút gọn trang 5–15: About the IPPF, Fundamentals, Glossary, Domain I. Đánh dấu các từ trong Glossary chưa chắc nghĩa.<\/li>\n      <li><b>Tự tóm tắt 1 trang<\/b> bằng lời của chị: Purpose Statement + khung 5 domain + 1 ví dụ từ công việc GSHĐ.<\/li>\n      <li><b>Bài chẩn đoán 12 câu<\/b> trên FreeFellow (T3) – ghi lại <b>điểm gốc<\/b>; dùng điểm này để chọn ngôn ngữ thi (gợi ý trong kế hoạch: thi tiếng Việt nếu điểm chẩn đoán tiếng Anh dưới 60%).<\/li>\n      <li><b>Đọc T10<\/b> (Certification Candidate Handbook): phần đăng ký, quy định phòng thi.<\/li>\n      <li><b>K1 (1 giờ):<\/b> Luật Kế toán 88/2015 – Điều 39 về KSNB, KTNB. Câu tự kiểm: Luật giao KSNB cho ai?<\/li>\n      <li><b>Sổ lỗi:<\/b> mọi câu sai ở phần 10 → ghi chủ đề, lý do sai (thiếu kiến thức / đọc nhầm / bẫy từ ngữ), nguồn đọc lại.<\/li>\n    <\/ol>\n  <div class=\"note\"><b>Bài sau (tuần 2 – C2)<\/b>Mandate, Internal Audit Charter, vai trò HĐQT và quản lý cấp cao (GIAS nguyên tắc 6 và 8) – liên hệ Quy chế GSHĐ v1.1.<\/div>","order":1,"pills":["⏱ ~90 phút: 45 đọc · 15 thẻ thuật ngữ · 25 trắc nghiệm","📄 Nguồn: T2 (GIAS 2024) · T1 (đề cương)","🎯 Đề cương A.1, A.4 (phần định nghĩa)"],"quiz":[{"a":1,"e":"Cốt lõi của Domain I là tạo – bảo vệ – duy trì giá trị. A sai vì không có đảm bảo tuyệt đối; C là trách nhiệm quản lý; D vượt quá vai trò KTNB.","o":["Bảo đảm tuyệt đối báo cáo tài chính không có sai sót trọng yếu","Tạo ra, bảo vệ và duy trì giá trị","Thay ban quản lý thiết kế hệ thống kiểm soát","Phát hiện toàn bộ hành vi gian lận"],"q":"Theo tuyên bố mục đích (Purpose Statement) của GIAS, KTNB tăng cường khả năng của tổ chức trong việc:","s":"GIAS Domain I"},{"a":3,"e":"A, B, C là đúng 3 điều kiện. D làm suy giảm độc lập vì KTNB phải đánh giá chính khối tài chính.","o":["Do người có năng lực thực hiện, tuân thủ GIAS","Chức năng KTNB định vị độc lập, giải trình trực tiếp với HĐQT","KTV không chịu ảnh hưởng không thích đáng, cam kết đánh giá khách quan","CAE báo cáo cả về chức năng lẫn hành chính cho Giám đốc tài chính để tiếp cận số liệu nhanh"],"q":"Điều nào KHÔNG thuộc các điều kiện giúp KTNB hiệu quả nhất theo Domain I?","s":"GIAS Domain I; Nguyên tắc 7"},{"a":2,"e":"GIAS và Topical Requirements là bắt buộc (Topical Requirements bắt buộc khi thuộc phạm vi). Global Guidance là bổ trợ.","o":["Global Internal Audit Standards","Topical Requirements","Global Guidance (Global Practice Guides, GTAG)","Cả A và B"],"q":"Trong IPPF 2024, thành phần nào mang tính bổ trợ, KHÔNG bắt buộc?","s":"GIAS – About the IPPF"},{"a":1,"e":"5 domain, 15 nguyên tắc. Bẫy: 17 là COSO IC 2013; 10 nguyên tắc cốt lõi thuộc IPPF 2017 đã bỏ.","o":["4 domain, 12 nguyên tắc","5 domain, 15 nguyên tắc","5 domain, 17 nguyên tắc","10 nguyên tắc cốt lõi và Quy tắc đạo đức"],"q":"GIAS 2024 được tổ chức thành:","s":"GIAS – Fundamentals"},{"a":0,"e":"Chỉ Domain II đến V chứa nguyên tắc và chuẩn mực. Domain I là tuyên bố mục đích.","o":["Domain I – Purpose of Internal Auditing","Domain II – Ethics and Professionalism","Domain IV – Managing the Internal Audit Function","Domain V – Performing Internal Audit Services"],"q":"Domain nào chỉ gồm tuyên bố mục đích, KHÔNG có nguyên tắc và chuẩn mực con?","s":"GIAS – Fundamentals"},{"a":1,"e":"Must = vô điều kiện; should = ưu tiên, không bắt buộc; may = tùy chọn.","o":["Yêu cầu vô điều kiện","Thực hành được ưu tiên nhưng không bắt buộc","Thực hành hoàn toàn tùy chọn","Chỉ áp dụng cho khu vực công"],"q":"Trong phần Considerations for Implementation, từ “should” có nghĩa là:","s":"GIAS – Fundamentals; Glossary"},{"a":2,"e":"GIAS nói rõ các ví dụ này không phải yêu cầu, cũng không phải cách duy nhất chứng minh tuân thủ.","o":["Yêu cầu bắt buộc phải có đủ","Cách duy nhất để chứng minh tuân thủ","Ví dụ giúp chuẩn bị cho đánh giá chất lượng; không phải yêu cầu và không phải cách duy nhất","Chỉ dành cho kiểm toán viên độc lập"],"q":"Các “Examples of Evidence of Conformance” ở cuối mỗi chuẩn mực là:","s":"GIAS – Fundamentals"},{"a":0,"e":"Các nguyên tắc và chuẩn mực của Domain II thay thế Code of Ethics cũ.","o":["Domain II – Ethics and Professionalism","Topical Requirements","Domain V – Performing Internal Audit Services","Một Global Practice Guide về đạo đức"],"q":"Bộ Quy tắc đạo đức (Code of Ethics) trước đây của IIA được thay thế bởi:","s":"GIAS Domain II (phần mở đầu)"},{"a":2,"e":"Domain III – Governing the Internal Audit Function liệt kê essential conditions trong từng chuẩn mực.","o":["Domain I","Domain II","Domain III","Domain V"],"q":"“Essential conditions” – các việc HĐQT và quản lý cấp cao cần làm để KTNB hiệu quả – nằm ở:","s":"GIAS Domain III"},{"a":1,"e":"Điều phối thảo luận về rủi ro, kiểm soát là ví dụ điển hình của dịch vụ tư vấn; phạm vi do thỏa thuận.","o":["Dịch vụ đảm bảo về tuân thủ","Dịch vụ tư vấn","Trách nhiệm quản lý mà KTNB đảm nhận","Một Topical Requirement"],"q":"Trưởng bộ phận vận hành đề nghị KTNB điều phối một buổi thảo luận nhận diện rủi ro cho hệ thống POS sắp triển khai; phạm vi do hai bên thống nhất. Đây là:","s":"GIAS Glossary – advisory services"},{"a":1,"e":"Định nghĩa assurance services: mức đảm bảo tùy thuộc nature, timing, extent của thủ tục.","o":["Chức danh người ký báo cáo","Bản chất, thời điểm và phạm vi của thủ tục đã thực hiện","Ý kiến của ban quản lý","Quy mô doanh thu của tổ chức"],"q":"Việc KTNB đưa ra đảm bảo có giới hạn hay đảm bảo hợp lý phụ thuộc chủ yếu vào:","s":"GIAS Glossary – assurance services"},{"a":2,"e":"CAE chịu trách nhiệm giải trình cho toàn bộ; từng KTV chỉ chịu trách nhiệm phần liên quan đến công việc của mình (chủ yếu Domain II, V).","o":["HĐQT","Từng KTV","CAE","Tổng giám đốc"],"q":"Ai chịu trách nhiệm giải trình (accountable) cho việc toàn bộ chức năng KTNB tuân thủ mọi nguyên tắc và chuẩn mực?","s":"GIAS – Fundamentals"},{"a":1,"e":"GIAS cho phép điều chỉnh trong trường hợp ngoại lệ, nhưng phải có hành động thay thế và CAE ghi lại, truyền đạt lý do.","o":["Bỏ qua yêu cầu đó, không cần ghi nhận","Thực hiện hành động thay thế để đạt mục đích của chuẩn mực; CAE lập văn bản lý do, hành động thay thế và truyền đạt cho các bên phù hợp","Tuyên bố ngừng tuân thủ toàn bộ GIAS","Hoãn mọi cuộc kiểm toán đến khi đủ nguồn lực"],"q":"Do thiếu nguồn lực, KTNB chưa thể đáp ứng đầy đủ một yêu cầu của GIAS. Cách xử lý PHÙ HỢP NHẤT:","s":"GIAS – Fundamentals; Chuẩn mực 4.1"},{"a":1,"e":"Chuẩn mực 4.1: nếu luật cấm tuân thủ một phần, vẫn bắt buộc tuân thủ mọi phần khác và công bố thích hợp.","o":["Không còn phải tuân thủ GIAS","Tuân thủ mọi phần còn lại của GIAS và công bố thích hợp","Xin IIA văn bản miễn trừ","Chỉ cần tuân thủ Domain II"],"q":"Luật áp dụng cho tổ chức cấm KTNB thực hiện một phần của GIAS. KTNB phải:","s":"GIAS Chuẩn mực 4.1"},{"a":2,"e":"Định nghĩa “board” trong Glossary có điều khoản dự phòng cho trường hợp này.","o":["Công ty kiểm toán độc lập","Phòng kế toán","Nhóm hoặc người đóng vai trò cơ quan quản trị cao nhất, ví dụ người đứng đầu tổ chức và quản lý cấp cao","Không thể áp dụng GIAS"],"q":"Một doanh nghiệp không có HĐQT, Ủy ban kiểm toán hay cơ quan quản trị tương đương. Theo GIAS, “board” được hiểu là:","s":"GIAS Glossary – board"},{"a":2,"e":"Phần Fundamentals – áp dụng cho KTNB quy mô nhỏ: chức năng 1 người cần hỗ trợ bên ngoài cho QAIP. D sai vì phòng kế toán là đối tượng kiểm toán, không độc lập.","o":["Bỏ qua QAIP vì quy mô nhỏ","Người đó tự đánh giá, không cần ai khác","Có sự hỗ trợ từ bên ngoài chức năng KTNB","Giao phòng kế toán thực hiện thay"],"q":"Bộ phận KTNB chỉ có 1 người. Để có chương trình đảm bảo và nâng cao chất lượng (QAIP) phù hợp, cần:","s":"GIAS – Fundamentals (Small Internal Audit Functions)"},{"a":1,"e":"Topical Requirements là bắt buộc khi phạm vi cuộc kiểm toán có chủ đề đó; nó bổ sung chứ không thay thế GIAS.","o":["Tham khảo nếu thấy cần, vì đây là hướng dẫn không bắt buộc","Tuân thủ các yêu cầu liên quan của Topical Requirement đó","Chỉ áp dụng nếu HĐQT yêu cầu bằng văn bản","Thay GIAS bằng Topical Requirement cho chủ đề đó"],"q":"KTNB lập kế hoạch một cuộc kiểm toán có phạm vi bao gồm một chủ đề đã có Topical Requirement của IIA. KTNB nên:","s":"GIAS – About the IPPF"},{"a":1,"e":"Độc lập gắn với vị trí của chức năng KTNB; khách quan là thái độ tư duy không thiên vị của cá nhân.","o":["(1) Khách quan · (2) Độc lập","(1) Độc lập · (2) Khách quan","(1) Chính trực · (2) Năng lực","(1) Độc lập · (2) Bảo mật"],"q":"“CAE báo cáo trực tiếp cho HĐQT” thể hiện (1); “KTV không để định kiến cá nhân chi phối nhận định” thể hiện (2). Điền đúng:","s":"GIAS Glossary – independence, objectivity"}],"short":"Mục đích KTNB & cấu trúc IPPF / GIAS 2024","summary":"","terms":[["Internal auditing","Kiểm toán nội bộ","Hoạt động đảm bảo và tư vấn độc lập, khách quan, nhằm gia tăng giá trị và cải thiện hoạt động; dùng cách tiếp cận có hệ thống, kỷ luật để đánh giá và nâng cao hiệu lực của quản trị, quản lý rủi ro, kiểm soát.","KTNB đánh giá quy trình kiểm quỹ cuối ngày tại 20 cửa hàng và báo cáo HĐQT."],["IPPF","Khuôn khổ thực hành chuyên nghiệp quốc tế","Bộ khung kiến thức có thẩm quyền của IIA cho nghề KTNB, gồm GIAS, Topical Requirements và Global Guidance.","Giống “bộ luật + nghị định + sổ tay” của nghề KTNB."],["Topical Requirements","Yêu cầu theo chủ đề","Yêu cầu bắt buộc cho từng chủ đề rủi ro cụ thể; phải tuân thủ khi phạm vi cuộc kiểm toán có chủ đề đó.","Kiểm toán hệ thống POS có phạm vi an ninh mạng → áp dụng yêu cầu chủ đề an ninh mạng."],["Global Guidance","Hướng dẫn toàn cầu","Thông tin, lời khuyên, thực hành tốt – không bắt buộc. Gồm Global Practice Guides và GTAG (CNTT).","Tham khảo GTAG khi kiểm toán phân quyền phần mềm kế toán."],["Board","Cơ quan quản trị cao nhất","HĐQT, Ủy ban kiểm toán, hội đồng thành viên/ủy thác… Nếu không có, là người/nhóm đóng vai quản trị cao nhất (ví dụ người đứng đầu và quản lý cấp cao).","Công ty TNHH không có HĐQT: Chủ tịch công ty có thể đóng vai “board”."],["Senior management","Quản lý cấp cao","Cấp điều hành cao nhất, giải trình với board về việc thực thi quyết định chiến lược; thường gồm CEO hoặc người đứng đầu.","Tổng giám đốc, Giám đốc tài chính, Giám đốc vận hành."],["Chief audit executive (CAE)","Trưởng/Giám đốc KTNB","Vai trò lãnh đạo, quản lý mọi mặt của chức năng KTNB và bảo đảm chất lượng dịch vụ theo GIAS. Chức danh có thể khác nhau.","“Trưởng ban Kiểm soát nội bộ” nếu thực hiện đúng vai trò này thì chính là CAE."],["Stakeholder","Bên liên quan","Bên có lợi ích trực tiếp hoặc gián tiếp với hoạt động và kết quả của tổ chức: board, quản lý, nhân viên, khách hàng, nhà cung cấp, cơ quan quản lý, kiểm toán độc lập, công chúng…","Ngân hàng cho vay đọc báo cáo tài chính của công ty là một bên liên quan."],["Assurance","Sự đảm bảo","Tuyên bố nhằm tăng mức tin cậy của các bên về quy trình GRC đối với một vấn đề, so với tiêu chí đã thiết lập.","“Quy trình kiểm quỹ vận hành hiệu quả so với Quy chế tài chính” là một tuyên bố đảm bảo."],["Assurance services","Dịch vụ đảm bảo","Đánh giá khách quan để đưa ra đảm bảo: tuân thủ, tài chính, hoạt động/hiệu quả, công nghệ. Mức đảm bảo có thể là có giới hạn hoặc hợp lý.","Kiểm toán tuân thủ quy định hóa đơn điện tử tại 10 cửa hàng."],["Limited vs reasonable assurance","Đảm bảo có giới hạn / hợp lý","Mức đảm bảo phụ thuộc bản chất, thời điểm và phạm vi thủ tục. Không bao giờ có đảm bảo tuyệt đối.","Chỉ phân tích xu hướng → có giới hạn; kiểm kê + chọn mẫu + đối chiếu chứng từ → hợp lý."],["Advisory services","Dịch vụ tư vấn (consulting)","Đưa lời khuyên mà không đưa ra đảm bảo, không nhận trách nhiệm quản lý; phạm vi do thỏa thuận.","Góp ý thiết kế quy trình đổi trả hàng mới trước khi ban hành."],["Engagement","Cuộc kiểm toán / nhiệm vụ","Một nhiệm vụ cụ thể gồm nhiều công việc để đạt một nhóm mục tiêu liên quan; có thể là đảm bảo hoặc tư vấn.","Cuộc kiểm toán quy trình nhập hàng quý IV."],["Activity under review","Đối tượng được kiểm toán","Chủ thể của cuộc kiểm toán: một khu vực, đơn vị, hoạt động, chức năng, quy trình hoặc hệ thống.","Quy trình thu ngân của cửa hàng Bình Thạnh."],["Criteria","Tiêu chí đánh giá","Mô tả trạng thái mong muốn của đối tượng được kiểm toán.","“Chênh lệch quỹ trên 50.000đ phải lập biên bản trong ngày.”"],["Finding","Phát hiện","Kết luận rằng có khoảng cách giữa tiêu chí và thực trạng (condition).","Tiêu chí: lập biên bản trong ngày; thực trạng: 7/30 ngày không lập → phát hiện."],["Root cause","Nguyên nhân gốc","Vấn đề cốt lõi giải thích khác biệt giữa tiêu chí và thực trạng.","Biên bản không được lập vì ca tối chỉ có 1 người, không ai đối chiếu."],["Governance","Quản trị","Tổ hợp quy trình và cấu trúc do board triển khai để thông tin, định hướng, quản lý và giám sát hoạt động hướng tới mục tiêu.","HĐQT ban hành quy chế, nhận báo cáo định kỳ, giám sát Tổng giám đốc."],["Risk","Rủi ro","Tác động tích cực hoặc tiêu cực của sự không chắc chắn lên mục tiêu.","Mở 50 cửa hàng: cơ hội tăng doanh thu và nguy cơ kiểm soát lỏng lẻo."],["Control","Kiểm soát","Mọi hành động của quản lý, board và các bên khác để quản lý rủi ro và tăng khả năng đạt mục tiêu.","Tách người lập phiếu chi, người duyệt và người chi tiền."],["Independence","Độc lập","Không bị các điều kiện làm suy giảm khả năng của chức năng KTNB thực hiện trách nhiệm một cách không thiên vị. Gắn với vị trí tổ chức.","CAE báo cáo trực tiếp HĐQT, HĐQT bổ nhiệm/miễn nhiệm CAE."],["Objectivity","Khách quan","Thái độ tư duy không thiên vị của cá nhân KTV khi đưa ra xét đoán nghề nghiệp.","KTV từng là kế toán thanh toán không đánh giá quy trình thanh toán mình phụ trách trong 12 tháng trước."],["Internal audit mandate","Thẩm quyền KTNB","Thẩm quyền, vai trò và trách nhiệm của KTNB, do board và/hoặc luật cấp.","Quyết định của HĐQT giao KTNB quyền tiếp cận mọi chứng từ, camera, nhân sự."],["Internal audit charter","Điều lệ KTNB","Văn bản chính thức nêu mandate, vị trí tổ chức, quan hệ báo cáo, phạm vi công việc, loại dịch vụ… Board phê duyệt.","Quy chế hoạt động của bộ phận KTNB được HĐQT ký ban hành."],["Methodologies","Phương pháp luận","Chính sách, quy trình, thủ tục do CAE thiết lập để hướng dẫn chức năng KTNB; ghi trong Sổ tay KTNB (internal audit manual).","Sổ tay quy định cách chấm điểm rủi ro, mẫu biên bản, mẫu theo dõi khắc phục."],["QAIP","Chương trình đảm bảo & nâng cao chất lượng","Chương trình do CAE lập để đánh giá việc tuân thủ GIAS, đạt mục tiêu hiệu quả và cải tiến liên tục; gồm đánh giá nội bộ và bên ngoài (tối thiểu 5 năm/lần).","Tự đánh giá hằng năm + thuê đơn vị độc lập đánh giá 5 năm/lần."],["Must / Should / May","Bắt buộc / Nên / Có thể","Must: yêu cầu vô điều kiện (Requirements). Should: ưu tiên, không bắt buộc. May: tùy chọn (Considerations).","“Phải” trình HĐQT phê duyệt kế hoạch (must) khác “nên” trao đổi định kỳ (should)."],["Essential conditions","Điều kiện thiết yếu","Ở Domain III: các việc HĐQT và quản lý cấp cao cần làm để KTNB hiệu quả (phê duyệt charter, bảo đảm tiếp cận, nguồn lực…).","HĐQT họp riêng với CAE không có mặt ban điều hành."],["Public interest","Lợi ích công chúng","Lợi ích kinh tế – xã hội và sự an lành chung của xã hội và các tổ chức trong đó.","KTNB giúp công ty báo cáo trung thực → nhà đầu tư, ngân hàng, người lao động đều được lợi."],["Significance","Mức độ quan trọng","Tầm quan trọng tương đối của một vấn đề trong bối cảnh, xét cả định lượng và định tính (độ lớn, bản chất, mức liên quan, tác động).","Chênh lệch quỹ nhỏ nhưng lặp lại ở một thu ngân có thể quan trọng hơn một lần chênh lệch lớn."]],"title":"Bài 1. Mục đích kiểm toán nội bộ & cấu trúc IPPF / GIAS 2024","traps":"<div class=\"trap\"><b>“17 nguyên tắc” hay “15 nguyên tắc”?<\/b>GIAS có <b>15 nguyên tắc<\/b>. Con số 17 là của <b>COSO Internal Control 2013<\/b>; 20 là của <b>COSO ERM 2017<\/b>; 10 “Core Principles” là của IPPF 2017 (đã bỏ).<\/div>\n  <div class=\"trap\"><b>“Should” không phải “must”<\/b>Đáp án viện dẫn mục <i>Considerations<\/i> (should/may) thì đó là thực hành khuyến nghị, không phải yêu cầu bắt buộc.<\/div>\n  <div class=\"trap\"><b>Tư vấn vẫn phải tuân thủ GIAS<\/b>Đáp án kiểu “dịch vụ tư vấn không chịu sự điều chỉnh của chuẩn mực” là sai.<\/div>\n  <div class=\"trap\"><b>Global Guidance không bắt buộc – Topical Requirements thì có<\/b>Đừng nhầm hai thành phần này. Topical Requirements bắt buộc <i>khi chủ đề nằm trong phạm vi<\/i>.<\/div>\n  <div class=\"trap\"><b>Độc lập ≠ Khách quan<\/b><b>Độc lập<\/b> (independence) gắn với <b>chức năng/vị trí tổ chức<\/b> – ví dụ CAE báo cáo trực tiếp HĐQT. <b>Khách quan<\/b> (objectivity) là <b>thái độ tư duy của cá nhân<\/b> KTV – không thiên vị.<\/div>\n  <div class=\"trap\"><b>Rủi ro không chỉ là tiêu cực<\/b>GIAS định nghĩa rủi ro là tác động <b>tích cực hoặc tiêu cực<\/b> của sự không chắc chắn lên mục tiêu.<\/div>\n  <div class=\"trap\"><b>“Board” không đồng nghĩa với HĐQT pháp lý<\/b>Có thể là Ủy ban kiểm toán, hoặc người đứng đầu tổ chức nếu không có cơ quan quản trị nào khác.<\/div>","week":1},"lessons/L02":{"cases":[{"gias":"<p><b>Mandate<\/b> = <b>thẩm quyền, vai trò và trách nhiệm<\/b> của chức năng KTNB, do <b>HĐQT<\/b> và/hoặc <b>luật<\/b> trao. Theo 6.1, CAE phải:<\/p><ul><li>Cung cấp cho HĐQT và quản lý cấp cao thông tin cần thiết để thiết lập mandate.<\/li><li><b>Phối hợp với các bên cung cấp đảm bảo khác<\/b> (trong và ngoài tổ chức) để hiểu vai trò của nhau, giúp HĐQT xác định phạm vi và loại dịch vụ.<\/li><li>Ghi hoặc dẫn chiếu mandate trong <b>Điều lệ KTNB do HĐQT phê duyệt<\/b>.<\/li><li><b>Định kỳ<\/b> đánh giá xem thay đổi hoàn cảnh có cần bàn lại mandate không.<\/li><\/ul><div class=\"tbl\"><table><tr><th>Essential conditions<\/th><th>Việc cần làm<\/th><\/tr><tr><td>HĐQT<\/td><td>Thảo luận với CAE và quản lý cấp cao về thẩm quyền, vai trò, trách nhiệm; <b>phê duyệt Điều lệ<\/b> (gồm mandate, phạm vi, loại dịch vụ)<\/td><\/tr><tr><td>Quản lý cấp cao<\/td><td>Tham gia thảo luận, <b>góp ý kỳ vọng<\/b>; <b>ủng hộ mandate<\/b> trong toàn tổ chức<\/td><\/tr><\/table><\/div>","opts":[["Đồng ý, vì Tổng giám đốc là người đề xuất và quản lý hành chính của CAE",false,"Quản lý cấp cao chỉ góp ý kỳ vọng; mandate do HĐQT (hoặc luật) trao."],["Cung cấp thông tin để HĐQT và ban điều hành thiết lập mandate; phối hợp với các bên đảm bảo khác để làm rõ vai trò; ghi mandate vào Điều lệ trình HĐQT phê duyệt",true,"Đúng trình tự của 6.1."],["Tự soạn và ban hành mandate để bảo đảm độc lập",false,"CAE không tự trao quyền cho mình; CAE cung cấp thông tin, HĐQT quyết định."],["Chờ cơ quan nhà nước quy định phạm vi",false,"Chỉ một số ngành/khu vực công có mandate theo luật; khi đó Điều lệ phải ghi các yêu cầu pháp lý."]],"q":"CAE nên làm gì?","scene":"<p>An Phát vừa bổ nhiệm CAE. Trong buổi họp đầu tiên, Tổng giám đốc nói: <i>“KTNB do tôi đề xuất thành lập. Tôi sẽ quyết định KTNB được kiểm tra những mảng nào, các anh chị cứ tập trung vào cửa hàng.”<\/i><\/p>","std":"GIAS 6.1","take":"Mandate = <b>Quyền + Vai trò + Trách nhiệm<\/b>. HĐQT <b>trao<\/b> · CAE <b>cung cấp thông tin<\/b> · Ban điều hành <b>góp ý & ủng hộ<\/b>.","title":"Ai trao quyền cho KTNB?"},{"gias":"<p>CAE phải <b>xây dựng và duy trì<\/b> Điều lệ KTNB, tối thiểu nêu:<\/p><div class=\"tbl\"><table><tr><th>#<\/th><th>Nội dung tối thiểu (6.2)<\/th><\/tr><tr><td>1<\/td><td><b>Mục đích KTNB<\/b> (Purpose of Internal Auditing)<\/td><\/tr><tr><td>2<\/td><td><b>Cam kết tuân thủ GIAS<\/b><\/td><\/tr><tr><td>3<\/td><td><b>Mandate<\/b>: phạm vi và loại dịch vụ; trách nhiệm của HĐQT và kỳ vọng của HĐQT về sự hỗ trợ của ban điều hành<\/td><\/tr><tr><td>4<\/td><td><b>Vị trí tổ chức và quan hệ báo cáo<\/b><\/td><\/tr><\/table><\/div><p>CAE phải <b>thảo luận dự thảo với HĐQT và quản lý cấp cao<\/b>. HĐQT <b>phê duyệt<\/b> và <b>rà soát lại<\/b> khi có thay đổi (CAE mới; thay đổi loại, mức độ, mối liên hệ của rủi ro). Nếu CAE có vai trò ngoài KTNB, Điều lệ còn phải ghi trách nhiệm và biện pháp bảo vệ (7.1 – học ở Bài 3).<\/p>","opts":[["Để Giám đốc tài chính ký trước, báo HĐQT sau",false,"Điều lệ phải được HĐQT phê duyệt; GĐTC lại là đối tượng KTNB sẽ kiểm toán."],["CAE tự ký vì là người soạn",false,"CAE soạn và duy trì Điều lệ, nhưng không phê duyệt."],["Thảo luận dự thảo với HĐQT và quản lý cấp cao để xác nhận đúng kỳ vọng, rồi trình HĐQT phê duyệt (có thể xin ý kiến bằng văn bản nếu cần nhanh)",true,"Đúng 6.2: CAE soạn – thảo luận – HĐQT phê duyệt."],["Không cần Điều lệ vì Điều lệ công ty đã nhắc đến KTNB",false,"6.2: CAE phải xây dựng và duy trì Điều lệ KTNB."]],"q":"Phương án phù hợp nhất?","scene":"<p>CAE soạn xong dự thảo Quy chế hoạt động KTNB. Giám đốc tài chính đề nghị: <i>“HĐQT 3 tháng mới họp một lần, để tôi ký ban hành trước cho kịp mùa kiểm kê cuối năm.”<\/i><\/p>","std":"GIAS 6.2","take":"Mẹo nhớ 4 nội dung: <span class=\"mnemo\">“Mục – Cam – Man – Vị”<\/span><br>Mục đích · Cam kết GIAS · Mandate · Vị trí & báo cáo.","title":"Ai ký Điều lệ KTNB?"},{"gias":"<p><b>Essential conditions (6.3)<\/b> – HĐQT thể hiện sự ủng hộ bằng cách:<\/p><ul><li>Cùng quản lý cấp cao bảo đảm KTNB <b>tiếp cận không hạn chế<\/b> dữ liệu, hồ sơ, thông tin, nhân sự và tài sản vật chất.<\/li><li>Quy định CAE báo cáo ở cấp đủ để thực hiện mandate.<\/li><li>Phê duyệt <b>Điều lệ, kế hoạch KTNB, ngân sách và kế hoạch nguồn lực<\/b>.<\/li><li>Hỏi quản lý cấp cao và CAE xem có hạn chế nào về phạm vi, tiếp cận, thẩm quyền, nguồn lực.<\/li><li><b>Họp định kỳ với CAE không có mặt quản lý cấp cao<\/b>.<\/li><\/ul><p><b>13.3:<\/b> hạn chế phạm vi (vd. hạn chế tiếp cận nhân sự, cơ sở, dữ liệu) phải được bàn với quản lý; không giải quyết được thì CAE <b>nâng lên HĐQT<\/b> theo phương pháp đã thiết lập.<\/p>","opts":[["Nhờ nhân viên IT lấy dữ liệu bằng tài khoản quản trị mà không thông báo",false,"Vi phạm chính trực và quy trình; quyền tiếp cận phải được thực hiện đúng kênh."],["Bỏ phần camera và kết luận dựa trên chứng từ, không nêu hạn chế",false,"Che giấu hạn chế phạm vi; báo cáo cuối phải giải thích hạn chế phạm vi (15.1)."],["Viện dẫn quyền tiếp cận không hạn chế trong Điều lệ, trao đổi với quản lý để giải quyết; nếu không được, CAE nâng hạn chế phạm vi lên HĐQT",true,"Đúng: hạn chế tiếp cận là hạn chế phạm vi (13.3) và HĐQT có trách nhiệm hỗ trợ tiếp cận (6.3)."],["Hủy cuộc kiểm toán ở cửa hàng này",false,"Né tránh vấn đề; rủi ro vẫn còn và HĐQT không được biết."]],"q":"Theo GIAS, cách xử lý PHÙ HỢP NHẤT?","scene":"<p>Đoàn KTNB kiểm tra hao hụt tiền mặt tại cửa hàng Q.7. Cửa hàng trưởng từ chối cung cấp dữ liệu camera quầy thu ngân: <i>“Phải có Giám đốc vùng đồng ý bằng văn bản.”<\/i> Giám đốc vùng không trả lời sau 1 tuần.<\/p>","std":"GIAS 6.3 · 13.3","take":"Bị chặn tiếp cận = <b>hạn chế phạm vi<\/b> → bàn với quản lý → không xong thì <b>CAE báo HĐQT<\/b>. Không lách, không giấu.","title":"Cửa hàng trưởng không cho xem camera"},{"gias":"<p>8.1: Khi CAE bất đồng với quản lý cấp cao hoặc bên liên quan về <b>phạm vi, phát hiện<\/b> hay khía cạnh khác ảnh hưởng đến khả năng thực hiện trách nhiệm, CAE phải <b>cung cấp cho HĐQT dữ kiện và hoàn cảnh<\/b> để HĐQT xem xét có can thiệp hay không.<\/p><p>CAE phải báo cáo HĐQT và quản lý cấp cao:<\/p><div class=\"tbl\"><table><tr><th>#<\/th><th>Phải báo cáo (8.1)<\/th><\/tr><tr><td>1<\/td><td>Kế hoạch KTNB, ngân sách và các điều chỉnh đáng kể<\/td><\/tr><tr><td>2<\/td><td>Thay đổi có thể ảnh hưởng đến mandate hoặc Điều lệ<\/td><\/tr><tr><td>3<\/td><td>Nguy cơ suy giảm độc lập<\/td><\/tr><tr><td>4<\/td><td>Kết quả dịch vụ KTNB (kết luận, chủ đề xuyên suốt, đảm bảo, tư vấn, theo dõi)<\/td><\/tr><tr><td>5<\/td><td>Kết quả chương trình đảm bảo và nâng cao chất lượng (QAIP)<\/td><\/tr><\/table><\/div><p>HĐQT đặt kỳ vọng về <b>tần suất<\/b> báo cáo, <b>tiêu chí<\/b> vấn đề cần nâng lên HĐQT (vd. rủi ro vượt ngưỡng chịu đựng) và <b>quy trình<\/b> nâng vấn đề.<\/p>","opts":[["Bỏ vấn đề khỏi phạm vi để giữ quan hệ với ban điều hành",false,"KTNB không được che giấu hoặc bỏ sót thông tin quan trọng (1.1)."],["Cung cấp cho HĐQT dữ kiện và hoàn cảnh của bất đồng để HĐQT cân nhắc có cần can thiệp với ban điều hành",true,"Đúng 8.1."],["Gửi thông tin cho cơ quan báo chí",false,"Vi phạm bảo mật (5.2); chưa qua kênh quản trị nội bộ."],["Tự mở rộng phạm vi mà không thông báo ai",false,"Thay đổi phạm vi phải được CAE phê duyệt và trao đổi với quản lý (13.1, 13.3)."]],"q":"CAE nên làm gì?","scene":"<p>Kiểm toán quy trình mua hàng phát hiện chính sách chiết khấu đặc biệt cho một nhà phân phối có quan hệ thân quen với ban điều hành. Tổng giám đốc yêu cầu CAE <i>“để vấn đề chiết khấu ra ngoài phạm vi, đây là quyết định kinh doanh”<\/i>. CAE không đồng ý.<\/p>","std":"GIAS 8.1","take":"5 thứ luôn báo HĐQT: <span class=\"mnemo\">“Kế – Man – Độc – Kết – Chất”<\/span><br>Kế hoạch & ngân sách · Mandate/Điều lệ thay đổi · Độc lập bị đe dọa · Kết quả · Chất lượng.","title":"Tổng giám đốc muốn bỏ một phát hiện"},{"gias":"<p>8.2: CAE phải đánh giá nguồn lực có <b>đủ<\/b> để thực hiện mandate và kế hoạch không. Nếu không, CAE phải <b>xây dựng chiến lược<\/b> để có đủ nguồn lực và <b>báo HĐQT<\/b> về tác động cùng cách xử lý thiếu hụt.<\/p><p>Essential conditions: HĐQT cùng quản lý cấp cao cung cấp đủ nguồn lực; <b>bàn với CAE ít nhất hằng năm<\/b> về mức đủ (cả số lượng lẫn năng lực); cân nhắc tác động và cùng khắc phục.<\/p><p class=\"en\">Liên hệ 9.4: CAE phải truyền đạt kịp thời tác động của hạn chế nguồn lực lên phạm vi bao phủ của kế hoạch.<\/p>","opts":[["Âm thầm thu hẹp kế hoạch, không cần thông báo",false,"Ảnh hưởng của hạn chế nguồn lực phải được báo HĐQT."],["Yêu cầu nhân viên làm thêm giờ để bù phần thiếu",false,"Không giải quyết gốc vấn đề và không minh bạch với HĐQT."],["Đánh giá mức đủ của nguồn lực, xây dựng chiến lược bổ sung (vd. thuê ngoài một phần, dùng phân tích dữ liệu) và báo HĐQT tác động của việc thiếu nguồn lực cùng cách xử lý",true,"Đúng 8.2."],["Thuê ngoài mà không báo cáo",false,"Thiếu minh bạch; HĐQT phê duyệt ngân sách và kế hoạch nguồn lực."]],"q":"CAE phải làm gì?","scene":"<p>Do kết quả kinh doanh giảm, ngân sách KTNB năm sau bị cắt 30%. Với nguồn lực còn lại, KTNB chỉ kiểm tra được khoảng 60% số cửa hàng xếp hạng rủi ro cao trong kế hoạch.<\/p>","std":"GIAS 8.2","take":"Thiếu nguồn lực → <b>chiến lược bổ sung + báo HĐQT tác động<\/b>. HĐQT bàn mức đủ <b>≥ hằng năm<\/b>.","title":"Ngân sách bị cắt 30%"},{"gias":"<p><b>QAIP<\/b> (chương trình đảm bảo và nâng cao chất lượng) do CAE xây dựng, gồm hai loại đánh giá:<\/p><div class=\"tbl\"><table><tr><th>Loại<\/th><th>Cách làm<\/th><th>Tần suất / báo cáo<\/th><\/tr><tr><td><b>Nội bộ<\/b> (12.1)<\/td><td>Giám sát liên tục + tự đánh giá định kỳ<\/td><td>Báo HĐQT và quản lý cấp cao <b>ít nhất hằng năm<\/b><\/td><\/tr><tr><td><b>Bên ngoài<\/b> (8.4)<\/td><td>Đánh giá viên/nhóm <b>đủ năng lực, độc lập<\/b>, <b>≥ 1 người có CIA còn hiệu lực<\/b>; hoặc tự đánh giá có xác nhận độc lập<\/td><td><b>Ít nhất 5 năm/lần<\/b>; báo cáo khi hoàn thành; HĐQT nhận <b>kết quả đầy đủ trực tiếp từ đánh giá viên<\/b><\/td><\/tr><\/table><\/div><p>HĐQT phê duyệt kế hoạch đánh giá bên ngoài (phạm vi, tần suất, năng lực và tính độc lập của đánh giá viên, lý do chọn tự đánh giá có xác nhận độc lập), phê duyệt kế hoạch khắc phục và theo dõi tiến độ. HĐQT cũng <b>phê duyệt mục tiêu hiệu quả hoạt động của KTNB ít nhất hằng năm<\/b> (8.3).<\/p>","opts":[["Giữ nguyên kế hoạch, vì quan trọng là có đánh giá",false,"Thiếu điều kiện về người có CIA, về HĐQT phê duyệt kế hoạch và nhận kết quả trực tiếp."],["Lập kế hoạch đánh giá bên ngoài, thảo luận và trình HĐQT duyệt; chọn đánh giá viên đủ năng lực, độc lập, có ít nhất một người giữ chứng chỉ CIA còn hiệu lực; HĐQT nhận kết quả đầy đủ trực tiếp từ đánh giá viên",true,"Đúng 8.4."],["Thay bằng tự đánh giá nội bộ hằng năm",false,"Tự đánh giá chỉ thay thế được nếu có xác nhận độc lập (self-assessment with independent validation)."],["Hoãn đến năm thứ 10 vì bộ phận còn nhỏ",false,"Tối thiểu 5 năm/lần."]],"q":"Phương án nào phù hợp nhất với GIAS?","scene":"<p>KTNB An Phát hoạt động từ 2021, chưa từng được đánh giá chất lượng từ bên ngoài. CAE định mời một chuyên gia quen, không có chứng chỉ CIA; kết quả sẽ gửi CAE để CAE tóm tắt lại cho HĐQT.<\/p>","std":"GIAS 8.3 · 8.4","take":"QAIP = <b>Nội bộ<\/b> (báo ≥ hằng năm) + <b>Bên ngoài<\/b> (≥ 5 năm · ≥ 1 CIA · kết quả gửi <b>thẳng HĐQT<\/b>).","title":"Đánh giá chất lượng từ bên ngoài"},{"gias":"<p>Domain III yêu cầu CAE <b>thảo luận các essential conditions<\/b> với HĐQT và quản lý cấp cao (mục đích KTNB, các điều kiện thiết yếu, tác động nếu thiếu). Cần bàn lại khi: chuẩn mực thay đổi lớn hoặc lập KTNB mới; CAE mới; thay đổi quan hệ HĐQT – CAE; thay đổi cơ cấu quản lý cấp cao.<\/p><p>Khi bất đồng:<\/p><ul><li>CAE <b>phải<\/b> nhấn mạnh, kèm ví dụ, việc thiếu điều kiện ảnh hưởng thế nào; <b>nên<\/b> bàn phương án thay thế.<\/li><li>Nếu thống nhất điều kiện đó không cần: CAE <b>phải lập văn bản<\/b> lý do và các <b>điều kiện bù đắp<\/b>.<\/li><li>Nếu CAE không đồng ý với lý do: có thể kết luận KTNB <b>không tuân thủ được GIAS<\/b>; ghi lại lý do, chia sẻ với HĐQT, quản lý cấp cao và cung cấp cho đánh giá viên chất lượng bên ngoài.<\/li><\/ul><p class=\"en\">Nếu vị trí CAE bị trống, HĐQT nên bổ nhiệm người tạm thời.<\/p>","opts":[["Chấp nhận ngay, không cần ghi lại",false,"Nếu đồng ý bỏ một điều kiện thiết yếu, CAE phải lập văn bản lý do và điều kiện bù đắp."],["Nêu ví dụ cụ thể cho thấy thiếu điều kiện này ảnh hưởng thế nào đến KTNB, bàn phương án thay thế; nếu thống nhất bỏ thì lập văn bản lý do và điều kiện bù đắp; nếu không thống nhất, ghi lại lý do và có thể kết luận KTNB không tuân thủ được GIAS",true,"Đúng hướng dẫn về bất đồng essential conditions."],["Báo cáo IIA để IIA can thiệp",false,"IIA không can thiệp vào quản trị nội bộ của tổ chức."],["Từ chức ngay",false,"Phản ứng quá mức; GIAS hướng dẫn trao đổi, tìm phương án thay thế và ghi nhận."]],"q":"CAE nên xử lý thế nào?","scene":"<p>Chủ tịch HĐQT cho rằng việc họp riêng với CAE mà không có Tổng giám đốc là <i>“không cần thiết, gây mất đoàn kết”<\/i>.<\/p>","std":"Domain III – Essential conditions","take":"Bất đồng về điều kiện thiết yếu → <b>Giải thích bằng ví dụ → Tìm phương án thay thế → Ghi lại<\/b>.","title":"HĐQT không muốn họp riêng với CAE"}],"code":"C2","eyebrow":"IAP (CIA Part 1) · Tuần 2 · Chủ đề C2 · Phần I – Nền tảng KTNB (35%)","footer":"<p><b>Nguồn:<\/b> The IIA – Global Internal Audit Standards 2024 (bản rút gọn, T2) · The IIA – CIA Part 1 Expanded Test Specifications V2.09.2024 (T1), Section A · Kế hoạch tự học Bước 1 – IAP v1.0.<\/p>","goals":"<ol><li>Giải thích <b>mandate<\/b>: ai trao, gồm gì, khi nào rà soát lại.<\/li><li>Kể đủ <b>4 nội dung tối thiểu<\/b> của Điều lệ KTNB (charter) và quy trình soạn – thảo luận – phê duyệt.<\/li><li>Phân biệt việc của <b>CAE<\/b> (Requirements) và việc của <b>HĐQT, quản lý cấp cao<\/b> (Essential Conditions).<\/li><li>Biết <b>5 nhóm thông tin<\/b> CAE phải báo cáo HĐQT và cách xử lý khi bất đồng với ban điều hành.<\/li><li>Nắm các mốc: nguồn lực (bàn ≥ hằng năm), đánh giá chất lượng nội bộ (báo cáo ≥ hằng năm), bên ngoài (≥ 5 năm, ≥ 1 người có CIA).<\/li><\/ol><p class=\"en\">Bối cảnh chung: Công ty Bán lẻ An Phát – 120 cửa hàng, có HĐQT và Ủy ban kiểm toán, vừa thành lập bộ phận KTNB 3 người.<\/p>","id":"L02","lead":"Học qua 7 tình huống tại một chuỗi bán lẻ giả định. Bài bám Domain III của GIAS: <b>Nguyên tắc 6 – Được HĐQT ủy quyền<\/b> và <b>Nguyên tắc 8 – Được HĐQT giám sát<\/b>.","next":"<ol><li><b>Đọc gốc (≈ 60 phút):<\/b> GIAS Domain III – phần mở đầu, Nguyên tắc 6 (6.1–6.3) và Nguyên tắc 8 (8.1–8.4), bản rút gọn trang 25–36.<\/li><li><b>Tự tóm tắt 1 trang:<\/b> bảng “CAE – HĐQT – Quản lý cấp cao” bằng lời của chị; đối chiếu với Quy chế GSHĐ v1.1 xem có tương đương “mandate”, “charter” không.<\/li><li><b>Luyện tập theo kế hoạch:<\/b> Bộ 1 câu 1–3 (trong tài liệu Kế hoạch v1.0).<\/li><li><b>K2 (1 giờ):<\/b> Luật Kế toán – sổ kế toán, BCTC, quyền và trách nhiệm của Kế toán trưởng. Câu tự kiểm: Quyền độc lập chuyên môn của KTT gồm gì?<\/li><li><b>Sổ lỗi:<\/b> ghi các câu sai ở trắc nghiệm và các tình huống không chọn đúng ngay lần đầu.<\/li><\/ol><div class=\"note\"><b class=\"h\">Bài sau – Bài 3 (C3)<\/b>Độc lập tổ chức – GIAS Nguyên tắc 7.<\/div>","order":2,"pills":["⏱ ~90 phút: 50 tình huống · 15 thẻ thuật ngữ · 25 trắc nghiệm","📄 GIAS Domain III: 6.1–6.3, 8.1–8.4","🎯 Đề cương A.2, A.3"],"quiz":[{"a":1,"e":"Mandate do HĐQT trao, hoặc luật trong một số ngành, khu vực công.","o":["CAE","HĐQT và/hoặc luật","Tổng giám đốc","Kiểm toán độc lập"],"q":"Theo GIAS, mandate của KTNB được trao bởi:","s":"GIAS Nguyên tắc 6; 6.1"},{"a":3,"e":"Danh sách cuộc kiểm toán thuộc kế hoạch KTNB (9.4), không thuộc Điều lệ.","o":["Mục đích KTNB","Cam kết tuân thủ GIAS","Vị trí tổ chức và quan hệ báo cáo","Danh sách các cuộc kiểm toán trong năm"],"q":"Nội dung nào KHÔNG thuộc yêu cầu tối thiểu của Điều lệ KTNB?","s":"GIAS 6.2"},{"a":1,"e":"CAE soạn và duy trì; HĐQT phê duyệt.","o":["HĐQT","CAE","Tổng giám đốc","Ủy ban kiểm toán"],"q":"Ai có trách nhiệm xây dựng và duy trì Điều lệ KTNB?","s":"GIAS 6.2"},{"a":1,"e":"6.1 yêu cầu CAE phối hợp với các bên đảm bảo khác.","o":["Tự quyết định phạm vi","Phối hợp với các bên cung cấp đảm bảo khác trong và ngoài tổ chức để hiểu vai trò của nhau","Sao chép mandate của công ty khác cùng ngành","Chờ kiểm toán độc lập đề xuất"],"q":"Để giúp HĐQT xác định phạm vi và loại dịch vụ KTNB, CAE phải:","s":"GIAS 6.1; 9.5"},{"a":2,"e":"Essential conditions là việc HĐQT và quản lý cấp cao cần làm để KTNB hiệu quả.","o":["Từng KTV","CAE","HĐQT và quản lý cấp cao","Đánh giá viên chất lượng bên ngoài"],"q":"“Essential conditions” trong Domain III mô tả trách nhiệm của:","s":"GIAS Domain III"},{"a":1,"e":"Họp riêng với CAE là một essential condition của 6.3. Chương trình làm việc do CAE phê duyệt (13.6).","o":["Phê duyệt từng chương trình làm việc của cuộc kiểm toán","Họp định kỳ với CAE không có mặt quản lý cấp cao","Ký thay CAE các báo cáo cuối cùng","Tham gia kiểm kê cùng đoàn KTNB"],"q":"Hoạt động nào là ví dụ HĐQT thể hiện sự ủng hộ KTNB theo 6.3?","s":"GIAS 6.3"},{"a":3,"e":"8.1 liệt kê kế hoạch, ngân sách, thay đổi mandate, nguy cơ suy giảm độc lập, kết quả, QAIP; không gồm hồ sơ làm việc chi tiết.","o":["Kế hoạch và ngân sách KTNB","Nguy cơ suy giảm độc lập","Kết quả chương trình QAIP","Toàn bộ hồ sơ làm việc chi tiết của từng cuộc kiểm toán"],"q":"CAE KHÔNG bắt buộc phải báo cáo HĐQT nội dung nào sau đây?","s":"GIAS 8.1"},{"a":1,"e":"8.1: đưa dữ kiện cho HĐQT quyết định có can thiệp hay không.","o":["Làm theo Tổng giám đốc","Cung cấp cho HĐQT dữ kiện và hoàn cảnh để HĐQT xem xét có can thiệp không","Tạm dừng mọi cuộc kiểm toán","Báo cơ quan quản lý nhà nước"],"q":"CAE và Tổng giám đốc bất đồng về phạm vi một cuộc kiểm toán, ảnh hưởng đến khả năng thực hiện trách nhiệm. CAE phải:","s":"GIAS 8.1"},{"a":1,"e":"8.2 yêu cầu chiến lược bổ sung và báo HĐQT.","o":["Thu hẹp kế hoạch, không cần thông báo","Xây dựng chiến lược để có đủ nguồn lực và báo HĐQT tác động cùng cách xử lý","Chỉ báo Tổng giám đốc","Chờ đến kỳ đánh giá chất lượng bên ngoài"],"q":"Nguồn lực không đủ để thực hiện kế hoạch KTNB. Yêu cầu nào ĐÚNG với CAE?","s":"GIAS 8.2"},{"a":1,"e":"Essential condition của 8.2: ít nhất hằng năm.","o":["Mỗi quý","Hằng năm","3 năm một lần","5 năm một lần"],"q":"HĐQT nên bàn với CAE về mức đủ của nguồn lực KTNB tối thiểu:","s":"GIAS 8.2"},{"a":1,"e":"8.4.","o":["Thực hiện 3 năm một lần bởi bộ phận KTNB","Ít nhất 5 năm một lần, bởi người/nhóm đủ năng lực, độc lập, có ít nhất một người giữ CIA còn hiệu lực","Hằng năm, bởi kiểm toán độc lập báo cáo tài chính","Chỉ bắt buộc nếu cơ quan quản lý yêu cầu"],"q":"Phát biểu nào ĐÚNG về đánh giá chất lượng bên ngoài?","s":"GIAS 8.4"},{"a":1,"e":"Essential condition của 8.4.","o":["Qua bản tóm tắt của CAE","Đầy đủ, trực tiếp từ đánh giá viên","Qua Tổng giám đốc","Không cần gửi HĐQT"],"q":"Kết quả đánh giá chất lượng bên ngoài nên được HĐQT nhận như thế nào?","s":"GIAS 8.4"},{"a":0,"e":"8.3: kết quả đánh giá nội bộ báo ít nhất hằng năm; đánh giá bên ngoài báo khi hoàn thành.","o":["Ít nhất hằng năm","Khi có yêu cầu","5 năm một lần","Chỉ khi có thiếu sót"],"q":"Kết quả đánh giá chất lượng nội bộ phải được báo HĐQT và quản lý cấp cao:","s":"GIAS 8.3"},{"a":1,"e":"Domain III – Disagreements on Essential Conditions.","o":["Không cần làm gì thêm","Lập văn bản lý do và các điều kiện thay thế bù đắp","Báo IIA","Ngừng tuyên bố tuân thủ GIAS"],"q":"HĐQT và CAE thống nhất rằng một essential condition không cần thiết. CAE phải:","s":"GIAS Domain III"},{"a":0,"e":"Essential condition của 8.3.","o":["Ít nhất hằng năm","5 năm một lần","Khi CAE thay đổi","Không cần phê duyệt"],"q":"Mục tiêu hiệu quả hoạt động của KTNB được HĐQT phê duyệt:","s":"GIAS 8.3; 12.2"}],"short":"Mandate, Điều lệ KTNB và vai trò của HĐQT","summary":"<div class=\"tbl\"><table><tr><th>Chủ đề<\/th><th>CAE (Requirements)<\/th><th>HĐQT<\/th><th>Quản lý cấp cao<\/th><\/tr><tr><td><b>Mandate<\/b><\/td><td>Cung cấp thông tin; phối hợp các bên đảm bảo; ghi vào Điều lệ; định kỳ rà soát<\/td><td>Trao mandate; phê duyệt Điều lệ<\/td><td>Góp ý kỳ vọng; ủng hộ mandate<\/td><\/tr><tr><td><b>Điều lệ<\/b><\/td><td>Soạn, duy trì; thảo luận với HĐQT và ban điều hành<\/td><td>Phê duyệt; rà soát khi có thay đổi<\/td><td>Góp ý nội dung<\/td><\/tr><tr><td><b>Hỗ trợ<\/b><\/td><td>Cung cấp thông tin để KTNB được công nhận<\/td><td>Bảo đảm tiếp cận không hạn chế; duyệt kế hoạch, ngân sách; họp riêng với CAE<\/td><td>Bảo đảm tiếp cận; ủng hộ KTNB<\/td><\/tr><tr><td><b>Tương tác<\/b><\/td><td>Báo 5 nhóm thông tin; báo bất đồng với ban điều hành<\/td><td>Đặt tần suất, tiêu chí, quy trình nâng vấn đề<\/td><td>Chia sẻ góc nhìn về rủi ro<\/td><\/tr><tr><td><b>Nguồn lực<\/b><\/td><td>Đánh giá mức đủ; chiến lược bổ sung; báo tác động<\/td><td>Bàn mức đủ ≥ hằng năm<\/td><td>Cùng cung cấp nguồn lực<\/td><\/tr><tr><td><b>Chất lượng<\/b><\/td><td>Lập QAIP; báo nội bộ ≥ hằng năm; lập kế hoạch đánh giá ngoài ≥ 5 năm<\/td><td>Duyệt mục tiêu hiệu quả ≥ hằng năm; duyệt kế hoạch đánh giá ngoài; nhận kết quả trực tiếp<\/td><td>Góp ý mục tiêu; tham gia đánh giá CAE hằng năm<\/td><\/tr><\/table><\/div>","terms":[["Internal audit mandate","Mandate KTNB","Thẩm quyền, vai trò và trách nhiệm của chức năng KTNB, do HĐQT và/hoặc luật trao.","HĐQT quyết định KTNB được kiểm toán mọi đơn vị, kể cả công ty con và hệ thống CNTT."],["Internal audit charter","Điều lệ KTNB","Văn bản chính thức gồm mandate, vị trí tổ chức, quan hệ báo cáo, phạm vi, loại dịch vụ… CAE soạn, HĐQT phê duyệt.","Quy chế hoạt động KTNB của An Phát do HĐQT ký ban hành."],["Essential conditions","Điều kiện thiết yếu","Các việc HĐQT và quản lý cấp cao cần làm để KTNB hiệu quả, nêu trong từng chuẩn mực của Domain III.","HĐQT họp riêng với CAE mỗi quý."],["Unrestricted access","Tiếp cận không hạn chế","Quyền tiếp cận dữ liệu, hồ sơ, thông tin, nhân sự và tài sản vật chất cần thiết để thực hiện mandate.","KTNB được xem dữ liệu camera và kiểm quỹ đột xuất tại mọi cửa hàng."],["Scope limitation","Hạn chế phạm vi","Điều kiện ngăn KTV làm việc như kế hoạch: thiếu nguồn lực, bị hạn chế tiếp cận nhân sự, cơ sở, dữ liệu.","Cửa hàng không cho xem camera → hạn chế phạm vi, phải nêu trong báo cáo."],["Senior management","Quản lý cấp cao","Cấp điều hành cao nhất, giải trình với HĐQT về thực thi chiến lược; thường gồm Tổng giám đốc.","Tổng giám đốc, Giám đốc tài chính, Giám đốc vận hành."],["Escalation","Nâng vấn đề lên cấp cao hơn","Đưa vấn đề chưa giải quyết lên HĐQT theo tiêu chí và quy trình HĐQT đã đặt.","Rủi ro vượt ngưỡng chịu đựng mà ban điều hành không xử lý → báo HĐQT."],["QAIP","Chương trình đảm bảo & nâng cao chất lượng","Chương trình đánh giá việc tuân thủ GIAS, mức đạt mục tiêu hiệu quả và cải tiến liên tục; gồm đánh giá nội bộ và bên ngoài.","Tự đánh giá hằng năm + đánh giá bên ngoài 5 năm/lần."],["External quality assessment","Đánh giá chất lượng bên ngoài","Đánh giá bởi người/nhóm đủ năng lực, độc lập, ≥ 1 người có CIA; ít nhất 5 năm/lần.","Thuê một công ty tư vấn độc lập đánh giá KTNB năm 2026."],["Self-assessment with independent validation","Tự đánh giá có xác nhận độc lập","Cách thay thế đánh giá bên ngoài: KTNB tự đánh giá, bên độc lập đủ năng lực xác nhận kết quả.","KTNB tự chấm theo bộ tiêu chí GIAS, chuyên gia bên ngoài rà soát và xác nhận."],["Performance objectives","Mục tiêu hiệu quả hoạt động","Mục tiêu đo hiệu quả của KTNB, do CAE xây dựng có tham khảo HĐQT, ban điều hành; HĐQT phê duyệt ít nhất hằng năm.","≥ 90% kế hoạch hoàn thành; ≥ 80% khuyến nghị được khắc phục đúng hạn."]],"title":"Bài 2. Mandate, Điều lệ KTNB và vai trò của HĐQT","traps":"<div class=\"trap\"><b class=\"h\">CAE soạn ≠ CAE phê duyệt<\/b>Điều lệ, kế hoạch, ngân sách: CAE <b>soạn<\/b>, HĐQT <b>phê duyệt<\/b>. Đáp án “CAE phê duyệt Điều lệ” là sai.<\/div><div class=\"trap\"><b class=\"h\">Quản lý cấp cao “góp ý”, không “quyết định”<\/b>Ban điều hành góp ý kỳ vọng và ủng hộ mandate; quyền phê duyệt thuộc HĐQT.<\/div><div class=\"trap\"><b class=\"h\">Requirements khác Essential conditions<\/b>Requirements là nghĩa vụ của <b>CAE<\/b> (must). Essential conditions mô tả việc của <b>HĐQT và quản lý cấp cao<\/b>; CAE không bị coi là vi phạm nếu HĐQT không làm, nhưng phải thảo luận và ghi lại.<\/div><div class=\"trap\"><b class=\"h\">Các con số dễ nhầm<\/b>Xác nhận độc lập: <b>≥ hằng năm<\/b> · Bàn mức đủ nguồn lực: <b>≥ hằng năm<\/b> · Báo đánh giá nội bộ: <b>≥ hằng năm<\/b> · Đánh giá bên ngoài: <b>≥ 5 năm<\/b> · Không đánh giá việc mình phụ trách trong <b>12 tháng<\/b> trước.<\/div><div class=\"trap\"><b class=\"h\">Kết quả đánh giá bên ngoài gửi cho ai?<\/b>HĐQT nhận <b>kết quả đầy đủ trực tiếp từ đánh giá viên<\/b>, không qua CAE tóm tắt.<\/div>","week":2},"lessons/L03":{"cases":[{"gias":"<p><b>Độc lập<\/b> (independence) = không bị các điều kiện làm suy giảm khả năng của chức năng KTNB thực hiện trách nhiệm một cách không thiên vị. KTNB chỉ đạt mục đích khi CAE <b>báo cáo trực tiếp HĐQT<\/b>, đủ năng lực và được đặt ở <b>cấp đủ cao<\/b> để làm việc <b>không bị can thiệp<\/b>.<\/p><div class=\"tbl\"><table><tr><th>Tuyến báo cáo<\/th><th>Nội dung điển hình<\/th><\/tr><tr><td><b>Trực tiếp với HĐQT<\/b><\/td><td>Phê duyệt Điều lệ, kế hoạch, ngân sách; bổ nhiệm, miễn nhiệm CAE; nhận kết quả; họp riêng với CAE<\/td><\/tr><tr><td><b>Hành chính<\/b> – thường với người đứng đầu ban điều hành (vd. Tổng giám đốc)<\/td><td>Hỗ trợ hoạt động hằng ngày: nghỉ phép, văn phòng, quy trình nhân sự; tạo vị thế để kết quả KTNB được quan tâm đúng mức<\/td><\/tr><\/table><\/div><p class=\"en\">Tài liệu cũ (IPPF 2017) gọi tuyến thứ nhất là “functional reporting”; GIAS 2024 dùng cụm “direct reporting relationship with the board”.<\/p>","opts":[["Giữ nguyên, vì GĐTC hiểu rõ rủi ro tài chính nhất",false,"KTNB phải đánh giá chính khối tài chính → suy giảm độc lập."],["CAE báo cáo trực tiếp HĐQT (vd. Ủy ban kiểm toán); về hành chính hằng ngày báo cáo Tổng giám đốc",true,"Đúng mô hình GIAS."],["CAE báo cáo Tổng giám đốc về mọi mặt",false,"Thiếu quan hệ báo cáo trực tiếp với HĐQT."],["KTNB không báo cáo ai để giữ độc lập tuyệt đối",false,"KTNB phải giải trình trực tiếp với HĐQT; độc lập không có nghĩa là tách rời."]],"q":"Cách bố trí nào thể hiện TỐT NHẤT độc lập tổ chức?","scene":"<p>Sơ đồ tổ chức mới của An Phát đặt bộ phận KTNB dưới Giám đốc tài chính. GĐTC phê duyệt kế hoạch KTNB, ngân sách, đánh giá hiệu quả và quyết định lương của CAE. Lý do: <i>“KTNB cần gần số liệu tài chính.”<\/i><\/p>","std":"GIAS 7.1 · Domain IV","take":"<span class=\"mnemo\">“Chuyên môn lên HĐQT – Hành chính sang Tổng giám đốc”<\/span><br>Cấp đủ cao để <b>đưa vấn đề thẳng tới quản lý cấp cao<\/b> và <b>nâng lên HĐQT<\/b> khi cần.","title":"CAE báo cáo cho ai?"},{"gias":"<p>7.1: CAE phải <b>xác nhận với HĐQT, ít nhất hằng năm<\/b>, về độc lập tổ chức của KTNB, gồm cả việc truyền đạt <b>các sự cố có thể đã làm suy giảm độc lập<\/b> và <b>hành động hoặc biện pháp bảo vệ<\/b> đã dùng.<\/p><p>CAE cũng phải ghi trong Điều lệ <b>quan hệ báo cáo và vị trí tổ chức<\/
